<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon - Code Mon</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0e27;
      color: #fff;
      overflow-x: hidden;
      min-height: 100vh;
    }

    .background {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .gradient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      animation: float 20s infinite ease-in-out;
    }

    .orb-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(88, 166, 255, 0.4) 0%, transparent 70%);
      top: -10%;
      left: -10%;
      animation-delay: 0s;
    }

    .orb-2 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(188, 140, 255, 0.3) 0%, transparent 70%);
      bottom: -10%;
      right: -10%;
      animation-delay: 7s;
    }

    .orb-3 {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(63, 185, 80, 0.2) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: 14s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(50px, -50px) scale(1.1); }
      50% { transform: translate(-30px, 30px) scale(0.9); }
      75% { transform: translate(40px, 40px) scale(1.05); }
    }

    .grid-overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(88, 166, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(88, 166, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridMove 20s linear infinite;
    }

    @keyframes gridMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(50px, 50px); }
    }

    .container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .logo {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 3rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      animation: fadeInDown 1s ease;
    }

    .logo::before {
      content: "◆";
      color: #58a6ff;
      font-size: 3rem;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.1); }
    }

    .badge {
      display: inline-block;
      background: rgba(88, 166, 255, 0.1);
      border: 1px solid rgba(88, 166, 255, 0.3);
      padding: 0.6rem 1.5rem;
      border-radius: 30px;
      font-size: 0.9rem;
      color: #58a6ff;
      margin-bottom: 2rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      animation: fadeIn 1s ease 0.3s both;
    }

    .badge i {
      margin-right: 0.5rem;
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    h1 {
      font-size: 4.5rem;
      font-weight: 900;
      margin-bottom: 1.5rem;
      line-height: 1.1;
      background: linear-gradient(135deg, #fff 0%, #58a6ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: fadeIn 1s ease 0.5s both;
      letter-spacing: -0.03em;
    }

    .subtitle {
      font-size: 1.5rem;
      color: #8b949e;
      margin-bottom: 3rem;
      max-width: 700px;
      line-height: 1.6;
      animation: fadeIn 1s ease 0.7s both;
    }

    .countdown {
      display: flex;
      gap: 2rem;
      margin-bottom: 4rem;
      animation: fadeIn 1s ease 0.9s both;
      flex-wrap: wrap;
      justify-content: center;
    }

    .time-unit {
      background: rgba(22, 27, 34, 0.8);
      border: 1px solid rgba(88, 166, 255, 0.2);
      border-radius: 16px;
      padding: 2rem 2.5rem;
      min-width: 120px;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }

    .time-unit:hover {
      transform: translateY(-5px);
      border-color: #58a6ff;
      box-shadow: 0 10px 30px rgba(88, 166, 255, 0.2);
    }

    .time-value {
      font-size: 3.5rem;
      font-weight: 800;
      color: #58a6ff;
      display: block;
      line-height: 1;
      margin-bottom: 0.5rem;
    }

    .time-label {
      font-size: 0.9rem;
      color: #6e7681;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
    }

    .notify-form {
      display: flex;
      gap: 1rem;
      max-width: 500px;
      width: 100%;
      animation: fadeIn 1s ease 1.1s both;
      flex-wrap: wrap;
    }

    .email-input {
      flex: 1;
      min-width: 250px;
      background: rgba(22, 27, 34, 0.8);
      border: 1px solid rgba(88, 166, 255, 0.2);
      border-radius: 10px;
      padding: 1rem 1.5rem;
      font-size: 1rem;
      color: #fff;
      outline: none;
      transition: all 0.3s;
      backdrop-filter: blur(10px);
    }

    .email-input::placeholder {
      color: #6e7681;
    }

    .email-input:focus {
      border-color: #58a6ff;
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
    }

    .notify-btn {
      background: #58a6ff;
      color: #0a0e27;
      border: none;
      border-radius: 10px;
      padding: 1rem 2rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
    }

    .notify-btn:hover {
      background: #1f6feb;
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(88, 166, 255, 0.3);
    }

    .notify-btn:active {
      transform: translateY(0);
    }

    .features {
      display: flex;
      gap: 3rem;
      margin-top: 4rem;
      animation: fadeIn 1s ease 1.3s both;
      flex-wrap: wrap;
      justify-content: center;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      color: #8b949e;
      font-size: 0.95rem;
    }

    .feature i {
      color: #3fb950;
      font-size: 1.2rem;
    }

    .social-links {
      margin-top: 3rem;
      display: flex;
      gap: 1rem;
      animation: fadeIn 1s ease 1.5s both;
    }

    .social-link {
      width: 50px;
      height: 50px;
      background: rgba(22, 27, 34, 0.8);
      border: 1px solid rgba(88, 166, 255, 0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8b949e;
      text-decoration: none;
      font-size: 1.3rem;
      transition: all 0.3s;
      backdrop-filter: blur(10px);
    }

    .social-link:hover {
      background: #58a6ff;
      border-color: #58a6ff;
      color: #0a0e27;
      transform: translateY(-3px);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .success-message {
      display: none;
      background: rgba(63, 185, 80, 0.1);
      border: 1px solid rgba(63, 185, 80, 0.3);
      border-radius: 10px;
      padding: 1rem 1.5rem;
      color: #3fb950;
      margin-top: 1rem;
      animation: fadeIn 0.5s ease;
    }

    .success-message.show {
      display: block;
    }

    @media (max-width: 768px) {
      .logo {
        font-size: 2rem;
      }

      h1 {
        font-size: 2.5rem;
      }

      .subtitle {
        font-size: 1.1rem;
        padding: 0 1rem;
      }

      .countdown {
        gap: 1rem;
      }

      .time-unit {
        padding: 1.5rem 1.8rem;
        min-width: 100px;
      }

      .time-value {
        font-size: 2.5rem;
      }

      .notify-form {
        flex-direction: column;
      }

      .email-input,
      .notify-btn {
        width: 100%;
        justify-content: center;
      }

      .features {
        flex-direction: column;
        gap: 1.5rem;
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 2rem;
      }

      .time-unit {
        padding: 1rem 1.2rem;
        min-width: 80px;
      }

      .time-value {
        font-size: 2rem;
      }

      .time-label {
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="background">
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="gradient-orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="container">
    <div class="logo">CODE MON</div>
    
    <div class="badge">
      <i class="fas fa-cog"></i> LAUNCHING SOON
    </div>

    <h1>Something Epic<br>Is Coming</h1>
    
    <p class="subtitle">
      We're crafting an incredible new experience. Get ready for something that will change the game.
    </p>

    <div class="countdown" id="countdown">
      <div class="time-unit">
        <span class="time-value" id="days">00</span>
        <span class="time-label">Days</span>
      </div>
      <div class="time-unit">
        <span class="time-value" id="hours">00</span>
        <span class="time-label">Hours</span>
      </div>
      <div class="time-unit">
        <span class="time-value" id="minutes">00</span>
        <span class="time-label">Minutes</span>
      </div>
      <div class="time-unit">
        <span class="time-value" id="seconds">00</span>
        <span class="time-label">Seconds</span>
      </div>
    </div>

    <form class="notify-form" id="notifyForm">
      <input 
        type="email" 
        class="email-input" 
        placeholder="Enter your email" 
        required
        id="emailInput"
      >
      <button type="submit" class="notify-btn">
        <i class="fas fa-bell"></i>
        Notify Me
      </button>
    </form>

    <div class="success-message" id="successMessage">
      <i class="fas fa-check-circle"></i> Awesome! We'll notify you when we launch.
    </div>

    <div class="features">
      <div class="feature">
        <i class="fas fa-rocket"></i>
        <span>Lightning Fast</span>
      </div>
      <div class="feature">
        <i class="fas fa-brain"></i>
        <span>AI Powered</span>
      </div>
      <div class="feature">
        <i class="fas fa-heart"></i>
        <span>Free Forever</span>
      </div>
    </div>

    <div class="social-links">
      <a href="https://discord.gg/eJJBzFD4TU" class="social-link" target="_blank">
        <i class="fab fa-discord"></i>
      </a>
      <a href="#" class="social-link">
        <i class="fab fa-twitter"></i>
      </a>
      <a href="#" class="social-link">
        <i class="fab fa-github"></i>
      </a>
    </div>
  </div>

  <script>
    // Countdown Timer - Set your launch date here
    const launchDate = new Date('2025-02-15T00:00:00').getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = launchDate - now;

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = String(days).padStart(2, '0');
      document.getElementById('hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');

      if (distance < 0) {
        clearInterval(countdownInterval);
        document.getElementById('countdown').innerHTML = '<h2>We\'re Live! 🎉</h2>';
      }
    }

    const countdownInterval = setInterval(updateCountdown, 1000);
    updateCountdown();

    // Email Notification Form
    document.getElementById('notifyForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = document.getElementById('emailInput').value;
      const successMessage = document.getElementById('successMessage');
      
      // Here you would normally send the email to your backend
      console.log('Email submitted:', email);
      
      // Show success message
      successMessage.classList.add('show');
      document.getElementById('emailInput').value = '';
      
      // Hide success message after 5 seconds
      setTimeout(() => {
        successMessage.classList.remove('show');
      }, 5000);
    });
  </script>
</body>
  </html>
