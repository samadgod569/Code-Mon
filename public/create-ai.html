<!DOCTYPE html>
<html>
<head>
<title>Create AI</title>

<style>
/* ============================
      HYTECH GLOBAL THEME
============================ */
body {
    margin: 0;
    padding: 0;
    font-family: "Roboto", sans-serif;
    background: #050505;
    color: #0ff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;

    background-image:
        linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 12s linear infinite;
}

@keyframes gridMove {
    0% { background-position: 0 0, 0 0; }
    100% { background-position: 400px 400px, 400px 400px; }
}

#panel {
    width: 450px;
    padding: 30px;
    border-radius: 15px;
    background: rgba(0, 20, 20, 0.35);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(0,255,255,0.25);
    box-shadow: 0 0 25px rgba(0,255,255,0.2);
    animation: fadeUp 0.9s ease-out;
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}

h1 {
    text-align: center;
    font-size: 26px;
    margin-bottom: 25px;
    color: #7effff;
    text-shadow: 0 0 10px #00ffff;
}

input, textarea {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    font-size: 16px;
    color: #0ff;
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(0,255,255,0.35);
    border-radius: 8px;
    outline: none;
    transition: 0.2s;
}

input:focus, textarea:focus {
    box-shadow: 0 0 10px #00ffff;
    border-color: #00ffff;
    background: rgba(0, 5, 10, 0.9);
}

textarea {
    height: 120px;
    resize: none;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    font-size: 18px;
    cursor: pointer;
    background: linear-gradient(90deg, #003cff, #00f2ff);
    border: none;
    border-radius: 8px;
    color: white;
    font-weight: bold;
    letter-spacing: 1px;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.03);
    box-shadow: 0 0 20px #00f0ff;
}

button:active {
    transform: scale(0.98);
    box-shadow: 0 0 10px #00eaff;
}

#output {
    color: #00ffc8;
    background: rgba(0, 10, 10, 0.7);
    border: 1px solid rgba(0,255,255,0.25);
    padding: 10px;
    margin-top: 15px;
    height: 120px;
    overflow-y: auto;
    border-radius: 8px;
    font-size: 14px;
    white-space: pre-wrap;
}
</style>

</head>
<body>

<div id="panel">
<h1>Create Your AI</h1>

<input id="username" placeholder="Username">
<input id="name" placeholder="AI Name">
<input id="key" placeholder="Gemini API Key">
<textarea id="training" placeholder="Training text">visit ai.google.dev for the API key</textarea>
<button onclick="createAI()">Create AI</button>
<pre id="output"></pre>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    // Fetch username from localStorage if exists
    const savedUsername = localStorage.getItem("code-mon-username");
    if (savedUsername) {
        username.value = savedUsername;
    }
});

async function createAI() {
    const u = username.value.trim();
    const n = name.value.trim();
    const k = key.value.trim();
    const t = training.value.trim();

    if (!u || !n || !k) {
        output.textContent = "Username, AI Name, and API Key are required!";
        return;
    }

    // Save username to localStorage
    localStorage.setItem("username", u);

    try {
        const res = await fetch(`/api/ai?username=${encodeURIComponent(u)}&name=${encodeURIComponent(n)}&key=${encodeURIComponent(k)}&trainingText=${encodeURIComponent(t)}`);
        const text = await res.text();
        output.textContent = text;
    } catch (err) {
        output.textContent = "Error creating AI: " + err.message;
    }
}
</script>

</body>
</html>
