<!DOCTYPE html>
<html>
<head>
      <link rel="icon" type="image/png" href="img/icon.png" />
<title>Create AI</title>

<style>
/* ============================
      HYTECH GLOBAL THEME
============================ */
body {
    margin: 0;
    padding: 0;
    font-family: "Roboto", sans-serif;
    background: #050505;
    color: #0ff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-image:
        linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 12s linear infinite;
}

@keyframes gridMove {
    0% { background-position: 0 0, 0 0; }
    100% { background-position: 400px 400px, 400px 400px; }
}

#panel {
    width: 450px;
    padding: 30px;
    border-radius: 15px;
    background: rgba(0, 20, 20, 0.35);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(0,255,255,0.25);
    box-shadow: 0 0 25px rgba(0,255,255,0.2);
    animation: fadeUp 0.9s ease-out;
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}

h1 {
    text-align: center;
    font-size: 26px;
    margin-bottom: 25px;
    color: #7effff;
    text-shadow: 0 0 10px #00ffff;
}

input, textarea {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    font-size: 16px;
    color: #0ff;
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(0,255,255,0.35);
    border-radius: 8px;
    outline: none;
    transition: 0.2s;
}

input:focus, textarea:focus {
    box-shadow: 0 0 10px #00ffff;
    border-color: #00ffff;
    background: rgba(0, 5, 10, 0.9);
}

textarea {
    height: 120px;
    resize: none;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    font-size: 18px;
    cursor: pointer;
    background: linear-gradient(90deg, #003cff, #00f2ff);
    border: none;
    border-radius: 8px;
    color: white;
    font-weight: bold;
    letter-spacing: 1px;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.03);
    box-shadow: 0 0 20px #00f0ff;
}

button:active {
    transform: scale(0.98);
    box-shadow: 0 0 10px #00eaff;
}

#output {
    color: #00ffc8;
    background: rgba(0, 10, 10, 0.7);
    border: 1px solid rgba(0,255,255,0.25);
    padding: 10px;
    margin-top: 15px;
    height: 150px;
    overflow-y: auto;
    border-radius: 8px;
    font-size: 14px;
    white-space: pre-wrap;
}
</style>

</head>
<body>

<div id="panel">
<h1>Create Your AI</h1>

<input id="username" placeholder="Username" readonly>
<input id="name" placeholder="AI Name">
<input id="key" placeholder="Gemini API Key">
<textarea id="training" placeholder="Training text"></textarea>
<button onclick="createAI()">Create AI</button>
<pre id="output">visit ai.google.dev for the API key</pre>
</div>

<script>

     (async function() {
    const API = "https://code-mon.codemon.workers.dev";

    const username = localStorage.getItem("code-mon-username");
    const password = localStorage.getItem("code-mon-pass");

    //  No credentials → go to login
    if (!username || !password) {
        localStorage.clear();
        location.href = "login.html";
        return;
    }

    try {
        const res = await fetch(`${API}/api/pass?username=${username}&pass=${password}`);
        const data = await res.json();

        //  Wrong password / user not found
        if (!data.success) {
            localStorage.removeItem("code-mon-username");
            localStorage.removeItem("code-mon-pass");
            localStorage.removeItem("user");

            location.href = "login.html";
            return;
        }

        //  Auth success → continue loading file.html normally
        console.log("User authenticated:", username);

    } catch (err) {
        // Network failure = prevent access
        localStorage.clear();
        location.href = "login.html";
    }
})(); 
      const u = localStorage.getItem("code-mon-username");
      let user = document.getElementById("username");
      user.value = u;
      let pass = localStorage.getItem("code-mon-pass");
async function createAI() {
     
    const n = document.getElementById("name").value.trim();
    const k = document.getElementById("key").value.trim();
    const t = document.getElementById("training").value.trim();
    const output = document.getElementById("output");

    if (!u || !n || !k) {
        output.textContent = "Username, AI Name, and API Key are required!";
        return;
    }

    // Save username
    localStorage.setItem("username", u);

    try {
        const endpoint = "https://code-mon.codemon.workers.dev/api/ai";

        // Build the URL EXACTLY like your working example
        const url =
            `${endpoint}?username=${encodeURIComponent(u)}` +
            `&name=${encodeURIComponent(n)}` +
            `&key=${encodeURIComponent(k)}` +
            `&trainingText=${encodeURIComponent(t)}` +
            `&pass=${pass}`;

        const res = await fetch(url);

        // If server unreachable / network error
        if (!res.ok) {
            output.textContent = "Server error: " + res.status;
            return;
        }

        // Safely get text (even empty)
        let text = "";
        try {
            text = await res.text();
        } catch {
            text = "(No response text returned)";
        }

        output.textContent =
            `${text}\n\nYou can now use your AI by fetching:\n` +
            `https://code-mon.codemon.workers.dev/api/ai-get` +
            `?username=${encodeURIComponent(u)}` +
            `&name=${encodeURIComponent(n)}` +
            `&question=YOUR_QUESTION`;

    } catch (err) {
        output.textContent =`Your API key has been protected and Fine tuned you can see the results of your api by fetching: https://code-mon.codemon.workers.dev/api/ai-get` +
            `?username=${encodeURIComponent(u)}` +
            `&name=${encodeURIComponent(n)}` +
            `&question=YOUR_QUESTION`;
    }
}
</script>

</body>
</html>
