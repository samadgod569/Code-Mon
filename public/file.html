<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>File Manager</title>
<style>
/* GLOBAL */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Roboto', sans-serif;
  background: radial-gradient(circle at top, #0a0f24, #111827, #000);
  color: #fff;
  height: 100vh;
  overflow: hidden;
}

/* HEADER */
header {
  font-family: 'Orbitron', sans-serif;
  text-align: center;
  padding: 20px;
  font-size: 2rem;
  letter-spacing: 2px;
  background: linear-gradient(90deg, #4f46e5, #22d3ee);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 20px #22d3ee;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 5px #22d3ee; }
  to   { text-shadow: 0 0 25px #22d3ee; }
}

/* MAIN WRAPPER */
#wrap {
  display: flex;
  height: calc(100vh - 80px);
  backdrop-filter: blur(10px);
}

/* FILE SIDEBAR */
#files {
  width: 280px;
  padding: 20px;
  background: rgba(30, 41, 59, 0.5);
  border-right: 2px solid rgba(255,255,255,0.08);
  box-shadow: 4px 0 20px rgba(0, 0, 0, 0.5);
}

#files button {
  width: 100%;
  padding: 12px;
  border: 2px solid #22d3ee;
  background: transparent;
  color: #22d3ee;
  font-family: 'Orbitron';
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: 0.3s;
}

#files button:hover {
  background: #22d3ee;
  color: #0f0c29;
  box-shadow: 0 0 20px #22d3ee;
}

.fileItem {
  margin-top: 12px;
  padding: 12px;
  border-radius: 8px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  cursor: pointer;
  transition: 0.25s;
  font-size: 0.95rem;
}

.fileItem:hover {
  background: rgba(34,211,238,0.15);
  box-shadow: 0 0 12px #22d3ee;
}

/* EDITOR SECTION */
#editorArea {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 20px;
}

#editor {
  flex: 1;
  padding: 15px;
  background: rgba(0,0,0,0.3);
  border: 2px solid rgba(255,255,255,0.1);
  color: #22d3ee;
  border-radius: 12px;
  font-size: 15px;
  font-family: monospace;
  outline: none;
  resize: none;
  transition: 0.3s;
}

#editor:focus {
  border-color: #22d3ee;
  box-shadow: 0 0 20px #22d3ee;
}

/* BUTTONS */
#editorArea button {
  margin-top: 15px;
  padding: 14px;
  border-radius: 10px;
  font-size: 1rem;
  cursor: pointer;
  font-family: 'Orbitron';
  background: linear-gradient(90deg, #4f46e5, #22d3ee);
  border: none;
  transition: 0.3s;
}

#editorArea button:hover {
  transform: translateY(-3px);
  box-shadow: 0 0 25px #22d3ee;
}

/* ERROR BOX */
#error {
  background: rgba(255,0,0,0.15);
  border-left: 4px solid red;
  padding: 12px;
  margin: 10px;
  border-radius: 8px;
  display: none;
  font-size: 0.95rem;
  animation: shake 0.2s;
}

@keyframes shake {
  0% { transform: translateX(0);}
  25% { transform: translateX(-3px);}
  50% { transform: translateX(3px);}
  75% { transform: translateX(-2px);}
  100% { transform: translateX(0);}
}

</style>
</head>

<body>
<header>File Manager</header>
<div id="error"></div>

<div id="wrap">
  <div id="files">
    <button onclick="createFile()">+ Create</button>
    <div id="fileList"></div>
  </div>

  <div id="editorArea">
    <textarea id="editor" placeholder="Select a file..."></textarea>
    <button onclick="saveFile()">Save</button>
    <button onclick="deploy()">Deploy</button>
  </div>
</div>

<script>
const API = "https://code-mon.codemon.workers.dev"; // Worker URL
const user = localStorage.getItem("user");
if (!user) location.href = "login.html";

let currentFile = null;

// Show error messages
function showError(msg) {
    const e = document.getElementById("error");
    e.style.display = "block";
    e.innerText = msg;
}

// Clear error
function clearError() {
    const e = document.getElementById("error");
    e.style.display = "none";
    e.innerText = "";
}

// ------------------------------
// Load file list
// ------------------------------
async function loadFiles(selectedFile = null) {
    clearError();
    try {
        const res = await fetch(`${API}/api/list?user=${user}`);
        const text = await res.text();
        let data;
        try { data = JSON.parse(text); } catch { return showError("Failed to load files:\n" + text); }

        if (data.error) return showError("Failed to load files: " + data.error);

        const list = document.getElementById("fileList");
        list.innerHTML = "";
        data.files.forEach(f => {
            const div = document.createElement("div");
            div.className = "fileItem";
            div.innerText = f;
            div.onclick = () => loadFile(f);
            list.appendChild(div);
        });

        // Auto-select a file if provided
        if (selectedFile && data.files.includes(selectedFile)) loadFile(selectedFile);
    } catch (err) {
        showError("Failed to load files: " + err.message);
    }
}

// ------------------------------
// Load file content
// ------------------------------
async function loadFile(name) {
    clearError();
    currentFile = name;
    try {
        const res = await fetch(`${API}/api/load?user=${user}&filename=${name}`);
        const text = await res.text();
        document.getElementById("editor").value = text;
    } catch (err) {
        showError("Failed to load file: " + err.message);
    }
}

// ------------------------------
// Create file
// ------------------------------
async function createFile() {
    clearError();
    const name = prompt("Enter file name (example: index.html):");
    if (!name) return;

    try {
        const res = await fetch(`${API}/api/save`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user, filename: name, content: "" })
        });
        const text = await res.text();
        let data;
        try { data = JSON.parse(text); } catch { return showError("Failed to create file:\n" + text); }

        if (data.error) return showError("Failed to create file: " + data.error);

        // Refresh file list and select the new file
        loadFiles(name);
    } catch (err) {
        showError("Failed to create file: " + err.message);
    }
}

// ------------------------------
// Save file
// ------------------------------
async function saveFile() {
    clearError();
    if (!currentFile) return showError("Select a file first");

    try {
        const res = await fetch(`${API}/api/save`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                user,
                filename: currentFile,
                content: document.getElementById("editor").value
            })
        });
        const text = await res.text();
        let data;
        try { data = JSON.parse(text); } catch { return showError("Failed to save file:\n" + text); }

        if (data.error) return showError("Failed to save file: " + data.error);

        alert("File saved!");
        loadFiles(currentFile); // Refresh list and keep file selected
    } catch (err) {
        showError("Failed to save file: " + err.message);
    }
}

// ------------------------------
// Deploy file
// ------------------------------
async function deploy() {
    clearError();
    if (!currentFile) return showError("Select a file first");

    try {
        const res = await fetch(`${API}/api/deploy`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user, filename: currentFile })
        });
        const text = await res.text();
        let data;
        try { data = JSON.parse(text); } catch { return showError("Deploy failed:\n" + text); }

        if (data.error) return showError("Deploy failed: " + JSON.stringify(data));

        alert("Deployed!\nLive URL: " + data.url + (data.github ? "\nGitHub URL: " + data.github : ""));
    } catch (err) {
        showError("Deploy failed: " + err.message);
    }
}
</script>
</body>
</html>
