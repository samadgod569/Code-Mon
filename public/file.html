<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>File Manager</title>
<link rel="icon" type="image/png" href="img/icon.png" />
<style>
/* GLOBAL */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Roboto', sans-serif;
    background: radial-gradient(circle at top, #0f0c29, #302b63, #24243e);
    color: #fff;
    height: 100vh;
    overflow: hidden;
}

/* HEADER */
header {
    text-align: center;
    padding: 25px;
    font-family: 'Orbitron', sans-serif;
    font-size: 2rem;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    color: #22d3ee;
    text-shadow: 0 0 15px #22d3ee;
    animation: glitch 2s infinite;
}

/* MAIN WRAPPER */
#wrap {
    display: flex;
    height: calc(100vh - 80px);
}

/* FILE LIST PANEL */
#files {
    width: 280px;
    padding: 15px;
    border-right: 2px solid rgba(34, 211, 238,0.5);
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(14px);
    display: flex;
    flex-direction: column;
}

/* Sidebar buttons */
#files button {
    width: 100%;
    padding: 14px;
    font-family: 'Orbitron';
    border-radius: 50px;
    border: 2px solid #22d3ee;
    background: transparent;
    color: #22d3ee;
    cursor: pointer;
    transition: 0.3s;
    margin-bottom: 15px;
}
#files button:hover {
    background: #22d3ee;
    color: #0f0c29;
    box-shadow: 0 0 25px #22d3ee;
}

/* FILE ITEMS */
#fileList {
    flex: 1;
    overflow-y: auto;
}
.fileItem {
    padding: 12px;
    margin-top: 12px;
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
    cursor: pointer;
    transition: 0.3s;
}
.fileItem:hover {
    background: rgba(34, 211, 238, 0.25);
    transform: translateX(5px);
    font-weight: bold;
}

/* EDITOR AREA */
#editorArea {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px;
    z-index: 10;
}

/* Editor scrolls */
#editor {
    flex: 1;
    padding: 20px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(34,211,238,0.5);
    border-radius: 12px;
    color: #22d3ee;
    font-family: monospace;
    font-size: 1rem;
    outline: none;
    resize: none;
    overflow-y: auto;
    box-shadow: inset 0 0 15px rgba(34, 211, 238, 0.2);
}

/* ERROR BOX */
#error {
    display: none;
    background: rgba(255,0,0,0.15);
    border-left: 4px solid red;
    padding: 10px;
    margin: 10px 20px;
    border-radius: 8px;
    color: #ff8a8a;
    font-family: 'Roboto';
    font-weight: bold;
}

/* SUCCESS BOX */
#success {
    display: none;
    background: rgba(0,255,130,0.15);
    border-left: 4px solid #00ff9d;
    padding: 10px;
    margin: 10px 20px;
    border-radius: 8px;
    color: #9affd6;
    font-family: 'Roboto';
    font-weight: bold;
    position: relative;
    top: -80px;
    animation: slideDown 0.4s forwards;
}

/* CREATE FILE POPUP */
#createBox {
    display: none;
    position: absolute;
    top: -150px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,255,130,0.15);
    border: 2px solid #00ff9d;
    padding: 20px;
    border-radius: 12px;
    width: 300px;
    backdrop-filter: blur(12px);
    animation: slideDown 0.4s forwards;
    z-index: 11;
}
#createBox input {
    width: 100%;
    padding: 12px;
    border: 1px solid #00ff9d;
    background: rgba(255,255,255,0.1);
    color: white;
    border-radius: 6px;
    margin-top: 10px;
}
#createBox button {
    margin-top: 12px;
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #00ff9d;
    background: #00ff9d;
    color: #0f0c29;
    cursor: pointer;
    font-weight: bold;
}
    /* UPLOAD BOX (same style as createBox) */
#uploadBox {
    display: none;
    position: absolute;
    top: -150px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,255,130,0.15);
    border: 2px solid #00ff9d;
    padding: 20px;
    border-radius: 12px;
    width: 300px;
    backdrop-filter: blur(12px);
    animation: slideDown 0.4s forwards;
    z-index: 11;
    text-align: center;
}

/* Upload drop zone */
#uploadDrop {
    margin-top: 12px;
    padding: 20px;
    border: 2px dashed #00ff9d;
    border-radius: 10px;
    cursor: pointer;
    color: #00ff9d;
    transition: 0.25s;
}
#uploadDrop:hover {
    background: rgba(0,255,130,0.15);
}

/* Animation */
@keyframes slideDown {
    from { top: -80px; opacity: 0; }
    to { top: 0; opacity: 1; }
}

</style>
</head>

<body>

<header>File Manager</header>

<div id="error"></div>
<div id="success"></div>

<!-- CREATE FILE BOX -->
<div id="createBox">
    <h3 style="color:#00ff9d;">Create New File</h3>
    <input id="createFilename" placeholder="example: index.html">
    <button onclick="confirmCreate()">Create</button>
</div>
<!-- UPLOAD FILE BOX -->
<div id="uploadBox">
    <h3 style="color:#00ff9d;">Upload Image</h3>

    <input id="uploadFilename" placeholder="example: photo.png">

    <div id="uploadDrop">
        Click or Drop Image Here
    </div>

    <input type="file" id="uploadInput" accept="image/*" style="display:none;">
    
    <img id="uploadPreview" style="max-width:100%;margin-top:10px;display:none;border-radius:8px;">

    <!-- ONLY THIS LINE CHANGES -->
    <button onclick="uploadAndDeployImageBinary()">Upload</button>
</div>
<div id="wrap">
  <div id="files">
    <button onclick="createFile()">+ Create</button>
<button onclick="openUpload()">Upload Image</button>
<button onclick="saveFile()">SAVE FILE</button>
<button onclick="deploy()">DEPLOY</button>
   <button onclick="album()">Album</button>   
    <div id="fileList"></div>
  </div>

  <div id="editorArea">
    <textarea id="editor" placeholder="Select a file..."></textarea>
  </div>
</div>

<script>


(async function() {
    const API = "https://code-mon.codemon.workers.dev";

    const username = localStorage.getItem("code-mon-username");
    const password = localStorage.getItem("code-mon-pass");

    //  No credentials → go to login
    if (!username || !password) {
        localStorage.clear();
        location.href = "login.html";
        return;
    }

    try {
        const res = await fetch(`${API}/api/pass?username=${username}&pass=${password}`);
        const data = await res.json();

        //  Wrong password / user not found
        if (!data.success) {
            localStorage.removeItem("code-mon-username");
            localStorage.removeItem("code-mon-pass");
            localStorage.removeItem("user");

            location.href = "login.html";
            return;
        }

        //  Auth success → continue loading file.html normally
        console.log("User authenticated:", username);

    } catch (err) {
        // Network failure = prevent access
        localStorage.clear();
        location.href = "login.html";
    }
})();

  let uploadFileData = null;

function openUpload() {
    document.getElementById("uploadBox").style.display = "block";
}

// Clicking the box opens file picker
document.getElementById("uploadDrop").onclick = () => {
    document.getElementById("uploadInput").click();
};

// When file is selected


document.getElementById("uploadInput").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    uploadFileData = await file.arrayBuffer(); // binary stored

    // Preview image
    const reader = new FileReader();
    reader.onload = () => {
        document.getElementById("uploadPreview").src = reader.result;
        document.getElementById("uploadPreview").style.display = "block";
    };
    reader.readAsDataURL(file);
});
const API = "https://code-mon.codemon.workers.dev";
const user = localStorage.getItem("code-mon-username");
    const pass = localStorage.getItem("code-mon-pass");
if (!user) location.href = "login.html";

let currentFile = null;

function showError(msg) {
    const e = document.getElementById("error");
    e.style.display = "block";
    e.innerText = msg;
    setTimeout(() => e.style.display = "none", 4000);
}

function showSuccess(msg) {
    const s = document.getElementById("success");
    s.style.display = "block";
    s.innerText = msg;
    setTimeout(() => s.style.display = "none", 3000);
}

function clearError() {
    document.getElementById("error").style.display = "none";
}
    function album(){
        window.location.href = "album.html";
    }

/* LOAD FILES */
async function loadFiles(selectedFile = null) {
    clearError();
    try {
        const res = await fetch(`${API}/api/list?user=${user}`);
        const data = await res.json();

        if (data.error) return showError("Failed to load files: " + data.error);

        const list = document.getElementById("fileList");
        list.innerHTML = "";

      data.files.forEach(f => {

    
    if (/\.(png|jpg|jpeg|gif|webp|svg)$/i.test(f)) return;

    const div = document.createElement("div");
    div.className = "fileItem";
    div.innerText = f;
    div.onclick = () => loadFile(f);
    list.appendChild(div);
});


        if (selectedFile && data.files.includes(selectedFile)) loadFile(selectedFile);

    } catch (err) {
        showError("Failed to load files: " + err.message);
    }
}

/* LOAD SINGLE FILE */
async function loadFile(name) {
    currentFile = name;
    try {
        const res = await fetch(`${API}/api/load?user=${user}&filename=${name}`);
        document.getElementById("editor").value = await res.text();

    } catch (err) {
        showError("Failed to load file: " + err.message);
    }
}

/* OPEN CREATE FILE BOX */
function createFile() {
    document.getElementById("createBox").style.display = "block";
}

/* CONFIRM CREATE FILE */
async function confirmCreate() {
    const name = document.getElementById("createFilename").value.trim();
    document.getElementById("createBox").style.display = "none";

    if (!name) return showError("Filename cannot be empty");

    try {
        const res = await fetch(`${API}/api/save`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user, pass, filename: name, content: "" })
        });

        const data = await res.json();
        if (data.error) return showError("Failed to create file: " + data.error);

        showSuccess("File created!");
        loadFiles(name);

    } catch (err) {
        showError("Failed to create file: " + err.message);
    }
}

/* SAVE FILE */
async function saveFile() {
    if (!currentFile) return showError("Select a file first");

     

    if (!pass) return showError("Missing password — please login again");

    try {
        const res = await fetch(`${API}/api/save`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                user,
                pass,            // 🔥 NEW: send password
                filename: currentFile,
                content: document.getElementById("editor").value
            })
        });

        const data = await res.json();

        if (!data.success)
            return showError("Failed to save file: " + (data.error || "Unknown error"));

        showSuccess("File saved!");
        loadFiles(currentFile);

    } catch (err) {
        showError("Failed to save file: " + err.message);
    }
    }

    /* OPEN IMAGE UPLOAD BOX */
async function uploadAndDeployImageBinary() {
    const filename = document.getElementById("uploadFilename").value.trim();
    
    if (!filename)
        return showError("Filename required!");

    if (!uploadFileData)
        return showError("Select an image first!");

    try {
        // STEP 1 — Upload binary to KV
        const saveRes = await fetch(`${API}/api/img-save`, {
            method: "POST",
            headers: {
                "Content-Type": "application/octet-stream",
                "x-user": user,
                "x-pass": pass,
                "x-filename": filename
            },
            body: uploadFileData      // <-- RAW BINARY ARRAYBUFFER
        });

        const saveJson = await saveRes.json();
        if (!saveJson.success)
            return showError("KV Binary Save Failed: " + (saveJson.error || "Unknown"));

        // STEP 2 — Deploy to GitHub
        const deployRes = await fetch(`${API}/api/img-deploy`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user, filename })
        });

        const deployJson = await deployRes.json();

        if (!deployJson.success)
    return showError("GitHub Upload Failed: " + JSON.stringify(deployJson));

        showSuccess("Image uploaded and deployed!");
        document.getElementById("uploadBox").style.display = "none";

        loadFiles(filename);

    } catch (err) {
        showError("Upload failed: " + err.message);
    }
    }

/* DEPLOY */
async function deploy() {
    if (!currentFile) return showError("Select a file first");

    try {
        const res = await fetch(`${API}/api/deploy`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user, filename: currentFile })
        });

        const data = await res.json();

        if (data.error)
            return showError("Deploy failed: " + JSON.stringify(data));

        showSuccess(`Deployed Successfully! Check out the website at https://code-mon-space.pages.dev/${user}/${currentFile}`);

    } catch (err) {
        /* SPECIAL MESSAGE FOR FAILED-TO-FETCH */
        showError(
            "Ooops! Seems like you have reached your file CPU limit (Beta).\n" +
            "You can convert the file or visit our Discord to deploy large files."
        );
    }
}

/* LOAD ON START */
loadFiles();
</script>

</body>
</html>
