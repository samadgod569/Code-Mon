<!DOCTYPE html>
<html>
<head>
<title>File Manager</title>
<style>
body { font-family: Arial; display:flex; gap:20px; }
#fileList { width:200px; border:1px solid #ccc; padding:10px; }
.fileItem { padding:5px; cursor:pointer; border-bottom:1px solid #eee; }
.fileItem:hover { background:#f0f0f0; }
#error { color:red; margin-top:10px; }
textarea { width:600px; height:400px; }
</style>
</head>
<body>

<div id="fileList"></div>

<div>
    <textarea id="editor"></textarea><br><br>
    <button onclick="createFile()">Create File</button>
    <button onclick="saveFile()">Save</button>
    <button onclick="deploy()">Deploy</button>

    <div id="error"></div>
</div>

<script>
const API = "https://code-mon.codemon.workers.dev";
const user = localStorage.getItem("user") || "defaultUser";
let currentFile = null;

function showError(msg) {
    const e = document.getElementById("error");
    e.innerText = msg;
    e.style.display = "block";
}
function clearError() {
    const e = document.getElementById("error");
    e.style.display = "none";
}

async function loadFiles() {
    const res = await fetch(`${API}/api/list?user=${user}`);
    const data = await res.json();
    const list = document.getElementById("fileList");
    list.innerHTML = "";
    data.files.forEach(name => {
        const div = document.createElement("div");
        div.className = "fileItem";
        div.innerText = name;
        div.onclick = () => loadFile(name);
        list.appendChild(div);
    });
}
async function loadFile(filename) {
    currentFile = filename;
    const res = await fetch(`${API}/api/load?user=${user}&filename=${filename}`);
    document.getElementById("editor").value = await res.text();
}

async function createFile() {
    const name = prompt("File name:");
    if (!name) return;

    await fetch(`${API}/api/save`, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ user, filename:name, content:"" })
    });

    loadFiles();
}

async function saveFile() {
    if (!currentFile) return showError("Select a file");

    await fetch(`${API}/api/save`, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
            user,
            filename:currentFile,
            content:document.getElementById("editor").value
        })
    });

    alert("Saved!");
}

async function deploy() {
    await fetch(`${API}/api/add-deploy`, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ user })
    });

    alert("Deploy request queued!");
}

loadFiles();
</script>
</body>
</html>
