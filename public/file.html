<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File Manager</title>
<style>
body { margin:0; font-family:Arial; background:#f3f3f3; }
header { background:#222; color:white; padding:15px; text-align:center; }
#error { color:red; padding:10px; display:none; background:white; border-left:4px solid red; margin:10px; border-radius:5px; }
#wrap { display:flex; height:calc(100vh - 60px); }
#files { width:250px; background:white; padding:10px; border-right:1px solid #ccc; }
#editorArea { flex:1; display:flex; flex-direction:column; padding:10px; }
#editor { flex:1; padding:10px; border:1px solid #ccc; border-radius:8px; font-family:monospace; resize:none; }
button { margin-top:10px; padding:12px; background:#222; color:white; border:none; border-radius:5px; cursor:pointer; }
.fileItem { padding:10px; background:#eee; margin:6px 0; border-radius:5px; cursor:pointer; }
.fileItem:hover { background:#ddd; }
</style>
</head>
<body>

<header>File Manager</header>
<div id="error"></div>

<div id="wrap">
    <div id="files">
        <button onclick="createFile()">+ Create</button>
        <div id="fileList"></div>
    </div>

    <div id="editorArea">
        <textarea id="editor" placeholder="Select a file..."></textarea>
        <button onclick="saveFile()">Save</button>
        <button onclick="deploy()">Deploy</button>
    </div>
</div>

<script>
const API = "https://code-mon.codemon.workers.dev";
const user = localStorage.getItem("user");
if (!user) location.href = "login.html";

let currentFile = null;

function showError(msg) {
    const e = document.getElementById("error");
    e.style.display = "block";
    e.innerText = msg;
}

// --------------------
// Load file list
// --------------------
async function loadFiles() {
    try {
        const res = await fetch(`${API}/api/list?user=${user}`);
        const data = await res.json();
        if (data.error) return showError("Failed to load files: " + data.error);

        const list = document.getElementById("fileList");
        list.innerHTML = "";
        data.files.forEach(f => {
            const div = document.createElement("div");
            div.className = "fileItem";
            div.innerText = f;
            div.onclick = () => loadFile(f);
            list.appendChild(div);
        });
    } catch (err) {
        showError("Failed to load files: " + err.message);
    }
}
loadFiles();

// --------------------
// Load file content
// --------------------
async function loadFile(name) {
    try {
        currentFile = name;
        const res = await fetch(`${API}/api/load?user=${user}&filename=${name}`);
        const text = await res.text();
        document.getElementById("editor").value = text;
    } catch (err) {
        showError("Failed to load file: " + err.message);
    }
}

// --------------------
// Create file
// --------------------
async function createFile() {
    const name = prompt("File name:");
    if (!name) return;
    try {
        const res = await fetch(`${API}/api/save`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user, filename: name, content: "" })
        });
        const data = await res.json();
        if (data.error) return showError("Failed to create file: " + data.error);

        loadFiles();
        loadFile(name);
    } catch (err) {
        showError("Failed to create file: " + err.message);
    }
}

// --------------------
// Save file
// --------------------
async function saveFile() {
    if (!currentFile) return showError("Select a file first");

    try {
        const res = await fetch(`${API}/api/save`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                user,
                filename: currentFile,
                content: document.getElementById("editor").value
            })
        });
        const data = await res.json();
        if (data.error) return showError("Save failed: " + data.error);

        alert("Saved!");
    } catch (err) {
        showError("Save failed: " + err.message);
    }
}

// --------------------
// Deploy file
// --------------------
async function deploy() {
    if (!currentFile) return showError("Select a file first!");

    try {
        const res = await fetch(`${API}/api/deploy`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user, filename: currentFile })
        });
        const data = await res.json();
        if (data.error) return showError("Deploy failed: " + data.error);

        alert("Deployed!\nLive URL: " + data.url);
    } catch (err) {
        showError("Deploy failed: " + err.message);
    }
}
</script>

</body>
</html>
