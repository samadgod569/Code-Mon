<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File Manager</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f0f0f0;
        margin: 0;
        padding: 0;
    }
    header {
        background: #333;
        color: white;
        padding: 15px;
        text-align: center;
        font-size: 22px;
    }
    #container {
        display: flex;
        height: calc(100vh - 60px);
    }
    #files {
        width: 260px;
        background: #fff;
        border-right: 1px solid #ccc;
        padding: 15px;
        overflow-y: auto;
    }
    #editorArea {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 10px;
    }
    #editor {
        width: 100%;
        height: 100%;
        padding: 15px;
        border: 1px solid #ccc;
        outline: none;
        resize: none;
        font-size: 16px;
        border-radius: 8px;
        font-family: monospace;
        background: #fff;
    }
    button {
        padding: 12px;
        margin-top: 10px;
        cursor: pointer;
        border: none;
        background: #333;
        color: white;
        border-radius: 6px;
        font-size: 15px;
    }
    .fileItem {
        padding: 10px;
        margin: 6px 0;
        background: #eee;
        cursor: pointer;
        border-radius: 6px;
    }
    .fileItem:hover {
        background: #ddd;
    }
</style>

</head>
<body>

<header>File Manager</header>

<div id="container">

    <!-- LEFT SIDE (FILE LIST) -->
    <div id="files">
        <button onclick="createFile()">+ Create File</button>
        <div id="fileList"></div>
    </div>

    <!-- RIGHT SIDE (EDITOR + ACTIONS) -->
    <div id="editorArea">
        <textarea id="editor" placeholder="Select or create a file to begin..."></textarea>
        <button onclick="saveFile()">💾 Save</button>
        <button onclick="deploy()">🚀 Deploy</button>
        <button onclick="preview()">🔍 Preview</button>
    </div>

</div>

<script>
const user = localStorage.getItem("user");
if (!user) location.href = "login.html";

let currentFile = null;

// ------------------------------
// Load all files
// ------------------------------
async function loadFiles() {
    const res = await fetch(`/api/list?user=${user}`);
    const files = await res.json();

    const list = document.getElementById("fileList");
    list.innerHTML = "";

    files.forEach(filename => {
        const div = document.createElement("div");
        div.className = "fileItem";
        div.innerText = filename;
        div.onclick = () => loadFile(filename);
        list.appendChild(div);
    });
}

loadFiles();


// ------------------------------
// Load file content
// ------------------------------
async function loadFile(name) {
    currentFile = name;

    const res = await fetch(`/api/load?user=${user}&filename=${name}`);
    const text = await res.text();

    document.getElementById("editor").value = text;
}


// ------------------------------
// Create new file
// ------------------------------
async function createFile() {
    const name = prompt("Enter file name (example: index.html):");
    if (!name) return;

    // create empty file
    await fetch("/api/save", {
        method: "POST",
        body: JSON.stringify({
            user,
            filename: name,
            content: ""
        })
    });

    loadFiles();
    loadFile(name);  // auto-open the new file
}


// ------------------------------
// Save file
// ------------------------------
async function saveFile() {
    if (!currentFile) return alert("Select a file first!");

    await fetch("/api/save", {
        method: "POST",
        body: JSON.stringify({
            user,
            filename: currentFile,
            content: document.getElementById("editor").value
        })
    });

    alert("Saved!");
}


// ------------------------------
// Deploy file
// ------------------------------
async function deploy() {
    if (!currentFile) return alert("Select a file first!");

    const res = await fetch("/api/deploy", {
        method: "POST",
        body: JSON.stringify({
            user,
            filename: currentFile
        }),
    });

    const data = await res.json();
    alert("Deployed!\nLive URL: " + data.kv_url);
}


// ------------------------------
// Preview (KV public URL)
// ------------------------------
function preview() {
    if (!currentFile) return alert("Select a file first!");
    window.open(`/public/${currentFile}`, "_blank");
}

</script>

</body>
</html>
