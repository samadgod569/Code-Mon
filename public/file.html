<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>File Manager</title>
<style>
/* GLOBAL */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Roboto', sans-serif;
    background: radial-gradient(circle at top, #0f0c29, #302b63, #24243e);
    color: #fff;
    height: 100vh;
    overflow: hidden;
}

/* HEADER */
header {
    text-align: center;
    padding: 25px;
    font-family: 'Orbitron', sans-serif;
    font-size: 2rem;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    color: #22d3ee;
    text-shadow: 0 0 15px #22d3ee;
    animation: glitch 2s infinite;
}

/* MAIN WRAPPER */
#wrap {
    display: flex;
    height: calc(100vh - 80px);
}

/* FILE LIST PANEL */
#files {
    width: 280px;
    padding: 15px;
    border-right: 2px solid rgba(34, 211, 238,0.5);
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(14px);
    display: flex;
    flex-direction: column;
}

/* Sidebar buttons */
#files button {
    width: 100%;
    padding: 14px;
    font-family: 'Orbitron';
    border-radius: 50px;
    border: 2px solid #22d3ee;
    background: transparent;
    color: #22d3ee;
    cursor: pointer;
    transition: 0.3s;
    margin-bottom: 15px;
}
#files button:hover {
    background: #22d3ee;
    color: #0f0c29;
    box-shadow: 0 0 25px #22d3ee;
}

/* FILE ITEMS */
#fileList {
    flex: 1;
    overflow-y: auto;
}
.fileItem {
    padding: 12px;
    margin-top: 12px;
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
    cursor: pointer;
    transition: 0.3s;
}
.fileItem:hover {
    background: rgba(34, 211, 238, 0.25);
    transform: translateX(5px);
    font-weight: bold;
}

/* EDITOR AREA */
#editorArea {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px;
}

/* Editor scrolls */
#editor {
    flex: 1;
    padding: 20px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(34,211,238,0.5);
    border-radius: 12px;
    color: #22d3ee;
    font-family: monospace;
    font-size: 1rem;
    outline: none;
    resize: none;
    overflow-y: auto;
    box-shadow: inset 0 0 15px rgba(34, 211, 238, 0.2);
}

/* ERROR BOX */
#error {
    display: none;
    background: rgba(255,0,0,0.15);
    border-left: 4px solid red;
    padding: 10px;
    margin: 10px 20px;
    border-radius: 8px;
    color: #ff8a8a;
    font-family: 'Roboto';
    font-weight: bold;
}

/* SCROLLBARS */
#fileList::-webkit-scrollbar, #editor::-webkit-scrollbar {
    width: 10px;
}
#fileList::-webkit-scrollbar-thumb, #editor::-webkit-scrollbar-thumb {
    background: rgba(34,211,238,0.5);
    border-radius: 10px;
}
#fileList::-webkit-scrollbar-thumb:hover, #editor::-webkit-scrollbar-thumb:hover {
    background: #22d3ee;
}

/* GLITCH HEADER EFFECT */
@keyframes glitch {
    0% { text-shadow: 0 0 10px #22d3ee; }
    20% { text-shadow: 2px 2px 6px #22d3ee; }
    40% { text-shadow: -2px -2px 6px #22d3ee; }
    60% { text-shadow: 2px -2px 6px #22d3ee; }
    80% { text-shadow: -2px 2px 6px #22d3ee; }
    100% { text-shadow: 0 0 10px #22d3ee; }
}

/* Responsive */
@media(max-width: 900px){
    #wrap { flex-direction: column; height: auto; }
    #files { width: 100%; flex-direction: row; overflow-x: auto; border-right: none; border-bottom: 2px solid rgba(34,211,238,0.5); }
    #fileList { display: flex; gap: 10px; flex: 1; margin-top: 0; overflow-x: auto; }
    .fileItem { flex: none; margin: 0; padding: 8px 12px; }
    #editorArea { padding: 15px; }
    #editorArea button { margin-top: 8px; }
}
</style>
</head>

<body>
<header>File Manager</header>
<div id="error"></div>

<div id="wrap">
  <div id="files">
    <button onclick="createFile()">+ Create</button>
    <button onclick="saveFile()">SAVE FILE</button>
    <button onclick="deploy()">DEPLOY</button>
    <div id="fileList"></div>
  </div>

  <div id="editorArea">
    <textarea id="editor" placeholder="Select a file..."></textarea>
  </div>
</div>

<script>
    const API = "https://code-mon.codemon.workers.dev";
let user = localStorage.getItem("user");
let currentFile = null;

if (!user) {
    user = "user-" + Math.random().toString(36).slice(2, 10);
    localStorage.setItem("user", user);
}

/* ---------------- LOADING FILE LIST ---------------- */
async function loadFiles() {
    const res = await fetch(`${API}/api/list?user=${user}`);
    const files = await res.json();

    const list = document.getElementById("fileList");
    list.innerHTML = "";

    for (const f of files) {
        const div = document.createElement("div");
        div.className = "fileItem";
        div.innerText = f;
        div.onclick = () => loadFile(f);
        list.appendChild(div);
    }
}

/* ---------------- OPEN FILE ---------------- */
async function loadFile(filename) {
    currentFile = filename;

    const res = await fetch(`${API}/api/get?user=${user}&filename=${filename}`);
    const text = await res.text();

    document.getElementById("editor").value = text;
}

/* ---------------- SAVE FILE (FORMS) ---------------- */
async function saveFile() {
    if (!currentFile) return showError("Select a file first");

    const editor = document.getElementById("editor");

    const fd = new FormData();
    fd.append("user", user);
    fd.append("filename", currentFile);
    fd.append("content", editor.value);

    const res = await fetch(`${API}/api/save`, {
        method: "POST",
        body: fd
    });

    if (!res.ok) return showError("Save failed");

    alert("Saved!");
}

/* ---------------- DEPLOY FILE (FORMDATA) ---------------- */
async function deployFile() {
    if (!currentFile) return showError("Select a file to deploy");

    const editor = document.getElementById("editor");

    const fd = new FormData();
    fd.append("user", user);
    fd.append("filename", currentFile);
    fd.append("content", editor.value);

    const res = await fetch(`${API}/api/deploy`, {
        method: "POST",
        body: fd
    });

    const result = await res.json();

    if (result.error) return showError(result.error);

    // Copy deployed code
    navigator.clipboard.writeText(editor.value);

    // Open site
    window.location.href = result.url;
}

/* ---------------- NEW FILE ---------------- */
async function newFile() {
    const filename = prompt("File name:");
    if (!filename) return;

    const fd = new FormData();
    fd.append("user", user);
    fd.append("filename", filename);

    await fetch(`${API}/api/create`, {
        method: "POST",
        body: fd
    });

    loadFiles();
}

/* ---------------- ERROR HANDLER ---------------- */
function showError(t) {
    const error = document.getElementById("error");
    error.innerText = t;
    error.style.display = "block";

    setTimeout(() => error.style.display = "none", 3000);
}

loadFiles();
</script>

</body>
</html>
