<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bot VM — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="icon" type="image/png" href="https://code-mon.pages.dev/favicon.png" />
<style>
  :root[data-theme="dark"] {
    --bg: #0d1117;
    --bg2: #161b22;
    --bg3: #21262d;
    --bg4: #30363d;
    --border: #30363d;
    --text: #e6edf3;
    --text2: #8b949e;
    --text3: #6e7681;
    --accent: #238636;
    --accent-hover: #2ea043;
    --accent2: #1f6feb;
    --accent2-hover: #388bfd;
    --red: #da3633;
    --tag-bg: #1f6feb22;
    --tag-text: #388bfd;
    --code-bg: #0d1117;
    --shadow: 0 8px 32px rgba(0,0,0,0.5);
    --glow: 0 0 0 3px rgba(31,111,235,0.25);
  }
  :root[data-theme="light"] {
    --bg: #f6f8fa;
    --bg2: #ffffff;
    --bg3: #f6f8fa;
    --bg4: #eaeef2;
    --border: #d0d7de;
    --text: #1f2328;
    --text2: #57606a;
    --text3: #8c959f;
    --accent: #1a7f37;
    --accent-hover: #2da44e;
    --accent2: #0969da;
    --accent2-hover: #0550ae;
    --red: #cf222e;
    --tag-bg: #ddf4ff;
    --tag-text: #0969da;
    --code-bg: #f6f8fa;
    --shadow: 0 8px 32px rgba(0,0,0,0.1);
    --glow: 0 0 0 3px rgba(9,105,218,0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Geist', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background 0.2s, color 0.2s;
  }

  nav {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .nav-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 15px;
    color: var(--text);
    text-decoration: none;
  }
  .nav-right { display: flex; align-items: center; gap: 10px; }

  .icon-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 32px;
    height: 32px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, border-color 0.15s;
    color: var(--text2);
  }
  .icon-btn:hover { background: var(--bg4); color: var(--text); }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px;
  }

  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }
  .page-title {
    font-size: 20px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .page-title .count {
    font-size: 12px;
    font-weight: 500;
    background: var(--bg4);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2px 10px;
    color: var(--text2);
    font-family: 'JetBrains Mono', monospace;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s;
    font-family: 'Geist', sans-serif;
    line-height: 1;
  }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; border-color: rgba(255,255,255,0.1); }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-secondary { background: var(--bg3); color: var(--text); border-color: var(--border); }
  .btn-secondary:hover { background: var(--bg4); border-color: var(--text3); }
  .btn-danger { background: transparent; color: var(--red); border-color: var(--border); }
  .btn-danger:hover:not(:disabled) { background: var(--red); color: #fff; border-color: var(--red); }
  .btn-blue { background: var(--accent2); color: #fff; }
  .btn-blue:hover:not(:disabled) { background: var(--accent2-hover); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  .vm-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }

  .vm-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
    animation: fadeUp 0.25s ease both;
  }
  .vm-card:hover {
    border-color: var(--accent2);
    box-shadow: var(--glow);
    transform: translateY(-1px);
  }
  .vm-card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }
  .vm-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--accent2);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #3fb950;
    flex-shrink: 0;
    box-shadow: 0 0 6px #3fb95088;
  }
  .vm-key {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text3);
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 4px;
  }
  .copy-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text3);
    padding: 2px 4px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    transition: color 0.15s, background 0.15s;
  }
  .copy-btn:hover { color: var(--text); background: var(--bg3); }
  .vm-card-actions { display: flex; gap: 6px; }
  .vm-footer { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--tag-text);
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 500;
  }
  .vm-open-hint {
    margin-left: auto;
    font-size: 12px;
    color: var(--text3);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .empty-icon { color: var(--text3); opacity: 0.35; }
  .empty-title { font-size: 17px; font-weight: 600; color: var(--text2); }
  .empty-sub { font-size: 14px; color: var(--text3); }

  .loading-row {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 60px;
    color: var(--text3);
    font-size: 14px;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.15s ease;
  }
  .overlay.hidden { display: none; }

  .modal {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    width: 420px;
    max-width: 90vw;
    box-shadow: var(--shadow);
    animation: slideUp 0.2s ease;
  }
  .modal-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .modal-sub { font-size: 13px; color: var(--text2); margin-bottom: 20px; }
  .form-label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text2); }
  .form-input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
    padding: 9px 12px;
    font-family: 'Geist', sans-serif;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    margin-bottom: 16px;
  }
  .form-input:focus { border-color: var(--accent2); box-shadow: var(--glow); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

  .confirm-modal {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    width: 380px;
    max-width: 90vw;
    box-shadow: var(--shadow);
    animation: slideUp 0.18s ease;
  }
  .confirm-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .confirm-sub { font-size: 13px; color: var(--text2); margin-bottom: 20px; }

  .detail-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.15s ease;
  }
  .detail-overlay.hidden { display: none; }
  .detail-panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: min(860px, 95vw);
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow);
    animation: slideUp 0.2s ease;
    overflow: hidden;
  }
  .detail-header {
    padding: 18px 22px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
  }
  .detail-header-left { display: flex; flex-direction: column; gap: 5px; }
  .detail-vm-name {
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .detail-key-row {
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text3);
  }
  .detail-header-right { display: flex; gap: 8px; align-items: center; }

  .saving-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text3);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .saving-indicator.visible { opacity: 1; }

  .code-container {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .code-toolbar {
    background: var(--bg3);
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .code-toolbar-left {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text3);
    font-family: 'JetBrains Mono', monospace;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot-r { background: #ff5f57; }
  .dot-y { background: #febc2e; }
  .dot-g { background: #28c840; }

  .editor-wrap {
    flex: 1;
    display: flex;
    overflow: hidden;
    min-height: 380px;
    background: var(--code-bg);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13.5px;
    line-height: 1.65;
  }
  .editor-lines {
    padding: 20px 0;
    min-width: 48px;
    text-align: right;
    color: var(--text3);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13.5px;
    line-height: 1.65;
    user-select: none;
    background: var(--code-bg);
    border-right: 1px solid var(--border);
    overflow: hidden;
    flex-shrink: 0;
  }
  .editor-lines span {
    display: block;
    padding: 0 12px;
  }
  .editor-body {
    flex: 1;
    position: relative;
    overflow: auto;
  }
  .editor-highlight {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    margin: 0;
    padding: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13.5px;
    line-height: 1.65;
    white-space: pre;
    word-break: normal;
    overflow-wrap: normal;
    pointer-events: none;
    background: transparent;
    border: none;
    box-shadow: none;
    color: transparent;
  }
  .editor-highlight code {
    font-family: inherit;
    font-size: inherit;
    line-height: inherit;
    background: transparent;
    padding: 0;
    white-space: pre;
  }
  #code-editor {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13.5px;
    line-height: 1.65;
    background: transparent;
    color: transparent;
    caret-color: var(--text);
    border: none;
    outline: none;
    resize: none;
    overflow: hidden;
    white-space: pre;
    word-break: normal;
    overflow-wrap: normal;
    tab-size: 2;
    -moz-tab-size: 2;
    z-index: 1;
  }

  .toast-wrap {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 500;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .toast {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 500;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 8px;
    animation: slideRight 0.2s ease;
    pointer-events: all;
    transition: opacity 0.2s, transform 0.2s;
  }
  .toast.success { border-left: 3px solid #3fb950; }
  .toast.error   { border-left: 3px solid var(--red); }
  .toast.info    { border-left: 3px solid var(--accent2); }

  .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent2);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    flex-shrink: 0;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideRight { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
<style>
  pre[class*="language-"], code[class*="language-"] {
    background: transparent !important;
    text-shadow: none !important;
  }
  .token.comment, .token.prolog, .token.doctype, .token.cdata { color: #8b949e; }
  .token.punctuation { color: #c9d1d9; }
  .token.property, .token.tag, .token.boolean, .token.number, .token.constant, .token.symbol, .token.deleted { color: #79c0ff; }
  .token.selector, .token.attr-name, .token.string, .token.char, .token.builtin, .token.inserted { color: #a5d6ff; }
  .token.operator, .token.entity, .token.url, .language-css .token.string, .style .token.string { color: #ff7b72; }
  .token.atrule, .token.attr-value, .token.keyword { color: #ff7b72; }
  .token.function, .token.class-name { color: #d2a8ff; }
  .token.regex, .token.important, .token.variable { color: #ffa657; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
</head>
<body>

<nav>
  <a class="nav-brand" href="#">
    <img src="https://code-mon.pages.dev/favicon.png" width="22" height="22" alt="Bot VM" style="display:block;" />
    Bot VM
  </a>
  <div class="nav-right">
    <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle theme">
      <svg id="theme-icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg id="theme-icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
  </div>
</nav>

<main>
  <div class="page-header">
    <div class="page-title">
      Instances
      <span class="count" id="instance-count">0</span>
    </div>
    <button class="btn btn-primary" onclick="openCreateModal()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New Instance
    </button>
  </div>
  <div class="vm-grid" id="vm-grid">
    <div class="loading-row">
      <div class="spinner"></div>
      Loading instances...
    </div>
  </div>
</main>

<div class="overlay hidden" id="create-overlay" onclick="closeCreateModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      Create New Instance
    </div>
    <div class="modal-sub">Give your Bot VM instance a name to get started. Creating costs <strong>5 shells</strong> — you have <span id="modal-balance">—</span> shells.</div>
    <label class="form-label" for="instance-name-input">Instance Name</label>
    <input class="form-input" id="instance-name-input" type="text" placeholder="e.g. my-scraper-bot" maxlength="40" onkeydown="if(event.key==='Enter')confirmCreate()" />
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeCreateModal()">Cancel</button>
      <button class="btn btn-primary" onclick="confirmCreate()" id="create-confirm-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Create Instance
      </button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="confirm-overlay" onclick="closeConfirmModal(event)">
  <div class="confirm-modal" onclick="event.stopPropagation()">
    <div class="confirm-title">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      Delete Instance?
    </div>
    <div class="confirm-sub" id="confirm-sub-text">This will permanently delete the instance and all its code.</div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeConfirmModal()">Cancel</button>
      <button class="btn btn-danger" onclick="executeDelete()" id="delete-confirm-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        Delete
      </button>
    </div>
  </div>
</div>

<div class="detail-overlay hidden" id="detail-overlay" onclick="closeDetail(event)">
  <div class="detail-panel" onclick="event.stopPropagation()">
    <div class="detail-header">
      <div class="detail-header-left">
        <div class="detail-vm-name">
          <div class="status-dot"></div>
          <span id="detail-name">—</span>
        </div>
        <div class="detail-key-row">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
          <span id="detail-key-text">—</span>
          <button class="copy-btn" onclick="copyDetailKey()" title="Copy key">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
        </div>
      </div>
      <div class="detail-header-right">
        <div class="saving-indicator" id="saving-indicator">
          <div class="spinner"></div>
          Saving...
        </div>
        <button class="btn btn-blue btn-sm" onclick="saveCode()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Save
        </button>
        <button class="icon-btn" onclick="closeDetail()" title="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
    <div class="code-container">
      <div class="code-toolbar">
        <div class="code-toolbar-left">
          <div class="dot dot-r"></div>
          <div class="dot dot-y"></div>
          <div class="dot dot-g"></div>
          <span style="margin-left:8px;">code.js</span>
        </div>
        <span style="font-size:12px;color:var(--text3);font-family:'JetBrains Mono',monospace;">UTF-8</span>
      </div>
      <div class="editor-wrap">
        <div class="editor-lines" id="editor-lines"></div>
        <div class="editor-body">
          <pre class="editor-highlight" aria-hidden="true"><code class="language-javascript" id="editor-highlight-code"></code></pre>
          <textarea id="code-editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="// Write your bot code here..."></textarea>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>

<script>
const API = 'https://code-mon.codemon.workers.dev';
let currentUser = '';
let currentPass = '';
let instances = [];
let pendingDeleteKey = null;
let openKey = null;

const ICONS = {
  plus: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  trash: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`,
  copy: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`,
  save: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>`,
  check: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
  alert: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
  info: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent2)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`,
  monitor: `<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>`,
  lock: `<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`,
  wifiOff: `<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.56 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>`,
  circleAlert: `<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
  externalLink: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`,
  key: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>`
};

async function init() {
  const savedTheme = localStorage.getItem('bvm-theme') || 'dark';
  applyTheme(savedTheme);
  initEditor();

  currentUser = localStorage.getItem('code-mon-username') || '';
  currentPass = localStorage.getItem('code-mon-pass') || '';

  if (!currentUser || !currentPass) {
    showToast('No credentials found in localStorage', 'error', 5000);
    document.getElementById('vm-grid').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">${ICONS.lock}</div>
        <div class="empty-title">No credentials found</div>
        <div class="empty-sub">Set <code>code-mon-username</code> and <code>code-mon-pass</code> in localStorage.</div>
      </div>`;
    return;
  }

  await refreshInstances();
}

function loadInstanceMap() {
  const raw = localStorage.getItem(`bvm-names-${currentUser}`);
  return raw ? JSON.parse(raw) : {};
}
function saveInstanceMap(map) {
  localStorage.setItem(`bvm-names-${currentUser}`, JSON.stringify(map));
}

async function apiFetch(path, body, method = 'POST') {
  let url = `${API}${path}`;
  let options;
  if (method === 'GET') {
    const params = new URLSearchParams({ user: currentUser, pass: currentPass, ...body });
    url = `${url}?${params}`;
    options = { method: 'GET', mode: 'cors', credentials: 'omit', headers: { 'Accept': 'application/json' } };
  } else {
    options = {
      method: 'POST',
      mode: 'cors',
      credentials: 'omit',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ user: currentUser, pass: currentPass, ...body })
    };
  }
  const res = await fetch(url, options);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function fetchBalance() {
  try {
    const data = await apiFetch('/api/api-balance', {}, 'GET');
    if (data.balance !== undefined) updateBalanceUI(data.balance);
  } catch {}
}

function updateBalanceUI(amount) {
  document.getElementById('balance-amount').textContent = amount;
  const el = document.getElementById('modal-balance');
  if (el) el.textContent = amount;
}

async function refreshInstances() {
  document.getElementById('vm-grid').innerHTML = `<div class="loading-row"><div class="spinner"></div> Fetching instances...</div>`;
  try {
    const data = await apiFetch('/api/api-list', {}, 'GET');
    if (data.error) {
      showToast(data.error, 'error');
      document.getElementById('vm-grid').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">${ICONS.circleAlert}</div>
          <div class="empty-title">Error loading instances</div>
          <div class="empty-sub">${escHtml(data.error)}</div>
        </div>`;
      return;
    }
    const keys = data.keys || [];
    const nameMap = loadInstanceMap();
    instances = keys.map(k => ({ key: k, name: nameMap[k] || k }));
    renderGrid();
  } catch {
    showToast('Network error', 'error');
    document.getElementById('vm-grid').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">${ICONS.wifiOff}</div>
        <div class="empty-title">Network error</div>
        <div class="empty-sub">Could not reach the API.</div>
      </div>`;
  }
}

function renderGrid() {
  const grid = document.getElementById('vm-grid');
  document.getElementById('instance-count').textContent = instances.length;

  if (instances.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">${ICONS.monitor}</div>
        <div class="empty-title">No instances yet</div>
        <div class="empty-sub">Create your first Bot VM instance to get started.</div>
        <button class="btn btn-primary" onclick="openCreateModal()" style="margin-top:4px;">
          ${ICONS.plus} New Instance
        </button>
      </div>`;
    return;
  }

  grid.innerHTML = '';
  instances.forEach((inst, i) => {
    const card = document.createElement('div');
    card.className = 'vm-card';
    card.style.animationDelay = `${i * 40}ms`;
    card.innerHTML = `
      <div class="vm-card-header">
        <div>
          <div class="vm-name">
            <div class="status-dot"></div>
            ${escHtml(inst.name)}
          </div>
          <div class="vm-key">
            <span>${escHtml(inst.key)}</span>
            <button class="copy-btn" onclick="event.stopPropagation();copyText('${escHtml(inst.key)}','Key')" title="Copy key">${ICONS.copy}</button>
          </div>
        </div>
        <div class="vm-card-actions" onclick="event.stopPropagation()">
          <button class="btn btn-danger btn-sm" onclick="openDeleteConfirm('${escHtml(inst.key)}','${escHtml(inst.name)}')" title="Delete">${ICONS.trash}</button>
        </div>
      </div>
      <div class="vm-footer">
        <span class="tag">vm</span>
        <span class="tag">active</span>
        <span class="vm-open-hint">${ICONS.externalLink} Open</span>
      </div>`;
    card.addEventListener('click', () => openDetail(inst));
    grid.appendChild(card);
  });
}

function openCreateModal() {
  const bal = document.getElementById('balance-amount').textContent;
  const el = document.getElementById('modal-balance');
  if (el) el.textContent = bal;
  document.getElementById('create-overlay').classList.remove('hidden');
  setTimeout(() => document.getElementById('instance-name-input').focus(), 80);
}
function closeCreateModal(e) {
  if (e && e.target !== document.getElementById('create-overlay')) return;
  document.getElementById('create-overlay').classList.add('hidden');
  document.getElementById('instance-name-input').value = '';
}

async function confirmCreate() {
  const name = document.getElementById('instance-name-input').value.trim();
  if (!name) { showToast('Please enter an instance name', 'error'); return; }

  const btn = document.getElementById('create-confirm-btn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> Creating...';

  try {
    const data = await apiFetch('/api/api-create', {});
    if (!data.success) {
      showToast(data.error, 'error');
      btn.disabled = false;
      btn.innerHTML = `${ICONS.plus} Create Instance`;
      return;
    }
    const nameMap = loadInstanceMap();
    nameMap[data.key] = name;
    saveInstanceMap(nameMap);

    document.getElementById('create-overlay').classList.add('hidden');
    document.getElementById('instance-name-input').value = '';
    btn.disabled = false;
    btn.innerHTML = `${ICONS.plus} Create Instance`;

    if (data.balance !== undefined) updateBalanceUI(data.balance);
    showToast(`"${name}" created — ${data.balance} shells remaining`, 'success');
    await refreshInstances();
  } catch {
    showToast('Network error', 'error');
    btn.disabled = false;
    btn.innerHTML = `${ICONS.plus} Create Instance`;
  }
}

function openDeleteConfirm(key, name) {
  pendingDeleteKey = key;
  document.getElementById('confirm-sub-text').textContent = `Delete "${name}" (${key})? This cannot be undone.`;
  document.getElementById('confirm-overlay').classList.remove('hidden');
}
function closeConfirmModal(e) {
  if (e && e.target !== document.getElementById('confirm-overlay')) return;
  document.getElementById('confirm-overlay').classList.add('hidden');
  pendingDeleteKey = null;
}

async function executeDelete() {
  if (!pendingDeleteKey) return;
  const btn = document.getElementById('delete-confirm-btn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div>';

  try {
    const data = await apiFetch('/api/api-delete', { key: pendingDeleteKey });
    const nameMap = loadInstanceMap();
    delete nameMap[pendingDeleteKey];
    saveInstanceMap(nameMap);

    document.getElementById('confirm-overlay').classList.add('hidden');
    pendingDeleteKey = null;
    btn.disabled = false;
    btn.innerHTML = `${ICONS.trash} Delete`;

    if (data.success) showToast('Instance deleted', 'info');
    else showToast(data.error, 'error');

    await refreshInstances();
  } catch {
    showToast('Network error', 'error');
    btn.disabled = false;
    btn.innerHTML = `${ICONS.trash} Delete`;
  }
}

async function openDetail(inst) {
  openKey = inst.key;
  document.getElementById('detail-name').textContent = inst.name;
  document.getElementById('detail-key-text').textContent = inst.key;
  updateEditor('');
  document.getElementById('detail-overlay').classList.remove('hidden');

  try {
    const data = await apiFetch('/api/api-load', { key: inst.key });
    if (data.success) {
      updateEditor(data.content ?? '');
    } else {
      showToast(data.error, 'error');
    }
  } catch {
    showToast('Network error loading code', 'error');
  }
}

function closeDetail(e) {
  if (e && e.target !== document.getElementById('detail-overlay')) return;
  document.getElementById('detail-overlay').classList.add('hidden');
  openKey = null;
}

async function saveCode() {
  if (!openKey) return;
  const content = document.getElementById('code-editor').value;
  const ind = document.getElementById('saving-indicator');
  ind.classList.add('visible');

  try {
    const data = await apiFetch('/api/api-save', { key: openKey, content });
    if (data.success) showToast('Saved', 'success');
    else showToast(data.error, 'error');
  } catch {
    showToast('Network error', 'error');
  } finally {
    ind.classList.remove('visible');
  }
}

function copyDetailKey() {
  copyText(document.getElementById('detail-key-text').textContent, 'Key');
}

function copyText(text, label) {
  navigator.clipboard.writeText(text).then(() => {
    showToast(`${label} copied`, 'info', 1800);
  }).catch(() => {
    showToast('Copy failed', 'error');
  });
}

function showToast(msg, type = 'info', duration = 3000) {
  const iconMap = { success: ICONS.check, error: ICONS.alert, info: ICONS.info };
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `${iconMap[type] || ''}<span>${escHtml(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateX(16px)';
    setTimeout(() => el.remove(), 200);
  }, duration);
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('theme-icon-moon').style.display = theme === 'dark' ? '' : 'none';
  document.getElementById('theme-icon-sun').style.display = theme === 'light' ? '' : 'none';
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  localStorage.setItem('bvm-theme', next);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}


function updateEditor(code) {
  const ta = document.getElementById('code-editor');
  const highlight = document.getElementById('editor-highlight-code');
  const lines = document.getElementById('editor-lines');

  ta.value = code;

  const escaped = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  highlight.innerHTML = escaped;
  Prism.highlightElement(highlight);

  const lineCount = (code.match(/
/g) || []).length + 1;
  lines.innerHTML = Array.from({length: lineCount}, (_, i) =>
    `<span>${i + 1}</span>`
  ).join('');

  syncScroll();
}

function syncScroll() {
  const body = document.querySelector('.editor-body');
  const lines = document.getElementById('editor-lines');
  if (body && lines) lines.scrollTop = body.scrollTop;
}

function initEditor() {
  const ta = document.getElementById('code-editor');
  if (!ta) return;

  ta.addEventListener('input', () => {
    updateEditor(ta.value);
  });

  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = ta.selectionStart;
      const end = ta.selectionEnd;
      ta.value = ta.value.substring(0, start) + '  ' + ta.value.substring(end);
      ta.selectionStart = ta.selectionEnd = start + 2;
      updateEditor(ta.value);
    }
  });

  const body = document.querySelector('.editor-body');
  if (body) {
    body.addEventListener('scroll', () => {
      const highlight = document.querySelector('.editor-highlight');
      const lines = document.getElementById('editor-lines');
      if (highlight) {
        highlight.scrollTop = body.scrollTop;
        highlight.scrollLeft = body.scrollLeft;
      }
      if (lines) lines.scrollTop = body.scrollTop;
    });
  }
}

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's' && openKey) {
    e.preventDefault();
    saveCode();
  }
  if (e.key === 'Escape') {
    if (!document.getElementById('detail-overlay').classList.contains('hidden')) closeDetail();
    else if (!document.getElementById('confirm-overlay').classList.contains('hidden')) closeConfirmModal();
    else if (!document.getElementById('create-overlay').classList.contains('hidden')) closeCreateModal();
  }
});

init();
</script>
</body>
</html>
