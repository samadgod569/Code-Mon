<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/icon.png" />
<title>Code-Mon General AI</title>

<style>
    body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: #0f0f0f;
        color: #eaeaea;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* Title */
    h1 {
        margin: 22px 0 12px;
        font-size: 1.7rem;
        font-weight: 600;
        letter-spacing: 0.5px;
        color: #f5f5f5;
    }

    /* Chat layout */
    .chat {
        width: 100%;
        max-width: 720px;
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 16px;
    }

    .messages {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding-bottom: 12px;
    }

    /* Message bubbles */
    .msg {
        max-width: 72%;
        padding: 12px 15px;
        border-radius: 10px;
        line-height: 1.45;
        font-size: 0.95rem;
        white-space: pre-wrap;
        word-break: break-word;
    }

    .user {
        align-self: flex-start;
        background: #1e1e1e;
        border: 1px solid #2a2a2a;
    }

    .ai {
        align-self: flex-end;
        background: #262626;
        border: 1px solid #333;
    }

    /* Input */
    .input {
        display: flex;
        gap: 10px;
        margin-top: 12px;
    }

    input {
      flex: 1;
        padding: 13px 14px;
        border-radius: 8px;
        border: 1px solid #2a2a2a;
        outline: none;
        background: #141414;
        color: #fff;
        font-size: 0.95rem;
        transition: border 0.15s ease;
    }

    input:focus {
        border-color: #3a3a3a;
    }

    button {
        padding: 13px 18px;
        border-radius: 8px;
        border: 1px solid #333;
        background: #1b1b1b;
        color: #fff;
        cursor: pointer;
        font-size: 0.95rem;
        transition: background 0.15s ease, border 0.15s ease;
    }

    button:hover {
        background: #232323;
        border-color: #444;
    }

    /* Scrollbar */
    .messages::-webkit-scrollbar {
        width: 6px;
    }
h1 {
    margin: 18px 0 10px;
    font-size: 1.15rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #bdbdbd;
}
    .messages::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 3px;
    }
</style>
</head>

<body>

<h1>CODE MON GENERAL AI</h1>

<div class="chat">
    <div class="messages" id="messages"></div>

    <div class="input">
        <input id="input" placeholder="Type a message..." />
        <button onclick="send()">Send</button>
    </div>
</div>

<script>
         (async function() {
    const API = "https://code-mon.codemon.workers.dev";

    const username = localStorage.getItem("code-mon-username");
    const password = localStorage.getItem("code-mon-pass");

    //  No credentials → go to login
    if (!username || !password) {
        localStorage.clear();
        location.href = "login.html";
        return;
    }

    try {
        const res = await fetch(`${API}/api/pass?username=${username}&pass=${password}`);
        const data = await res.json();

        //  Wrong password / user not found
        if (!data.success) {
            localStorage.removeItem("code-mon-username");
            localStorage.removeItem("code-mon-pass");
            localStorage.removeItem("user");

            location.href = "login.html";
            return;
        }

        //  Auth success → continue loading file.html normally
        console.log("User authenticated:", username);

    } catch (err) {
        // Network failure = prevent access
        localStorage.clear();
        location.href = "login.html";
    }
})(); 

let database = "";

// Load database.txt
fetch("database.txt")
    .then(r => r.text())
    .then(t => database = t)
    .catch(() => database = "");

async function send() {
    const input = document.getElementById("input");
    const text = input.value.trim();
    if (!text) return;

    add(text, "user");
    input.value = "";

    try {
        const q = encodeURIComponent(text + "/database:" + database);
        const url = `https://code-mon.codemon.workers.dev/api/ai-get?username=C69P2W&name=Code-Mon-General&question=${q}`;
const res = await fetch(url);
const data = await res.text();

console.log("Status:", res.status);
console.log("Body length:", data.length);

add(data || "No response", "ai");

    } catch {
        add("Error getting response.", "ai");
    }
}

function add(text, type) {
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.textContent = text;

    const messages = document.getElementById("messages");
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

document.getElementById("input").addEventListener("keydown", e => {
    if (e.key === "Enter") send();
});
</script>

</body>
</html>
