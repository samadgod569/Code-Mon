<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Templates</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #24292e;
            transition: background-color 0.3s, color 0.3s;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        body.dark {
            background-color: #0d1117;
            color: #c9d1d9;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
        }

        .theme-toggle {
            background: none;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 0.9rem;
            color: inherit;
            background-color: #f6f8fa;
        }

        body.dark .theme-toggle {
            background-color: #21262d;
            border-color: #30363d;
            color: #c9d1d9;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid transparent;
            transition: 0.2s;
            font-size: 1rem;
        }

        .btn-primary {
            background-color: #2da44e;
            color: white;
            border-color: #2da44e;
        }

        .btn-primary:hover {
            background-color: #2c974b;
        }

        .btn-secondary {
            background-color: #f6f8fa;
            color: #24292e;
            border-color: #d0d7de;
        }

        body.dark .btn-secondary {
            background-color: #21262d;
            color: #c9d1d9;
            border-color: #30363d;
        }

        .btn-secondary:hover {
            background-color: #eaeef2;
        }

        body.dark .btn-secondary:hover {
            background-color: #30363d;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .modal {
            background: white;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            padding: 2rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }

        body.dark .modal {
            background: #161b22;
            border: 1px solid #30363d;
        }

        .modal h2 {
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid #d0d7de;
            background: white;
            font-size: 1rem;
        }

        body.dark .form-control {
            background: #0d1117;
            border-color: #30363d;
            color: #c9d1d9;
        }

        .custom-select {
            position: relative;
        }

        .custom-select select {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid #d0d7de;
            background: white;
            font-size: 1rem;
            appearance: none;
        }

        body.dark .custom-select select {
            background: #0d1117;
            border-color: #30363d;
            color: #c9d1d9;
        }

        .custom-select::after {
            content: '▼';
            font-size: 0.8rem;
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #57606a;
        }

        body.dark .custom-select::after {
            color: #8b949e;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 2rem;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .card {
            border: 1px solid #d0d7de;
            border-radius: 12px;
            padding: 1.5rem;
            background: white;
            transition: transform 0.1s, box-shadow 0.2s;
            cursor: pointer;
        }

        body.dark .card {
            background: #161b22;
            border-color: #30363d;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }

        body.dark .card:hover {
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .card h3 {
            margin-bottom: 0.75rem;
            font-size: 1.25rem;
        }

        .card p {
            margin-bottom: 0.5rem;
            color: #57606a;
            font-size: 0.9rem;
        }

        body.dark .card p {
            color: #8b949e;
        }

        .badge {
            display: inline-block;
            padding: 0.2rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            background: #ddf4ff;
            color: #0969da;
        }

        body.dark .badge {
            background: #1f6feb33;
            color: #58a6ff;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #57606a;
            border: 2px dashed #d0d7de;
            border-radius: 12px;
        }

        body.dark .empty-state {
            color: #8b949e;
            border-color: #30363d;
        }

        .error-message {
            color: #cf222e;
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        body.dark .error-message {
            color: #f85149;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Game Templates</h1>
            <button class="theme-toggle" id="themeToggle">🌙 Dark</button>
        </header>

        <div class="button-group">
            <button class="btn btn-primary" id="newTemplateBtn">+ New Template</button>
            <button class="btn btn-secondary" id="restoreTemplateBtn">↻ Restore Template</button>
        </div>

        <!-- Cards container -->
        <div id="cardsContainer" class="cards-container">
            <div class="empty-state">No games yet. Create or restore one.</div>
        </div>
    </div>

    <!-- New Template Modal -->
    <div class="modal-overlay" id="newModal">
        <div class="modal">
            <h2>Create New Template</h2>
            <div class="form-group">
                <label>Type</label>
                <div class="custom-select">
                    <select id="typeSelect">
                        <option value="personal">Personal</option>
                        <option value="organization">Organization</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Game Name</label>
                <input type="text" id="gameName" class="form-control" placeholder="e.g., my-rpg">
            </div>
            <div class="form-group">
                <label>Starting Directory</label>
                <input type="text" id="startingDir" class="form-control" value="/" placeholder="/ or subdir">
            </div>
            <div class="form-group" id="projectGroup">
                <label>Choose Project</label>
                <div class="custom-select">
                    <select id="projectSelect" disabled>
                        <option value="">Select organization</option>
                    </select>
                </div>
                <div id="projectError" class="error-message"></div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="cancelNew">Cancel</button>
                <button class="btn btn-primary" id="createBtn">Create</button>
            </div>
        </div>
    </div>

    <!-- Restore Modal -->
    <div class="modal-overlay" id="restoreModal">
        <div class="modal">
            <h2>Restore Template</h2>
            <div class="form-group">
                <label>Game Name</label>
                <input type="text" id="restoreGameName" class="form-control" placeholder="Enter game name">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="cancelRestore">Cancel</button>
                <button class="btn btn-primary" id="restoreBtn">Restore</button>
            </div>
            <div id="restoreError" class="error-message"></div>
        </div>
    </div>

    <script>
        (function() {
            // ---------- Cookie helpers ----------
            function setCookie(name, value, days = 365) {
                const expires = new Date(Date.now() + days * 864e5).toUTCString();
                document.cookie = name + '=' + encodeURIComponent(value) + '; expires=' + expires + '; path=/';
            }

            function getCookie(name) {
                return document.cookie.split('; ').reduce((r, v) => {
                    const parts = v.split('=');
                    return parts[0] === name ? decodeURIComponent(parts[1]) : r;
                }, '');
            }

            // ---------- Games cookie storage ----------
            function getGames() {
                const gamesCookie = getCookie('games');
                if (gamesCookie) {
                    try {
                        return JSON.parse(gamesCookie);
                    } catch (e) {
                        return [];
                    }
                }
                return [];
            }

            function saveGames(games) {
                setCookie('games', JSON.stringify(games));
            }

            function addGame(game) {
                const games = getGames();
                if (!games.some(g => g.gameName === game.gameName)) {
                    games.push(game);
                    saveGames(games);
                }
            }

            // ---------- Render cards ----------
            function renderCards() {
                const container = document.getElementById('cardsContainer');
                const games = getGames();
                if (games.length === 0) {
                    container.innerHTML = '<div class="empty-state">No games yet. Create or restore one.</div>';
                    return;
                }
                container.innerHTML = games.map(game => `
                    <div class="card" data-game="${game.gameName}">
                        <h3>${game.gameName}</h3>
                        <p><span class="badge">${game.type}</span></p>
                        <p><strong>Project:</strong> ${game.project}</p>
                        <p><strong>Starting:</strong> ${game.starting}</p>
                    </div>
                `).join('');
                document.querySelectorAll('.card').forEach(card => {
                    card.addEventListener('click', () => {
                        const gameName = card.dataset.game;
                        window.location.href = `game-panel.html?game=${encodeURIComponent(gameName)}`;
                    });
                });
            }

            // ---------- Get username/password from cookies ----------
            function getUsername() {
                return getCookie('code-mon-username');
            }

            function getPassword() {
                return getCookie('code-mon-pass');
            }

            // ---------- Fetch organizations for user ----------
            async function fetchOrgs() {
                const username = getUsername();
                if (!username) {
                    document.getElementById('projectError').innerText = 'Username not found in cookies';
                    return [];
                }
                try {
                    const response = await fetch(`https://code-mon.codemon.workers.dev/api/org/inv?username=${encodeURIComponent(username)}`);
                    const data = await response.json();
                    if (data.success && Array.isArray(data.orgs)) {
                        return data.orgs;
                    } else {
                        return [];
                    }
                } catch (err) {
                    document.getElementById('projectError').innerText = 'Failed to fetch organizations';
                    return [];
                }
            }

            // ---------- Populate project dropdown ----------
            async function populateProjects() {
                const projectSelect = document.getElementById('projectSelect');
                const orgs = await fetchOrgs();
                projectSelect.innerHTML = '<option value="">Select organization</option>';
                orgs.forEach(org => {
                    const option = document.createElement('option');
                    option.value = org;
                    option.textContent = org;
                    projectSelect.appendChild(option);
                });
                projectSelect.disabled = false;
            }

            // ---------- Handle type change ----------
            document.getElementById('typeSelect').addEventListener('change', async function(e) {
                const type = e.target.value;
                const projectGroup = document.getElementById('projectGroup');
                const projectSelect = document.getElementById('projectSelect');
                const projectError = document.getElementById('projectError');
                if (type === 'organization') {
                    projectGroup.style.display = 'block';
                    projectError.innerText = '';
                    await populateProjects();
                } else {
                    projectGroup.style.display = 'block'; // keep visible but disabled
                    projectSelect.disabled = true;
                    projectSelect.innerHTML = '<option value="">N/A (personal)</option>';
                }
            });

            // ---------- New Template modal ----------
            const newModal = document.getElementById('newModal');
            document.getElementById('newTemplateBtn').addEventListener('click', () => {
                // Reset form
                document.getElementById('typeSelect').value = 'personal';
                document.getElementById('gameName').value = '';
                document.getElementById('startingDir').value = '/';
                document.getElementById('projectSelect').innerHTML = '<option value="">Select organization</option>';
                document.getElementById('projectSelect').disabled = true;
                document.getElementById('projectError').innerText = '';
                // If personal, project group is visible but disabled
                document.getElementById('projectGroup').style.display = 'block';
                newModal.classList.add('active');
            });

            document.getElementById('cancelNew').addEventListener('click', () => {
                newModal.classList.remove('active');
            });

            document.getElementById('createBtn').addEventListener('click', async () => {
                const type = document.getElementById('typeSelect').value;
                const game = document.getElementById('gameName').value.trim();
                const starting = document.getElementById('startingDir').value.trim();
                let project = document.getElementById('projectSelect').value;

                // Validation
                if (!game) {
                    alert('Game name is required');
                    return;
                }
                if (!starting) {
                    alert('Starting directory is required');
                    return;
                }
                if (type === 'organization' && !project) {
                    alert('Please select a project');
                    return;
                }

                const username = getUsername();
                const pass = getPassword();
                if (!username || !pass) {
                    alert('Username or password not set in cookies (code-mon-username, code-mon-pass)');
                    return;
                }

                // For personal, project should be username
                if (type === 'personal') {
                    project = username;
                }

                // Prepare POST data
                const body = {
                    username,
                    pass,
                    game,
                    type,
                    project,
                    starting
                };

                try {
                    const response = await fetch('https://code-mon.codemon.workers.dev/api/game', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    const data = await response.json();
                    if (response.ok && data.success) {
                        // Store in cookies
                        addGame({ gameName: game, type, project, starting });
                        renderCards();
                        newModal.classList.remove('active');
                    } else {
                        alert('Error: ' + (data.error || 'Unknown error'));
                    }
                } catch (err) {
                    alert('Network error: ' + err.message);
                }
            });

            // ---------- Restore modal ----------
            const restoreModal = document.getElementById('restoreModal');
            document.getElementById('restoreTemplateBtn').addEventListener('click', () => {
                document.getElementById('restoreGameName').value = '';
                document.getElementById('restoreError').innerText = '';
                restoreModal.classList.add('active');
            });

            document.getElementById('cancelRestore').addEventListener('click', () => {
                restoreModal.classList.remove('active');
            });

            document.getElementById('restoreBtn').addEventListener('click', async () => {
                const gameName = document.getElementById('restoreGameName').value.trim();
                if (!gameName) {
                    document.getElementById('restoreError').innerText = 'Game name required';
                    return;
                }

                const username = getUsername();
                if (!username) {
                    document.getElementById('restoreError').innerText = 'Username not set in cookies';
                    return;
                }

                try {
                    const response = await fetch(`https://code-mon.codemon.workers.dev/api/game?user=${encodeURIComponent(username)}&game=${encodeURIComponent(gameName)}`);
                    const data = await response.json();
                    if (response.ok && !data.error) {
                        // data should contain { type, project, starting }
                        const { type, project, starting } = data;
                        // Add to cookies if not exists
                        addGame({ gameName, type, project, starting });
                        renderCards();
                        restoreModal.classList.remove('active');
                    } else {
                        document.getElementById('restoreError').innerText = data.error || 'Game not found';
                    }
                } catch (err) {
                    document.getElementById('restoreError').innerText = 'Network error';
                }
            });

            // ---------- Theme toggle (GitHub light/dark) ----------
            const themeToggle = document.getElementById('themeToggle');
            const body = document.body;
            if (getCookie('theme') === 'dark') {
                body.classList.add('dark');
                themeToggle.textContent = '☀️ Light';
            } else {
                themeToggle.textContent = '🌙 Dark';
            }

            themeToggle.addEventListener('click', () => {
                if (body.classList.contains('dark')) {
                    body.classList.remove('dark');
                    setCookie('theme', 'light');
                    themeToggle.textContent = '🌙 Dark';
                } else {
                    body.classList.add('dark');
                    setCookie('theme', 'dark');
                    themeToggle.textContent = '☀️ Light';
                }
            });

            // ---------- Initial render ----------
            renderCards();

            // If type is changed to org on modal open, we handle above.
            // Also pre-fetch if org is selected on modal open? No, user will select.
        })();
    </script>
</body>
</html>
