<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Panel · Code Mon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-light">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-dark" disabled>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #ffffff;
      --bg2: #f6f8fa;
      --bg3: #eaeef2;
      --bd: #d0d7de;
      --bdm: #e1e4e8;
      --tx: #1f2328;
      --txm: #636c76;
      --txs: #9198a1;
      --ac: #0969da;
      --ach: #0550ae;
      --acb: #ddf4ff;
      --ace: #54aeff;
      --ok: #1a7f37;
      --okb: #dafbe1;
      --er: #cf222e;
      --erb: #ffebe9;
      --sh1: 0 1px 0 rgba(27,31,36,.04);
      --sh2: 0 3px 6px rgba(140,149,159,.15);
      --sh3: 0 8px 24px rgba(140,149,159,.2);
      --r: 6px;
      --rl: 12px;
      --tr: 80ms cubic-bezier(.33,1,.68,1);
      --sw: 280px;
      --fw: 300px;
    }

    [data-theme="dark"] {
      --bg: #0d1117;
      --bg2: #161b22;
      --bg3: #21262d;
      --bd: #30363d;
      --bdm: #21262d;
      --tx: #e6edf3;
      --txm: #8b949e;
      --txs: #6e7681;
      --ac: #58a6ff;
      --ach: #79c0ff;
      --acb: rgba(56,139,253,.1);
      --ace: rgba(56,139,253,.4);
      --ok: #3fb950;
      --okb: rgba(46,160,67,.1);
      --er: #f85149;
      --erb: rgba(248,81,73,.1);
      --sh1: 0 1px 0 rgba(0,0,0,.25);
      --sh2: 0 3px 6px rgba(0,0,0,.3);
      --sh3: 0 8px 24px rgba(0,0,0,.45);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--tx);
      height: 100vh;
      overflow: hidden;
      font-size: 14px;
      line-height: 1.5;
    }

    button, input, textarea, select {
      font-family: inherit;
    }

    .hidden { display: none !important; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bd); border-radius: 4px; }

    /* Header */
    .hdr {
      background: var(--bg2);
      border-bottom: 1px solid var(--bd);
      height: 48px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: var(--sh1);
      z-index: 50;
    }
    .hdr-l { display: flex; align-items: center; gap: 10px; }
    .logo { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 14px; }
    .logo-mark { width: 26px; height: 26px; border-radius: 6px; background: linear-gradient(135deg,var(--ac),#6e40c9); display: flex; align-items: center; justify-content: center; }
    .hdr-r { display: flex; align-items: center; gap: 8px; }
    .thbtn { background: none; border: 1px solid var(--bd); border-radius: var(--r); color: var(--txm); cursor: pointer; padding: 4px 8px; display: flex; align-items: center; gap: 5px; font-size: 11px; transition: var(--tr); }
    .thbtn:hover { background: var(--bg3); color: var(--tx); }

    /* App layout */
    .app {
      display: flex;
      height: calc(100vh - 48px);
      overflow: hidden;
    }

    /* Left panel (file tree) */
    .left-panel {
      width: var(--sw);
      background: var(--bg2);
      border-right: 1px solid var(--bd);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }
    .panel-header {
      padding: 10px 12px;
      border-bottom: 1px solid var(--bd);
      font-size: 11px;
      font-weight: 600;
      color: var(--txm);
      text-transform: uppercase;
      letter-spacing: .5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .panel-header svg { width: 14px; height: 14px; fill: var(--ac); }
    .file-tree {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .folder-item, .file-item {
      display: flex;
      align-items: center;
      padding: 4px 12px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      transition: background 0.2s;
      user-select: none;
    }
    .folder-item:hover, .file-item:hover { background: var(--bg3); }
    .file-item.active { background: var(--acb); border-left: 3px solid var(--ac); }
    .folder-item .icon, .file-item .icon { width: 16px; height: 16px; margin-right: 8px; flex-shrink: 0; }
    .folder-item .icon { fill: var(--accent-yellow, #dcdcaa); }
    .file-item .icon.html { fill: #e34c26; }
    .file-item .icon.css { fill: #264de4; }
    .file-item .icon.js { fill: #f0db4f; }
    .file-item .icon.json { fill: #5dc9e2; }
    .file-item .icon.py { fill: #3776ab; }
    .file-item .icon.java { fill: #5382a1; }
    .file-item .icon.cpp { fill: #00599c; }
    .file-item .icon.md { fill: #ffffff; }
    .file-item .icon.txt { fill: #c0c0c0; }
    .file-item .icon.default { fill: #cccccc; }
    .folder-item .toggle { width: 16px; height: 16px; margin-right: 4px; fill: var(--txm); transition: transform 0.2s; }
    .folder-item .toggle.expanded { transform: rotate(90deg); }
    .folder-contents { display: none; padding-left: 20px; }
    .folder-contents.expanded { display: block; }

    /* Center panel */
    .center-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .toolbar {
      padding: 6px 12px;
      background: var(--bg2);
      border-bottom: 1px solid var(--bd);
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tool-btn {
      background: var(--bg);
      border: 1px solid var(--bd);
      border-radius: var(--r);
      color: var(--txm);
      padding: 4px 8px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: var(--tr);
    }
    .tool-btn:hover { background: var(--bg3); color: var(--tx); }
    .tool-btn svg { width: 12px; height: 12px; fill: currentColor; }
    .iframe-container {
      width: 100%;
      height: 40%;
      min-height: 200px;
      background: white;
      border-bottom: 1px solid var(--bd);
    }
    #preview-frame { width: 100%; height: 100%; border: none; background: white; }
    .editor-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: var(--bg);
    }
    #editor {
      width: 100%;
      height: 100%;
      padding: 16px;
      background: transparent;
      border: none;
      color: var(--tx);
      font-family: 'Fira Code', monospace;
      font-size: 13px;
      line-height: 1.6;
      resize: none;
      outline: none;
      tab-size: 4;
      overflow: auto;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      caret-color: var(--tx);
    }
    #highlighted-code {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 16px;
      margin: 0;
      overflow: auto;
      pointer-events: none;
      font-family: 'Fira Code', monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
      background: var(--bg);
      z-index: 0;
    }
    #highlighted-code code { background: transparent !important; padding: 0 !important; }

    /* Right panel (copilot) */
    .right-panel {
      width: var(--fw);
      background: var(--bg2);
      border-left: 1px solid var(--bd);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }
    .copilot-header {
      padding: 8px 12px;
      border-bottom: 1px solid var(--bd);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
    }
    .model-select {
      background: var(--bg);
      border: 1px solid var(--bd);
      border-radius: var(--r);
      padding: 4px 20px 4px 6px;
      font-size: 11px;
      color: var(--tx);
      outline: none;
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='12' viewBox='0 0 16 16' fill='%236e7681'%3E%3Cpath d='M4.427 7.427l3.396 3.396a.25.25 0 0 0 .354 0l3.396-3.396A.25.25 0 0 0 11.396 7H4.604a.25.25 0 0 0-.177.427z'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 4px center;
      background-size: 12px;
    }
    .think-btn {
      background: none;
      border: 1px solid var(--bd);
      border-radius: var(--r);
      color: var(--txm);
      cursor: pointer;
      padding: 4px 6px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
    }
    .think-btn.on { background: var(--acb); border-color: var(--ace); color: var(--ac); }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .chat-messages:empty {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chat-messages:empty::after {
      content: 'Ask me anything about your game...';
      color: var(--txm);
      font-size: 12px;
      text-align: center;
      max-width: 200px;
    }
    .msg { display: flex; gap: 8px; }
    .msg.ai { flex-direction: row; }
    .msg.user { flex-direction: row-reverse; }
    .avatar {
      width: 24px; height: 24px; border-radius: 4px;
      background: var(--bg3); color: var(--txm);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; flex-shrink: 0;
    }
    .msg.ai .avatar { background: var(--acb); color: var(--ac); }
    .bubble {
      max-width: calc(100% - 32px);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.5;
      word-break: break-word;
    }
    .msg.ai .bubble { background: var(--bg); border: 1px solid var(--bd); }
    .msg.user .bubble { background: var(--ac); color: white; }
    .chat-input-area {
      padding: 12px;
      border-top: 1px solid var(--bd);
      display: flex;
      gap: 6px;
    }
    .chat-input-area textarea {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--bd);
      border-radius: var(--r);
      color: var(--tx);
      padding: 6px 8px;
      font-size: 12px;
      resize: none;
      outline: none;
    }
    .chat-send {
      background: var(--ac);
      border: none;
      border-radius: var(--r);
      color: white;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .chat-send svg { width: 14px; height: 14px; fill: currentColor; }

    /* Status bar */
    .status-bar {
      height: 24px;
      background: var(--bg2);
      border-top: 1px solid var(--bd);
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-size: 11px;
      color: var(--txm);
      gap: 20px;
    }

    /* Modals (simplified) */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none; align-items: center; justify-content: center;
      z-index: 2000;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--bg); border: 1px solid var(--bd); border-radius: var(--rl);
      width: 90%; max-width: 400px; padding: 20px;
    }
    .modal h3 { margin-bottom: 16px; }
    .modal-input {
      width: 100%; padding: 8px; background: var(--bg2); border: 1px solid var(--bd);
      border-radius: var(--r); color: var(--tx); margin-bottom: 16px;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

    /* Mobile responsiveness */
    @media (max-width: 720px) {
      .left-panel { position: fixed; top: 48px; left: 0; bottom: 24px; z-index: 100; transform: translateX(-100%); transition: transform 0.2s; }
      .left-panel.mob { transform: translateX(0); }
      .right-panel { position: fixed; top: 48px; right: 0; bottom: 24px; z-index: 100; transform: translateX(100%); transition: transform 0.2s; }
      .right-panel.mob { transform: translateX(0); }
      .mob-overlay { display: none; position: fixed; inset: 0; top: 48px; background: rgba(0,0,0,0.4); z-index: 99; }
      .mob-overlay.on { display: block; }
    }
  </style>
</head>
<body>
  <header class="hdr">
    <div class="hdr-l">
      <button class="tool-btn" id="menu-toggle" style="border:none; padding:4px 6px;">
        <svg width="14" height="14" viewBox="0 0 16 16"><path d="M1 2.75A.75.75 0 0 1 1.75 2h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 2.75Zm0 5A.75.75 0 0 1 1.75 7h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 7.75ZM1.75 12h12.5a.75.75 0 0 1 0 1.5H1.75a.75.75 0 0 1 0-1.5Z"/></svg>
      </button>
      <div class="logo">
        <div class="logo-mark"><svg width="14" height="14" viewBox="0 0 16 16" fill="#fff"><path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8Z"/></svg></div>
        Game Panel
      </div>
    </div>
    <div class="hdr-r">
      <button class="thbtn" id="theme-toggle"></button>
      <button class="tool-btn" id="files-toggle">Files</button>
    </div>
  </header>

  <div class="app">
    <!-- Left file tree -->
    <aside class="left-panel" id="leftPanel">
      <div class="panel-header">
        <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
        <span>EXPLORER</span>
      </div>
      <div class="file-tree" id="file-tree"></div>
    </aside>

    <!-- Center editor + preview -->
    <div class="center-panel">
      <div class="toolbar" id="toolbar">
        <button class="tool-btn" id="new-file-btn"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg> New</button>
        <button class="tool-btn" id="upload-btn"><svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg> Upload</button>
        <button class="tool-btn" id="save-btn"><svg viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg> Save</button>
        <button class="tool-btn" id="delete-btn"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg> Delete</button>
        <button class="tool-btn" id="download-btn"><svg viewBox="0 0 24 24"><path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2z"/></svg> Download</button>
      </div>
      <div class="iframe-container">
        <iframe id="preview-frame" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
      </div>
      <div class="editor-wrapper">
        <pre id="highlighted-code"><code></code></pre>
        <textarea id="editor" placeholder="Select a file to edit..." spellcheck="false"></textarea>
      </div>
    </div>

    <!-- Right copilot -->
    <aside class="right-panel" id="rightPanel">
      <div class="copilot-header">
        <select id="model-select" class="model-select"></select>
        <button class="think-btn" id="think-btn">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5A6.5 6.5 0 1 0 14.5 8 6.508 6.508 0 0 0 8 1.5ZM0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8Zm9 3a1 1 0 1 1-2 0 1 1 0 0 1 2 0ZM6.92 6.085c.081-.16.19-.299.34-.398.145-.097.371-.187.74-.187.28 0 .553.087.738.225A.613.613 0 0 1 9 6.25c0 .177-.04.264-.077.318a.956.956 0 0 1-.277.245c-.076.051-.158.1-.258.161l-.007.004a7.728 7.728 0 0 0-.313.195 2.416 2.416 0 0 0-.692.742A2.65 2.65 0 0 0 7 9h1.5a1.15 1.15 0 0 1 .025-.242 1.01 1.01 0 0 1 .274-.39 5.21 5.21 0 0 1 .197-.133l.01-.006.35-.214c.17-.105.36-.225.52-.35.22-.17.42-.38.57-.65.15-.27.22-.56.22-.865 0-.47-.17-.92-.47-1.26C9.83 4.72 9.33 4.5 8 4.5c-.636 0-1.162.156-1.58.438-.413.278-.71.657-.88 1.047Z"/></svg>
          Think<span id="think-indicator" style="display:none; width:6px;height:6px;border-radius:50%;background:#6e40c9;margin-left:2px;"></span>
        </button>
      </div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-area">
        <textarea id="chat-input" rows="2" placeholder="Ask copilot..."></textarea>
        <button class="chat-send" id="chat-send">
          <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
        </button>
      </div>
    </aside>
  </div>

  <div class="status-bar">
    <span id="status-file">No file</span>
    <span id="status-lines">Lines: 0</span>
    <span id="status-game"></span>
  </div>

  <!-- Modals -->
  <div class="modal-overlay" id="new-file-modal">
    <div class="modal">
      <h3>Create New File</h3>
      <input type="text" class="modal-input" id="new-file-path" placeholder="filename.js">
      <div class="modal-actions">
        <button class="tool-btn" id="new-file-cancel">Cancel</button>
        <button class="tool-btn" id="new-file-create">Create</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="upload-modal">
    <div class="modal">
      <h3>Upload File</h3>
      <input type="text" class="modal-input" id="upload-path" placeholder="destination/file.txt">
      <input type="file" id="upload-file" style="margin-bottom:12px; background:var(--bg2); color:var(--tx); border:1px solid var(--bd); width:100%;">
      <div class="modal-actions">
        <button class="tool-btn" id="upload-cancel">Cancel</button>
        <button class="tool-btn" id="upload-confirm">Upload</button>
      </div>
    </div>
  </div>

  <div class="mob-overlay" id="mobOverlay" onclick="closeMobPanels()"></div>

  <script>
    (function() {
      // ----- constants and global state -----
      const API_BASE = "https://code-mon.codemon.workers.dev";
      const username = localStorage.getItem("code-mon-username");
      const password = localStorage.getItem("code-mon-pass");
      if (!username || !password) { alert("Not logged in"); location.href = "login.html"; return; }

      const urlParams = new URLSearchParams(window.location.search);
      const gameName = urlParams.get("game");
      if (!gameName) { alert("Missing game parameter"); history.back(); return; }

      let gameConfig = null;          // { type, project, starting }
      let currentFile = null;
      let fileContent = "";
      let orgName = null;
      let currentDir = "/";           // starting dir
      let fileStructure = {};          // placeholder
      let openTabs = [];               // not used much

      // API endpoints determined by type
      let api = {
        listDir: (user, dir) => `${API_BASE}/api/list-dir?user=${encodeURIComponent(user)}&dir=${encodeURIComponent(dir)}`,
        load: null,
        save: null,
        delete: null,
        upload: null,
        previewBase: null,
      };

      // ----- helper: show notification (simple) -----
      function notify(msg, type = 'info') {
        alert(msg); // simplified
      }

      // ----- fetch game config -----
      async function initGame() {
        try {
          const res = await fetch(`${API_BASE}/api/game?user=${encodeURIComponent(username)}&game=${encodeURIComponent(gameName)}`);
          const data = await res.json();
          if (data.error) throw new Error(data.error);
          gameConfig = data;
          document.getElementById('status-game').textContent = `${gameName} (${gameConfig.type})`;
          currentDir = gameConfig.starting || '/';

          if (gameConfig.type === 'personal') {
            api.load = (filename) => `${API_BASE}/api/load?user=${encodeURIComponent(username)}&filename=${encodeURIComponent(filename)}`;
            api.save = `${API_BASE}/api/save`;
            api.delete = `${API_BASE}/api/delete-file`;
            api.upload = `${API_BASE}/api/save`;
            api.previewBase = `https://${username}.code-mon-space.shop/`;
          } else {
            orgName = gameConfig.project;
            api.load = (filename) => `${API_BASE}/api/load-org?user=${encodeURIComponent(username)}&orgName=${encodeURIComponent(orgName)}&filename=${encodeURIComponent(filename)}`;
            api.save = `${API_BASE}/api/save-org`;
            api.delete = `${API_BASE}/api/delete-org-file`;
            api.upload = `${API_BASE}/api/save-org`;
            api.previewBase = `https://${orgName}.code-mon-space.shop/${username}/`;
          }

          await loadDirectory(currentDir);
        } catch (e) {
          alert("Failed to load game: " + e.message);
          history.back();
        }
      }

      // ----- load directory using list-dir -----
      async function loadDirectory(dirPath) {
        let userParam;
        if (gameConfig.type === 'personal') {
          userParam = username;
        } else {
          userParam = `org/${orgName}/${username}`;
        }
        const url = api.listDir(userParam, dirPath);
        try {
          const res = await fetch(url);
          const data = await res.json();
          if (data.error) throw new Error(data.error);
          renderFileTree(data.files, dirPath);
        } catch (e) {
          console.error("Failed to list dir", e);
        }
      }

      // ----- render file tree (simple flat for now, but with folders) -----
      function renderFileTree(files, currentDir) {
        const container = document.getElementById('file-tree');
        container.innerHTML = '';

        // Build a simple tree from paths relative to currentDir
        const tree = { folders: {}, files: [] };
        files.forEach(f => {
          const parts = f.split('/');
          if (parts.length === 1) {
            tree.files.push(f);
          } else {
            let level = tree;
            for (let i = 0; i < parts.length - 1; i++) {
              const folder = parts[i];
              if (!level.folders[folder]) level.folders[folder] = { folders: {}, files: [] };
              level = level.folders[folder];
            }
            level.files.push(parts[parts.length - 1]);
          }
        });

        function renderNode(node, pathPrefix = '') {
          const frag = document.createDocumentFragment();
          // folders
          Object.keys(node.folders).sort().forEach(folderName => {
            const folderPath = pathPrefix ? `${pathPrefix}/${folderName}` : folderName;
            const folderDiv = document.createElement('div');
            folderDiv.className = 'folder-item';
            folderDiv.innerHTML = `
              <svg class="toggle" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5v10z"/></svg>
              <svg class="icon" viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
              <span>${folderName}</span>
            `;
            const contentsDiv = document.createElement('div');
            contentsDiv.className = 'folder-contents';
            const toggle = folderDiv.querySelector('.toggle');
            folderDiv.addEventListener('click', async (e) => {
              e.stopPropagation();
              const expanded = contentsDiv.classList.toggle('expanded');
              toggle.classList.toggle('expanded', expanded);
              if (expanded && contentsDiv.children.length === 0) {
                // lazy load subfolder contents
                let userParam;
                if (gameConfig.type === 'personal') userParam = username;
                else userParam = `org/${orgName}/${username}`;
                const subUrl = api.listDir(userParam, folderPath);
                try {
                  const res = await fetch(subUrl);
                  const data = await res.json();
                  if (!data.error) {
                    const subTree = { folders: {}, files: [] };
                    data.files.forEach(f => {
                      const rel = f.replace(folderPath + '/', '');
                      if (!rel.includes('/')) subTree.files.push(rel);
                      else {
                        // deeper folder - ignore for simplicity
                      }
                    });
                    subTree.files.sort().forEach(file => {
                      const fullPath = folderPath + '/' + file;
                      const fileItem = createFileItem(file, fullPath);
                      contentsDiv.appendChild(fileItem);
                    });
                  }
                } catch (err) {}
              }
            });
            folderDiv.appendChild(contentsDiv);
            frag.appendChild(folderDiv);
          });
          // files
          node.files.sort().forEach(file => {
            const fullPath = pathPrefix ? `${pathPrefix}/${file}` : file;
            frag.appendChild(createFileItem(file, fullPath));
          });
          return frag;
        }

        function createFileItem(displayName, fullPath) {
          const div = document.createElement('div');
          div.className = 'file-item';
          if (currentFile === fullPath) div.classList.add('active');
          div.dataset.path = fullPath;

          const ext = displayName.split('.').pop().toLowerCase();
          let iconClass = 'default';
          if (['html','htm'].includes(ext)) iconClass = 'html';
          else if (ext === 'css') iconClass = 'css';
          else if (['js','jsx'].includes(ext)) iconClass = 'js';
          else if (ext === 'json') iconClass = 'json';
          else if (ext === 'py') iconClass = 'py';
          else if (ext === 'java') iconClass = 'java';
          else if (ext === 'cpp' || ext === 'c') iconClass = 'cpp';
          else if (ext === 'md') iconClass = 'md';
          else if (ext === 'txt') iconClass = 'txt';

          div.innerHTML = `
            <svg class="icon ${iconClass}" viewBox="0 0 24 24"><path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z"/></svg>
            <span>${displayName}</span>
          `;
          div.addEventListener('click', () => openFile(fullPath));
          return div;
        }

        container.appendChild(renderNode(tree));
      }

      // ----- open file (load content) -----
      async function openFile(path) {
        currentFile = path;
        document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
        const activeEl = Array.from(document.querySelectorAll('.file-item')).find(el => el.dataset.path === path);
        if (activeEl) activeEl.classList.add('active');

        try {
          const url = api.load(path);
          const res = await fetch(url);
          const content = await res.text();
          fileContent = content;
          document.getElementById('editor').value = content;
          updateSyntaxHighlighting();
          updateStatusBar();

          if (path.endsWith('.html') || path.endsWith('.htm')) {
            refreshPreview(path, content);
          } else {
            document.getElementById('preview-frame').src = 'about:blank';
          }
        } catch (e) {
          alert("Failed to load file: " + e.message);
        }
      }

      function refreshPreview(path, content) {
        const iframe = document.getElementById('preview-frame');
        if (gameConfig.type === 'personal') {
          iframe.src = api.previewBase + path;
        } else {
          const blob = new Blob([content], { type: 'text/html' });
          iframe.src = URL.createObjectURL(blob);
        }
      }

      // ----- syntax highlighting -----
      function updateSyntaxHighlighting() {
        const editor = document.getElementById('editor');
        const highlighted = document.getElementById('highlighted-code');
        const codeEl = highlighted.querySelector('code');
        const content = editor.value;

        codeEl.textContent = content;
        codeEl.className = '';
        if (currentFile) {
          const ext = currentFile.split('.').pop().toLowerCase();
          const langMap = { js:'javascript', jsx:'javascript', ts:'typescript', html:'html', css:'css', json:'json', py:'python', java:'java', cpp:'cpp', c:'cpp', md:'markdown' };
          const lang = langMap[ext] || 'plaintext';
          codeEl.className = `language-${lang}`;
        }
        delete codeEl.dataset.highlighted;
        hljs.highlightElement(codeEl);

        highlighted.scrollTop = editor.scrollTop;
        highlighted.scrollLeft = editor.scrollLeft;
      }

      document.getElementById('editor').addEventListener('input', updateSyntaxHighlighting);
      document.getElementById('editor').addEventListener('scroll', function() {
        document.getElementById('highlighted-code').scrollTop = this.scrollTop;
        document.getElementById('highlighted-code').scrollLeft = this.scrollLeft;
      });

      function updateStatusBar() {
        const lines = document.getElementById('editor').value.split('\n').length;
        document.getElementById('status-file').textContent = currentFile || 'No file';
        document.getElementById('status-lines').textContent = `Lines: ${lines}`;
      }

      // ----- file operations -----
      async function saveCurrentFile() {
        if (!currentFile) return alert('No file open');
        const content = document.getElementById('editor').value;
        const body = gameConfig.type === 'personal'
          ? { user: username, pass: password, filename: currentFile, content }
          : { user: username, pass: password, orgName: orgName, filename: currentFile, content };
        try {
          const res = await fetch(api.save, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error);
          fileContent = content;
          notify('File saved', 'ok');
          if (currentFile.endsWith('.html')) refreshPreview(currentFile, content);
        } catch (e) { alert('Save failed: ' + e.message); }
      }

      async function deleteCurrentFile() {
        if (!currentFile) return alert('No file selected');
        if (!confirm(`Delete ${currentFile}?`)) return;
        const body = gameConfig.type === 'personal'
          ? { username, pass: password, filename: currentFile }
          : { username, pass: password, orgName, filename: currentFile };
        try {
          const res = await fetch(api.delete, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error);
          notify('File deleted');
          currentFile = null;
          document.getElementById('editor').value = '';
          updateSyntaxHighlighting();
          updateStatusBar();
          await loadDirectory(currentDir);
        } catch (e) { alert('Delete failed: ' + e.message); }
      }

      // ----- create new file (with starting dir) -----
      async function createFile(path) {
        const fullPath = currentDir === '/' ? path : `${currentDir}/${path}`;
        const body = gameConfig.type === 'personal'
          ? { user: username, pass: password, filename: fullPath, content: '' }
          : { user: username, pass: password, orgName, filename: fullPath, content: '' };
        try {
          const res = await fetch(api.save, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error);
          notify('File created');
          await loadDirectory(currentDir);
          openFile(fullPath);
        } catch (e) { alert('Create failed: ' + e.message); }
      }

      // ----- upload file (text or media) -----
      async function uploadFile(path, file) {
        const fullPath = currentDir === '/' ? path : `${currentDir}/${path}`;
        const isMedia = /\.(png|jpg|jpeg|gif|webp|mp4|mp3|wav|avi|mov)$/i.test(file.name);
        if (!isMedia) {
          const reader = new FileReader();
          reader.onload = async (e) => {
            const content = e.target.result;
            const body = gameConfig.type === 'personal'
              ? { user: username, pass: password, filename: fullPath, content }
              : { user: username, pass: password, orgName, filename: fullPath, content };
            try {
              const res = await fetch(api.save, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
              });
              const data = await res.json();
              if (data.error) throw new Error(data.error);
              notify('File uploaded');
              await loadDirectory(currentDir);
              openFile(fullPath);
            } catch (e) { alert('Upload failed: ' + e.message); }
          };
          reader.readAsText(file);
        } else {
          const reader = new FileReader();
          reader.onload = async (e) => {
            const arrayBuffer = e.target.result;
            const endpoint = gameConfig.type === 'personal' ? '/api/img-save' : '/api/img-save-org';
            const headers = gameConfig.type === 'personal'
              ? { 'x-user': username, 'x-pass': password, 'x-filename': fullPath }
              : { 'x-user': username, 'x-pass': password, 'x-org': orgName, 'x-filename': fullPath };
            try {
              const res = await fetch(API_BASE + endpoint, {
                method: 'POST',
                headers,
                body: arrayBuffer
              });
              const data = await res.json();
              if (data.error) throw new Error(data.error);
              notify('Media uploaded');
              await loadDirectory(currentDir);
            } catch (e) { alert('Upload failed: ' + e.message); }
          };
          reader.readAsArrayBuffer(file);
        }
      }

      // ----- download current file -----
      function downloadCurrentFile() {
        if (!currentFile) return alert('No file open');
        const content = document.getElementById('editor').value;
        const blob = new Blob([content], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = currentFile.split('/').pop();
        a.click();
        URL.revokeObjectURL(url);
      }

      // ----- Copilot integration (simplified from copilot (3).html) -----
      const MODEL_CONFIG = {
        "gpt-oss": { name: "GPT-OSS" },
        "gpt-4o": { name: "GPT-4o" },
        "sonnet": { name: "Claude Sonnet" },
        "deepseek-3.2": { name: "DeepSeek 3.2" }
      };
      let thinkMode = false;
      let chatMessages = [];

      function populateModelSelect() {
        const sel = document.getElementById('model-select');
        sel.innerHTML = Object.keys(MODEL_CONFIG).map(key => `<option value="${key}">${MODEL_CONFIG[key].name}</option>`).join('');
      }
      populateModelSelect();

      document.getElementById('think-btn').addEventListener('click', () => {
        thinkMode = !thinkMode;
        const btn = document.getElementById('think-btn');
        const ind = document.getElementById('think-indicator');
        btn.classList.toggle('on', thinkMode);
        ind.style.display = thinkMode ? 'inline-block' : 'none';
      });

      function appendMessage(role, content) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${role}`;
        msgDiv.innerHTML = `
          <div class="avatar">${role === 'ai' ? 'AI' : 'U'}</div>
          <div class="bubble">${content}</div>
        `;
        document.getElementById('chat-messages').appendChild(msgDiv);
        document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;
      }

      async function sendChat() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text) return;
        appendMessage('user', text);
        input.value = '';

        // Simulate AI response (in real, call API with context)
        setTimeout(() => {
          appendMessage('ai', "I'm your copilot. I can help generate code, explain ECS, or deploy files. Try asking me to create a new component.");
        }, 500);
      }

      document.getElementById('chat-send').addEventListener('click', sendChat);
      document.getElementById('chat-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
      });

      // ----- Theme toggle (from copilot) -----
      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        document.getElementById('hljs-light').disabled = theme === 'dark';
        document.getElementById('hljs-dark').disabled = theme !== 'dark';
        const btn = document.getElementById('theme-toggle');
        btn.innerHTML = theme === 'dark'
          ? '<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M8 12a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-1.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Zm5.657-8.157a.75.75 0 0 1 0 1.061l-1.061 1.06a.749.749 0 0 1-1.275-.326.749.749 0 0 1 .215-.734l1.06-1.06a.75.75 0 0 1 1.06 0Zm-9.193 9.193a.75.75 0 0 1 0 1.06l-1.06 1.061a.75.75 0 1 1-1.061-1.06l1.06-1.061a.75.75 0 0 1 1.061 0ZM8 0a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0V.75A.75.75 0 0 1 8 0ZM3 8a.75.75 0 0 1-.75.75H.75a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 3 8Zm13 0a.75.75 0 0 1-.75.75h-1.5a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 16 8Zm-8 5a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5A.75.75 0 0 1 8 13Zm4.596-1.596a.75.75 0 0 1 1.06 0l1.061 1.06a.75.75 0 0 1-1.06 1.061l-1.061-1.06a.75.75 0 0 1 0-1.061Zm-9.193-9.193a.75.75 0 0 1 1.06 0l1.061 1.06a.75.75 0 0 1-1.06 1.061L2.403 4.211a.75.75 0 0 1 0-1.06Z"/></svg> Light'
          : '<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M9.598 1.591a.749.749 0 0 1 .785-.175 7 7 0 1 1-8.967 8.967.75.75 0 0 1 .961-.96 5.5 5.5 0 0 0 7.046-7.046.75.75 0 0 1 .175-.786Zm1.616 1.945a7 7 0 0 1-7.678 7.678 5.499 5.499 0 1 0 7.678-7.678Z"/></svg> Dark';
      }
      const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      applyTheme(savedTheme);
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        applyTheme(current === 'dark' ? 'light' : 'dark');
      });

      // ----- mobile panel toggles -----
      document.getElementById('menu-toggle').addEventListener('click', () => {
        document.getElementById('leftPanel').classList.toggle('mob');
        document.getElementById('mobOverlay').classList.toggle('on');
      });
      document.getElementById('files-toggle').addEventListener('click', () => {
        document.getElementById('rightPanel').classList.toggle('mob');
        document.getElementById('mobOverlay').classList.toggle('on');
      });
      window.closeMobPanels = function() {
        document.getElementById('leftPanel').classList.remove('mob');
        document.getElementById('rightPanel').classList.remove('mob');
        document.getElementById('mobOverlay').classList.remove('on');
      };

      // ----- toolbar event listeners -----
      document.getElementById('new-file-btn').addEventListener('click', () => {
        document.getElementById('new-file-modal').classList.add('active');
      });
      document.getElementById('new-file-cancel').addEventListener('click', () => {
        document.getElementById('new-file-modal').classList.remove('active');
      });
      document.getElementById('new-file-create').addEventListener('click', () => {
        const path = document.getElementById('new-file-path').value.trim();
        if (!path) return;
        document.getElementById('new-file-modal').classList.remove('active');
        createFile(path);
      });

      document.getElementById('upload-btn').addEventListener('click', () => {
        document.getElementById('upload-modal').classList.add('active');
      });
      document.getElementById('upload-cancel').addEventListener('click', () => {
        document.getElementById('upload-modal').classList.remove('active');
      });
      document.getElementById('upload-confirm').addEventListener('click', () => {
        const path = document.getElementById('upload-path').value.trim();
        const fileInput = document.getElementById('upload-file');
        if (!path || !fileInput.files.length) return;
        document.getElementById('upload-modal').classList.remove('active');
        uploadFile(path, fileInput.files[0]);
      });

      document.getElementById('save-btn').addEventListener('click', saveCurrentFile);
      document.getElementById('delete-btn').addEventListener('click', deleteCurrentFile);
      document.getElementById('download-btn').addEventListener('click', downloadCurrentFile);

      // Keyboard save
      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
          e.preventDefault();
          saveCurrentFile();
        }
      });

      // ----- start -----
      initGame();
    })();
  </script>
</body>
</html>
