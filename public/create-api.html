 <!DOCTYPE html>
<html>
<head>
<title>API Key Manager</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #0d0d0d;
        color: white;
        margin: 0;
        padding: 20px;
        text-align: center;
    }

    h1 {
        color: #00eaff;
        text-shadow: 0 0 10px #00eaff;
        margin-bottom: 10px;
    }

    .box {
        background: #111;
        padding: 20px;
        border-radius: 10px;
        width: 90%;
        max-width: 500px;
        margin: auto;
        box-shadow: 0 0 15px #0099cc;
    }

    input {
        width: 90%;
        padding: 12px;
        margin-top: 10px;
        border: none;
        border-radius: 6px;
        background: #1a1a1a;
        color: #00eaff;
        outline: none;
        font-size: 16px;
        box-shadow: inset 0 0 8px #00eaff;
    }

    button {
        margin-top: 15px;
        width: 200px;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #00eaff;
        color: black;
        font-weight: bold;
        cursor: pointer;
        font-size: 16px;
        box-shadow: 0 0 15px #00eaff;
        transition: 0.2s;
    }

    button:hover {
        background: #00bcd4;
        box-shadow: 0 0 25px #00eaff;
    }

    .output {
        margin-top: 20px;
        padding: 15px;
        background: #111;
        border-radius: 10px;
        box-shadow: 0 0 10px #0099cc;
        text-align: left;
        white-space: pre-wrap;
        font-size: 14px;
    }

    .keys-box {
        margin-top: 25px;
        padding: 15px;
        background: #181818;
        border-radius: 10px;
        box-shadow: 0 0 10px #005577;
    }
</style>
</head>
<body>

<h1>API Value Setter</h1>

<div class="box">
    <input id="keyInput" placeholder="Enter key (example: mykey)">
    <input id="valueInput" placeholder="Enter value">

    <button onclick="postValue()">POST</button>
</div>

<div class="output" id="resultBox">Waiting...</div>

<div class="keys-box">
    <h3 style="color:#00eaff;">Your Stored Keys</h3>
    <div id="keysList">Loading...</div>
</div>

<script>
const API_BASE = "https://code-mon.codemon.workers.dev/api/api-get";

// Load username
let username = localStorage.getItem("code-mon-username");
if (!username) {
    username = prompt("Enter your username:");
    localStorage.setItem("code-mon-username", username);
}

// POST KEY → VALUE
async function postValue() {
    const key = document.getElementById("keyInput").value.trim();
    const value = document.getElementById("valueInput").value.trim();

    if (!key || !value) {
        resultBox.textContent = "Enter both key and value!";
        return;
    }

    const fullKey = `${username}/${key}`;

    const url = `${API_BASE}?method=POST&key=${encodeURIComponent(fullKey)}&value=${encodeURIComponent(value)}`;

    resultBox.textContent = "Posting...";

    try {
        const res = await fetch(url);
        const text = await res.text();
        resultBox.textContent =
            text +
            `\n\nTo GET this value:\n${API_BASE}?method=GET&key=${fullKey}`;

        loadKeys(); // refresh list
    } catch (err) {
        resultBox.textContent = "POST Error: " + err.message;
    }
}

// LOAD USER KEYS
async function loadKeys() {
    const listURL = `https://code-mon.codemon.workers.dev/api/list?user=${username}`;

    try {
        const res = await fetch(listURL);
        const data = await res.json();

        if (!data.keys || data.keys.length === 0) {
            keysList.textContent = "(none yet)";
            return;
        }

        keysList.innerHTML = data.keys
            .map(k => `<div>🔑 ${k}</div>`)
            .join("");

    } catch (err) {
        keysList.textContent = "Error loading keys";
    }
}

loadKeys();
</script>

</body>
</html>
