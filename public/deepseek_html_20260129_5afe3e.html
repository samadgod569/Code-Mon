<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Studio Pro</title>
<link rel="icon" type="image/png" href="img/icon.png" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/vs2015.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/java.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/cpp.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/html.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/css.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500;600&display=swap');

:root {
    /* VS Code Dark Theme Colors */
    --bg-primary: #1e1e1e;
    --bg-secondary: #252526;
    --bg-tertiary: #2d2d30;
    --bg-card: #3e3e42;
    --bg-hover: #3e3e42;
    --bg-active: #094771;
    --border: #454545;
    --border-light: #4f4f4f;
    --text-primary: #cccccc;
    --text-secondary: #858585;
    --text-dim: #6b7280;
    
    /* VS Code Syntax Colors */
    --accent-blue: #569cd6;
    --accent-purple: #c586c0;
    --accent-green: #4ec9b0;
    --accent-orange: #ce9178;
    --accent-yellow: #dcdcaa;
    --accent-red: #f44747;
    --accent-cyan: #9cdcfe;
    --accent-pink: #d16969;
    
    /* GitHub-like accents */
    --github-blue: #0366d6;
    --github-green: #28a745;
    --github-red: #d73a49;
    --github-purple: #6f42c1;
    --github-orange: #e36209;
    
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
    --shadow-light: 0 4px 20px rgba(0, 0, 0, 0.2);
    --shadow-heavy: 0 12px 40px rgba(0, 0, 0, 0.4);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    height: 100vh;
    overflow: hidden;
    font-size: 14px;
}

/* Premium Glass Effect Background */
.glass-panel {
    background: rgba(37, 37, 38, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: var(--shadow);
}

/* HEADER */
header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    height: 50px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    z-index: 100;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 20px;
}

.header-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 16px;
    font-weight: 600;
    color: var(--accent-blue);
}

.header-brand svg {
    width: 22px;
    height: 22px;
    fill: var(--accent-blue);
}

.header-actions {
    display: flex;
    gap: 8px;
}

.header-btn {
    padding: 6px 12px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-primary);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 6px;
}

.header-btn:hover {
    background: var(--bg-hover);
    border-color: var(--border-light);
}

.header-btn svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
}

/* STATUS BAR */
.status-bar {
    height: 22px;
    background: var(--bg-secondary);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    font-size: 12px;
    color: var(--text-secondary);
    gap: 20px;
}

.status-item {
    display: flex;
    align-items: center;
    gap: 6px;
}

/* MAIN LAYOUT */
.main-container {
    display: flex;
    height: calc(100vh - 72px);
}

/* SIDEBAR */
.sidebar {
    width: 280px;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.sidebar-section {
    padding: 20px 16px;
    border-bottom: 1px solid var(--border);
}

.section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-bottom: 12px;
    letter-spacing: 0.5px;
}

/* Sidebar Actions */
.sidebar-actions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 12px;
}

.action-btn {
    padding: 8px 12px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-primary);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 6px;
    justify-content: center;
}

.action-btn:hover {
    background: var(--bg-hover);
    border-color: var(--accent-blue);
}

.action-btn.primary {
    background: var(--accent-blue);
    border-color: var(--accent-blue);
    color: white;
}

.action-btn.primary:hover {
    background: #4a8bc8;
}

.action-btn.success {
    background: var(--accent-green);
    border-color: var(--accent-green);
    color: white;
}

.action-btn.full {
    grid-column: 1 / -1;
}

.action-btn svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
}

/* Explorer */
.explorer {
    flex: 1;
    overflow-y: auto;
}

.explorer-header {
    padding: 12px 16px;
    font-weight: 600;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
}

.explorer-header svg {
    width: 16px;
    height: 16px;
    fill: var(--accent-blue);
}

.explorer-items {
    padding: 8px 0;
}

.file-item {
    display: flex;
    align-items: center;
    padding: 6px 16px 6px 32px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s ease;
    position: relative;
}

.file-item:hover {
    background: var(--bg-hover);
}

.file-item.active {
    background: var(--bg-active);
}

.file-item::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--accent-blue);
    opacity: 0;
    transition: opacity 0.2s;
}

.file-item.active::before {
    opacity: 1;
}

.file-icon {
    width: 16px;
    height: 16px;
    margin-right: 8px;
    flex-shrink: 0;
}

.folder .file-icon {
    fill: var(--accent-blue);
}

.file .file-icon {
    fill: var(--text-secondary);
}

.file-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.file-actions {
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.2s;
}

.file-item:hover .file-actions {
    opacity: 1;
}

.file-action-btn {
    padding: 2px 6px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text-secondary);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
}

.file-action-btn:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
}

.file-action-btn.delete:hover {
    color: var(--accent-red);
    border-color: var(--accent-red);
}

.folder-children {
    padding-left: 16px;
    display: none;
}

.folder.expanded .folder-children {
    display: block;
}

.folder-header {
    display: flex;
    align-items: center;
    cursor: pointer;
    padding: 6px 16px;
    transition: all 0.2s;
}

.folder-header:hover {
    background: var(--bg-hover);
}

.folder-arrow {
    width: 16px;
    height: 16px;
    margin-right: 4px;
    fill: var(--text-secondary);
    transform: rotate(0deg);
    transition: transform 0.2s;
}

.folder.expanded .folder-arrow {
    transform: rotate(90deg);
}

/* EDITOR */
.editor-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.editor-tabs {
    display: flex;
    background: var(--bg-tertiary);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
}

.editor-tab {
    padding: 10px 20px;
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    border-right: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
    min-width: 120px;
}

.editor-tab:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
}

.editor-tab.active {
    background: var(--bg-primary);
    color: var(--text-primary);
    position: relative;
}

.editor-tab.active::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--accent-blue);
}

.tab-icon {
    width: 14px;
    height: 14px;
    fill: currentColor;
}

.tab-close {
    margin-left: auto;
    padding: 2px;
    border-radius: 3px;
    opacity: 0;
    transition: all 0.2s;
}

.editor-tab:hover .tab-close {
    opacity: 1;
}

.tab-close:hover {
    background: var(--bg-hover);
}

/* Monaco-like Editor */
.editor-wrapper {
    flex: 1;
    overflow: hidden;
    position: relative;
}

.editor {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    font-family: 'Fira Code', 'JetBrains Mono', monospace;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-primary);
    background: var(--bg-primary);
    padding: 20px 0 20px 60px;
    border: none;
    outline: none;
    resize: none;
    tab-size: 2;
    caret-color: var(--accent-blue);
}

.editor:focus {
    outline: none;
}

/* Line Numbers */
.line-numbers {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 60px;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border);
    color: var(--text-dim);
    text-align: right;
    padding: 20px 10px;
    font-family: 'Fira Code', monospace;
    font-size: 14px;
    line-height: 1.6;
    user-select: none;
    overflow: hidden;
}

/* Output Panel */
.output-panel {
    height: 200px;
    background: var(--bg-secondary);
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
}

.output-header {
    padding: 8px 16px;
    background: var(--bg-tertiary);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    font-weight: 500;
}

.output-tabs {
    display: flex;
    gap: 4px;
}

.output-tab {
    padding: 4px 12px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-secondary);
    font-size: 11px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s;
}

.output-tab.active {
    background: var(--bg-primary);
    color: var(--text-primary);
    border-color: var(--border);
}

.output-close {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 4px;
    border-radius: 3px;
    transition: all 0.2s;
}

.output-close:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
}

.output-content {
    flex: 1;
    padding: 12px 16px;
    overflow-y: auto;
    font-family: 'Fira Code', monospace;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
}

.output-content.success {
    color: var(--accent-green);
}

.output-content.error {
    color: var(--accent-red);
}

.output-content.info {
    color: var(--accent-cyan);
}

/* MODALS */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
}

.modal-overlay.active {
    display: flex;
}

.modal {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 6px;
    min-width: 400px;
    max-width: 600px;
    max-height: 90vh;
    overflow: hidden;
    box-shadow: var(--shadow-heavy);
}

.modal-header {
    padding: 16px 20px;
    background: var(--bg-tertiary);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
}

.modal-close {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 20px;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    transition: all 0.2s;
}

.modal-close:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
}

.modal-body {
    padding: 20px;
}

.form-group {
    margin-bottom: 16px;
}

.form-label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
}

.form-input {
    width: 100%;
    padding: 8px 12px;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-primary);
    font-size: 14px;
    font-family: inherit;
    transition: all 0.2s;
}

.form-input:focus {
    outline: none;
    border-color: var(--accent-blue);
    box-shadow: 0 0 0 2px rgba(86, 156, 214, 0.1);
}

.form-hint {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 4px;
}

.modal-footer {
    padding: 16px 20px;
    background: var(--bg-tertiary);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}

.btn {
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg-primary);
    color: var(--text-primary);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
}

.btn:hover {
    background: var(--bg-hover);
    border-color: var(--border-light);
}

.btn-primary {
    background: var(--accent-blue);
    border-color: var(--accent-blue);
    color: white;
}

.btn-primary:hover {
    background: #4a8bc8;
}

.btn-success {
    background: var(--accent-green);
    border-color: var(--accent-green);
    color: white;
}

.btn-success:hover {
    background: #3db39e;
}

/* File Upload */
.file-upload {
    border: 2px dashed var(--border);
    border-radius: 4px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    margin: 16px 0;
}

.file-upload:hover {
    border-color: var(--accent-blue);
    background: rgba(86, 156, 214, 0.05);
}

.file-upload svg {
    width: 48px;
    height: 48px;
    fill: var(--text-secondary);
    margin-bottom: 12px;
}

.file-upload p {
    color: var(--text-secondary);
    font-size: 14px;
}

/* Notifications */
.notification {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 12px 20px;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 500;
    z-index: 1001;
    animation: slideIn 0.3s ease;
    max-width: 400px;
    box-shadow: var(--shadow);
}

.notification.success {
    background: var(--accent-green);
    color: white;
    border-left: 4px solid #2a9d87;
}

.notification.error {
    background: var(--accent-red);
    color: white;
    border-left: 4px solid #c53030;
}

.notification.info {
    background: var(--accent-blue);
    color: white;
    border-left: 4px solid #2b6cb0;
}

@keyframes slideIn {
    from {
        transform: translateX(100%);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}

/* Scrollbars */
::-webkit-scrollbar {
    width: 10px;
    height: 10px;
}

::-webkit-scrollbar-track {
    background: var(--bg-secondary);
}

::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 5px;
}

::-webkit-scrollbar-thumb:hover {
    background: var(--border-light);
}

/* Context Menu */
.context-menu {
    position: fixed;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 4px;
    box-shadow: var(--shadow);
    z-index: 1000;
    min-width: 160px;
    display: none;
}

.context-menu.active {
    display: block;
}

.context-item {
    padding: 8px 16px;
    color: var(--text-primary);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
}

.context-item:hover {
    background: var(--bg-hover);
}

.context-item svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
}

.context-divider {
    height: 1px;
    background: var(--border);
    margin: 4px 0;
}

/* Empty State */
.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
}

.empty-state svg {
    width: 64px;
    height: 64px;
    fill: var(--text-dim);
    margin-bottom: 16px;
    opacity: 0.5;
}

.empty-state p {
    font-size: 14px;
}

/* Responsive */
@media (max-width: 1024px) {
    .sidebar {
        width: 240px;
    }
}

@media (max-width: 768px) {
    .main-container {
        flex-direction: column;
    }
    
    .sidebar {
        width: 100%;
        height: 200px;
    }
    
    .editor-container {
        height: calc(100vh - 272px);
    }
}

/* GitHub-style syntax highlighting overrides */
.hljs {
    background: transparent !important;
    color: var(--text-primary) !important;
}

.hljs-keyword,
.hljs-selector-tag,
.hljs-literal {
    color: var(--accent-blue) !important;
}

.hljs-string,
.hljs-title,
.hljs-section,
.hljs-attribute,
.hljs-template-tag,
.hljs-template-variable {
    color: var(--accent-orange) !important;
}

.hljs-comment,
.hljs-quote {
    color: var(--text-dim) !important;
    font-style: italic !important;
}

.hljs-number,
.hljs-regexp,
.hljs-variable,
.hljs-template-variable {
    color: var(--accent-green) !important;
}

.hljs-built_in,
.hljs-builtin-name {
    color: var(--accent-cyan) !important;
}

.hljs-type,
.hljs-class .hljs-title {
    color: var(--accent-yellow) !important;
}

.hljs-function .hljs-title {
    color: var(--accent-purple) !important;
}

.hljs-tag,
.hljs-name,
.hljs-attr {
    color: var(--accent-blue) !important;
}

.hljs-meta {
    color: var(--text-secondary) !important;
}
</style>
</head>
<body>

<header>
    <div class="header-left">
        <div class="header-brand">
            <svg viewBox="0 0 24 24">
                <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z"/>
            </svg>
            Code Studio
        </div>
    </div>
    <div class="header-actions">
        <button class="header-btn" onclick="saveFile()">
            <svg viewBox="0 0 16 16">
                <path d="M1.75 2A1.75 1.75 0 0 0 0 3.75v8.5C0 13.216.784 14 1.75 14h12.5A1.75 1.75 0 0 0 16 12.25v-6.5A1.75 1.75 0 0 0 14.25 4H7.5L5.66 2.16A1.75 1.75 0 0 0 4.42 2H1.75Z"/>
            </svg>
            Save
        </button>
        <button class="header-btn" onclick="runCode()" style="background: var(--accent-green); border-color: var(--accent-green); color: white;">
            <svg viewBox="0 0 16 16">
                <path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Zm4.879-2.773 4.264 2.559a.25.25 0 0 1 0 .428l-4.264 2.559A.25.25 0 0 1 6 10.559V5.442a.25.25 0 0 1 .379-.215Z"/>
            </svg>
            Run
        </button>
    </div>

<script>
// Configuration
const API = "https://code-mon.codemon.workers.dev";
let currentUser = null;
let currentPass = null;
let currentFile = null;
let allFiles = [];
let openTabs = [];
let activeTab = null;

// Initialize
document.addEventListener('DOMContentLoaded', async () => {
    await checkAuth();
    setupEditor();
    setupEventListeners();
    loadFiles();
});

// Authentication
async function checkAuth() {
    currentUser = localStorage.getItem("code-mon-username");
    currentPass = localStorage.getItem("code-mon-pass");
    
    if (!currentUser || !currentPass) {
        localStorage.clear();
        window.location.href = "login.html";
        return;
    }
    
    try {
        const res = await fetch(`${API}/api/pass?username=${currentUser}&pass=${currentPass}`);
        const data = await res.json();
        
        if (!data.success) {
            localStorage.clear();
            window.location.href = "login.html";
        }
    } catch (error) {
        localStorage.clear();
        window.location.href = "login.html";
    }
}

// Editor Setup
function setupEditor() {
    const editor = document.getElementById('editor');
    const lineNumbers = document.getElementById('lineNumbers');
    
    editor.addEventListener('input', updateLineNumbers);
    editor.addEventListener('scroll', syncScroll);
    editor.addEventListener('keydown', handleTabKey);
    
    updateLineNumbers();
}

function updateLineNumbers() {
    const editor = document.getElementById('editor');
    const lineNumbers = document.getElementById('lineNumbers');
    const lines = editor.value.split('\n').length;
    
    let numbers = '';
    for (let i = 1; i <= lines; i++) {
        numbers += i + '\n';
    }
    lineNumbers.textContent = numbers;
    
    // Update status bar
    const cursorPos = getCursorPosition();
    document.getElementById('lineCount').textContent = `Line ${cursorPos.line}, Column ${cursorPos.column}`;
    document.getElementById('fileSize').textContent = `${editor.value.length} characters`;
}

function getCursorPosition() {
    const editor = document.getElementById('editor');
    const cursorPos = editor.selectionStart;
    const textBeforeCursor = editor.value.substring(0, cursorPos);
    const lines = textBeforeCursor.split('\n');
    
    return {
        line: lines.length,
        column: lines[lines.length - 1].length + 1
    };
}

function syncScroll() {
    const editor = document.getElementById('editor');
    const lineNumbers = document.getElementById('lineNumbers');
    lineNumbers.scrollTop = editor.scrollTop;
}

function handleTabKey(e) {
    if (e.key === 'Tab') {
        e.preventDefault();
        const editor = document.getElementById('editor');
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        
        editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
        editor.selectionStart = editor.selectionEnd = start + 2;
        
        updateLineNumbers();
    }
}

// File Management
async function loadFiles() {
    try {
        const res = await fetch(`${API}/api/list?user=${currentUser}`);
        const data = await res.json();
        
        if (data.error) {
            showNotification('Failed to load files: ' + data.error, 'error');
            return;
        }
        
        allFiles = data.files || [];
        renderFileExplorer();
        
    } catch (error) {
        showNotification('Failed to load files: ' + error.message, 'error');
    }
}

function renderFileExplorer() {
    const explorer = document.getElementById('fileExplorer');
    
    if (allFiles.length === 0) {
        explorer.innerHTML = `
            <div class="empty-state">
                <svg viewBox="0 0 24 24">
                    <path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/>
                </svg>
                <p>No files yet. Create your first file!</p>
            </div>
        `;
        return;
    }
    
    // Build folder structure
    const structure = {};
    allFiles.forEach(file => {
        const parts = file.split('/');
        let current = structure;
        
        for (let i = 0; i < parts.length; i++) {
            const part = parts[i];
            if (!current[part]) {
                current[part] = i === parts.length - 1 ? { type: 'file', path: file } : { type: 'folder', children: {} };
            }
            if (i < parts.length - 1) {
                current = current[part].children;
            }
        }
    });
    
    explorer.innerHTML = buildExplorerHTML(structure);
}

function buildExplorerHTML(structure, path = '') {
    let html = '';
    
    Object.entries(structure).forEach(([name, item]) => {
        if (item.type === 'folder') {
            const fullPath = path ? `${path}/${name}` : name;
            html += `
                <div class="folder" data-path="${fullPath}">
                    <div class="folder-header" onclick="toggleFolder('${fullPath}')">
                        <svg class="folder-arrow" viewBox="0 0 16 16">
                            <path d="M6.22 3.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L9.94 8 6.22 4.28a.75.75 0 0 1 0-1.06Z"/>
                        </svg>
                        <svg class="file-icon folder" viewBox="0 0 16 16">
                            <path d="M1.75 2A1.75 1.75 0 0 0 0 3.75v8.5C0 13.216.784 14 1.75 14h12.5A1.75 1.75 0 0 0 16 12.25v-6.5A1.75 1.75 0 0 0 14.25 4H7.5L5.66 2.16A1.75 1.75 0 0 0 4.42 2H1.75Z"/>
                        </svg>
                        <span class="file-name">${name}</span>
                    </div>
                    <div class="folder-children">
                        ${buildExplorerHTML(item.children, fullPath)}
                    </div>
                </div>
            `;
        } else {
            const isActive = currentFile === item.path;
            html += `
                <div class="file-item ${isActive ? 'active' : ''}" onclick="openFile('${item.path}')">
                    <svg class="file-icon file" viewBox="0 0 16 16">
                        <path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25V1.75Z"/>
                    </svg>
                    <span class="file-name">${name}</span>
                    <div class="file-actions">
                        <button class="file-action-btn delete" onclick="deleteFile('${item.path}'); event.stopPropagation()">×</button>
                    </div>
                </div>
            `;
        }
    });
    
    return html;
}

function toggleFolder(path) {
    const folder = document.querySelector(`.folder[data-path="${path}"]`);
    folder.classList.toggle('expanded');
}

async function openFile(filePath) {
    if (!filePath) return;
    
    try {
        const res = await fetch(`${API}/api/load?user=${currentUser}&filename=${filePath}`);
        const content = await res.text();
        
        currentFile = filePath;
        
        // Update editor
        const editor = document.getElementById('editor');
        editor.value = content;
        updateLineNumbers();
        
        // Update language indicator
        const language = getLanguage(filePath);
        document.getElementById('languageIndicator').textContent = language.name;
        
        // Add or activate tab
        addTab(filePath);
        
        // Update syntax highlighting
        highlightCode();
        
    } catch (error) {
        showNotification('Failed to load file: ' + error.message, 'error');
    }
}

function addTab(filePath) {
    const tabsContainer = document.getElementById('editorTabs');
    const fileName = filePath.split('/').pop();
    const language = getLanguage(filePath);
    
    // Check if tab already exists
    let tab = openTabs.find(t => t.path === filePath);
    
    if (!tab) {
        tab = {
            path: filePath,
            name: fileName,
            language: language.code
        };
        openTabs.push(tab);
        
        const tabElement = document.createElement('button');
        tabElement.className = 'editor-tab';
        tabElement.innerHTML = `
            <svg class="tab-icon" viewBox="0 0 16 16">
                <path d="${language.icon}"/>
            </svg>
            ${fileName}
            <span class="tab-close" onclick="closeTab('${filePath}'); event.stopPropagation()">×</span>
        `;
        tabElement.onclick = () => activateTab(filePath);
        tabsContainer.appendChild(tabElement);
    }
    
    activateTab(filePath);
}

function activateTab(filePath) {
    // Update tab classes
    document.querySelectorAll('.editor-tab').forEach(tab => {
        tab.classList.remove('active');
    });
    
    const tabElement = [...document.querySelectorAll('.editor-tab')].find(tab => 
        tab.textContent.includes(filePath.split('/').pop())
    );
    
    if (tabElement) {
        tabElement.classList.add('active');
    }
    
    activeTab = filePath;
}

function closeTab(filePath) {
    openTabs = openTabs.filter(tab => tab.path !== filePath);
    
    const tabElement = [...document.querySelectorAll('.editor-tab')].find(tab => 
        tab.textContent.includes(filePath.split('/').pop())
    );
    
    if (tabElement) {
        tabElement.remove();
    }
    
    if (currentFile === filePath) {
        if (openTabs.length > 0) {
            openFile(openTabs[0].path);
        } else {
            currentFile = null;
            document.getElementById('editor').value = '';
            document.getElementById('languageIndicator').textContent = 'Plain Text';
        }
    }
}

// Language Detection
function getLanguage(filename) {
    const ext = filename.split('.').pop().toLowerCase();
    
    const languages = {
        'js': { name: 'JavaScript', code: 'javascript', icon: 'M3 3h18v18H3V3zm16 16V7l-5-5H5v16h14zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z' },
        'jsx': { name: 'JavaScript React', code: 'javascript', icon: 'M3 3h18v18H3V3zm16 16V7l-5-5H5v16h14zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z' },
        'ts': { name: 'TypeScript', code: 'typescript', icon: 'M3 3h18v18H3V3zm16 16V7l-5-5H5v16h14zM12 17v-1h-2v-2h2v-1h-2V9h2V8h2v1h2v2h-2v1h2v2h-2v1h-2zm-4-1H7v-7h2v7z' },
        'tsx': { name: 'TypeScript React', code: 'typescript', icon: 'M3 3h18v18H3V3zm16 16V7l-5-5H5v16h14zM12 17v-1h-2v-2h2v-1h-2V9h2V8h2v1h2v2h-2v1h2v2h-2v1h-2zm-4-1H7v-7h2v7z' },
        'py': { name: 'Python', code: 'python', icon: 'M3 3h18v18H3V3zm2 2v14h14V5H5zm2 2h10v2H7V7zm0 4h10v2H7v-2zm0 4h7v2H7v-2z' },
        'html': { name: 'HTML', code: 'html', icon: 'M3 3h18v18H3V3zm2 2v14h14V5H5zm2 2h10v2H7V7zm0 4h10v2H7v-2zm0 4h7v2H7v-2z' },
        'css': { name: 'CSS', code: 'css', icon: 'M3 3h18v18H3V3zm2 2v14h14V5H5zm2 2h10v2H7V7zm0 4h10v2H7v-2zm0 4h7v2H7v-2z' },
        'json': { name: 'JSON', code: 'json', icon: 'M3 3h18v18H3V3zm2 2v14h14V5H5zm2 2h10v2H7V7zm0 4h10v2H7v-2zm0 4h7v2H7v-2z' },
        'md': { name: 'Markdown', code: 'markdown', icon: 'M3 3h18v18H3V3zm2 2v14h14V5H5zm2 2h10v2H7V7zm0 4h10v2H7v-2zm0 4h7v2H7v-2z' },
        'java': { name: 'Java', code: 'java', icon: 'M3 3h18v18H3V3zm2 2v14h14V5H5zm2 2h10v2H7V7zm0 4h10v2H7v-2zm0 4h7v2H7v-2z' },
        'cpp': { name: 'C++', code: 'cpp', icon: 'M3 3h18v18H3V3zm2 2v14h14V5H5zm2 2h10v2H7V7zm0 4h10v2H7v-2zm0 4h7v2H7v-2z' },
        'c': { name: 'C', code: 'c', icon: 'M3 3h18v18H3V3zm2 2v14h14V5H5zm2 2h10v2H7V7zm0 4h10v2H7v-2zm0 4h7v2H7v-2z' },
        'php': { name: 'PHP', code: 'php', icon: 'M3 3h18v18H3V3zm2 2v14h14V5H5zm2 2h10v2H7V7zm0 4h10v2H7v-2zm0 4h7v2H7v-2z' },
        'rb': { name: 'Ruby', code: 'ruby', icon: 'M3 3h18v18H3V3zm2 2v14h14V5H5zm2 2h10v2H7V7zm0 4h10v2H7v-2zm0 4h7v2H7v-2z' },
        'go': { name: 'Go', code: 'go', icon: 'M3 3h18v18H3V3zm2 2v14h14V5H5zm2 2h10v2H7V7zm0 4h10v2H7v-2zm0 4h7v2H7v-2z' },
        'rs': { name: 'Rust', code: 'rust', icon: 'M3 3h18v18H3V3zm2 2v14h14V5H5zm2 2h10v2H7V7zm0 4h10v2H7v-2zm0 4h7v2H7v-2z' },
        'sql': { name: 'SQL', code: 'sql', icon: 'M3 3h18v18H3V3zm2 2v14h14V5H5zm2 2h10v2H7V7zm0 4h10v2H7v-2zm0 4h7v2H7v-2z' }
    };
    
    return languages[ext] || { name: 'Plain Text', code: 'plaintext', icon: 'M3 3h18v18H3V3zm2 2v14h14V5H5zm2 2h10v2H7V7zm0 4h10v2H7v-2zm0 4h7v2H7v-2z' };
}

// Code Highlighting
function highlightCode() {
    const editor = document.getElementById('editor');
    const code = editor.value;
    const language = currentFile ? getLanguage(currentFile).code : 'plaintext';
    
    // This is a simplified version - in production, you'd use a proper syntax highlighter
    // For now, we'll just update the line numbers
    updateLineNumbers();
}

// File Operations
async function createFile() {
    document.getElementById('newFilePath').value = '';
    openModal('createFileModal');
}

async function createNewFile() {
    const filePath = document.getElementById('newFilePath').value.trim();
    
    if (!filePath) {
        showNotification('Please enter a file path', 'error');
        return;
    }
    
    try {
        const res = await fetch(`${API}/api/save`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                user: currentUser,
                pass: currentPass,
                filename: filePath,
                content: ""
            })
        });
        
        const data = await res.json();
        if (data.error) {
            showNotification('Failed to create file: ' + data.error, 'error');
            return;
        }
        
        showNotification('File created successfully', 'success');
        closeModal('createFileModal');
        loadFiles();
        openFile(filePath);
        
    } catch (error) {
        showNotification('Failed to create file: ' + error.message, 'error');
    }
}

async function createFolder() {
    document.getElementById('newFolderName').value = '';
    openModal('createFolderModal');
}

async function createNewFolder() {
    const folderName = document.getElementById('newFolderName').value.trim();
    
    if (!folderName) {
        showNotification('Please enter a folder name', 'error');
        return;
    }
    
    // Create a placeholder file in the folder
    const filePath = `${folderName}/.keep`;
    
    try {
        const res = await fetch(`${API}/api/save`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                user: currentUser,
                pass: currentPass,
                filename: filePath,
                content: ""
            })
        });
        
        const data = await res.json();
        if (data.error) {
            showNotification('Failed to create folder: ' + data.error, 'error');
            return;
        }
        
        showNotification('Folder created successfully', 'success');
        closeModal('createFolderModal');
        loadFiles();
        
    } catch (error) {
        showNotification('Failed to create folder: ' + error.message, 'error');
    }
}

async function saveFile() {
    if (!currentFile) {
        showNotification('No file selected', 'error');
        return;
    }
    
    const editor = document.getElementById('editor');
    const content = editor.value;
    
    try {
        const res = await fetch(`${API}/api/save`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                user: currentUser,
                pass: currentPass,
                filename: currentFile,
                content: content
            })
        });
        
        const data = await res.json();
        if (data.error) {
            showNotification('Failed to save file: ' + data.error, 'error');
            return;
        }
        
        showNotification('File saved successfully', 'success');
        
    } catch (error) {
        showNotification('Failed to save file: ' + error.message, 'error');
    }
}

async function deleteFile(filePath) {
    if (!confirm(`Delete ${filePath}? This action cannot be undone.`)) {
        return;
    }
    
    try {
        const res = await fetch(`${API}/api/delete-file`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                username: currentUser,
                pass: currentPass,
                filename: filePath
            })
        });
        
        const data = await res.json();
        if (data.error) {
            showNotification('Failed to delete file: ' + data.error, 'error');
            return;
        }
        
        showNotification('File deleted successfully', 'success');
        
        // Close tab if open
        closeTab(filePath);
        
        // Reload files
        loadFiles();
        
    } catch (error) {
        showNotification('Failed to delete file: ' + error.message, 'error');
    }
}

async function openUpload() {
    document.getElementById('uploadPath').value = '';
    openModal('uploadModal');
}

async function uploadFile() {
    const fileInput = document.getElementById('fileInput');
    const uploadPath = document.getElementById('uploadPath').value.trim();
    
    if (!fileInput.files.length) {
        showNotification('Please select a file', 'error');
        return;
    }
    
    if (!uploadPath) {
        showNotification('Please enter a target path', 'error');
        return;
    }
    
    const file = fileInput.files[0];
    const reader = new FileReader();
    
    reader.onload = async function(e) {
        try {
            const content = e.target.result;
            
            const res = await fetch(`${API}/api/save`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    user: currentUser,
                    pass: currentPass,
                    filename: uploadPath,
                    content: content
                })
            });
            
            const data = await res.json();
            if (data.error) {
                showNotification('Failed to upload file: ' + data.error, 'error');
                return;
            }
            
            showNotification('File uploaded successfully', 'success');
            closeModal('uploadModal');
            loadFiles();
            
        } catch (error) {
            showNotification('Failed to upload file: ' + error.message, 'error');
        }
    };
    
    reader.readAsText(file);
}

// Code Execution with Judge0
async function runCode() {
    if (!currentFile) {
        showNotification('No file selected', 'error');
        return;
    }
    
    const code = document.getElementById('editor').value;
    const language = getLanguage(currentFile).code;
    
    // Map our language codes to Judge0 language IDs
    const languageIds = {
        'javascript': 63,    // JavaScript (Node.js)
        'typescript': 74,    // TypeScript
        'python': 71,        // Python 3
        'java': 62,          // Java
        'cpp': 54,           // C++ (GCC)
        'c': 50,             // C (GCC)
        'csharp': 51,        // C# (Mono)
        'ruby': 72,          // Ruby
        'go': 60,            // Go
        'rust': 73,          // Rust
        'php': 68,           // PHP
        'swift': 83,         // Swift
        'kotlin': 78,        // Kotlin
        'r': 80,             // R
        'perl': 85,          // Perl
        'lua': 64,           // Lua
        'scala': 81,         // Scala
        'bash': 46,          // Bash
        'plaintext': 43      // Plain Text
    };
    
    const languageId = languageIds[language];
    
    if (!languageId) {
        showNotification('Language not supported for execution', 'error');
        return;
    }
    
    // Show output panel
    const outputPanel = document.getElementById('outputPanel');
    const outputContent = document.getElementById('outputContent');
    outputPanel.style.display = 'flex';
    outputContent.textContent = 'Compiling and running code...';
    
    try {
        const response = await fetch(
            "https://ce.judge0.com/submissions?base64_encoded=false&wait=true",
            {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    language_id: languageId,
                    source_code: code,
                    stdin: ""
                })
            }
        );
        
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const result = await response.json();
        
        // Display result
        let output = '';
        if (result.stdout) {
            output = result.stdout;
            outputContent.className = 'output-content success';
        } else if (result.stderr) {
            output = result.stderr;
            outputContent.className = 'output-content error';
        } else if (result.compile_output) {
            output = result.compile_output;
            outputContent.className = 'output-content error';
        } else {
            output = 'No output';
            outputContent.className = 'output-content info';
        }
        
        outputContent.textContent = output;
        
    } catch (error) {
        outputContent.textContent = `Error: ${error.message}\n\nMake sure you have an internet connection and try again.`;
        outputContent.className = 'output-content error';
    }
}

// UI Helpers
function openModal(modalId) {
    document.getElementById(modalId).classList.add('active');
}

function closeModal(modalId) {
    document.getElementById(modalId).classList.remove('active');
}

function closeOutput() {
    document.getElementById('outputPanel').style.display = 'none';
}

function showNotification(message, type = 'info') {
    const notification = document.createElement('div');
    notification.className = `notification ${type}`;
    notification.textContent = message;
    
    document.body.appendChild(notification);
    
    setTimeout(() => {
        notification.remove();
    }, 3000);
}

function setupEventListeners() {
    // Auto-save on Ctrl+S
    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
            e.preventDefault();
            saveFile();
        }
    });
    
    // Drag and drop file upload
    const uploadArea = document.querySelector('.file-upload');
    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.style.borderColor = 'var(--accent-blue)';
        uploadArea.style.background = 'rgba(86, 156, 214, 0.1)';
    });
    
    uploadArea.addEventListener('dragleave', () => {
        uploadArea.style.borderColor = 'var(--border)';
        uploadArea.style.background = '';
    });
    
    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.style.borderColor = 'var(--border)';
        uploadArea.style.background = '';
        
        const files = e.dataTransfer.files;
        if (files.length > 0) {
            document.getElementById('fileInput').files = files;
        }
    });
}
