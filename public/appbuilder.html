<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Code-Mon App Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --bg: #0f0f14;
  --card: rgba(255,255,255,0.08);
  --border: rgba(255,255,255,0.15);
  --accent: #6c63ff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top, #1b1b2f, #0f0f14);
  font-family: system-ui, -apple-system, Segoe UI, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
}

.container {
  width: 100%;
  max-width: 520px;
  background: var(--card);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 26px;
  box-shadow: 0 20px 50px rgba(0,0,0,.4);
  animation: fadeIn .5s ease;
}

h1 {
  margin: 0 0 8px;
  text-align: center;
}

p {
  text-align: center;
  opacity: .8;
  font-size: 14px;
  margin-bottom: 20px;
}

label {
  font-size: 13px;
  opacity: .8;
}

input, button {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,.08);
  color: white;
  outline: none;
}

input::placeholder { color: rgba(255,255,255,.4); }

input[type="color"] {
  padding: 4px;
  height: 46px;
  cursor: pointer;
}

button {
  background: linear-gradient(135deg, var(--accent), #8f88ff);
  border: none;
  font-weight: 600;
  cursor: pointer;
  margin-top: 18px;
  transition: transform .15s, opacity .15s;
}

button:hover { transform: translateY(-1px); }
button:disabled { opacity: .5; cursor: not-allowed; }

#installNow {
  display: none;
  margin-top: 14px;
  background: linear-gradient(135deg, #00e676, #00c853);
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>
<div class="container">
  <h1>Code-Mon PWA Builder</h1>
  <p>Build & deploy installable apps in seconds</p>

  <input id="name" placeholder="App Name">
  <input id="shortName" placeholder="Short Name">

  <label>Background Color</label>
  <input id="bgColor" type="color" value="#ffffff">

  <label>Theme Color</label>
  <input id="themeColor" type="color" value="#000000">

  <input id="iconFile" placeholder="Icon filename (example: icon.png)">
  <input id="fileName" placeholder="App file (example: test.html)">

  <button id="buildBtn" onclick="build()">Build App</button>
  <button id="installNow" onclick="goInstall()">🚀 Install NOW!</button>
</div>

<script>
const username = localStorage.getItem("code-mon-username");
const pass = localStorage.getItem("code-mon-pass");

let userFile = "";

async function saveFile(filename, content) {
  return fetch("https://code-mon.codemon.workers.dev/api/save", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, pass, filename, content })
  });
}

async function build() {
  if (!username || !pass) return alert("Not logged in");

  const name = nameInput.value.trim();
  const shortName = shortNameInput.value.trim();
  const bg = bgColor.value;
  const theme = themeColor.value;
  const icon = iconFile.value.trim();
  userFile = fileName.value.trim();

  if (!name || !shortName || !icon || !userFile)
    return alert("Fill all fields");

  buildBtn.disabled = true;
  buildBtn.textContent = "Building…";

  const manifest = {
    name,
    short_name: shortName,
    start_url: `/@me?user=${username}&filename=${userFile}`,
    display: "standalone",
    background_color: bg,
    theme_color: theme,
    icons: [
      { src: icon, sizes: "192x192", type: "image/png" },
      { src: icon, sizes: "512x512", type: "image/png" }
    ]
  };

  await saveFile("manifest.json", JSON.stringify(manifest, null, 2));

  await saveFile("install.html", `<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>${name}</title>
<link rel="manifest" href="/${username}/manifest.json">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="${theme}">
</head>
<body>
<h1>${name}</h1>
<button id="installBtn">Install</button>
<script>
let p;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();p=e});
installBtn.onclick=()=>p.prompt();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</scr` + `ipt>
</body></html>`);

  await saveFile("sw.js", `
const CACHE_NAME = "pwa-cache-v1";
const FILES_TO_CACHE = [
  "/",
  "/${userFile}",
  "/manifest.json",
  "/@me.html"
];

// Install
self.addEventListener("install", event => {
  event.waitUntil(
    caches.open(CACHE_NAME).then(cache => cache.addAll(FILES_TO_CACHE))
  );
});

// Activate
self.addEventListener("activate", event => {
  event.waitUntil(
    caches.keys().then(keys =>
      Promise.all(
        keys.map(key => key !== CACHE_NAME && caches.delete(key))
      )
    )
  );
});

// Fetch
self.addEventListener("fetch", event => {
  event.respondWith(
    caches.match(event.request).then(
      cached => cached || fetch(event.request)
    )
  );
});
`);
await fetch("https://code-mon.codemon.workers.dev/api/deploy", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({
    user: username
  })
});
  buildBtn.textContent = "Done ✔";
  installNow.style.display = "block";
}

function goInstall() {
  location.href =
    \`https://code-mon-space.pages.dev/@me?user=\${username}&filename=\${userFile}\`;
}
</script>
</body>
</html>
