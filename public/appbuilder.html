<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Code-Mon App Builder Step 1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="img/icon.png">
<style>
:root{
  --bg:#020617;
  --panel:#020617cc;
  --border:#1e293b;
  --text:#e5e7eb;
  --muted:#94a3b8;
  --primary:#2563eb;
  --primary2:#7c3aed;
}

*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  background:
    radial-gradient(1200px 600px at top,#1e1b4b 0%,transparent 60%),
    radial-gradient(800px 400px at bottom,#0f172a 0%,transparent 60%),
    var(--bg);
  font-family:system-ui,-apple-system,BlinkMacSystemFont;
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
}

.app{
  width:980px;
  max-width:96%;
  background:var(--panel);
  backdrop-filter:blur(14px);
  border-radius:18px;
  box-shadow:
    0 40px 120px rgba(0,0,0,.75),
    inset 0 0 0 1px var(--border);
  overflow:hidden;
}

header{
  padding:22px 26px;
  font-size:22px;
  font-weight:700;
  background:linear-gradient(90deg,var(--primary),var(--primary2));
  letter-spacing:.3px;
}

.content{
  padding:24px;
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
}

label{
  font-size:13px;
  color:var(--muted);
  margin-bottom:4px;
}

textarea,
input{
  width:100%;
  background:#020617;
  border:1px solid var(--border);
  border-radius:12px;
  color:var(--text);
  padding:14px 16px;
  font-size:15px;
  outline:none;
  transition:.2s;
}

textarea{
  height:120px;
  resize:none;
}

textarea:focus,
input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 2px rgba(37,99,235,.25);
}

button{
  margin-top:6px;
  padding:14px 26px;
  border-radius:14px;
  border:none;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:white;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  letter-spacing:.4px;
  transition:.25s;
}

button:hover{
  transform:translateY(-1px);
  box-shadow:0 14px 40px rgba(124,58,237,.45);
}

button:active{
  transform:translateY(0);
}

.loading{
  font-size:14px;
  color:var(--muted);
  animation:pulse 1.2s infinite;
}

@keyframes pulse{
  0%{opacity:.4}
  50%{opacity:1}
  100%{opacity:.4}
}

pre{
  background:#020617;
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
  max-height:360px;
  overflow:auto;
  font-size:14px;
  line-height:1.6;
  white-space:pre-wrap;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.02);
}

footer{
  padding:14px 24px;
  font-size:12px;
  color:var(--muted);
  text-align:right;
  background:#020617;
  border-top:1px solid var(--border);
}
</style>
</head>

<body>
<div class="app">
  <header>⚡ Code-Mon AI App Generator</header>

  <div class="content">
    <div>
      <label>Describe your app</label>
      <textarea id="userPrompt" placeholder="Build a modern dashboard with charts and auth…"></textarea>
    </div>

    <div>
      <label>Filename (example: index.html)</label>
      <input id="file" placeholder="index.html">
    </div>

    <button onclick="runAI()">Generate Professional App</button>

    <div class="loading" id="loading" style="display:none;">
      Generating elite-level UI & logic…
    </div>

    <pre id="output"></pre>
  </div>

  <footer>Powered by Code-Mon AI</footer>
</div>

<script>
      (async function() {
    const API = "https://code-mon.codemon.workers.dev";

    const username = localStorage.getItem("code-mon-username");
    const password = localStorage.getItem("code-mon-pass");

    //  No credentials → go to login
    if (!username || !password) {
        localStorage.clear();
        location.href = "login.html";
        return;
    }

    try {
        const res = await fetch(`${API}/api/pass?username=${username}&pass=${password}`);
        const data = await res.json();

        //  Wrong password / user not found
        if (!data.success) {
            localStorage.removeItem("code-mon-username");
            localStorage.removeItem("code-mon-pass");
            localStorage.removeItem("user");

            location.href = "login.html";
            return;
        }

        //  Auth success → continue loading file.html normally
        console.log("User authenticated:", username);

    } catch (err) {
        // Network failure = prevent access
        localStorage.clear();
        location.href = "login.html";
    }
})();
async function runAI(){
  const userPrompt=document.getElementById("userPrompt").value.trim()
  const filename=document.getElementById("file").value.trim()
  if(!userPrompt||!filename)return alert("Prompt & filename required")
const user = localStorage.getItem("code-mon-username");
  const pass = localStorage.getItem("code-mon-pass")
  loading.style.display="block"
  output.textContent=""

  const SYSTEM_ORDER=
`YOU ARE AN ELITE FRONTEND ENGINEER.
RULES:
- YOUR CSS SHOULD BE LONG
- OUTPUT A STUNNING, REAL-WORLD QUALITY WEB APP
- SINGLE HTML FILE WITH INLINE CSS AND JS
- PROFESSIONAL DESIGN SYSTEM
- NO MARKDOWN
- NO EXPLANATIONS
- NO COMMENTS OUTSIDE CODE
- NO BACKSLASH n
- OUTPUT MUST BE READY TO RUN`

  try{
    const res=await fetch(
      "https://code-mon.codemon.workers.dev/api/code-mon-ai?question="+
      encodeURIComponent(SYSTEM_ORDER+"\nUSER_REQUEST:\n"+userPrompt)
    )

    let data=await res.json()
    const code=data.answer

    output.textContent=code

    await fetch("https://code-mon.codemon.workers.dev/api/save",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        user: user,
        pass: pass,
        filename,
        content:code
      })
    })

    output.textContent="✔ SAVED SUCCESSFULLY"
window.location.href = "appbuilder.html";
  }catch(e){
    output.textContent="ERROR: "+e.message
  }finally{
    loading.style.display="none"
  }
}
</script>
</body>
</html>
