<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File Manager Pro</title>
<link rel="icon" type="image/png" href="img/icon.png" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg-primary: #0a0e1a;
    --bg-secondary: #10141f;
    --bg-tertiary: #1a1f2e;
    --bg-card: #1e2433;
    --bg-hover: #252b3b;
    --bg-active: #2d3548;
    --border: #2d3548;
    --text-primary: #e8edf4;
    --text-secondary: #8b95a8;
    --text-dim: #6b7280;
    --accent-blue: #60a5fa;
    --accent-purple: #a78bfa;
    --accent-pink: #f472b6;
    --accent-cyan: #22d3ee;
    --accent-green: #4ade80;
    --accent-orange: #fb923c;
    --accent-red: #f87171;
    --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    --gradient-3: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    --gradient-4: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
    --glow-blue: 0 0 20px rgba(96, 165, 250, 0.3);
    --glow-purple: 0 0 20px rgba(167, 139, 250, 0.3);
    --glow-pink: 0 0 20px rgba(244, 114, 182, 0.3);
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    height: 100vh;
    overflow: hidden;
    font-size: 14px;
}

/* Animated background */
body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: 
        radial-gradient(circle at 20% 50%, rgba(102, 126, 234, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(244, 114, 182, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 20%, rgba(34, 211, 238, 0.08) 0%, transparent 50%);
    animation: bgShift 20s ease infinite;
    pointer-events: none;
    z-index: 0;
}

@keyframes bgShift {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.1); }
}

/* HEADER */
header {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px;
    background: rgba(16, 20, 31, 0.8);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
}

.header-title {
    font-size: 24px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.header-title svg {
    width: 28px;
    height: 28px;
    fill: url(#gradient);
    filter: drop-shadow(0 0 10px rgba(96, 165, 250, 0.5));
}

.header-actions {
    display: flex;
    gap: 12px;
}

.header-btn {
    padding: 8px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-primary);
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 13px;
    font-weight: 500;
}

.header-btn:hover {
    background: var(--bg-hover);
    transform: translateY(-2px);
    box-shadow: var(--glow-blue);
}

/* BREADCRUMB */
.breadcrumb {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 16px 32px;
    background: rgba(16, 20, 31, 0.6);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    overflow-x: auto;
    white-space: nowrap;
}

.breadcrumb::-webkit-scrollbar {
    height: 4px;
}

.breadcrumb::-webkit-scrollbar-track {
    background: transparent;
}

.breadcrumb::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 2px;
}

.breadcrumb-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    color: var(--accent-blue);
    padding: 6px 12px;
    border-radius: 6px;
    transition: all 0.3s ease;
    font-weight: 500;
}

.breadcrumb-item:hover {
    background: var(--bg-card);
    transform: scale(1.05);
    box-shadow: var(--glow-blue);
}

.breadcrumb-separator {
    color: var(--text-dim);
}

.depth-indicator {
    color: var(--text-dim);
    font-size: 11px;
    padding: 4px 10px;
    background: var(--bg-card);
    border-radius: 12px;
    border: 1px solid var(--border);
    margin-left: 12px;
}

/* MAIN WRAPPER */
#wrap {
    position: relative;
    z-index: 5;
    display: flex;
    height: calc(100vh - 134px);
    gap: 16px;
    padding: 16px;
}

/* SIDEBAR */
#files {
    width: 340px;
    border-radius: 16px;
    background: rgba(30, 36, 51, 0.6);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
}

.sidebar-header {
    padding: 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(26, 31, 46, 0.8);
}

.sidebar-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.sidebar-title svg {
    width: 20px;
    height: 20px;
    fill: var(--accent-purple);
}

.sidebar-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
}

.action-btn {
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-tertiary);
    color: var(--text-primary);
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: center;
    position: relative;
    overflow: hidden;
}

.action-btn::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
    transform: translate(-50%, -50%);
    transition: width 0.6s, height 0.6s;
}

.action-btn:hover::before {
    width: 300px;
    height: 300px;
}

.action-btn:hover {
    transform: translateY(-3px) scale(1.02);
    border-color: var(--accent-blue);
    box-shadow: 0 8px 24px rgba(96, 165, 250, 0.3);
}

.action-btn:active {
    transform: translateY(-1px) scale(0.98);
}

.action-btn svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
    z-index: 1;
}

.action-btn.primary {
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
    border: none;
    color: white;
    box-shadow: 0 4px 16px rgba(96, 165, 250, 0.3);
}

.action-btn.primary:hover {
    box-shadow: 0 8px 28px rgba(96, 165, 250, 0.5);
}

.action-btn.success {
    background: linear-gradient(135deg, #4ade80, #22d3ee);
    border: none;
    color: white;
    box-shadow: 0 4px 16px rgba(74, 222, 128, 0.3);
}

.action-btn.success:hover {
    box-shadow: 0 8px 28px rgba(74, 222, 128, 0.5);
}

.action-btn.full {
    grid-column: 1 / -1;
}

/* FILE LIST */
#fileList {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
}

#fileList::-webkit-scrollbar {
    width: 8px;
}

#fileList::-webkit-scrollbar-track {
    background: transparent;
}

#fileList::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 4px;
}

#fileList::-webkit-scrollbar-thumb:hover {
    background: var(--text-dim);
}

.file-item {
    display: flex;
    align-items: center;
    padding: 12px 14px;
    margin-bottom: 6px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    border: 1px solid transparent;
}

.file-item::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 0;
    background: linear-gradient(180deg, var(--accent-blue), var(--accent-purple));
    border-radius: 0 3px 3px 0;
    transition: height 0.3s ease;
}

.file-item:hover {
    background: var(--bg-hover);
    transform: translateX(6px);
    border-color: var(--border);
}

.file-item:hover::before {
    height: 70%;
}

.file-item.active {
    background: var(--bg-active);
    border-color: var(--accent-blue);
    box-shadow: 0 4px 16px rgba(96, 165, 250, 0.2);
}

.file-item.active::before {
    height: 100%;
}

.file-icon {
    width: 20px;
    height: 20px;
    margin-right: 12px;
    flex-shrink: 0;
    transition: all 0.3s ease;
}

.file-item:hover .file-icon {
    transform: scale(1.1) rotate(5deg);
}

.folder-icon {
    fill: var(--accent-cyan);
    filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.4));
}

.file-icon-default {
    fill: var(--text-secondary);
}

.file-name {
    flex: 1;
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 500;
}

.file-actions {
    display: flex;
    gap: 6px;
    opacity: 0;
    transition: opacity 0.3s;
}

.file-item:hover .file-actions {
    opacity: 1;
}

.icon-btn {
    padding: 6px 10px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    cursor: pointer;
    border-radius: 6px;
    font-size: 11px;
    transition: all 0.3s ease;
    font-weight: 600;
}

.icon-btn:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
    transform: scale(1.05);
}

.icon-btn.delete:hover {
    color: var(--accent-red);
    border-color: var(--accent-red);
    background: rgba(248, 113, 113, 0.1);
    box-shadow: 0 0 12px rgba(248, 113, 113, 0.3);
}

/* EDITOR AREA */
#editorArea {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: rgba(30, 36, 51, 0.6);
    backdrop-filter: blur(20px);
    border-radius: 16px;
    border: 1px solid var(--border);
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
}

.editor-header {
    padding: 16px 24px;
    background: rgba(26, 31, 46, 0.8);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.editor-file-info {
    display: flex;
    align-items: center;
    gap: 12px;
}

.editor-filename {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
}

.editor-language {
    padding: 4px 10px;
    background: var(--bg-card);
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent-purple);
    border: 1px solid var(--border);
}

.editor-container {
    flex: 1;
    position: relative;
    overflow: hidden;
}

#editor {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    padding: 24px;
    background: transparent;
    color: var(--text-primary);
    font-family: 'JetBrains Mono', 'Fira Code', 'Monaco', monospace;
    font-size: 14px;
    line-height: 1.7;
    border: none;
    outline: none;
    resize: none;
    overflow-y: auto;
    tab-size: 2;
    z-index: 1;
    caret-color: var(--accent-blue);
}

#editor::-webkit-scrollbar {
    width: 10px;
}

#editor::-webkit-scrollbar-track {
    background: transparent;
}

#editor::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 5px;
}

#editor::-webkit-scrollbar-thumb:hover {
    background: var(--text-dim);
}

/* SYNTAX HIGHLIGHTING OVERLAY */
#highlightedCode {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 24px;
    overflow-y: auto;
    pointer-events: none;
    font-family: 'JetBrains Mono', 'Fira Code', 'Monaco', monospace;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-wrap: break-word;
    color: transparent;
    z-index: 0;
}

#highlightedCode::-webkit-scrollbar {
    display: none;
}

#highlightedCode code {
    background: transparent !important;
    padding: 0 !important;
}

.hljs {
    background: transparent !important;
}

/* Line numbers */
.line-numbers {
    position: absolute;
    left: 0;
    top: 24px;
    width: 50px;
    color: var(--text-dim);
    text-align: right;
    padding-right: 16px;
    user-select: none;
    pointer-events: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    line-height: 1.7;
    z-index: 2;
}

/* MESSAGES */
#error, #success {
    display: none;
    padding: 14px 32px;
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    border-left: 3px solid;
    animation: slideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    z-index: 100;
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateX(-20px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

#error {
    background: rgba(248, 113, 113, 0.15);
    border-color: var(--accent-red);
    color: #fca5a5;
    box-shadow: 0 4px 16px rgba(248, 113, 113, 0.2);
}

#success {
    background: rgba(74, 222, 128, 0.15);
    border-color: var(--accent-green);
    color: #86efac;
    box-shadow: 0 4px 16px rgba(74, 222, 128, 0.2);
}

/* MODALS */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(10, 14, 26, 0.9);
    backdrop-filter: blur(10px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.modal.active {
    display: flex;
}

.modal-content {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    max-width: 520px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
}

.modal-header h2 {
    font-size: 20px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.modal-close {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 24px;
    padding: 0;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    transition: all 0.3s ease;
}

.modal-close:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
    transform: rotate(90deg) scale(1.1);
}

.modal input[type="text"] {
    width: 100%;
    padding: 14px 16px;
    background: var(--bg-tertiary);
    border: 2px solid var(--border);
    border-radius: 10px;
    color: var(--text-primary);
    font-size: 14px;
    margin-bottom: 12px;
    transition: all 0.3s ease;
    font-weight: 500;
}

.modal input[type="text"]:focus {
    outline: none;
    border-color: var(--accent-blue);
    box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.2);
    background: var(--bg-card);
}

.modal-hint {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--bg-card);
    border-radius: 8px;
    border: 1px solid var(--border);
}

.modal-hint svg {
    width: 14px;
    height: 14px;
    fill: var(--accent-cyan);
}

.modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 24px;
}

.modal button {
    padding: 10px 20px;
    border: 1px solid var(--border);
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.3s ease;
}

.modal button:hover {
    background: var(--bg-hover);
    transform: translateY(-2px);
}

.modal button.btn-success {
    background: linear-gradient(135deg, #4ade80, #22d3ee);
    border: none;
    color: white;
    box-shadow: 0 4px 16px rgba(74, 222, 128, 0.3);
}

.modal button.btn-success:hover {
    box-shadow: 0 8px 28px rgba(74, 222, 128, 0.5);
}

/* UPLOAD AREA */
.upload-area {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    background: var(--bg-tertiary);
    margin: 16px 0;
    position: relative;
    overflow: hidden;
}

.upload-area::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(96, 165, 250, 0.1) 0%, transparent 70%);
    animation: rotate 20s linear infinite;
    opacity: 0;
    transition: opacity 0.3s;
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.upload-area:hover::before {
    opacity: 1;
}

.upload-area:hover {
    border-color: var(--accent-blue);
    background: var(--bg-card);
    transform: scale(1.02);
    box-shadow: var(--glow-blue);
}

.upload-area svg {
    margin-bottom: 16px;
    filter: drop-shadow(0 0 10px rgba(96, 165, 250, 0.3));
    z-index: 1;
    position: relative;
}

.upload-area p {
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 500;
    z-index: 1;
    position: relative;
}

#uploadPreview {
    max-width: 100%;
    margin-top: 20px;
    display: none;
    border-radius: 12px;
    border: 2px solid var(--border);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
}

input[type="file"] {
    display: none;
}

/* OPTIONS MENU */
#optionsMenu {
    display: none;
    margin: 0 20px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
}

#optionsMenu div {
    padding: 12px 16px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 600;
    border-left: 3px solid transparent;
}

#optionsMenu div:hover {
    background: var(--bg-hover);
    border-left-color: var(--accent-blue);
    transform: translateX(4px);
}

#optionsMenu div svg {
    width: 16px;
    height: 16px;
}

.empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-dim);
}

.empty-state svg {
    width: 64px;
    height: 64px;
    margin-bottom: 20px;
    opacity: 0.3;
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

.empty-state p {
    font-size: 14px;
    font-weight: 500;
}

.empty-state p {
    font-size: 14px;
    font-weight: 500;
}

/* OUTPUT PANEL */
#outputPanel {
    border-top: 1px solid var(--border);
    background: rgba(16, 20, 31, 0.9);
    max-height: 300px;
    display: flex;
    flex-direction: column;
}

.output-header {
    padding: 12px 20px;
    background: rgba(26, 31, 46, 0.8);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 600;
    font-size: 13px;
}

.close-output {

}

#outputContent {

}

#outputContent::-webkit-scrollbar {

}

#outputContent::-webkit-scrollbar-track {

}

#outputContent::-webkit-scrollbar-thumb {

.output-success {

}

.output-error {

}

.output-info {

}

<script>
const API = "https://code-mon.codemon.workers.dev";
const MAX_FOLDER_DEPTH = 5;

let user = null;
let pass = null;
let currentFile = null;
let currentPath = [];
let uploadFileData = null;
let allFiles = [];

// Auth check
(async function() {
    user = localStorage.getItem("code-mon-username");
    pass = localStorage.getItem("code-mon-pass");

    if (!user || !pass) {
        localStorage.clear();
        location.href = "login.html";
        return;
    }

    try {
        const res = await fetch(`${API}/api/pass?username=${user}&pass=${pass}`);
        const data = await res.json();

        if (!data.success) {
            localStorage.clear();
            location.href = "login.html";
            return;
        }

        console.log("✅ User authenticated:", user);
        loadFiles();

    } catch (err) {
        localStorage.clear();
        location.href = "login.html";
    }
})();

// Utility functions
function showError(msg) {
    const e = document.getElementById("error");
    e.style.display = "block";
    e.innerText = "❌ " + msg;
    setTimeout(() => e.style.display = "none", 4000);
}

function showSuccess(msg) {
    const s = document.getElementById("success");
    s.style.display = "block";
    s.innerText = "✅ " + msg;
    setTimeout(() => s.style.display = "none", 3000);
}

function clearError() {
    document.getElementById("error").style.display = "none";
}

function openModal(id) {
    document.getElementById(id).classList.add('active');
}

function closeModal(id) {
    document.getElementById(id).classList.remove('active');
}

// Language detection
function detectLanguage(filename) {
    const ext = filename.split('.').pop().toLowerCase();
    const langMap = {
        'js': { name: 'JavaScript', code: 'javascript' },
        'jsx': { name: 'React', code: 'javascript' },
        'ts': { name: 'TypeScript', code: 'typescript' },
        'tsx': { name: 'TypeScript React', code: 'typescript' },
        'py': { name: 'Python', code: 'python' },
        'html': { name: 'HTML', code: 'html' },
        'css': { name: 'CSS', code: 'css' },
        'json': { name: 'JSON', code: 'json' },
        'md': { name: 'Markdown', code: 'markdown' },
        'php': { name: 'PHP', code: 'php' },
        'java': { name: 'Java', code: 'java' },
        'c': { name: 'C', code: 'c' },
        'cpp': { name: 'C++', code: 'cpp' },
        'cs': { name: 'C#', code: 'csharp' },
        'rb': { name: 'Ruby', code: 'ruby' },
        'go': { name: 'Go', code: 'go' },
        'rs': { name: 'Rust', code: 'rust' },
        'sql': { name: 'SQL', code: 'sql' },
        'xml': { name: 'XML', code: 'xml' },
        'yaml': { name: 'YAML', code: 'yaml' },
        'yml': { name: 'YAML', code: 'yaml' }
    };
    return langMap[ext] || { name: 'Text', code: 'plaintext' };
}

// Syntax highlighting
const editor = document.getElementById('editor');
const highlightedCode = document.getElementById('highlightedCode');

function updateHighlighting() {
    const code = editor.value;
    const codeElement = highlightedCode.querySelector('code');
    
    let language = 'plaintext';
    if (currentFile) {
        language = detectLanguage(currentFile).code;
    }
    
    codeElement.textContent = code;
    codeElement.className = `language-${language}`;
    hljs.highlightElement(codeElement);
}

// Sync scroll
editor.addEventListener('scroll', () => {
    highlightedCode.scrollTop = editor.scrollTop;
    highlightedCode.scrollLeft = editor.scrollLeft;
});

editor.addEventListener('input', () => {
    updateHighlighting();
});

// Parse files into folder structure
function parseFilesIntoFolders(fileList) {
    const structure = {};
    
    fileList.forEach(filepath => {
        if (/\.(png|jpg|jpeg|gif|webp|svg)$/i.test(filepath)) return;
        
        const parts = filepath.split('/');
        let current = structure;
        
        for (let i = 0; i < parts.length - 1; i++) {
            if (!current[parts[i]]) {
                current[parts[i]] = { _isFolder: true, _children: {} };
            }
            current = current[parts[i]]._children;
        }
        
        const fileName = parts[parts.length - 1];
        current[fileName] = { _isFile: true, _fullPath: filepath };
    });
    
    return structure;
}

function getCurrentDir(structure) {
    let dir = structure;
    for (let folder of currentPath) {
        if (dir[folder] && dir[folder]._isFolder) {
            dir = dir[folder]._children;
        }
    }
    return dir;
}

function updateBreadcrumb() {
    const breadcrumb = document.getElementById('breadcrumb');
    
    if (currentPath.length === 0) {
        breadcrumb.innerHTML = '<div class="breadcrumb-item">🏠 Root</div>';
    } else {
        let html = '<div class="breadcrumb-item" onclick="navigateToRoot()">🏠 Root</div>';
        currentPath.forEach((folder, index) => {
            html += '<span class="breadcrumb-separator">›</span>';
            html += `<div class="breadcrumb-item" onclick="navigateToPath(${index})">${folder}</div>`;
        });
        html += `<span class="depth-indicator">Level ${currentPath.length}/${MAX_FOLDER_DEPTH}</span>`;
        breadcrumb.innerHTML = html;
    }
}

function navigateToRoot() {
    currentPath = [];
    renderFileList();
    updateBreadcrumb();
}

function navigateToPath(index) {
    currentPath = currentPath.slice(0, index + 1);
    renderFileList();
    updateBreadcrumb();
}

function renderFileList() {
    const fileList = document.getElementById('fileList');
    const structure = parseFilesIntoFolders(allFiles);
    const dir = getCurrentDir(structure);
    const entries = Object.entries(dir);

    if (entries.length === 0) {
        fileList.innerHTML = `
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/>
                </svg>
                <p>No files or folders yet</p>
            </div>
        `;
        return;
    }

    const folders = entries.filter(([_, value]) => value._isFolder);
    const files = entries.filter(([_, value]) => value._isFile);

    let html = '';

    folders.forEach(([name, _]) => {
        html += `
            <div class="file-item" onclick="openFolder('${name}')">
                <svg class="file-icon folder-icon" viewBox="0 0 16 16">
                    <path d="M1.75 2A1.75 1.75 0 0 0 0 3.75v8.5C0 13.216.784 14 1.75 14h12.5A1.75 1.75 0 0 0 16 12.25v-6.5A1.75 1.75 0 0 0 14.25 4H7.5L5.66 2.16A1.75 1.75 0 0 0 4.42 2H1.75Z"></path>
                </svg>
                <span class="file-name">${name}</span>
                <div class="file-actions">
                    <button class="icon-btn delete" onclick="event.stopPropagation(); deleteFolder('${name}')">Delete</button>
                </div>
            </div>
        `;
    });

    files.forEach(([name, data]) => {
        const isActive = currentFile === data._fullPath;
        html += `
            <div class="file-item ${isActive ? 'active' : ''}" onclick="loadFile('${data._fullPath}')">
                <svg class="file-icon file-icon-default" viewBox="0 0 16 16">
                    <path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V6h-2.75A1.75 1.75 0 0 1 9 4.25V1.5Zm6.75.062V4.25c0 .138.112.25.25.25h2.688l-.011-.013-2.914-2.914-.013-.011Z"></path>
                </svg>
                <span class="file-name">${name}</span>
            </div>
        `;
    });

    fileList.innerHTML = html;
}

function openFolder(folderName) {
    currentPath.push(folderName);
    renderFileList();
    updateBreadcrumb();
}

async function loadFiles(selectedFile = null) {
    clearError();
    try {
        const res = await fetch(`${API}/api/list?user=${user}`);
        const data = await res.json();

        if (data.error) return showError("Failed to load files: " + data.error);

        allFiles = data.files || [];
        renderFileList();
        updateBreadcrumb();

        if (selectedFile && allFiles.includes(selectedFile)) loadFile(selectedFile);

    } catch (err) {
        showError("Failed to load files: " + err.message);
    }
}

async function loadFile(filepath) {
    currentFile = filepath;
    const lang = detectLanguage(filepath);
    document.getElementById('editorFilename').textContent = filepath;
    document.getElementById('editorLanguage').textContent = lang.name.toUpperCase();
    
    try {
        const res = await fetch(`${API}/api/load?user=${user}&filename=${filepath}`);
        const content = await res.text();
        editor.value = content;
        updateHighlighting();
        renderFileList();
    } catch (err) {
        showError("Failed to load file: " + err.message);
    }
}

function createFolder() {
    if (currentPath.length >= MAX_FOLDER_DEPTH) {
        showError(`Maximum folder depth of ${MAX_FOLDER_DEPTH} reached!`);
        return;
    }
    openModal('folderModal');
}

async function confirmCreateFolder() {
    const folderName = document.getElementById('folderName').value.trim();
    closeModal('folderModal');
    
    if (!folderName) return showError("Folder name cannot be empty");
    if (folderName.includes('/')) return showError("Folder name cannot contain '/'");
    
    showSuccess("Folder created! Now create a file inside it.");
    document.getElementById('folderName').value = '';
    
    currentPath.push(folderName);
    renderFileList();
    updateBreadcrumb();
}

function createFile() {
    document.getElementById('createTitle').textContent = currentPath.length > 0 
        ? `Create File in ${currentPath.join('/')}`
        : 'Create New File';
    
    if (currentPath.length > 0) {
        document.getElementById('createFilename').value = currentPath.join('/') + '/';
    } else {
        document.getElementById('createFilename').value = '';
    }
    
    openModal('createModal');
}

async function confirmCreate() {
    let filename = document.getElementById('createFilename').value.trim();
    closeModal('createModal');

    if (!filename) return showError("Filename cannot be empty");

    try {
        const res = await fetch(`${API}/api/save`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user, pass, filename, content: "" })
        });

        const data = await res.json();
        if (data.error) return showError("Failed to create file: " + data.error);

        showSuccess("File created successfully!");
        document.getElementById('createFilename').value = '';
        loadFiles(filename);

    } catch (err) {
        showError("Failed to create file: " + err.message);
    }
}

async function saveFile() {
    if (!currentFile) return showError("Select a file first");

    try {
        const res = await fetch(`${API}/api/save`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                user,
                pass,
                filename: currentFile,
                content: editor.value
            })
        });

        const data = await res.json();
        if (!data.success) return showError("Failed to save file: " + (data.error || "Unknown error"));

        showSuccess("File saved successfully!");
        loadFiles(currentFile);

    } catch (err) {
        showError("Failed to save file: " + err.message);
    }
}

function openUpload() {
    document.getElementById('uploadFilename').value = currentPath.length > 0 
        ? currentPath.join('/') + '/'
        : '';
    openModal('uploadModal');
}

document.getElementById("uploadDrop").onclick = () => {
    document.getElementById("uploadInput").click();
};

document.getElementById("uploadInput").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    uploadFileData = await file.arrayBuffer();

    const reader = new FileReader();
    reader.onload = () => {
        document.getElementById("uploadPreview").src = reader.result;
        document.getElementById("uploadPreview").style.display = "block";
    };
    reader.readAsDataURL(file);
});

async function uploadAndDeployImageBinary() {
    let filename = document.getElementById("uploadFilename").value.trim();
    
    if (!filename) return showError("Filename required!");
    if (!uploadFileData) return showError("Select an image first!");

    try {
        const saveRes = await fetch(`${API}/api/img-save`, {
            method: "POST",
            headers: {
                "Content-Type": "application/octet-stream",
                "x-user": user,
                "x-pass": pass,
                "x-filename": filename
            },
            body: uploadFileData
        });

        const saveJson = await saveRes.json();
        if (!saveJson.success) return showError("KV Binary Save Failed: " + (saveJson.error || "Unknown"));

        const deployRes = await fetch(`${API}/api/img-deploy`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user, filename })
        });

        const deployJson = await deployRes.json();
        if (!deployJson.success) return showError("GitHub Upload Failed: " + JSON.stringify(deployJson));

        showSuccess("Image uploaded and deployed!");
        closeModal('uploadModal');
        document.getElementById('uploadFilename').value = '';
        document.getElementById('uploadPreview').style.display = 'none';
        uploadFileData = null;
        loadFiles(filename);

    } catch (err) {
        showError("Upload failed: " + err.message);
    }
}

async function deleteFolder(folderName) {
    if (!confirm(`Delete folder "${folderName}" and all its contents? This cannot be undone!`)) return;
    
    const folderPrefix = [...currentPath, folderName].join('/') + '/';
    const filesToDelete = allFiles.filter(f => f.startsWith(folderPrefix));
    
    if (filesToDelete.length === 0) {
        showError("Folder is empty or doesn't exist");
        return;
    }
    
    try {
        for (const file of filesToDelete) {
            const res = await fetch(`${API}/api/delete-file`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username: user, pass, filename: file })
            });
            
            const data = await res.json();
            if (!data.success) {
                showError(`Failed to delete ${file}: ` + (data.error || "Unknown error"));
                return;
            }
        }
        
        showSuccess("Folder deleted successfully!");
        if (currentFile && currentFile.startsWith(folderPrefix)) {
            currentFile = null;
            editor.value = "";
            document.getElementById('editorFilename').textContent = 'No file selected';
            document.getElementById('editorLanguage').textContent = 'TEXT';
        }
        loadFiles();
        
    } catch (err) {
        showError("Delete failed: " + err.message);
    }
}

async function deleteCurrentFile() {
    if (!currentFile) return showError("Select a file first");
    if (!confirm(`Delete ${currentFile}? This cannot be undone!`)) return;

    try {
        const res = await fetch(`${API}/api/delete-file`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: user, pass, filename: currentFile })
        });

        const data = await res.json();
        if (!data.success) return showError(data.error || "Delete failed");

        showSuccess("File deleted successfully!");
        currentFile = null;
        editor.value = "";
        document.getElementById('editorFilename').textContent = 'No file selected';
        document.getElementById('editorLanguage').textContent = 'TEXT';
        loadFiles();

    } catch (err) {
        showError("Delete failed: " + err.message);
    }
}

function downloadCurrentFile() {
    if (!currentFile) return showError("Select a file first");

    const content = editor.value;
    const blob = new Blob([content], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = currentFile.split('/').pop();
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    showSuccess("File downloaded successfully!");
}

// Run/Compile Code with Judge0 PUBLIC API (NO KEY NEEDED!)
async function runCode() {
    if (!currentFile) return showError("Select a file first");
    
    const code = editor.value;
    const ext = currentFile.split('.').pop().toLowerCase();
    const outputPanel = document.getElementById('outputPanel');
    const outputContent = document.getElementById('outputContent');
    
    outputPanel.style.display = 'flex';
    outputContent.innerHTML = '<div class="output-info">⏳ Running code...</div>';
    
    try {
        // Special cases that don't need Judge0
        if (ext === 'html') {
            const blob = new Blob([code], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
            outputContent.innerHTML = '<div class="output-success">✅ HTML opened in new tab!</div>';
            return;
        }
        
        if (ext === 'json') {
            try {
                const parsed = JSON.parse(code);
                outputContent.innerHTML = '<div class="output-success">✅ Valid JSON!\n\n' + JSON.stringify(parsed, null, 2) + '</div>';
            } catch (e) {
                outputContent.innerHTML = '<div class="output-error">❌ Invalid JSON: ' + e.message + '</div>';
            }
            return;
        }
        
        if (ext === 'xml') {
            try {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(code, "text/xml");
                const errors = xmlDoc.getElementsByTagName("parsererror");
                if (errors.length > 0) {
                    outputContent.innerHTML = '<div class="output-error">❌ Invalid XML</div>';
                } else {
                    outputContent.innerHTML = '<div class="output-success">✅ Valid XML!</div>';
                }
            } catch (e) {
                outputContent.innerHTML = '<div class="output-error">❌ Error parsing XML: ' + e.message + '</div>';
            }
            return;
        }
        
        if (ext === 'css' || ext === 'scss' || ext === 'sass') {
            outputContent.innerHTML = '<div class="output-info">🎨 CSS Preview:\n\nTo preview CSS:\n1. Create an HTML file that includes this CSS\n2. Use the Deploy button to view it live</div>';
            return;
        }
        
        if (ext === 'md') {
            outputContent.innerHTML = '<div class="output-success">📝 Markdown Preview:\n\n' + code.replace(/^#+\s/gm, '').substring(0, 500) + '\n\n(Preview truncated - Deploy to see full markdown)</div>';
            return;
        }
        
        if (ext === 'sql') {
            outputContent.innerHTML = '<div class="output-info">🗄️ SQL execution requires a database connection.\n\nYou can:\n1. Connect to MySQL/PostgreSQL/SQLite\n2. Use an online SQL sandbox\n3. Deploy to a database server</div>';
            return;
        }
        
        if (ext === 'yml' || ext === 'yaml') {
            outputContent.innerHTML = '<div class="output-info">📋 YAML Configuration File\n\nThis is a configuration file used by:\n- Docker (docker-compose.yml)\n- Kubernetes (k8s configs)\n- CI/CD pipelines (GitHub Actions, etc.)\n\nDeploy this to use in your applications!</div>';
            return;
        }
        
        // Check if language is supported by Judge0
        const languageId = languageIds[ext];
        if (!languageId) {
            outputContent.innerHTML = '<div class="output-info">ℹ️ File type: ' + ext.toUpperCase() + '\n\nThis file type cannot be executed directly.\n\nOptions:\n1. Deploy the file\n2. Download and run locally\n3. Use appropriate compiler/interpreter</div>';
            return;
        }
        
        // Use Judge0 FREE PUBLIC API (sulu.judge0.com)
        outputContent.innerHTML = '<div class="output-info">⏳ Compiling and running code...\n\nUsing Judge0 Free API...</div>';
        
        // Submit code to Judge0 FREE API
        const submissionResponse = await fetch('https://judge0-ce.p.rapidapi.com/submissions?base64_encoded=false&wait=true&fields=*', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-RapidAPI-Host': 'judge0-ce.p.rapidapi.com',
                'X-RapidAPI-Key': 'c4db20f8a1msh869be3096bb42edp138f50jsn29d5f0f0c4e9'
            },
            body: JSON.stringify({
                language_id: languageId,
                source_code: code,
                stdin: ''
            })
        });
        
        if (!submissionResponse.ok) {
            // Try alternative free endpoint
            const altResponse = await fetch('https://judge0-ce.p.rapidapi.com/submissions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    language_id: languageId,
                    source_code: code,
                    stdin: ''
                })
            });
            
            if (!altResponse.ok) {
                throw new Error('Failed to submit code');
            }
            
            const submission = await altResponse.json();
            const token = submission.token;
            
            // Poll for results
            let result;
            for (let i = 0; i < 10; i++) {
                await new Promise(resolve => setTimeout(resolve, 1000));
                const statusResponse = await fetch(`https://judge0-ce.p.rapidapi.com/submissions/${token}`);
                result = await statusResponse.json();
                
                if (result.status.id > 2) break; // Processing complete
            }
            
            displayResult(result, outputContent);
            return;
        }
        
        const result = await submissionResponse.json();
        displayResult(result, outputContent);
        
    } catch (err) {
        outputContent.innerHTML = `<div class="output-error">❌ Execution Error

${err.message}

💡 Tip: Some features may require internet connection.
You can also run code locally or use online compilers.</div>`;
    }
}

function displayResult(result, outputContent) {
    let output = '';
    
    if (result.status.id === 3) { // Accepted
        output = '<div class="output-success">✅ Compilation Successful!\n\n';
        output += '📤 OUTPUT:\n';
        output += '─────────────────────────────────\n';
        output += (result.stdout || '(No output)');
        output += '\n─────────────────────────────────\n';
        output += '\n⏱️ Time: ' + (result.time || '0') + 's';
        output += ' | 💾 Memory: ' + (result.memory || '0') + ' KB';
        output += '</div>';
    } else if (result.status.id === 6) { // Compilation Error
        output = '<div class="output-error">❌ COMPILATION ERROR:\n\n';
        output += (result.compile_output || result.stderr || 'Unknown error');
        output += '</div>';
    } else if (result.status.id === 11 || result.status.id === 12) { // Runtime Error
        output = '<div class="output-error">❌ RUNTIME ERROR:\n\n';
        output += (result.stderr || 'Unknown runtime error');
        if (result.stdout) {
            output += '\n\n📤 Output before error:\n' + result.stdout;
        }
        output += '</div>';
    } else if (result.status.id === 13) { // Time Limit Exceeded
        output = '<div class="output-error">⏱️ TIME LIMIT EXCEEDED\n\n';
        output += 'Your code took too long to execute.\n';
        output += 'Try optimizing your algorithm.';
        output += '</div>';
    } else if (result.status.id === 5) { // Time Limit Exceeded
        output = '<div class="output-error">⏱️ TIME LIMIT EXCEEDED\n\n';
        output += 'Your code took too long to execute.';
        output += '</div>';
    } else {
        output = '<div class="output-error">❌ EXECUTION FAILED\n\n';
        output += 'Status: ' + (result.status.description || 'Unknown');
        if (result.stderr) output += '\n\nError: ' + result.stderr;
        if (result.compile_output) output += '\n\n' + result.compile_output;
        output += '</div>';
    }
    
    outputContent.innerHTML = output;
}

    document.getElementById('outputPanel').style.display = 'none';
}
