<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeMon · Login</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #fafaf8;
    --surface: #ffffff;
    --border: #e8e6e1;
    --text: #1a1917;
    --muted: #8c8a85;
    --accent: #2563eb;
    --error: #dc2626;
    --success: #16a34a;
  }

  body {
    background: var(--bg);
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    color: var(--text);
  }

  .card {
    width: 380px;
    max-width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 36px 32px 32px;
  }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 28px;
    gap: 12px;
  }

  .brand img {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 1px solid var(--border);
    object-fit: cover;
  }

  .brand-name {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
  }

  h2 {
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--text);
    text-align: center;
    margin-bottom: 22px;
  }

  .field {
    margin-bottom: 14px;
  }

  label {
    display: block;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: 0.01em;
  }

  input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 9px 12px;
    font-size: 0.9rem;
    font-family: 'Geist', sans-serif;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  input:focus {
    border-color: #a0aec0;
    background: var(--surface);
  }

  input::placeholder { color: #c4c2be; }

  .hint {
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 4px;
  }

  .btn {
    width: 100%;
    background: var(--text);
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 10px;
    font-size: 0.88rem;
    font-family: 'Geist', sans-serif;
    font-weight: 500;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.15s;
  }

  .btn:hover { opacity: 0.8; }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 22px 0;
  }

  .switch {
    text-align: center;
    font-size: 0.82rem;
    color: var(--muted);
  }

  .switch span {
    color: var(--accent);
    cursor: pointer;
    font-weight: 500;
  }

  .switch span:hover { text-decoration: underline; }

  /* Toast */
  #toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 0.84rem;
    font-weight: 500;
    font-family: 'Geist', sans-serif;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.1);
    z-index: 999;
    white-space: nowrap;
  }

  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.success { border-left: 3px solid var(--success); color: var(--success); }
  #toast.error   { border-left: 3px solid var(--error);   color: var(--error); }
</style>
</head>
<body>

<div id="toast"></div>

<div class="card">
  <div class="brand">
    <img src="favicon.png" alt="CodeMon" onerror="this.style.display='none'">
    <span class="brand-name">CodeMon</span>
  </div>

  <h2 id="title">Sign in to your account</h2>

  <div class="field">
    <label for="loginUser">Username</label>
    <input type="text" id="loginUser" placeholder="6–12 letters or numbers">
    <div class="hint">Only a–z, A–Z, 0–9 · 6–12 characters</div>
  </div>

  <div class="field">
    <label for="loginPass">Password</label>
    <input type="password" id="loginPass" placeholder="••••••••">
  </div>

  <button class="btn" id="mainBtn" onclick="login()">Sign in</button>

  <div class="divider"></div>

  <div class="switch" id="switchText">
    New to CodeMon? <span onclick="switchToSignup()">Create an account</span>
  </div>
</div>

<script>
const API = "https://code-mon.codemon.workers.dev";
let toastTimer;

function showToast(msg, type = "error") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = `show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ""; }, 3000);
}

function validateUsername(str) {
  return str.length >= 6 && str.length <= 12 && /^[a-zA-Z0-9]+$/.test(str);
}

function switchToSignup() {
  document.getElementById("title").textContent = "Create your account";
  document.getElementById("mainBtn").textContent = "Create account";
  document.getElementById("mainBtn").setAttribute("onclick", "signup()");
  document.getElementById("switchText").innerHTML =
    `Already have an account? <span onclick="switchToLogin()">Sign in</span>`;
}

function switchToLogin() {
  document.getElementById("title").textContent = "Sign in to your account";
  document.getElementById("mainBtn").textContent = "Sign in";
  document.getElementById("mainBtn").setAttribute("onclick", "login()");
  document.getElementById("switchText").innerHTML =
    `New to CodeMon? <span onclick="switchToSignup()">Create an account</span>`;
}

async function login() {
  const username = document.getElementById("loginUser").value.trim();
  const pass = document.getElementById("loginPass").value.trim();
  if (!username || !pass) return showToast("Please fill in all fields");
  if (!validateUsername(username)) return showToast("Username: 6–12 letters/numbers only");
  try {
    const res = await fetch(`${API}/api/pass?username=${username}&pass=${pass}`);
    const data = await res.json();
    if (!data.success) return showToast(data.error || "Login failed");
    localStorage.setItem("code-mon-username", username);
    localStorage.setItem("code-mon-pass", pass);
    localStorage.setItem("user", username);
    showToast("Access granted", "success");
    setTimeout(() => location.href = "index.html", 900);
  } catch {
    showToast("Connection error");
  }
}

async function signup() {
  const username = document.getElementById("loginUser").value.trim();
  const pass = document.getElementById("loginPass").value.trim();
  if (!username || !pass) return showToast("Please fill in all fields");
  if (!validateUsername(username)) return showToast("Username: 6–12 letters/numbers only");
  try {
    const res = await fetch(`${API}/api/pass-deploy?username=${username}&pass=${pass}`);
    const data = await res.json();
    if (!data.success) return showToast(data.error || "Signup failed");
    showToast("Account created — sign in now", "success");
    setTimeout(() => {
      switchToLogin();
      document.getElementById("loginUser").value = '';
      document.getElementById("loginPass").value = '';
    }, 1400);
  } catch {
    showToast("Connection error");
  }
}
</script>
</body>
</html>
