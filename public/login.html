<!DOCTYPE html>
<html>
<head>
<title>Login-</title>
<style>
body { font-family:Arial; background:#f3f3f3; display:flex; justify-content:center; align-items:center; height:100vh; }
#box { background:white; padding:30px; border-radius:8px; width:300px; text-align:center; }
input { padding:10px; width:100%; margin-top:10px; }
button { padding:10px; margin-top:10px; width:100%; background:#222; color:white; border:none; border-radius:5px; }
</style>
</head>
<body>

<div id="box">
    <h2>Login</h2>
    <input id="username" placeholder="Enter username">
    <button onclick="login()">Login</button>
</div>

<script>
function login() {
    const user = document.getElementById("username").value.trim();
    if (!user) return alert("Enter username");
    localStorage.setItem("user", user);
    location.href = "file.html";
}
</script>

</body>
</html>
