<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Code Mon - Login</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #0a0f24, #111a3a);
      color: #e0e6ff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-box {
      background: rgba(255,255,255,0.06);
      padding: 30px;
      border-radius: 15px;
      backdrop-filter: blur(15px);
      text-align: center;
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.2);
      width: 300px;
    }
    input {
      width: 80%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: #00eaff;
      color: #00131a;
      font-weight: bold;
      box-shadow: 0 0 15px #00eaff;
      transition: 0.2s;
    }
    button:hover {
      background: #00bcd4;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login</h2>
    <input id="username" placeholder="Enter username" />
    <br>
    <button onclick="login()">Login</button>
  </div>

  <script>
    function login() {
      const user = document.getElementById("username").value.trim();
      if (!user) return alert("Please enter a username.");
      localStorage.setItem("user", user);
      window.location.href = "file.html";
    }
  </script>
</body>
</html>
