<!DOCTYPE html>
<html>
<head>
<title>CM Ultra Console</title>
<style>
    
    /* ==== HYTECH ULTRA FUTURISTIC CONSOLE THEME ==== */

body {
    margin: 0;
    background: radial-gradient(circle at center, #020202, #000);
    color: #00ffea;
    font-family: Consolas, monospace;
    overflow: hidden;
}

/* Glow frame */
#console {
    width: 100%;
    height: 90vh;
    padding: 15px;
    font-size: 15px;
    background: rgba(0, 0, 0, 0.8);
    border: 2px solid #00ffe1;
    border-radius: 10px;

    backdrop-filter: blur(6px);
    box-shadow:
        0 0 20px #00ffe1,
        inset 0 0 15px #004d47,
        0 0 60px #009688;

    color: #00ffd9;
    overflow-y: auto;
}

/* Type area */
#input {
    width: 100%;
    padding: 12px;
    border-radius: 6px;
    background: rgba(0, 20, 20, 0.9);
    border: 2px solid #00ffe1;
    outline: none;
    font-size: 16px;
    color: #00ffe1;

    box-shadow:
        0 0 15px #00ffe1,
        inset 0 0 10px #003f3b;
}

#input::placeholder {
    color: #00c7a1;
}

/* Console text colors */
.log {
    padding: 3px 0;
    letter-spacing: 0.6px;
}

.ok {
    color: #00ff9d;
    text-shadow: 0 0 5px #00ff9d;
}

.err {
    color: #ff4a4a;
    text-shadow: 0 0 5px #ff3b3b;
}

.info {
    color: #00fff6;
    text-shadow: 0 0 5px #00fff6;
}

/* Scrollbar */
#console::-webkit-scrollbar {
    width: 8px;
}

#console::-webkit-scrollbar-thumb {
    background: #00ffe1;
    border-radius: 10px;
    box-shadow: 0 0 10px #00ffe1;
}

#console::-webkit-scrollbar-track {
    background: rgba(0, 30, 30, 0.5);
}
</style>
</head>
<body>

<div id="console"></div>
<input id="input" placeholder="Type: cm help" autofocus/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>

<script>
const consoleBox = document.getElementById("console");
const input = document.getElementById("input");

const PORTAL = { workspace: null };
const TIME_MACHINE = { current: new Date() };

function log(msg, type="log") {
    const div = document.createElement("div");
    div.className = "log " + type;
    div.innerText = msg;
    consoleBox.appendChild(div);
    consoleBox.scrollTop = consoleBox.scrollHeight;
}

function openEditor(filename, content) {
    const w = window.open("", "_blank");
    w.document.write(`
        <textarea id='edit' style='width:100%;height:90vh;'>${content.replace(/</g, "&lt;")}</textarea>
        <button onclick="save()">Save</button>
        <script>
        function save() {
            const data = document.getElementById('edit').value;
            window.opener.postMessage({ file: "${filename}", content: data }, "*");
        }
        <` + `/script>
    `);
}

window.addEventListener("message", e => {
    if (PORTAL.workspace && PORTAL.workspace.files[e.data.file]) {
        PORTAL.workspace.files[e.data.file] = e.data.content;
        log("[portal] Saved " + e.data.file, "ok");
    }
});

input.addEventListener("keydown", async (e) => {
    if (e.key !== "Enter") return;
    const raw = input.value.trim();
    input.value = "";

    if (!raw.startsWith("cm")) {
        log("Commands must start with: cm", "err");
        return;
    }

    log("→ " + raw, "info");

    const parts = raw.split(" ");
    parts.shift();
    const cmd = parts.shift();
    const args = parts;

    // ================= HELP =================
    if (cmd === "help") {
        log("=== CM ULTRA CONSOLE COMMANDS ===");
        log("storage.set <key> <value>");
        log("storage.get <key>");
        log("fetch <url>");
        log("portal <url>");
        log("portal.list");
        log("portal.edit <file>");
        log("portal.export");
        log("portal.find <text>");
        log("portal.replace <a> <b>");
        log("timetravel <date | +1d | -1h>");
        log("time.now");
        log("dev.see <url>");
        log("dev.links <url>");
        log("sys.ram");
        log("sys.cpu");
        log("math <expression>");
        log("sandbox <js>");
        return;
    }
// ================= LIVE WEBSITE SEE SYSTEM =================
if (cmd === "see") {
    const url = args[0];
    if (!url) return log("Usage: cm see <url>", "err");

    log("[see] Fetching website...", "info");

    try {
        const res = await fetch(url);
        const text = await res.text();

        log("[see] Code fetched. Rendering preview below...", "ok");

        // Live iframe preview
        const frame = document.createElement("iframe");
        frame.style.width = "100%";
        frame.style.height = "400px";
        frame.style.border = "1px solid #0f0";
        frame.style.marginTop = "10px";
        document.body.appendChild(frame);

        frame.contentDocument.open();
        frame.contentDocument.write(text);
        frame.contentDocument.close();

        // Show raw code in editor
        openEditor("live-view.html", text);

    } catch (err) {
        log("SEE failed: " + err.message, "err");
    }

    return;
    }
    // ================= STORAGE =================
    if (cmd === "storage.set") {
        const key = args[0];
        const value = args.slice(1).join(" ");
        localStorage.setItem(key, value);
        log("Saved!", "ok");
        return;
    }

    if (cmd === "storage.get") {
        const key = args[0];
        log(localStorage.getItem(key), "info");
        return;
    }

    // ================= FETCH =================
    if (cmd === "fetch") {
        try {
            const url = args[0];
            const res = await fetch(url);
            const text = await res.text();
            log(text, "info");
        } catch {
            log("Fetch failed.", "err");
        }
        return;
    }

    // ================= PORTAL SYSTEM =================
    if (cmd === "portal") {
        const url = args.join(" ");
        log("[portal] Fetching " + url, "info");

        try {
            const html = await (await fetch(url)).text();
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, "text/html");

            PORTAL.workspace = {
                url,
                files: { "index.html": html }
            };

            for (const link of doc.querySelectorAll("link[rel='stylesheet']")) {
                try {
                    const href = new URL(link.href, url).href;
                    PORTAL.workspace.files[href.split("/").pop()] =
                        await (await fetch(href)).text();
                } catch {}
            }

            for (const s of doc.querySelectorAll("script[src]")) {
                try {
                    const src = new URL(s.src, url).href;
                    PORTAL.workspace.files[src.split("/").pop()] =
                        await (await fetch(src)).text();
                } catch {}
            }

            log(`[portal] Workspace created with ${Object.keys(PORTAL.workspace.files).length} files`, "ok");
            log("Use: portal.list | portal.edit | portal.export", "info");

        } catch {
            log("[portal] Failed to load.", "err");
        }
        return;
    }

    if (cmd === "portal.list") {
        if (!PORTAL.workspace) return log("No portal active.", "err");
        Object.keys(PORTAL.workspace.files).forEach(f => log("• " + f, "info"));
        return;
    }

    if (cmd === "portal.edit") {
        if (!PORTAL.workspace) return log("No portal active.", "err");
        const file = args.join(" ");
        if (!PORTAL.workspace.files[file]) return log("File missing.", "err");
        openEditor(file, PORTAL.workspace.files[file]);
        return;
    }

    if (cmd === "portal.export") {
        if (!PORTAL.workspace) return log("No portal active.", "err");

        const zip = new JSZip();
        for (const [name, content] of Object.entries(PORTAL.workspace.files))
            zip.file(name, content);

        zip.generateAsync({ type: "blob" }).then(blob => {
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "portal-site.zip";
            a.click();
        });

        log("[portal] Exported ZIP!", "ok");
        return;
    }

    if (cmd === "portal.find") {
        const text = args.join(" ");
        if (!PORTAL.workspace) return log("No portal loaded.", "err");
        const found = [];
        for (const [file, content] of Object.entries(PORTAL.workspace.files)) {
            if (content.includes(text)) found.push(file);
        }
        log(found.length ? "Found in:\n" + found.join("\n") : "Not found.", found.length ? "info" : "err");
        return;
    }

    if (cmd === "portal.replace") {
        if (!PORTAL.workspace) return log("No portal loaded.", "err");
        const [a, b] = args;
        for (const file in PORTAL.workspace.files)
            PORTAL.workspace.files[file] = PORTAL.workspace.files[file].split(a).join(b);
        log("Replaced globally.", "ok");
        return;
    }

    // ================= TIME TRAVEL =================
    if (cmd === "timetravel") {
        const target = args.join(" ");
        let d = new Date();

        if (target.startsWith("+") || target.startsWith("-")) {
            const n = parseInt(target);
            const type = target.slice(-1);
            switch (type) {
                case "d": d.setDate(d.getDate() + n); break;
                case "h": d.setHours(d.getHours() + n); break;
                case "m": d.setMinutes(d.getMinutes() + n); break;
                case "s": d.setSeconds(d.getSeconds() + n); break;
            }
        } else d = new Date(target);

        if (isNaN(d.getTime())) return log("Invalid date.", "err");
        TIME_MACHINE.current = d;
        log("[time] Now: " + d.toString(), "ok");
        return;
    }

    if (cmd === "time.now") {
        log(TIME_MACHINE.current.toString(), "info");
        return;
    }

    // ================= DEV TOOLS =================
    if (cmd === "dev.see") {
        const url = args[0];
        const html = await (await fetch(url)).text();
        openEditor("view.html", html);
        log("Source opened.", "ok");
        return;
    }

    if (cmd === "dev.links") {
        const url = args[0];
        const html = await (await fetch(url)).text();
        const d = new DOMParser().parseFromString(html, "text/html");
        [...d.querySelectorAll("a")].forEach(a => log(a.href, "info"));
        return;
    }

    // ================= SYSTEM =================
    if (cmd === "sys.ram") {
        if (performance.memory)
            log("RAM usage: " + Math.round(performance.memory.usedJSHeapSize / 1048576) + " MB", "info");
        else log("RAM info not supported.", "err");
        return;
    }

    if (cmd === "sys.cpu") {
        log("CPU Load: " + (Math.random() * 100).toFixed(2) + "% (simulated)", "info");
        return;
    }

    // ================= MATH =================
    if (cmd === "math") {
        try {
            log(eval(args.join(" ")), "ok");
        } catch {
            log("Math error.", "err");
        }
        return;
    }

    // ================= SANDBOX =================
    if (cmd === "sandbox") {
        try {
            const result = Function(args.join(" "))();
            log(result, "ok");
        } catch {
            log("Sandbox error.", "err");
        }
        return;
    }

    log("Unknown command.", "err");
});
</script>

</body>
  </html>
