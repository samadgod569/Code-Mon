<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediaWiki Image Finder</title>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h2 {
            margin-top: 0;
        }

        textarea {
            width: 100%;
            height: 400px;
            background: #222;
            color: white;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 10px;
            box-sizing: border-box;
            font-family: monospace;
            resize: vertical;
        }

        button {
            margin-top: 10px;
            margin-right: 8px;
            padding: 12px 20px;
            cursor: pointer;
            border: 0;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
        }

        #checkBtn {
            background: #4caf50;
            color: white;
        }

        #downloadBtn {
            background: #2196f3;
            color: white;
        }

        #copyBtn {
            background: #9c27b0;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
        }

        pre {
            background: #222;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 6px;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-x: auto;
        }
    </style>
</head>

<body>

<h2>MediaWiki Image Finder</h2>

<p>Paste your JSON array below:</p>

<textarea id="input">[
  "Ethereal Scythe",
  "Zombie Pickaxe",
  "Zombie Hat",
  "Zombie Heart",
  "Zombie Sword"
]</textarea>

<br>

<button id="checkBtn" onclick="checkImages()">
    Check Images
</button>

<button id="downloadBtn" onclick="downloadJSON()" disabled>
    Download pairs.json
</button>

<button id="copyBtn" onclick="copyJSON()" disabled>
    Copy JSON
</button>

<p id="status"></p>

<h3>Working Images</h3>

<pre id="output">[]</pre>


<script>

const BASE_URL =
    "https://craftersmc.wiki.gg/images/";

let working = [];


/*
 * Convert item name into the MediaWiki image URL.
 *
 * Example:
 *
 * Ethereal Scythe
 *
 * becomes:
 *
 * https://craftersmc.wiki.gg/images/Ethereal_Scythe.png
 *
 * Capitalization is preserved.
 */
function makeURL(itemName) {

    const filename = itemName
        .trim()
        .replace(/\s+/g, "_");

    return BASE_URL +
        encodeURIComponent(filename) +
        ".png";
}


/*
 * Test whether an image actually loads.
 *
 * We use Image() instead of fetch() so browser CORS
 * restrictions don't prevent the check.
 */
function testImage(url) {

    return new Promise(resolve => {

        const img = new Image();

        img.onload = () => {
            resolve(true);
        };

        img.onerror = () => {
            resolve(false);
        };

        /*
         * Cache buster.
         *
         * This is ONLY used for testing.
         * It is NOT included in the final JSON URL.
         */
        img.src = url + "?check=" + Date.now();

    });
}


/*
 * Main checker
 */
async function checkImages() {

    const input =
        document.getElementById("input");

    const status =
        document.getElementById("status");

    const output =
        document.getElementById("output");

    const downloadBtn =
        document.getElementById("downloadBtn");

    const copyBtn =
        document.getElementById("copyBtn");

    const checkBtn =
        document.getElementById("checkBtn");


    let items;


    /*
     * Parse JSON
     */
    try {

        items = JSON.parse(input.value);

        if (!Array.isArray(items)) {
            throw new Error(
                "Input must be a JSON array."
            );
        }

    } catch (error) {

        status.textContent =
            "❌ Invalid JSON: " + error.message;

        return;
    }


    /*
     * Reset previous results
     */
    working = [];

    output.textContent = "[]";

    downloadBtn.disabled = true;
    copyBtn.disabled = true;

    checkBtn.disabled = true;


    /*
     * Remove duplicate item names.
     */
    items = [...new Set(items)];


    status.textContent =
        `Checking ${items.length} images...`;


    /*
     * Check 10 images at a time.
     *
     * This prevents the browser from creating
     * hundreds of simultaneous requests.
     */
    const batchSize = 10;


    for (
        let start = 0;
        start < items.length;
        start += batchSize
    ) {

        const batch =
            items.slice(
                start,
                start + batchSize
            );


        /*
         * Check this batch simultaneously.
         */
        const results =
            await Promise.all(

                batch.map(async item => {

                    const img =
                        makeURL(item);

                    const works =
                        await testImage(img);

                    return {
                        item,
                        img,
                        works
                    };

                })

            );


        /*
         * Keep only working images.
         */
        for (const result of results) {

            if (result.works) {

                working.push({
                    itemname: result.item,
                    img: result.img
                });

            }

        }


        const checked =
            Math.min(
                start + batch.length,
                items.length
            );


        status.textContent =
            `Checking images... ` +
            `${checked}/${items.length} | ` +
            `Working: ${working.length}`;


        /*
         * Update the output after every batch.
         */
        output.textContent =
            JSON.stringify(
                working,
                null,
                2
            );
    }


    /*
     * Finished
     */
    status.textContent =
        `✅ Done! ` +
        `${working.length}/${items.length} images work.`;


    /*
     * Enable buttons if we found something.
     */
    if (working.length > 0) {

        downloadBtn.disabled = false;
        copyBtn.disabled = false;

    }


    checkBtn.disabled = false;
}


/*
 * Generate the JSON string.
 */
function getJSON() {

    return JSON.stringify(
        working,
        null,
        2
    );

}


/*
 * Download pairs.json
 */
function downloadJSON() {

    if (working.length === 0) {
        return;
    }


    const json =
        getJSON();


    const blob =
        new Blob(
            [json],
            {
                type: "application/json"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    a.href = url;
    a.download = "pairs.json";


    document.body.appendChild(a);

    a.click();

    a.remove();


    URL.revokeObjectURL(url);
}


/*
 * Copy JSON to clipboard
 */
async function copyJSON() {

    if (working.length === 0) {
        return;
    }


    const json =
        getJSON();


    const copyBtn =
        document.getElementById("copyBtn");


    try {

        await navigator.clipboard.writeText(json);


        const oldText =
            copyBtn.textContent;


        copyBtn.textContent =
            "✓ Copied!";


        setTimeout(() => {

            copyBtn.textContent =
                oldText;

        }, 1500);


    } catch (error) {

        /*
         * Fallback for browsers where
         * navigator.clipboard is unavailable.
         */
        const textarea =
            document.createElement("textarea");

        textarea.value = json;

        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";

        document.body.appendChild(textarea);

        textarea.select();

        try {

            document.execCommand("copy");

            copyBtn.textContent =
                "✓ Copied!";

            setTimeout(() => {

                copyBtn.textContent =
                    "Copy JSON";

            }, 1500);

        } catch (e) {

            alert(
                "❌ Could not copy JSON."
            );

        }

        textarea.remove();
    }

}

</script>

</body>
</html>
