<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Code Mon DS</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        padding: 20px;
    }
    .box {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        margin-bottom: 20px;
    }
    button {
        padding: 10px 20px;
        margin-top: 10px;
        border: none;
        background: #007bff;
        color: white;
        border-radius: 5px;
        cursor: pointer;
    }
    pre {
        background: #222;
        color: #0f0;
        padding: 10px;
        border-radius: 5px;
        overflow-x: auto;
    }
</style>
</head>
<body>

<h2>Code Mon DS</h2>
<p>Select your Data Storage type:</p>

<button onclick="openSimple()">Simple DS</button>
<button onclick="openProtected()">Protected DS</button>

<div id="output"></div>

<script>
const API = "https://code-mon.codemon.workers.dev";
const username = localStorage.getItem("code-mon-username");
const password = localStorage.getItem("code-mon-pass");

if (!username || !password) {
    document.body.innerHTML = "<h2>Please login first.</h2>";
}

// =================================================================
// SIMPLE DS
// =================================================================

function openSimple() {
    const key = `DSK-${Math.random().toString(36).slice(2, 10)}`;

    document.getElementById("output").innerHTML = `
        <div class="box">
            <h3>Simple DS Space</h3>

            <p><b>Your Username:</b> ${username}</p>
            <p><b>Your DS Key:</b> ${key}</p>

            <h4>API Base:</h4>
            <pre>${API}/api/pb-api</pre>

            <button onclick="loadSimpleKeys('${key}')">Load Stored Keys</button>
            <div id="keyList"></div>
        </div>
    `;
}

// ------------------------
// Load Simple DS Keys
// ------------------------
async function loadSimpleKeys(key) {
    const res = await fetch(`${API}/api/pb-api?username=${username}&method=LIST&key=${key}`);
    const data = await res.json();

    if (!data.success || !data.items) {
        document.getElementById("keyList").innerHTML = "<p>No data found.</p>";
        return;
    }

    let html = `<h4>Stored Keys:</h4>`;

    data.items.forEach(item => {
        html += `
            <div style="
                width:100%;
                height:30px;
                border:1px solid #ccc;
                margin-bottom:8px;
                padding:5px;
                border-radius:6px;
                display:flex;
                justify-content:space-between;
            ">
                <span><b>${item.name}</b></span>
                <span style="
                    max-width:60%;
                    overflow-x:auto;
                    white-space:nowrap;
                ">${item.value}</span>
            </div>
        `;
    });

    document.getElementById("keyList").innerHTML = html;
}



// =================================================================
// PROTECTED DS
// =================================================================

function openProtected() {

    document.getElementById("output").innerHTML = `
        <div class="box">
            <h3>Protected DS Space</h3>

            <p><b>Your Username:</b> ${username}</p>
            <p><b>Your Password:</b> ${password}</p>

            <h4>Save Data API:</h4>
            <pre>${API}/api/pro-api-deploy?username=${username}&text=website&value=HelloWorld</pre>

            <h4>Validate Key API:</h4>
            <pre>${API}/api/pro-api?username=${username}&key=website&value=HelloWorld</pre>

            <button onclick="loadProtectedKeys()">Load Protected Keys</button>
            <div id="protectedList"></div>
        </div>
    `;
}


// --------------------------------------------------------
// Load Protected DS Keys using pb-api-pro internally
// --------------------------------------------------------
async function loadProtectedKeys() {
    const res = await fetch(`${API}/api/pb-api-pro?username=${username}&pass=${password}`);
    const data = await res.json();

    if (!data.success || !data.data) {
        document.getElementById("protectedList").innerHTML = "<p>No protected data.</p>";
        return;
    }

    let html = `<h4>Protected Stored Keys:</h4>`;

    Object.entries(data.data).forEach(([key, value]) => {

        html += `
            <div style="
                width:100%;
                height:30px;
                border:1px solid #ccc;
                margin-bottom:8px;
                padding:5px;
                border-radius:6px;
                display:flex;
                justify-content:space-between;
            ">
                <span><b>${key}</b></span>
                <span style="
                    max-width:60%;
                    overflow-x:auto;
                    white-space:nowrap;
                ">${value}</span>
            </div>
        `;
    });

    document.getElementById("protectedList").innerHTML = html;
        }
</script>

</body>
</html>
