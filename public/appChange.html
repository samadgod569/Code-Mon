<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Code-Mon APP Editor</title>
<style>
:root {
  --bg: linear-gradient(135deg, #f4f7ff 0%, #f0f4ff 100%);
  --panel: rgba(255, 255, 255, 0.95);
  --border: rgba(226, 232, 255, 0.6);
  --text: #1f2937;
  --muted: #6b7280;
  --primary: #6366f1;
  --primary-hover: #4f46e5;
  --success: #10b981;
  --success-hover: #059669;
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
  --shadow-hover: 0 20px 60px rgba(0, 0, 0, 0.08);
}

* {
  box-sizing: border-box;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  padding: 32px 24px;
  min-height: 100vh;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 280px;
  background: linear-gradient(135deg, rgba(99, 102, 241, 0.08) 0%, rgba(236, 239, 255, 0.4) 100%);
  z-index: -1;
}

/* HEADINGS */
h2 {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 8px;
  letter-spacing: -0.01em;
  background: linear-gradient(135deg, #1f2937 0%, #374151 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

h3 {
  font-size: 14px;
  font-weight: 600;
  margin-top: 26px;
  margin-bottom: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* INFO BAR */
#info {
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 28px;
  padding: 12px 0;
  border-bottom: 1px solid rgba(226, 232, 255, 0.5);
}

/* MAIN PANEL */
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 30px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.panel:hover {
  box-shadow: var(--shadow-hover);
  transform: translateY(-2px);
}

/* TEXTAREA EDITOR */
textarea {
  width: 100%;
  min-height: 380px;
  border-radius: 16px;
  border: 2px solid var(--border);
  padding: 20px;
  font-size: 15px;
  line-height: 1.7;
  background: rgba(248, 250, 252, 0.8);
  color: var(--text);
  resize: vertical;
  outline: none;
  transition: all 0.25s ease;
  font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
}

textarea:hover {
  border-color: rgba(99, 102, 241, 0.4);
  background: rgba(255, 255, 255, 0.9);
}

textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
  background: white;
  transform: translateY(-1px);
}

/* INPUT */
input {
  width: 100%;
  padding: 16px 20px;
  border-radius: 14px;
  border: 2px solid var(--border);
  background: rgba(255, 255, 255, 0.9);
  font-size: 15px;
  color: var(--text);
  outline: none;
  transition: all 0.25s ease;
  font-feature-settings: "kern" 1;
}

input:hover {
  border-color: rgba(99, 102, 241, 0.4);
  background: white;
}

input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
  background: white;
  transform: translateY(-1px);
}

/* BUTTON CONTAINER */
.buttons {
  display: flex;
  gap: 16px;
  margin-top: 28px;
  flex-wrap: wrap;
}

/* BUTTONS */
button {
  padding: 14px 24px;
  border-radius: 14px;
  border: none;
  background: var(--primary);
  color: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
  position: relative;
  overflow: hidden;
}

button::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 100%;
  background: linear-gradient(rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0));
  opacity: 0;
  transition: opacity 0.25s ease;
}

button:hover {
  background: var(--primary-hover);
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
}

button:hover::after {
  opacity: 1;
}

button:active {
  transform: translateY(-1px) scale(0.98);
}

/* SAVE BUTTON */
#saveBtn {
  background: linear-gradient(135deg, var(--success) 0%, #0d9488 100%);
  box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
}

#saveBtn:hover {
  background: linear-gradient(135deg, var(--success-hover) 0%, #0f766e 100%);
  box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
}

/* ADD SOME MODERN DETAILS */
.panel::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  width: 120px;
  height: 120px;
  background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.1) 0%, transparent 70%);
  border-radius: 0 20px 0 0;
  pointer-events: none;
}

/* SCROLLBAR STYLING */
textarea::-webkit-scrollbar {
  width: 10px;
}

textarea::-webkit-scrollbar-track {
  background: rgba(241, 245, 249, 0.8);
  border-radius: 0 16px 16px 0;
}

textarea::-webkit-scrollbar-thumb {
  background: rgba(203, 213, 225, 0.8);
  border-radius: 10px;
  border: 3px solid rgba(241, 245, 249, 0.8);
}

textarea::-webkit-scrollbar-thumb:hover {
  background: rgba(148, 163, 184, 0.8);
}

/* FOCUS RINGS */
*:focus {
  outline: 2px solid transparent;
}

/* MOBILE RESPONSIVE */
@media (max-width: 720px) {
  body {
    padding: 20px 16px;
  }
  
  .panel {
    padding: 24px 20px;
    border-radius: 18px;
  }
  
  textarea {
    min-height: 300px;
    padding: 18px;
    border-radius: 14px;
  }
  
  h2 {
    font-size: 24px;
  }
  
  button {
    padding: 16px 20px;
    flex: 1;
    min-width: 140px;
  }
  
  .buttons {
    gap: 12px;
  }
}

/* DARK MODE SUPPORT (OPTIONAL) */
@media (prefers-color-scheme: dark) {
  :root {
    --bg: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    --panel: rgba(30, 41, 59, 0.95);
    --border: rgba(51, 65, 85, 0.6);
    --text: #f1f5f9;
    --muted: #94a3b8;
  }
  
  body::before {
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(30, 41, 59, 0.6) 100%);
  }
  
  textarea, input {
    background: rgba(15, 23, 42, 0.8);
    border-color: rgba(51, 65, 85, 0.8);
  }
  
  textarea:hover, input:hover {
    background: rgba(15, 23, 42, 0.9);
  }
  
  textarea:focus, input:focus {
    background: rgba(15, 23, 42, 1);
  }
  }

</style>
</head>
<body>

<h2>Code-Mon App Editor</h2>

<div id="info"></div>

<h3>File Content</h3>
<textarea id="editor"></textarea>

<h3>Tell Code Mon AI what to update</h3>
<input id="prompt" placeholder="Example: add dark mode button and animation">

<button onclick="updateWithAI()">Update with AI</button>
<button id="saveBtn" onclick="saveFile()">Save</button>

<script>
const API="https://code-mon.codemon.workers.dev/api";

const user = localStorage.getItem("code-mon-username");
const pass = localStorage.getItem("code-mon-pass");

if(!user||!pass){
 location.href="login.html";
}

let currentFile="";

// ----------------------
// LOAD MANIFEST
// ----------------------
(async()=>{
 const res=await fetch(API+"/builder?username="+user);
 const raw=await res.text();

 const p=raw.split("*");

 let manifest={};
 try{
  const match=p[1].match(/"({[\s\S]*})"/);
  const unescaped=JSON.parse(`"${match[1]}"`);
  manifest=JSON.parse(unescaped);
 }catch(e){console.error(e)}

 const start=manifest.start_url||"";
 const fname=start.split("filename=")[1]||start.split("/").pop();
 currentFile=fname.replace(/&.*/,"");

 document.getElementById("info").innerHTML=
 "User: "+user+"<br>File: "+currentFile;

 loadFile();
})();

// ----------------------
// LOAD FILE CONTENT
// ----------------------
async function loadFile(){
 const r=await fetch(`${API}/load?user=${user}&filename=${currentFile}`);
 const t=await r.text();
 document.getElementById("editor").value=t;
}

// ----------------------
// AI UPDATE
// ----------------------
async function updateWithAI(){
 const oldCode=document.getElementById("editor").value;
 const q=document.getElementById("prompt").value;

 if(!q){alert("Type update instruction");return;}

 const prompt=`

Return ONLY raw file content.

Previous code:
${oldCode}

User wants:
${q}
`;

 let output="";

 while(!output){
  const res=await fetch(`${API}/code-mon-ai?question=${encodeURIComponent(prompt)}`);
  const data=await res.json();
  output=(data.answer||"")
   .replace(/```[\s\S]*?```/g,"")
   .replace(/```/g,"")
   .trim();
 }

 document.getElementById("editor").value=output;
}

// ----------------------
// SAVE FILE
// ----------------------
async function saveFile(){
 const res=await fetch(`${API}/save`,{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   user,
   pass,
   filename:currentFile,
   content:document.getElementById("editor").value
  })
 });

 const d=await res.json();
 alert(d.message||"Saved");
}
</script>

</body>
</html>
