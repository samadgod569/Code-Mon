<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Code-Mon Editor</title>
<style>
body{
 background:#050812;
 color:#00eaff;
 font-family:monospace;
 padding:20px;
}
textarea,input{
 width:100%;
 background:#0d1326;
 color:#00f7ff;
 border:1px solid #00eaff55;
 border-radius:10px;
 padding:12px;
 font-size:14px;
 margin-top:10px;
}
button{
 padding:12px 22px;
 margin-top:12px;
 border:none;
 border-radius:10px;
 background:#00eaff;
 color:#001219;
 font-weight:bold;
 cursor:pointer;
 box-shadow:0 0 15px #00eaffaa;
}
button:hover{background:#00b8d4}
#saveBtn{background:#00ff6a;color:#00240f}
</style>
</head>
<body>

<h2>Code-Mon App Editor</h2>

<div id="info"></div>

<h3>File Content</h3>
<textarea id="editor"></textarea>

<h3>Tell AI what to update</h3>
<input id="prompt" placeholder="Example: add dark mode button and animation">

<button onclick="updateWithAI()">Update with AI</button>
<button id="saveBtn" onclick="saveFile()">Save</button>

<script>
const API="https://code-mon.codemon.workers.dev/api";

const user = localStorage.getItem("code-mon-username");
const pass = localStorage.getItem("code-mon-pass");

if(!user||!pass){
 location.href="login.html";
}

let currentFile="";

// ----------------------
// LOAD MANIFEST
// ----------------------
(async()=>{
 const res=await fetch(API+"/builder?username="+user);
 const raw=await res.text();

 const p=raw.split("*");

 let manifest={};
 try{
  const match=p[1].match(/"({[\s\S]*})"/);
  const unescaped=JSON.parse(`"${match[1]}"`);
  manifest=JSON.parse(unescaped);
 }catch(e){console.error(e)}

 const start=manifest.start_url||"";
 const fname=start.split("filename=")[1]||start.split("/").pop();
 currentFile=fname.replace(/&.*/,"");

 document.getElementById("info").innerHTML=
 "User: "+user+"<br>File: "+currentFile;

 loadFile();
})();

// ----------------------
// LOAD FILE CONTENT
// ----------------------
async function loadFile(){
 const r=await fetch(`${API}/load?user=${user}&filename=${currentFile}`);
 const t=await r.text();
 document.getElementById("editor").value=t;
}

// ----------------------
// AI UPDATE
// ----------------------
async function updateWithAI(){
 const oldCode=document.getElementById("editor").value;
 const q=document.getElementById("prompt").value;

 if(!q){alert("Type update instruction");return;}

 const prompt=`
Return ONLY raw file content.

Previous code:
${oldCode}

User wants:
${q}
`;

 let output="";

 while(!output){
  const res=await fetch(`${API}/code-mon-ai?question=${encodeURIComponent(prompt)}`);
  const data=await res.json();
  output=(data.answer||"")
   .replace(/```[\s\S]*?```/g,"")
   .replace(/```/g,"")
   .trim();
 }

 document.getElementById("editor").value=output;
}

// ----------------------
// SAVE FILE
// ----------------------
async function saveFile(){
 const res=await fetch(`${API}/save`,{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   user,
   pass,
   filename:currentFile,
   content:document.getElementById("editor").value
  })
 });

 const d=await res.json();
 alert(d.message||"Saved");
}
</script>

</body>
</html>
