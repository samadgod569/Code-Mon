<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Code-Mon Editor</title>
<style>
:root{
  --bg:#f4f6fb;
  --panel:#ffffff;
  --border:#e3e6ef;
  --text:#1f2933;
  --muted:#6b7280;
  --primary:#6366f1;
  --primary-hover:#4f46e5;
  --success:#22c55e;
  --success-hover:#16a34a;
}

*{
  box-sizing:border-box;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  padding:24px;
}

/* HEADINGS */
h2{
  font-size:26px;
  font-weight:600;
  margin-bottom:6px;
}

h3{
  font-size:16px;
  font-weight:500;
  margin-top:22px;
  margin-bottom:8px;
  color:var(--muted);
}

/* INFO BAR */
#info{
  font-size:14px;
  color:var(--muted);
  margin-bottom:20px;
}

/* MAIN PANEL */
.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:22px;
  box-shadow:0 6px 20px rgba(0,0,0,.04);
}

/* TEXTAREA EDITOR */
textarea{
  width:100%;
  min-height:360px;
  border-radius:12px;
  border:1px solid var(--border);
  padding:14px;
  font-size:14px;
  line-height:1.6;
  background:#fafbff;
  color:#111827;
  resize:vertical;
  outline:none;
  transition:.15s;
}

textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(99,102,241,.15);
  background:white;
}

/* INPUT */
input{
  width:100%;
  padding:12px 14px;
  border-radius:10px;
  border:1px solid var(--border);
  background:white;
  font-size:14px;
  color:var(--text);
  outline:none;
  transition:.15s;
}

input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(99,102,241,.15);
}

/* BUTTON CONTAINER */
.buttons{
  display:flex;
  gap:12px;
  margin-top:18px;
  flex-wrap:wrap;
}

/* BUTTONS */
button{
  padding:12px 18px;
  border-radius:10px;
  border:none;
  background:var(--primary);
  color:white;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  transition:.15s;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

button:hover{
  background:var(--primary-hover);
  transform:translateY(-1px);
}

/* SAVE BUTTON */
#saveBtn{
  background:var(--success);
}

#saveBtn:hover{
  background:var(--success-hover);
}

/* MOBILE */
@media(max-width:720px){
  body{padding:16px}
  textarea{min-height:260px}
  h2{font-size:22px}
 }
</style>
</head>
<body>

<h2>Code-Mon App Editor</h2>

<div id="info"></div>

<h3>File Content</h3>
<textarea id="editor"></textarea>

<h3>Tell Code Mon AI what to update</h3>
<input id="prompt" placeholder="Example: add dark mode button and animation">

<button onclick="updateWithAI()">Update with AI</button>
<button id="saveBtn" onclick="saveFile()">Save</button>

<script>
const API="https://code-mon.codemon.workers.dev/api";

const user = localStorage.getItem("code-mon-username");
const pass = localStorage.getItem("code-mon-pass");

if(!user||!pass){
 location.href="login.html";
}

let currentFile="";

// ----------------------
// LOAD MANIFEST
// ----------------------
(async()=>{
 const res=await fetch(API+"/builder?username="+user);
 const raw=await res.text();

 const p=raw.split("*");

 let manifest={};
 try{
  const match=p[1].match(/"({[\s\S]*})"/);
  const unescaped=JSON.parse(`"${match[1]}"`);
  manifest=JSON.parse(unescaped);
 }catch(e){console.error(e)}

 const start=manifest.start_url||"";
 const fname=start.split("filename=")[1]||start.split("/").pop();
 currentFile=fname.replace(/&.*/,"");

 document.getElementById("info").innerHTML=
 "User: "+user+"<br>File: "+currentFile;

 loadFile();
})();

// ----------------------
// LOAD FILE CONTENT
// ----------------------
async function loadFile(){
 const r=await fetch(`${API}/load?user=${user}&filename=${currentFile}`);
 const t=await r.text();
 document.getElementById("editor").value=t;
}

// ----------------------
// AI UPDATE
// ----------------------
async function updateWithAI(){
 const oldCode=document.getElementById("editor").value;
 const q=document.getElementById("prompt").value;

 if(!q){alert("Type update instruction");return;}

 const prompt=`

Return ONLY raw file content.

Previous code:
${oldCode}

User wants:
${q}
`;

 let output="";

 while(!output){
  const res=await fetch(`${API}/code-mon-ai?question=${encodeURIComponent(prompt)}`);
  const data=await res.json();
  output=(data.answer||"")
   .replace(/```[\s\S]*?```/g,"")
   .replace(/```/g,"")
   .trim();
 }

 document.getElementById("editor").value=output;
}

// ----------------------
// SAVE FILE
// ----------------------
async function saveFile(){
 const res=await fetch(`${API}/save`,{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   user,
   pass,
   filename:currentFile,
   content:document.getElementById("editor").value
  })
 });

 const d=await res.json();
 alert(d.message||"Saved");
}
</script>

</body>
</html>
