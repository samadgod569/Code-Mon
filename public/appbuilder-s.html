<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Manifest Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="img/icon.png">
<style>
:root {
  --bg: #0b0d13;
  --card: rgba(255,255,255,0.08);
  --card-border: rgba(255,255,255,0.12);
  --text: #ffffff;
  --muted: #aab0c0;
  --accent: #6c63ff;
  --accent-glow: rgba(108,99,255,0.45);
  --danger: #ff5f5f;
  --radius: 16px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(800px 400px at top, #15172a 0%, transparent 60%),
    var(--bg);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
}

/* ===== CARD ===== */
.box {
  width: 100%;
  max-width: 440px;
  padding: 24px;
  background: linear-gradient(
    180deg,
    rgba(255,255,255,0.10),
    rgba(255,255,255,0.03)
  );
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  backdrop-filter: blur(14px);
  box-shadow:
    0 20px 50px rgba(0,0,0,0.45),
    inset 0 1px 0 rgba(255,255,255,0.08);
  animation: fadeIn 0.6s ease;
}

/* ===== TITLE ===== */
.box h3 {
  margin: 0 0 14px;
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: 0.4px;
}

/* ===== INPUTS ===== */
input,
textarea {
  width: 100%;
  margin-top: 12px;
  padding: 13px 14px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(255,255,255,0.06);
  color: var(--text);
  font-size: 0.95rem;
  outline: none;
  transition: all 0.2s ease;
}

input::placeholder,
textarea::placeholder {
  color: var(--muted);
}

input:focus,
textarea:focus {
  border-color: var(--accent);
  background: rgba(255,255,255,0.09);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

/* Disable resize but keep nice height */
textarea {
  resize: none;
  min-height: 80px;
}

/* ===== COLOR PICKERS ===== */
input[type="color"] {
  padding: 6px;
  height: 46px;
  cursor: pointer;
}

/* ===== BUTTON ===== */
button {
  margin-top: 18px;
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(
    135deg,
    #7b74ff,
    #5f56ff
  );
  color: white;
  font-size: 0.95rem;
  font-weight: 700;
  letter-spacing: 0.6px;
  cursor: pointer;
  transition: all 0.25s ease;
  box-shadow:
    0 10px 28px rgba(108,99,255,0.45);
}

button:hover {
  transform: translateY(-1px);
  box-shadow:
    0 16px 38px rgba(108,99,255,0.6);
}

button:active {
  transform: translateY(0);
}

button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
  box-shadow: none;
}

/* ===== STATUS TEXT ===== */
#status {
  margin-top: 12px;
  font-size: 0.85rem;
  color: var(--muted);
  min-height: 1em;
}

/* ===== ANIMATION ===== */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(10px) scale(0.98);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* ===== MOBILE ===== */
@media (max-width: 420px) {
  .box {
    margin: 14px;
    padding: 20px;
  }
}
</style>
</head>

<body>

<div class="box">
<p id="status" style="margin-top:10px;font-size:14px;opacity:.85;"></p>
  <h3>DESIGN APP</h3>

  
  <input id="name" placeholder="App Name">
  <input id="short" placeholder="Short Name">
  <input id="icon" placeholder="Icon file (icon.png)">
  <input id="start" placeholder="Start URL (index.html)">
  <textarea id="desc" placeholder="App Description"></textarea>
  <input id="bg" type="color" value="#ffffff">
  <input id="theme" type="color" value="#000000">

  <button id="build" type="button">SAVE MANIFEST</button>
</div>

<script>
      (async function() {
    const API = "https://code-mon.codemon.workers.dev";

    const username = localStorage.getItem("code-mon-username");
    const password = localStorage.getItem("code-mon-pass");

    //  No credentials → go to login
    if (!username || !password) {
        localStorage.clear();
        location.href = "login.html";
        return;
    }

    try {
        const res = await fetch(`${API}/api/pass?username=${username}&pass=${password}`);
        const data = await res.json();

        //  Wrong password / user not found
        if (!data.success) {
            localStorage.removeItem("code-mon-username");
            localStorage.removeItem("code-mon-pass");
            localStorage.removeItem("user");

            location.href = "login.html";
            return;
        }

        //  Auth success → continue loading file.html normally
        console.log("User authenticated:", username);

    } catch (err) {
        // Network failure = prevent access
        localStorage.clear();
        location.href = "login.html";
    }
})();
/* ===== CONFIG ===== */
const username = localStorage.getItem("code-mon-username");
const pass = localStorage.getItem("code-mon-pass");

const statusEl = document.getElementById("status");
const btn = document.getElementById("build");

function setStatus(msg) {
  statusEl.textContent = msg;
}

/* ===== MAIN FLOW ===== */
async function buildManifest() {
  
  const name  = document.getElementById("name").value.trim();
  const short = document.getElementById("short").value.trim();
  const icont  = document.getElementById("icon").value.trim();
  const start = document.getElementById("start").value.trim();
  const desc  = document.getElementById("desc").value.trim();
  const bg    = document.getElementById("bg").value;
  const theme = document.getElementById("theme").value;
const icon = `@me?user=${username}&filename=${icont}`;
  if (!name || !short || !icont || !start || !desc) {
    alert("Fill all fields");
    return;
  }

  btn.disabled = true;

  const manifestObj = {
    name,
    short_name: short,
    start_url: start,
    display: "standalone",
    background_color: bg,
    theme_color: theme,
    icons: [
      { src: icon, sizes: "192x192", type: "image/png" },
      { src: icon, sizes: "512x512", type: "image/png" }
    ]
  };

  const manifestValue = JSON.stringify(manifestObj, null, 2);
  const filename = `manifest.json`;

  try {
    /* 1️⃣ ENGINE */
    setStatus(" Registering app...");
    await fetch("https://code-mon-space.codemon.workers.dev/api/engine", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: desc,
        manifest: manifestValue,
        username,
        pass
      })
    });
const user = username;

    /* 2️⃣ SAVE */
    setStatus(" Saving manifest...");
    await fetch("https://code-mon.codemon.workers.dev/api/save", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        user,
        pass,
        filename,
        content: manifestValue
      })
    });

    /* 3️⃣ DEPLOY */
    setStatus(" Deploying...");
    await fetch("https://code-mon.codemon.workers.dev/api/deploy", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        user
      })
    });

    setStatus("Deployed successfully!");
    window.location.href= "appbuilder-t";

  } catch (err) {
    console.error(err);
    setStatus("❌ Failed");
    alert("Something went wrong");
  }

  btn.disabled = false;
}

document.getElementById("build").addEventListener("click", buildManifest);
</script>

</body>
</html>
