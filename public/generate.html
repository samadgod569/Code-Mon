<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Code-Mon Generator</title>
    <style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, #0a0f24, #111a3a);
        color: #e0e6ff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        width: 90%;
        max-width: 500px;
        padding: 30px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 20px;
        backdrop-filter: blur(15px);
        box-shadow: 0 0 25px rgba(0, 255, 255, 0.2);
        text-align: center;
        border: 1px solid rgba(0, 255, 255, 0.1);
        animation: fadeIn 0.8s ease-out;
    }

    h1 {
        font-size: 30px;
        margin-bottom: 10px;
        color: #00eaff;
        text-shadow: 0 0 10px rgba(0, 255, 255, 0.7);
    }

    p {
        font-size: 17px;
        margin-bottom: 20px;
        opacity: 0.9;
    }

    button {
        padding: 14px 26px;
        font-size: 16px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        background: #00eaff;
        color: #00131a;
        font-weight: bold;
        letter-spacing: 1px;
        box-shadow: 0 0 15px #00eaff;
        transition: 0.2s;
    }

    button:hover {
        background: #00bcd4;
        box-shadow: 0 0 25px #00eaff;
        transform: scale(1.05);
    }

    /* Fade-in animation */
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(15px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    </style>
</head>
<body>

<h2>Generating code…</h2>

<h3>Output</h3>
<textarea id="output"></textarea>

<br><br>
<button onclick="preview()">Preview</button>

<button id="deployBtn">Deploy</button>

<script>
// Read text from URL
const params = new URLSearchParams(window.location.search);
const userQuery = params.get("text") || "";

// AUTO-GENERATE on page load
window.onload = () => {
    if (!userQuery) {
        document.getElementById("output").value = "⚠ No ?text= provided.";
        return;
    }
    generate(userQuery);
}

async function generate(q) {
    // EXACT prompt from Node.js bot (unchanged)
    const prompt = `
Return ONLY raw HTML code.
Do NOT include \`\`\`, html\`\`\`, js\`\`\`, css\`\`\`, or any wrappers.
ONLY return the pure file content:
also if you are asked to give java script or css or json code or text file then only give.

For HTML requests:
You are Code Mon.
Output only raw HTML code.
The HTML must include inline CSS and inline JavaScript in the same file.
Do not place CSS or JavaScript in external files.
Do not use code blocks.
Do not include backticks.
Do not include comments.
Do not include explanations.
Do not escape newlines.
Output only the full HTML file exactly as it should appear.

For JS requests:
You are Code Mon.
Output only raw JavaScript code.
Do not use code blocks.
Do not include backticks.
Do not include comments.
Do not include explanations.
Do not escape newlines.
Output only the code.

For CSS requests:
You are Code Mon.
Output only raw CSS code.
Do not use code blocks.
Do not include backticks.
Do not include comments.
Do not include explanations.
Do not escape newlines.
Output only the code.

For JSON requests:
You are Code Mon.
Output only raw JSON.
Do not use code blocks.
Do not include backticks.
Do not include comments.
Do not include explanations.
Do not escape newlines.
Output only valid JSON.

For TXT requests:
You are Code Mon.
Output only raw text.
Do not use code blocks.
Do not include backticks.
Do not include comments.
Do not include explanations.
Do not escape newlines.
Output only the plain text.
${q}
`;

    let res = await fetch(`https://ai.craftersmc-navigators.xyz/query?q=${encodeURIComponent(prompt)}`);
    let data = await res.json();

    let output = data.answer || "";

    // CLEANING — same as Node.js
    output = output
        .replace(/```[\s\S]*?```/g, "")
        .replace(/```/g, "")
        .replace(/^html|^css|^js|^javascript/gi, "")
        .replace(/\r/g, "")
        .trim();

    document.getElementById("output").value = output;

    localStorage.setItem("codeMonGenerated", output);
}

function preview() {
    window.location.href = "preview.html";
}
</script>

</body>
</html>
