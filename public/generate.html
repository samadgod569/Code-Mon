<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Code-Mon AI</title>
    <link rel="icon" type="image/png" href="img/icon.png">
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0a0e17;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 900px;
        background: #13171f;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        border: 1px solid #1f2937;
        display: flex;
        flex-direction: column;
        height: 85vh;
        max-height: 700px;
    }

    .header {
        background: #1a1f2e;
        padding: 20px 30px;
        border-bottom: 1px solid #2d3748;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .header h1 {
        font-size: 20px;
        font-weight: 600;
        color: #e2e8f0;
        letter-spacing: 0.5px;
    }

    .user-info {
        font-size: 14px;
        color: #94a3b8;
    }

    .chat-area {
        flex: 1;
        overflow-y: auto;
        padding: 25px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        background: #0f1419;
    }

    .chat-area::-webkit-scrollbar {
        width: 6px;
    }

    .chat-area::-webkit-scrollbar-track {
        background: transparent;
    }

    .chat-area::-webkit-scrollbar-thumb {
        background: #2d3748;
        border-radius: 3px;
    }

    .message {
        display: flex;
        gap: 12px;
        animation: slideIn 0.2s ease-out;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(5px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .message.user {
        flex-direction: row-reverse;
    }

    .avatar {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        flex-shrink: 0;
        font-size: 14px;
        text-transform: uppercase;
    }

    .message.user .avatar {
        background: #3b82f6;
        color: #fff;
    }

    .message.ai .avatar {
        background: #1f2937;
        color: #60a5fa;
        border: 1px solid #374151;
    }

    .bubble {
        max-width: 70%;
        padding: 12px 16px;
        border-radius: 10px;
        line-height: 1.5;
        word-wrap: break-word;
        font-size: 14px;
    }

    .message.user .bubble {
        background: #3b82f6;
        color: #fff;
    }

    .message.ai .bubble {
        background: #1a1f2e;
        color: #e2e8f0;
        border: 1px solid #2d3748;
    }

    .code-output {
        background: #0d1117;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 16px;
        margin-top: 12px;
        font-family: 'Courier New', monospace;
        font-size: 13px;
        color: #c9d1d9;
        max-height: 300px;
        overflow-y: auto;
        white-space: pre-wrap;
        word-wrap: break-word;
    }

    .action-buttons {
        display: flex;
        gap: 10px;
        margin-top: 12px;
    }

    .action-btn {
        padding: 8px 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
        font-size: 13px;
        transition: all 0.15s;
    }

    .preview-btn {
        background: #2d3748;
        color: #e2e8f0;
        border: 1px solid #4a5568;
    }

    .preview-btn:hover {
        background: #374151;
    }

    .deploy-btn {
        background: #3b82f6;
        color: #fff;
    }

    .deploy-btn:hover {
        background: #2563eb;
    }

    .input-area {
        padding: 20px 25px;
        background: #1a1f2e;
        border-top: 1px solid #2d3748;
        display: flex;
        gap: 12px;
        align-items: center;
    }

    #userInput {
        flex: 1;
        padding: 12px 16px;
        border: 1px solid #2d3748;
        border-radius: 8px;
        background: #0f1419;
        color: #e2e8f0;
        font-size: 14px;
        outline: none;
        transition: all 0.15s;
    }

    #userInput:focus {
        border-color: #3b82f6;
        background: #13171f;
    }

    #sendBtn {
        padding: 12px 24px;
        background: #3b82f6;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.15s;
    }

    #sendBtn:hover {
        background: #2563eb;
    }

    #sendBtn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .typing-indicator {
        display: flex;
        gap: 4px;
        padding: 8px;
    }

    .typing-indicator span {
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: typing 1.4s infinite;
    }

    .typing-indicator span:nth-child(2) {
        animation-delay: 0.2s;
    }

    .typing-indicator span:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes typing {
        0%, 60%, 100% {
            transform: translateY(0);
            opacity: 0.4;
        }
        30% {
            transform: translateY(-6px);
            opacity: 1;
        }
    }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Code-Mon AI</h1>
        <div class="user-info" id="userInfo"></div>
    </div>
    
    <div class="chat-area" id="chatArea">
        <div class="message ai">
            <div class="avatar">AI</div>
            <div class="bubble">
                Hey! I'm Code-Mon AI. Tell me what you want to build and I'll generate the code for you.
            </div>
        </div>
    </div>
    
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Describe what you want to create..." />
        <button id="sendBtn">Send</button>
    </div>
</div>

<script>
(async function() {
    const API = "https://code-mon.codemon.workers.dev";
    const username = localStorage.getItem("code-mon-username");
    const password = localStorage.getItem("code-mon-pass");

    if (!username || !password) {
        localStorage.clear();
        location.href = "login.html";
        return;
    }

    document.getElementById("userInfo").textContent = username;

    try {
        const res = await fetch(`${API}/api/pass?username=${username}&pass=${password}`);
        const data = await res.json();

        if (!data.success) {
            localStorage.removeItem("code-mon-username");
            localStorage.removeItem("code-mon-pass");
            localStorage.removeItem("user");
            location.href = "login.html";
            return;
        }

        console.log("User authenticated:", username);
    } catch (err) {
        localStorage.clear();
        location.href = "login.html";
    }
})();

const chatArea = document.getElementById("chatArea");
const userInput = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const username = localStorage.getItem("code-mon-username");

let generatedCode = "";

function addMessage(text, isUser = false) {
    const msgDiv = document.createElement("div");
    msgDiv.className = `message ${isUser ? 'user' : 'ai'}`;
    
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = isUser ? username.substring(0, 2) : "AI";
    
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    
    msgDiv.appendChild(avatar);
    msgDiv.appendChild(bubble);
    chatArea.appendChild(msgDiv);
    chatArea.scrollTop = chatArea.scrollHeight;
    
    return bubble;
}

function addCodeMessage(code) {
    const msgDiv = document.createElement("div");
    msgDiv.className = "message ai";
    
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = "AI";
    
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = `
        Code generated successfully
        <div class="code-output">${escapeHtml(code)}</div>
        <div class="action-buttons">
            <button class="action-btn preview-btn" onclick="preview()">Preview</button>
            <button class="action-btn deploy-btn" onclick="deploy()">Deploy</button>
        </div>
    `;
    
    msgDiv.appendChild(avatar);
    msgDiv.appendChild(bubble);
    chatArea.appendChild(msgDiv);
    chatArea.scrollTop = chatArea.scrollHeight;
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function showTyping() {
    const msgDiv = document.createElement("div");
    msgDiv.className = "message ai";
    msgDiv.id = "typingIndicator";
    
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = "AI";
    
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
    
    msgDiv.appendChild(avatar);
    msgDiv.appendChild(bubble);
    chatArea.appendChild(msgDiv);
    chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTyping() {
    const typing = document.getElementById("typingIndicator");
    if (typing) typing.remove();
}

async function generateCode(query) {
    const prompt = `
Return ONLY raw HTML code.
Do NOT include \`\`\`, html\`\`\`, js\`\`\`, css\`\`\`, or any wrappers.
ONLY return the pure file content:
also if you are asked to give java script or css or json code or text file then only give.

For HTML requests:
You are Code Mon.
Output only raw HTML code.
The HTML must include inline CSS and inline JavaScript in the same file.
Do not place CSS or JavaScript in external files.
Do not use code blocks.
Do not include backticks.
Do not include comments.
Do not include explanations.
Do not escape newlines.
Output only the full HTML file exactly as it should appear.

For JS requests:
You are Code Mon.
Output only raw JavaScript code.
Do not use code blocks.
Do not include backticks.
Do not include comments.
Do not include explanations.
Do not escape newlines.
Output only the code.

For CSS requests:
You are Code Mon.
Output only raw CSS code.
Do not use code blocks.
Do not include backticks.
Do not include comments.
Do not include explanations.
Do not escape newlines.
Output only the code.

For JSON requests:
You are Code Mon.
Output only raw JSON.
Do not use code blocks.
Do not include backticks.
Do not include comments.
Do not include explanations.
Do not escape newlines.
Output only valid JSON.

For TXT requests:
You are Code Mon.
Output only raw text.
Do not use code blocks.
Do not include backticks.
Do not include comments.
Do not include explanations.
Do not escape newlines.
Output only the plain text.
${query}
`;

    const res = await fetch(`https://code-mon.codemon.workers.dev/api/code-mon-ai?question=${encodeURIComponent(prompt)}`);
    let data = await res.json();

    let output = data.answer || "";

    output = output
        .replace(/```[\s\S]*?```/g, "")
        .replace(/```/g, "")
        .replace(/^html|^css|^js|^javascript\n/gi, "")
        .replace(/\r/g, "")
        .trim();

    return output;
}

async function handleSend() {
    const query = userInput.value.trim();
    if (!query) return;

    addMessage(query, true);
    userInput.value = "";
    sendBtn.disabled = true;

    showTyping();

    try {
        const code = await generateCode(query);
        removeTyping();
        
        generatedCode = code;
        localStorage.setItem("codeMonGenerated", code);
        
        addCodeMessage(code);
    } catch (err) {
        removeTyping();
        addMessage("Sorry, something went wrong. Please try again.");
    }

    sendBtn.disabled = false;
    userInput.focus();
}

sendBtn.addEventListener("click", handleSend);

userInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") handleSend();
});

function preview() {
    if (!generatedCode) {
        alert("No code generated yet!");
        return;
    }
    window.location.href = "preview.html";
}

async function deploy() {
    if (!generatedCode) {
        alert("No code generated yet!");
        return;
    }

    try {
        await navigator.clipboard.writeText(generatedCode);
        window.location.href = "file.html";
    } catch (err) {
        alert("Failed to copy code: " + err);
    }
}
</script>
</body>
</html>
