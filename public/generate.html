<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Code-Mon Generator</title>
    <link rel="icon" type="image/png" href="img/icon.png">
    <style>
    /* GLOBAL */
    body {
        margin: 0;
        padding: 40px;
        font-family: "Segoe UI", "Roboto Mono", monospace;
        background: radial-gradient(circle at top, #0b0f1e, #081124, #050812);
        color: #00eaff;
        min-height: 100vh;
    }

    h2, h3 {
        color: #00eaff;
        text-shadow: 0 0 12px #00eaffaa;
        margin-bottom: 10px;
        font-weight: 600;
        letter-spacing: 1px;
    }

    /* OUTPUT TEXTAREA */
    textarea {
        width: 100%;
        height: 350px;
        background: #0d1326;
        color: #00f7ff;
        border: 1px solid #00eaff55;
        border-radius: 12px;
        padding: 15px;
        font-size: 15px;
        resize: vertical;
        box-shadow: 0 0 20px #00eaff22;
        outline: none;
        font-family: "Roboto Mono", monospace;
        transition: 0.15s;
    }

    textarea:focus {
        border-color: #00eaff;
        box-shadow: 0 0 25px #00eaff55;
    }

    /* BUTTONS */
    button {
        padding: 12px 24px;
        font-size: 17px;
        margin-top: 20px;
        margin-right: 10px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        background: #00eaff;
        color: #001219;
        font-weight: bold;
        letter-spacing: 0.5px;
        transition: 0.2s;
        box-shadow: 0 0 15px #00eaffaa;
    }

    button:hover {
        background: #00b8d4;
        box-shadow: 0 0 25px #00eaff;
        transform: translateY(-2px);
    }

    /* GREEN DEPLOY BUTTON */
    #deployBtn {
        background: #00ff6a;
        box-shadow: 0 0 15px #00ff6a99;
        color: #00240f;
    }

    #deployBtn:hover {
        background: #00e05c;
        box-shadow: 0 0 25px #00ff6a;
    }

    /* LAYOUT CONTAINER */
    .wrapper {
        max-width: 800px;
        margin: auto;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 0 40px #00eaff22;
        border: 1px solid #00eaff33;
        backdrop-filter: blur(15px);
        animation: fadeIn 0.6s ease-out;
    }

    /* ANIMATIONS */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
    }
    </style>
</head>
<body>
<div class="wrapper">
<h2>Generating code…</h2>

<h3>Output</h3>
<textarea id="output"></textarea>

<br><br>
<button onclick="preview()">Preview</button>

<button id="deployBtn">Deploy</button>
</div>
<script>
    (async function() {
    const API = "https://code-mon.codemon.workers.dev";

    const username = localStorage.getItem("code-mon-username");
    const password = localStorage.getItem("code-mon-pass");

    //  No credentials → go to login
    if (!username || !password) {
        localStorage.clear();
        location.href = "login.html";
        return;
    }

    try {
        const res = await fetch(`${API}/api/pass?username=${username}&pass=${password}`);
        const data = await res.json();

        //  Wrong password / user not found
        if (!data.success) {
            localStorage.removeItem("code-mon-username");
            localStorage.removeItem("code-mon-pass");
            localStorage.removeItem("user");

            location.href = "login.html";
            return;
        }

        //  Auth success → continue loading file.html normally
        console.log("User authenticated:", username);

    } catch (err) {
        // Network failure = prevent access
        localStorage.clear();
        location.href = "login.html";
    }
})();
    // Existing generate() function stays the same

// ----------------------
// DEPLOY BUTTON FUNCTION
// ----------------------
const deployBtn = document.getElementById("deployBtn");
deployBtn.addEventListener("click", async () => {
    const code = document.getElementById("output").value;
    if (!code) {
        alert("No generated code to deploy!");
        return;
    }

    try {
        // Copy to clipboard
        await navigator.clipboard.writeText(code);
        

        // Redirect to file.html
        window.location.href = "file.html";
    } catch (err) {
        alert("Failed to copy code: " + err);
    }
});
// Read text from URL
const params = new URLSearchParams(window.location.search);
const userQuery = params.get("text") || "";

// AUTO-GENERATE on page load
window.onload = () => {
    if (!userQuery) {
        document.getElementById("output").value = "⚠ No ?text= provided.";
        return;
    }
    generate(userQuery);
}

async function generate(q) {
    // EXACT prompt from Node.js bot (unchanged)
    const prompt = `
Return ONLY raw HTML code.
Do NOT include \`\`\`, html\`\`\`, js\`\`\`, css\`\`\`, or any wrappers.
ONLY return the pure file content:
also if you are asked to give java script or css or json code or text file then only give.

For HTML requests:
You are Code Mon.
Output only raw HTML code.
The HTML must include inline CSS and inline JavaScript in the same file.
Do not place CSS or JavaScript in external files.
Do not use code blocks.
Do not include backticks.
Do not include comments.
Do not include explanations.
Do not escape newlines.
Output only the full HTML file exactly as it should appear.

For JS requests:
You are Code Mon.
Output only raw JavaScript code.
Do not use code blocks.
Do not include backticks.
Do not include comments.
Do not include explanations.
Do not escape newlines.
Output only the code.

For CSS requests:
You are Code Mon.
Output only raw CSS code.
Do not use code blocks.
Do not include backticks.
Do not include comments.
Do not include explanations.
Do not escape newlines.
Output only the code.

For JSON requests:
You are Code Mon.
Output only raw JSON.
Do not use code blocks.
Do not include backticks.
Do not include comments.
Do not include explanations.
Do not escape newlines.
Output only valid JSON.

For TXT requests:
You are Code Mon.
Output only raw text.
Do not use code blocks.
Do not include backticks.
Do not include comments.
Do not include explanations.
Do not escape newlines.
Output only the plain text.
${q}
`;

    const res = await fetch(`https://code-mon.codemon.workers.dev/api/code-mon-ai?question= ${encodeURIComponent(prompt)}`);
    let data = await res.json();

    let output = data.answer || "";

    // CLEANING — same as Node.js
    output = output
        .replace(/```[\s\S]*?```/g, "")
        .replace(/```/g, "")
        .replace(/^html|^css|^js|^javascript/gi, "")
        .replace(/\r/g, "")
        .trim();

    document.getElementById("output").value = output;

    localStorage.setItem("codeMonGenerated", output);
}

function preview() {
    window.location.href = "preview.html";
}
</script>

</body>
</html>
