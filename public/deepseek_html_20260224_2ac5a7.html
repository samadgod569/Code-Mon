<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch AI — claude-sonnet-4-6</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0a0a0f;
            height: 100vh;
            overflow: hidden;
            color: #e0e0e0;
        }

        /* glassmorphism base */
        .glass {
            background: rgba(20, 20, 30, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(124, 58, 237, 0.2);
            border-radius: 16px;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #0a0a0f;
        }

        /* navbar */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #2a2a3a;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 1.4rem;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .model-badge {
            background: #1e1e2e;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            border: 1px solid #7c3aed40;
            color: #c0c0d0;
        }
        .nav-right svg {
            width: 24px;
            height: 24px;
            stroke: #a0a0b0;
            cursor: pointer;
            transition: stroke 0.2s;
        }
        .nav-right svg:hover {
            stroke: #7c3aed;
        }

        /* main 3-panel */
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
            padding: 12px;
            gap: 12px;
        }

        /* left sidebar */
        .left-panel {
            width: 260px;
            background: rgba(18, 18, 26, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid #2a2a3a;
            display: flex;
            flex-direction: column;
            padding: 16px;
            overflow-y: auto;
        }
        .panel-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7c3aed;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .new-workflow-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #06b6d4;
        }
        .workflow-list {
            list-style: none;
            margin-bottom: 20px;
        }
        .workflow-item {
            padding: 8px 12px;
            background: #1a1a26;
            border-radius: 12px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid transparent;
            transition: 0.2s;
            cursor: pointer;
        }
        .workflow-item.active {
            border-color: #7c3aed;
            background: #24243a;
        }
        .workflow-item .workflow-name {
            flex: 1;
            font-size: 0.9rem;
        }
        .step-container {
            margin-top: 12px;
        }
        .step-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: #a0a0b0;
            font-size: 0.8rem;
        }
        .step-list {
            list-style: none;
            min-height: 100px;
        }
        .step-item {
            background: #1e1e2c;
            border-radius: 10px;
            padding: 8px 8px 8px 12px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #2a2a3a;
            cursor: grab;
        }
        .step-item.dragging {
            opacity: 0.5;
        }
        .step-item .step-text {
            flex: 1;
            font-size: 0.85rem;
        }
        .step-item .drag-handle svg,
        .step-item .delete-step svg {
            width: 18px;
            height: 18px;
            stroke: #808090;
            cursor: pointer;
        }
        .step-item .delete-step svg:hover {
            stroke: #ef4444;
        }
        .add-step-form {
            display: flex;
            margin-top: 12px;
            gap: 6px;
        }
        .add-step-form input {
            flex: 1;
            background: #0f0f17;
            border: 1px solid #2a2a3a;
            border-radius: 30px;
            padding: 8px 12px;
            color: white;
            outline: none;
        }
        .add-step-form button {
            background: #7c3aed;
            border: none;
            border-radius: 30px;
            padding: 8px 12px;
            color: white;
            cursor: pointer;
            font-weight: 500;
        }

        /* center chat */
        .center-panel {
            flex: 1;
            background: rgba(12, 12, 20, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            border: 1px solid #2a2a3a;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .progress-bar {
            padding: 12px 20px;
            background: #12121a;
            border-bottom: 1px solid #2a2a3a;
            display: flex;
            gap: 16px;
            font-size: 0.8rem;
            overflow-x: auto;
        }
        .step-progress-item {
            background: #1e1e30;
            padding: 6px 14px;
            border-radius: 40px;
            color: #a0a0b0;
            white-space: nowrap;
            border: 1px solid #2a2a3a;
        }
        .step-progress-item.active {
            background: #7c3aed20;
            border-color: #7c3aed;
            color: #fff;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
        }
        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .avatar {
            width: 32px;
            height: 32px;
            background: #7c3aed;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
        }
        .user .avatar {
            background: #06b6d4;
        }
        .bubble {
            background: #1e1e30;
            padding: 12px 16px;
            border-radius: 18px;
            border: 1px solid #2a2a3a;
            line-height: 1.5;
            font-size: 0.95rem;
        }
        .user .bubble {
            background: #2a1a4a;
            border-color: #7c3aed;
        }
        .bubble p {
            margin: 8px 0;
        }
        .bubble h1 { font-size: 1.6rem; }
        .bubble h2 { font-size: 1.4rem; }
        .bubble h3 { font-size: 1.2rem; }
        .bubble code {
            background: #2d2d44;
            color: #a78bfa;
            padding: 2px 6px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
        }
        .bubble pre {
            display: none; /* code blocks are extracted, not shown */
        }
        .bubble blockquote {
            border-left: 4px solid #7c3aed;
            padding-left: 12px;
            margin: 8px 0;
            color: #b0b0c0;
        }
        .bubble hr {
            border: 1px solid #2a2a3a;
            margin: 16px 0;
        }
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 20px;
            background: #1a1a28;
            border-radius: 30px;
            width: fit-content;
        }
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #7c3aed;
            border-radius: 50%;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }

        .chat-input-area {
            padding: 16px;
            background: #12121a;
            border-top: 1px solid #2a2a3a;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        .chat-input-area textarea {
            flex: 1;
            background: #0a0a12;
            border: 1px solid #2a2a3a;
            border-radius: 24px;
            padding: 12px 18px;
            color: white;
            resize: none;
            max-height: 120px;
            outline: none;
            font-size: 0.95rem;
        }
        .send-btn {
            background: #7c3aed;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 4px;
        }
        .send-btn svg {
            width: 20px;
            height: 20px;
            stroke: white;
        }
        .send-btn:hover { background: #6d28d9; }

        /* right panel - code workspace */
        .right-panel {
            width: 340px;
            background: rgba(16, 16, 24, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid #2a2a3a;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: width 0.1s;
        }
        .workspace-header {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #2a2a3a;
        }
        .workspace-header h3 {
            color: #06b6d4;
        }
        .global-deploy {
            background: none;
            border: none;
            cursor: pointer;
        }
        .global-deploy svg {
            width: 24px;
            height: 24px;
            stroke: #06b6d4;
        }
        .code-tabs {
            display: flex;
            gap: 4px;
            padding: 12px 12px 0;
            overflow-x: auto;
            background: #12121c;
        }
        .code-tab {
            background: #1e1e2e;
            border: 1px solid #2a2a3a;
            border-bottom: none;
            border-radius: 10px 10px 0 0;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            color: #b0b0c0;
        }
        .code-tab.active {
            background: #24243a;
            border-color: #7c3aed;
            color: white;
        }
        .code-tab svg {
            width: 16px;
            height: 16px;
        }
        .code-tab .close-tab {
            margin-left: 6px;
            stroke: #808090;
        }
        .code-content {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            background: #0c0c14;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
        }
        .code-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #505070;
            gap: 12px;
        }
        .code-actions {
            display: flex;
            gap: 10px;
            padding: 12px;
            border-top: 1px solid #2a2a3a;
            background: #12121c;
        }
        .code-actions button {
            background: #1e1e30;
            border: none;
            border-radius: 30px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #c0c0d0;
            cursor: pointer;
            border: 1px solid #2a2a3a;
        }
        .code-actions button svg {
            width: 18px;
            height: 18px;
        }

        /* modal */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1a1a28;
            border-radius: 32px;
            padding: 32px;
            width: 400px;
            border: 1px solid #7c3aed;
        }
        .modal-content h2 { margin-bottom: 20px; color: #06b6d4; }
        .modal-content input {
            width: 100%;
            background: #0f0f1f;
            border: 1px solid #2a2a3a;
            border-radius: 40px;
            padding: 14px 18px;
            color: white;
            margin-bottom: 20px;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }
        .modal-actions button {
            padding: 10px 20px;
            border-radius: 40px;
            border: none;
            cursor: pointer;
        }
        .save-btn { background: #7c3aed; color: white; }
        .cancel-btn { background: #2a2a3a; color: white; }

        /* toast */
        .toast {
            position: fixed;
            bottom: 30px; left: 50%;
            transform: translateX(-50%);
            background: #1e1e30;
            border-left: 6px solid #7c3aed;
            padding: 12px 24px;
            border-radius: 40px;
            color: white;
            font-size: 0.9rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
            z-index: 2000;
        }

        .resize-handle {
            width: 6px;
            cursor: col-resize;
            background: transparent;
            transition: 0.2s;
        }
        .resize-handle:hover { background: #7c3aed40; }
    </style>
</head>
<body>
    <div id="app">
        <!-- navbar -->
        <div class="navbar">
            <div class="logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M13 2L3 14h8l-2 8 10-12h-8l2-8z" />
                </svg>
                Switch AI
            </div>
            <div class="model-badge">claude-sonnet-4-6</div>
            <div class="nav-right">
                <svg id="settings-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 18a10 10 0 0 0 6.36-2.22l.04-.04z"/><path d="M16.5 9.4V6.5a2 2 0 0 0-2-2h-5a2 2 0 0 0-2 2v2.9"/>
                </svg>
            </div>
        </div>

        <!-- main panels -->
        <div class="main-layout">
            <!-- left workflow -->
            <div class="left-panel">
                <div class="panel-title">
                    WORKFLOWS
                    <button class="new-workflow-btn" id="new-workflow">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>
                    </button>
                </div>
                <ul class="workflow-list" id="workflow-list"></ul>
                <div class="step-container">
                    <div class="step-header">
                        <span>STEPS</span>
                        <span id="active-step-indicator"></span>
                    </div>
                    <ul class="step-list" id="step-list"></ul>
                    <div class="add-step-form">
                        <input type="text" id="new-step-input" placeholder="e.g. Create HTML...">
                        <button id="add-step-btn">Add</button>
                    </div>
                </div>
            </div>

            <!-- center chat -->
            <div class="center-panel">
                <div class="progress-bar" id="progress-bar"></div>
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-input-area">
                    <textarea id="chat-input" placeholder="Ask Switch AI..." rows="1"></textarea>
                    <button class="send-btn" id="send-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                    </button>
                </div>
            </div>

            <!-- resize handle -->
            <div class="resize-handle" id="resize-handle"></div>

            <!-- right code workspace -->
            <div class="right-panel" id="right-panel">
                <div class="workspace-header">
                    <h3>Code workspace</h3>
                    <button class="global-deploy" id="global-deploy">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </button>
                </div>
                <div class="code-tabs" id="code-tabs"></div>
                <div class="code-content" id="code-content">
                    <div class="code-placeholder">
                        <svg width="64" height="64" viewBox="0 0 24 24" stroke="#404060"><path d="M16 18L22 12 16 6M8 6L2 12 8 18"/></svg>
                        <span>No code yet — ask Switch AI</span>
                    </div>
                </div>
                <div class="code-actions" id="code-actions" style="display: none;">
                    <button id="copy-code"><svg viewBox="0 0 24 24"><path d="M8 4v12h12V4H8z M4 8v12h12"/></svg> Copy</button>
                    <button id="download-code"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg> Download</button>
                    <button id="preview-code"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg> Preview</button>
                </div>
            </div>
        </div>
    </div>

    <!-- modal for API key -->
    <div class="modal" id="api-modal">
        <div class="modal-content">
            <h2>Anthropic API Key</h2>
            <input type="password" id="api-key-input" placeholder="sk-ant-...">
            <div class="modal-actions">
                <button class="cancel-btn" id="modal-cancel">Cancel</button>
                <button class="save-btn" id="modal-save">Save</button>
            </div>
        </div>
    </div>

    <!-- toast -->
    <div class="toast" id="toast">Copied!</div>

    <script>
        (function() {
            // ---------- state ----------
            let workflows = JSON.parse(localStorage.getItem('switchai_workflows')) || [];
            let activeWorkflowId = workflows[0]?.id || null;
            let activeStepId = null;
            let messages = [];
            let codeBlocks = []; // { id, language, code, filename }
            let activeCodeBlockId = null;
            let apiKey = localStorage.getItem('switchai_api_key') || '';

            // ---------- utils ----------
            function generateId() { return Date.now() + '-' + Math.random().toString(36); }
            function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2000); }

            // ---------- markdown parser (lightweight) ----------
            function parseMarkdown(text) {
                if (!text) return '';
                // extract code blocks first (they are removed from chat)
                // but we handle them separately in AI response.
                // For chat display, we just render inline markdown.
                let html = text
                    .replace(/^# (.*?)$/gm, '<h1>$1</h1>')
                    .replace(/^## (.*?)$/gm, '<h2>$1</h2>')
                    .replace(/^### (.*?)$/gm, '<h3>$1</h3>')
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>')
                    .replace(/`(.*?)`/g, '<code>$1</code>')
                    .replace(/^> (.*?)$/gm, '<blockquote>$1</blockquote>')
                    .replace(/^---$/gm, '<hr>')
                    .replace(/^\* (.*?)$/gm, '<ul><li>$1</li></ul>')  // very basic list
                    .replace(/^\- (.*?)$/gm, '<ul><li>$1</li></ul>')
                    .replace(/^\d\. (.*?)$/gm, '<ol><li>$1</li></ol>');
                // wrap consecutive lists later? skip for brevity.
                return html;
            }

            // ---------- extract fenced code blocks ----------
            function extractCodeBlocksFromAIResponse(text) {
                const regex = /```(\w+)?\n([\s\S]*?)```/g;
                let match;
                let blocks = [];
                let cleanText = text.replace(regex, (match, lang, code) => {
                    lang = lang || 'text';
                    blocks.push({ language: lang, code: code.trim() });
                    return ''; // remove from text
                });
                return { cleanText, blocks };
            }

            // ---------- filename from language ----------
            function getFilename(lang) {
                const map = { 'javascript': 'script.js', 'js': 'script.js', 'html': 'index.html', 'css': 'styles.css', 'python': 'main.py', 'java': 'Main.java', 'cpp': 'main.cpp', 'c': 'main.c', 'json': 'data.json' };
                return map[lang.toLowerCase()] || `code.${lang}`;
            }

            // ---------- syntax highlight (simple) ----------
            function highlight(code, lang) {
                const keywords = ['function', 'if', 'else', 'return', 'const', 'let', 'var', 'for', 'while', 'class', 'import', 'export'];
                let escaped = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                keywords.forEach(kw => {
                    const regex = new RegExp(`\\b${kw}\\b`, 'g');
                    escaped = escaped.replace(regex, `<span style="color:#c586c0">${kw}</span>`);
                });
                escaped = escaped.replace(/(".*?"|'.*?'|`.*?`)/g, '<span style="color:#ce9178">$1</span>');
                escaped = escaped.replace(/(\/\/.*?$|\/\*[\s\S]*?\*\/)/gm, '<span style="color:#6a9955">$&</span>');
                return escaped;
            }

            // ---------- render workflow list ----------
            function renderWorkflows() {
                const container = document.getElementById('workflow-list');
                container.innerHTML = workflows.map(w => `
                    <li class="workflow-item ${activeWorkflowId === w.id ? 'active' : ''}" data-id="${w.id}">
                        <span class="workflow-name">${w.name || 'Unnamed'}</span>
                    </li>
                `).join('');
                // attach click
                document.querySelectorAll('.workflow-item').forEach(el => {
                    el.addEventListener('click', () => {
                        activeWorkflowId = el.dataset.id;
                        activeStepId = null; // reset active step
                        renderWorkflows();
                        renderSteps();
                        renderProgressBar();
                    });
                });
            }

            function renderSteps() {
                const workflow = workflows.find(w => w.id === activeWorkflowId);
                const list = document.getElementById('step-list');
                if (!workflow) { list.innerHTML = ''; return; }
                const steps = workflow.steps || [];
                list.innerHTML = steps.map((step, idx) => `
                    <li class="step-item" draggable="true" data-id="${step.id}" data-index="${idx}">
                        <span class="drag-handle" draggable="false"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor"><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/><circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/></svg></span>
                        <span class="step-text" onclick="setActiveStep('${step.id}')">${step.text}</span>
                        <span class="delete-step" data-id="${step.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0h10"/></svg></span>
                    </li>
                `).join('');
                // drag drop
                document.querySelectorAll('.step-item').forEach(item => {
                    item.addEventListener('dragstart', (e) => {
                        e.dataTransfer.setData('text/plain', e.target.closest('.step-item').dataset.id);
                        item.classList.add('dragging');
                    });
                    item.addEventListener('dragend', () => item.classList.remove('dragging'));
                });
                list.addEventListener('dragover', e => e.preventDefault());
                list.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const id = e.dataTransfer.getData('text/plain');
                    const target = e.target.closest('.step-item');
                    if (!target) return;
                    const workflow = workflows.find(w => w.id === activeWorkflowId);
                    const steps = workflow.steps;
                    const draggedIndex = steps.findIndex(s => s.id === id);
                    const targetIndex = steps.findIndex(s => s.id === target.dataset.id);
                    if (draggedIndex !== -1 && targetIndex !== -1) {
                        const [removed] = steps.splice(draggedIndex, 1);
                        steps.splice(targetIndex, 0, removed);
                        saveWorkflows();
                        renderSteps();
                        renderProgressBar();
                    }
                });
                // delete
                document.querySelectorAll('.delete-step').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = btn.dataset.id;
                        const workflow = workflows.find(w => w.id === activeWorkflowId);
                        workflow.steps = workflow.steps.filter(s => s.id !== id);
                        if (activeStepId === id) activeStepId = null;
                        saveWorkflows();
                        renderSteps();
                        renderProgressBar();
                    });
                });
                // active step highlighting (via click on step-text)
                window.setActiveStep = (stepId) => {
                    activeStepId = stepId;
                    renderSteps();
                    renderProgressBar();
                };
                // highlight active
                document.querySelectorAll('.step-item').forEach(item => {
                    if (item.dataset.id === activeStepId) {
                        item.style.borderLeft = '4px solid #7c3aed';
                    } else item.style.borderLeft = 'none';
                });
            }

            function renderProgressBar() {
                const bar = document.getElementById('progress-bar');
                const workflow = workflows.find(w => w.id === activeWorkflowId);
                if (!workflow || !workflow.steps.length) { bar.innerHTML = ''; return; }
                bar.innerHTML = workflow.steps.map(step => `
                    <span class="step-progress-item ${activeStepId === step.id ? 'active' : ''}">${step.text}</span>
                `).join('');
            }

            function saveWorkflows() {
                localStorage.setItem('switchai_workflows', JSON.stringify(workflows));
            }

            // ---------- code workspace ----------
            function renderCodeWorkspace() {
                const tabs = document.getElementById('code-tabs');
                const content = document.getElementById('code-content');
                const actions = document.getElementById('code-actions');
                if (!codeBlocks.length) {
                    tabs.innerHTML = '';
                    content.innerHTML = '<div class="code-placeholder"><svg width="64" height="64" viewBox="0 0 24 24" stroke="#404060"><path d="M16 18L22 12 16 6M8 6L2 12 8 18"/></svg><span>No code generated yet — ask Switch AI to write some code</span></div>';
                    actions.style.display = 'none';
                    return;
                }
                actions.style.display = 'flex';
                tabs.innerHTML = codeBlocks.map(block => `
                    <div class="code-tab ${activeCodeBlockId === block.id ? 'active' : ''}" data-id="${block.id}">
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/><path d="M14 2v6h6"/></svg>
                        ${block.filename || 'code'}
                        <span class="close-tab" data-id="${block.id}"><svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor"><path d="M18 6L6 18M6 6l12 12"/></svg></span>
                    </div>
                `).join('');
                // show active code
                const active = codeBlocks.find(b => b.id === activeCodeBlockId) || codeBlocks[0];
                if (active) {
                    activeCodeBlockId = active.id;
                    content.innerHTML = `<pre style="font-family: monospace;">${highlight(active.code, active.language)}</pre>`;
                }
                // tab click
                document.querySelectorAll('.code-tab').forEach(tab => {
                    tab.addEventListener('click', (e) => {
                        if (e.target.closest('.close-tab')) return;
                        activeCodeBlockId = tab.dataset.id;
                        renderCodeWorkspace();
                    });
                });
                // close tab
                document.querySelectorAll('.close-tab').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = btn.dataset.id;
                        codeBlocks = codeBlocks.filter(b => b.id !== id);
                        if (activeCodeBlockId === id) activeCodeBlockId = codeBlocks[0]?.id || null;
                        renderCodeWorkspace();
                    });
                });
                // copy
                document.getElementById('copy-code').onclick = () => {
                    const active = codeBlocks.find(b => b.id === activeCodeBlockId);
                    if (active) {
                        navigator.clipboard.writeText(active.code).then(() => showToast('Copied!'));
                    }
                };
                // download
                document.getElementById('download-code').onclick = () => {
                    const active = codeBlocks.find(b => b.id === activeCodeBlockId);
                    if (active) {
                        const blob = new Blob([active.code], {type: 'text/plain'});
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = active.filename || 'code.txt';
                        a.click();
                        URL.revokeObjectURL(url);
                        showToast('Downloaded');
                    }
                };
                // preview
                document.getElementById('preview-code').onclick = () => {
                    const active = codeBlocks.find(b => b.id === activeCodeBlockId);
                    if (active) {
                        localStorage.setItem('switchai_preview_code', active.code);
                        localStorage.setItem('switchai_preview_lang', active.language);
                        const previewHTML = generatePreviewHTML();
                        const win = window.open('', '_blank');
                        win.document.write(previewHTML);
                        win.document.close();
                    }
                };
            }

            // ---------- preview.html generator ----------
            function generatePreviewHTML() {
                return `<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Switch AI Preview</title><style>body{background:#0a0a0f;color:#eee;font-family:system-ui;padding:2rem;}#back{position:fixed;top:20px;right:20px;background:#7c3aed;border:none;border-radius:40px;padding:10px 20px;color:white;cursor:pointer;display:flex;gap:8px;}.preview-container{max-width:900px;margin:auto;}</style></head>
<body>
<button id="back" onclick="window.close()"><svg width="20" height="20" viewBox="0 0 24 24" stroke="white"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back</button>
<div class="preview-container" id="preview-root"></div>
<script>
(function(){
    const code = localStorage.getItem('switchai_preview_code') || '';
    const lang = localStorage.getItem('switchai_preview_lang') || 'text';
    const root = document.getElementById('preview-root');
    if(lang === 'html') {
        const iframe = document.createElement('iframe');
        iframe.srcdoc = code;
        iframe.style.width = '100%'; iframe.style.height = '80vh'; iframe.style.border = '1px solid #2a2a3a'; iframe.style.background = 'white';
        root.appendChild(iframe);
    } else if(lang === 'css') {
        root.innerHTML = '<style>' + code + '</style><div class="demo-box" style="padding:2rem;background:#1e1e30;border-radius:16px;">Styled with your CSS</div>';
    } else if(lang === 'javascript' || lang === 'js') {
        const consoleOutput = [];
        const originalLog = console.log;
        console.log = (...args) => { consoleOutput.push(args.join(' ')); originalLog(...args); };
        try { eval(code); } catch(e) { consoleOutput.push('Error: ' + e.message); }
        console.log = originalLog;
        root.innerHTML = '<pre style="background:#1a1a28;padding:1rem;border-radius:12px;color:#0f0;">' + consoleOutput.join('\\n') + '</pre>';
    } else {
        root.innerHTML = '<pre style="background:#1a1a28;padding:1rem;border-radius:12px;color:#a0a0f0;">' + code.replace(/</g,'&lt;') + '</pre>';
    }
})();
<\/script>
</body>
</html>`;
            }

            // ---------- AI chat ----------
            async function sendMessage(userText) {
                if (!apiKey) { alert('Please set your Anthropic API key (gear icon)'); return; }
                const workflow = workflows.find(w => w.id === activeWorkflowId);
                const activeStep = workflow?.steps?.find(s => s.id === activeStepId);
                const stepContext = activeStep ? ` Current step: ${activeStep.text}` : '';
                const systemPrompt = "You are Switch AI, an expert coding agent. When writing code always use fenced code blocks with the correct language tag. Be concise in explanation but thorough in code." + stepContext;

                messages.push({ role: 'user', content: userText });
                renderMessages();
                showTyping(true);

                try {
                    const response = await fetch('https://api.anthropic.com/v1/messages', {
                        method: 'POST',
                        headers: {
                            'x-api-key': apiKey,
                            'anthropic-version': '2023-06-01',
                            'content-type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: 'claude-sonnet-4-6',
                            max_tokens: 2048,
                            system: systemPrompt,
                            messages: messages.map(m => ({ role: m.role, content: m.content }))
                        })
                    });
                    if (!response.ok) throw new Error(`API error ${response.status}`);
                    const data = await response.json();
                    const aiText = data.content[0].text;
                    // extract code blocks
                    const { cleanText, blocks } = extractCodeBlocksFromAIResponse(aiText);
                    if (blocks.length) {
                        blocks.forEach(b => {
                            codeBlocks.push({
                                id: generateId(),
                                language: b.language,
                                code: b.code,
                                filename: getFilename(b.language)
                            });
                        });
                        activeCodeBlockId = codeBlocks[codeBlocks.length-1].id;
                        renderCodeWorkspace();
                    }
                    messages.push({ role: 'assistant', content: cleanText || '(Code generated — see workspace)' });
                    renderMessages();
                } catch (err) {
                    messages.push({ role: 'assistant', content: `⚠️ Error: ${err.message}` });
                    renderMessages();
                } finally {
                    showTyping(false);
                }
            }

            function renderMessages() {
                const container = document.getElementById('chat-messages');
                container.innerHTML = messages.map(m => `
                    <div class="message ${m.role}">
                        <div class="avatar">${m.role === 'assistant' ? 'S' : 'U'}</div>
                        <div class="bubble">${m.role === 'assistant' ? parseMarkdown(m.content) : m.content}</div>
                    </div>
                `).join('');
                container.scrollTop = container.scrollHeight;
            }

            function showTyping(show) {
                const container = document.getElementById('chat-messages');
                const existing = document.getElementById('typing-indicator');
                if (existing) existing.remove();
                if (show) {
                    const div = document.createElement('div');
                    div.id = 'typing-indicator';
                    div.className = 'typing-indicator';
                    div.innerHTML = '<span></span><span></span><span></span>';
                    container.appendChild(div);
                    container.scrollTop = container.scrollHeight;
                }
            }

            // ---------- init and event listeners ----------
            document.addEventListener('DOMContentLoaded', () => {
                if (!workflows.length) {
                    workflows.push({ id: generateId(), name: 'Default workflow', steps: [] });
                    activeWorkflowId = workflows[0].id;
                    saveWorkflows();
                }
                renderWorkflows();
                renderSteps();
                renderProgressBar();
                renderCodeWorkspace();

                // new workflow
                document.getElementById('new-workflow').addEventListener('click', () => {
                    const name = prompt('Workflow name') || 'New workflow';
                    workflows.push({ id: generateId(), name, steps: [] });
                    saveWorkflows();
                    renderWorkflows();
                });

                // add step
                document.getElementById('add-step-btn').addEventListener('click', () => {
                    const input = document.getElementById('new-step-input');
                    if (!input.value.trim()) return;
                    const workflow = workflows.find(w => w.id === activeWorkflowId);
                    if (workflow) {
                        workflow.steps.push({ id: generateId(), text: input.value });
                        saveWorkflows();
                        renderSteps();
                        renderProgressBar();
                        input.value = '';
                    }
                });

                // send message
                document.getElementById('send-btn').addEventListener('click', () => {
                    const input = document.getElementById('chat-input');
                    if (!input.value.trim()) return;
                    sendMessage(input.value);
                    input.value = '';
                });

                // settings modal
                const modal = document.getElementById('api-modal');
                document.getElementById('settings-icon').addEventListener('click', () => {
                    document.getElementById('api-key-input').value = apiKey;
                    modal.style.display = 'flex';
                });
                document.getElementById('modal-cancel').addEventListener('click', () => modal.style.display = 'none');
                document.getElementById('modal-save').addEventListener('click', () => {
                    apiKey = document.getElementById('api-key-input').value;
                    localStorage.setItem('switchai_api_key', apiKey);
                    modal.style.display = 'none';
                });

                // global deploy
                document.getElementById('global-deploy').addEventListener('click', () => {
                    window.open('https://code-mon.pages.dev/', '_blank');
                });

                // resize panels
                const handle = document.getElementById('resize-handle');
                const right = document.getElementById('right-panel');
                let startX, startWidth;
                handle.addEventListener('mousedown', (e) => {
                    startX = e.clientX;
                    startWidth = parseInt(window.getComputedStyle(right).width, 10);
                    document.addEventListener('mousemove', resize);
                    document.addEventListener('mouseup', stopResize);
                });
                function resize(e) {
                    const dx = startX - e.clientX; // moving left reduces width
                    let newWidth = startWidth - dx;
                    if (newWidth < 200) newWidth = 200;
                    if (newWidth > 600) newWidth = 600;
                    right.style.width = newWidth + 'px';
                }
                function stopResize() {
                    document.removeEventListener('mousemove', resize);
                }

                // auto-resize textarea
                document.getElementById('chat-input').addEventListener('input', function() {
                    this.style.height = 'auto';
                    this.style.height = (this.scrollHeight) + 'px';
                });
            });
        })();
    </script>
</body>
</html>
