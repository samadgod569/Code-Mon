<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Panel · Code Mon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wght@0,200..900;1,200..900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<link id="hljs-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<link id="hljs-dark" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" disabled>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f6f8fa;--bg3:#eaeef2;--bd:#d0d7de;--bdm:#e1e4e8;
  --tx:#1f2328;--txm:#636c76;--txs:#9198a1;--ac:#0969da;--ach:#0550ae;
  --acb:#ddf4ff;--ace:#54aeff;--ok:#1a7f37;--okb:#dafbe1;--oke:rgba(26,127,55,.3);
  --er:#cf222e;--erb:#ffebe9;--ere:rgba(207,34,46,.3);--wn:#9a6700;--wnb:#fff8c5;--wne:rgba(154,103,0,.3);
  --sh1:0 1px 0 rgba(27,31,36,.04);--sh2:0 3px 6px rgba(140,149,159,.15);--sh3:0 8px 24px rgba(140,149,159,.2);
  --r:6px;--rl:12px;--tr:80ms cubic-bezier(.33,1,.68,1);
  --sw:260px;--aiw:300px;
}
[data-theme="dark"]{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--bd:#30363d;--bdm:#21262d;
  --tx:#e6edf3;--txm:#8b949e;--txs:#6e7681;--ac:#58a6ff;--ach:#79c0ff;
  --acb:rgba(56,139,253,.1);--ace:rgba(56,139,253,.4);
  --ok:#3fb950;--okb:rgba(46,160,67,.1);--oke:rgba(63,185,80,.3);
  --er:#f85149;--erb:rgba(248,81,73,.1);--ere:rgba(248,81,73,.3);
  --wn:#e3b341;--wnb:rgba(187,128,9,.15);--wne:rgba(227,179,65,.3);
  --sh1:0 1px 0 rgba(0,0,0,.25);--sh2:0 3px 6px rgba(0,0,0,.3);--sh3:0 8px 24px rgba(0,0,0,.45);
}
html{font-family:'Mona Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{background:var(--bg);color:var(--tx);height:100dvh;overflow:hidden;font-size:14px;line-height:1.5;display:flex;flex-direction:column}
button,input,textarea,select{font-family:inherit}
.hidden{display:none!important}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}

.hdr{background:var(--bg2);border-bottom:1px solid var(--bd);height:48px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:var(--sh1);z-index:50;gap:8px}
.hdr-l{display:flex;align-items:center;gap:8px;min-width:0}
.hdr-r{display:flex;align-items:center;gap:6px;flex-shrink:0}
.logo{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;white-space:nowrap;color:var(--tx)}
.logo-mark{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,var(--ac),#6e40c9);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.game-badge{font-size:11px;color:var(--txm);background:var(--bg3);border:1px solid var(--bd);border-radius:20px;padding:2px 8px;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;display:none}
.ibtn{background:none;border:1px solid var(--bd);border-radius:var(--r);color:var(--txm);cursor:pointer;padding:4px 8px;font-size:11px;display:flex;align-items:center;gap:4px;transition:var(--tr);white-space:nowrap;flex-shrink:0}
.ibtn:hover{background:var(--bg3);color:var(--tx)}
.ibtn.on{background:var(--acb);border-color:var(--ace);color:var(--ac)}
.ibtn svg{flex-shrink:0}
.prev-btn{background:var(--ac);border:none;color:#fff}
.prev-btn:hover{background:var(--ach);color:#fff}
.thbtn{background:none;border:1px solid var(--bd);border-radius:var(--r);color:var(--txm);cursor:pointer;padding:4px 8px;display:flex;align-items:center;gap:5px;font-size:11px;transition:var(--tr)}
.thbtn:hover{background:var(--bg3);color:var(--tx)}

.app{display:flex;flex:1;overflow:hidden;min-height:0}

.left-panel{width:var(--sw);background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;transition:width .18s ease}
.left-panel.off{width:0;border-right:none}
.panel-hd{padding:9px 10px 9px 12px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.panel-title{font-size:11px;font-weight:600;color:var(--txm);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.file-tree{flex:1;overflow-y:auto;padding:4px 0}
.folder-item{display:flex;align-items:center;padding:4px 10px;cursor:pointer;font-size:12px;white-space:nowrap;transition:background .15s;user-select:none;gap:4px;color:var(--tx)}
.folder-item:hover{background:var(--bg3)}
.folder-toggle{width:14px;height:14px;fill:var(--txm);transition:transform .15s;flex-shrink:0}
.folder-toggle.open{transform:rotate(90deg)}
.folder-icon{width:14px;height:14px;fill:#daa520;flex-shrink:0}
.folder-contents{display:none;padding-left:16px}
.folder-contents.open{display:block}
.file-item{display:flex;align-items:center;padding:4px 10px;cursor:pointer;font-size:12px;white-space:nowrap;transition:background .15s;user-select:none;gap:6px;color:var(--tx);border-left:2px solid transparent}
.file-item:hover{background:var(--bg3)}
.file-item.active{background:var(--acb);border-left-color:var(--ac)}
.file-icon{width:14px;height:14px;flex-shrink:0}
.file-icon.html{fill:#e34c26}
.file-icon.css{fill:#264de4}
.file-icon.js{fill:#c5a30a}
.file-icon.json{fill:#5dc9e2}
.file-icon.py{fill:#3776ab}
.file-icon.md{fill:var(--txm)}
.file-icon.txt{fill:var(--txs)}
.file-icon.default{fill:var(--txm)}

.center-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.toolbar{padding:5px 10px;background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;gap:5px;flex-wrap:wrap;align-items:center;flex-shrink:0}
.tool-btn{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);color:var(--txm);padding:4px 8px;font-size:11px;display:flex;align-items:center;gap:4px;cursor:pointer;transition:var(--tr);white-space:nowrap}
.tool-btn:hover{background:var(--bg3);color:var(--tx)}
.tool-btn svg{width:12px;height:12px;fill:currentColor;flex-shrink:0}
.tool-sep{width:1px;height:16px;background:var(--bd);margin:0 2px;flex-shrink:0}

.preview-section{height:42%;min-height:160px;display:flex;flex-direction:column;border-bottom:1px solid var(--bd);flex-shrink:0;background:var(--bg)}
.preview-bar{height:32px;background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 10px;gap:8px;flex-shrink:0}
.preview-bar-title{font-size:11px;color:var(--txm);font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview-open-btn{background:none;border:none;color:var(--txm);cursor:pointer;padding:3px 6px;border-radius:4px;font-size:11px;display:flex;align-items:center;gap:4px;transition:var(--tr)}
.preview-open-btn:hover{background:var(--bg3);color:var(--ac)}
#preview-frame{width:100%;flex:1;border:none;background:#fff;display:block}

.editor-section{flex:1;position:relative;overflow:hidden;background:var(--bg);min-height:0}
#highlighted-code{position:absolute;inset:0;padding:14px 16px;margin:0;overflow:auto;pointer-events:none;font-family:'Fira Code',monospace;font-size:13px;line-height:1.7;white-space:pre-wrap;word-wrap:break-word;background:var(--bg);z-index:1}
#highlighted-code code{background:transparent!important;padding:0!important;font-size:inherit!important}
#editor{position:absolute;inset:0;padding:14px 16px;background:transparent;border:none;color:transparent;caret-color:var(--tx);font-family:'Fira Code',monospace;font-size:13px;line-height:1.7;resize:none;outline:none;tab-size:2;overflow:auto;z-index:2;white-space:pre-wrap;word-wrap:break-word}
#editor::placeholder{color:var(--txs)}
#editor::selection{background:rgba(56,139,253,.25)}

.right-panel{width:var(--aiw);background:var(--bg2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;transition:width .18s ease}
.right-panel.off{width:0;border-left:none}
.ai-hd{padding:8px 10px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap}
.ai-hd-title{font-size:11px;font-weight:600;color:var(--txm);text-transform:uppercase;letter-spacing:.5px;flex:1;white-space:nowrap}
.model-select{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:3px 20px 3px 6px;font-size:11px;color:var(--tx);outline:none;cursor:pointer;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='12' height='12' viewBox='0 0 16 16' fill='%236e7681'%3E%3Cpath d='M4.427 7.427l3.396 3.396a.25.25 0 0 0 .354 0l3.396-3.396A.25.25 0 0 0 11.396 7H4.604a.25.25 0 0 0-.177.427z'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 4px center;background-size:12px;max-width:140px}
.think-btn{background:none;border:1px solid var(--bd);border-radius:var(--r);color:var(--txm);cursor:pointer;padding:3px 6px;display:flex;align-items:center;gap:3px;font-size:10px;transition:var(--tr);white-space:nowrap}
.think-btn.on{background:var(--acb);border-color:var(--ace);color:var(--ac)}
.think-dot{width:5px;height:5px;border-radius:50%;background:#6e40c9;display:none}
.think-btn.on .think-dot{display:inline-block}

.ai-chat-list{width:100%;background:var(--bg2);border-bottom:1px solid var(--bd);overflow-x:auto;display:flex;align-items:center;padding:4px 6px;gap:4px;flex-shrink:0;scrollbar-width:thin}
.chat-tab{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;border:1px solid transparent;font-size:11px;cursor:pointer;white-space:nowrap;color:var(--txm);background:none;transition:var(--tr);flex-shrink:0}
.chat-tab:hover{background:var(--bg3)}
.chat-tab.on{background:var(--bg);border-color:var(--bd);color:var(--tx);box-shadow:var(--sh1)}
.chat-tab-del{background:none;border:none;color:transparent;cursor:pointer;padding:0;line-height:1;display:flex;border-radius:2px;transition:var(--tr)}
.chat-tab:hover .chat-tab-del{color:var(--txs)}
.chat-tab-del:hover{color:var(--er)!important}
.new-chat-btn{background:var(--ac);border:none;border-radius:var(--r);color:#fff;font-size:10px;font-weight:600;cursor:pointer;padding:3px 6px;display:flex;align-items:center;gap:3px;flex-shrink:0;transition:var(--tr);white-space:nowrap}
.new-chat-btn:hover{background:var(--ach)}

.msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:14px;min-height:0}
.msgs-inner{display:flex;flex-direction:column;gap:14px}
.welcome-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:32px 16px;flex:1}
.wlogo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--ac),#6e40c9);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(9,105,218,.2)}
.wtitle{font-size:16px;font-weight:600;color:var(--tx)}
.wsub{font-size:11px;color:var(--txm);line-height:1.6;max-width:220px}

.msg{display:flex;gap:8px;width:100%}
.msg.u{flex-direction:row-reverse}
.av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;font-size:10px;font-weight:700}
.msg.ai .av{background:var(--acb);color:var(--ac);border:1px solid var(--ace)}
.msg.u .av{background:var(--bg3);color:var(--txm);border:1px solid var(--bd)}
.mc{display:flex;flex-direction:column;gap:3px;min-width:0;max-width:calc(100% - 34px)}
.msg.u .mc{align-items:flex-end}
.bbl{padding:8px 12px;border-radius:10px;font-size:12px;line-height:1.6;word-break:break-word}
.msg.ai .bbl{background:var(--bg);border:1px solid var(--bd);border-top-left-radius:3px;max-width:100%}
.msg.u .bbl{background:var(--ac);color:#fff;border-top-right-radius:3px}
.mmeta{font-size:10px;color:var(--txs);padding:0 2px}
.msg.u .mmeta{text-align:right}
.copy-btn{background:none;border:none;color:var(--txs);cursor:pointer;padding:0 3px;line-height:1;display:inline-flex;align-items:center;transition:color var(--tr)}
.copy-btn:hover{color:var(--ac)}

.plan-bubble{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;border-top-left-radius:3px;overflow:hidden;margin-bottom:4px}
.plan-hd{display:flex;align-items:center;gap:5px;padding:6px 10px;background:var(--bg3);border-bottom:1px solid var(--bd);cursor:pointer}
.plan-hd span{font-size:11px;font-weight:500;color:var(--txm);display:flex;align-items:center;gap:4px}
.plan-chevron{transition:transform .2s;color:var(--txm);font-size:9px}
.plan-body{padding:8px 10px;font-size:11px;color:var(--txm);line-height:1.6;border-top:1px solid var(--bd)}
.plan-body.collapsed{display:none}
.plan-typing{min-height:1.4em;white-space:pre-wrap;word-break:break-word}

.think-bubble{background:var(--bg2);border:1px solid rgba(110,64,201,.35);border-radius:10px;border-top-left-radius:3px;overflow:hidden;margin-bottom:4px}
.think-hd{display:flex;align-items:center;gap:5px;padding:6px 10px;background:linear-gradient(90deg,rgba(110,64,201,.08),transparent);cursor:pointer;border-bottom:1px solid rgba(110,64,201,.2)}
.think-hd span{font-size:11px;font-weight:500;color:#6e40c9;display:flex;align-items:center;gap:4px}
[data-theme="dark"] .think-hd span{color:#b48fff}
.think-body{padding:8px 10px;font-size:11px;color:var(--txm);line-height:1.6;font-style:italic}
.think-body.collapsed{display:none}

.thwrap{display:flex;gap:8px;width:100%}
.thbbl{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;border-top-left-radius:3px;font-size:11px;color:var(--txm)}
.dots{display:flex;gap:3px}
.dot{width:4px;height:4px;border-radius:50%;background:var(--ac);animation:pd 1.3s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes pd{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}

.md h1,.md h2,.md h3,.md h4{font-weight:600;line-height:1.3;margin:12px 0 5px}
.md h1:first-child,.md h2:first-child,.md h3:first-child{margin-top:0}
.md h1{font-size:1.2em;padding-bottom:5px;border-bottom:1px solid var(--bd)}
.md h2{font-size:1.05em}.md h3{font-size:.95em}
.md p{margin-bottom:7px}.md p:last-child{margin-bottom:0}
.md a{color:var(--ac)}
.md ul,.md ol{padding-left:18px;margin-bottom:7px}
.md li{margin-bottom:2px}
.md code{background:rgba(175,184,193,.2);border-radius:4px;padding:1px 4px;font-size:.82em;font-family:'Fira Code',monospace}
.msg.u .md code{background:rgba(255,255,255,.2)}
.md pre{background:var(--bg3);border:1px solid var(--bd);border-radius:var(--r);padding:0;margin:6px 0;overflow:hidden;position:relative}
.md pre code{background:none;border:none;padding:10px 12px;font-size:11px;display:block;overflow-x:auto;color:var(--tx)}
.md strong{font-weight:600}.md em{font-style:italic}
.md hr{border:none;border-top:1px solid var(--bd);margin:10px 0}
.md table{border-collapse:collapse;width:100%;margin:6px 0;font-size:11px}
.md th,.md td{border:1px solid var(--bd);padding:4px 8px;text-align:left}
.md th{background:var(--bg3);font-weight:600}

.cbw{position:relative;margin:6px 0}
.cbh{display:flex;align-items:center;justify-content:space-between;background:var(--bg3);border:1px solid var(--bd);border-bottom:none;border-radius:var(--r) var(--r) 0 0;padding:4px 8px}
.cbh .lang{font-size:10px;color:var(--txm);font-family:monospace;display:flex;align-items:center;gap:3px}
.cbh .cpbtn{background:none;border:none;color:var(--txm);cursor:pointer;padding:2px 6px;border-radius:3px;font-size:10px;transition:var(--tr);display:flex;align-items:center;gap:3px}
.cbh .cpbtn:hover{background:var(--bdm);color:var(--tx)}
.cbw pre{margin:0!important;border-radius:0 0 var(--r) var(--r)!important;border-top:1px solid var(--bdm)!important}
.fgc{display:flex;align-items:center;gap:6px;padding:5px 9px;background:var(--okb);border:1px solid var(--oke);border-radius:var(--r);font-size:11px;color:var(--ok);margin-top:4px;flex-wrap:wrap}
.fgc .fn{font-weight:600}

.ai-input-zone{padding:10px 10px 12px;border-top:1px solid var(--bd);background:var(--bg2);flex-shrink:0}
.irow{display:flex;gap:6px;align-items:flex-end}
.twrap{flex:1;position:relative}
.minput{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 36px 8px 10px;font-size:12px;color:var(--tx);resize:none;outline:none;max-height:120px;min-height:36px;line-height:1.5;transition:border-color var(--tr)}
.minput:focus{border-color:var(--ace)}
.minput::placeholder{color:var(--txs)}
.sbtn{background:var(--ac);border:none;border-radius:var(--r);color:#fff;cursor:pointer;padding:7px 10px;font-size:12px;font-weight:500;display:flex;align-items:center;gap:4px;transition:var(--tr);flex-shrink:0}
.sbtn:hover{background:var(--ach)}
.sbtn:disabled{opacity:.5;cursor:not-allowed}
.ihint{font-size:10px;color:var(--txs);margin-top:5px;padding:0 2px}

.status-bar{height:22px;background:var(--bg2);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 14px;font-size:10px;color:var(--txm);gap:16px;flex-shrink:0}
.status-item{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}

.tstack{position:fixed;bottom:30px;right:16px;z-index:500;display:flex;flex-direction:column;gap:5px}
.toast{padding:8px 12px;border-radius:var(--r);font-size:11px;font-weight:500;border:1px solid;box-shadow:var(--sh2);animation:tin .2s ease;max-width:260px}
.toast.ok{background:var(--okb);border-color:var(--oke);color:var(--ok)}
.toast.er{background:var(--erb);border-color:var(--ere);color:var(--er)}
.toast.nfo{background:var(--acb);border-color:var(--ace);color:var(--ac)}
@keyframes tin{from{transform:translateX(16px);opacity:0}to{transform:translateX(0);opacity:1}}

.ovl{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px);padding:16px}
.ovl.hidden{display:none}
.modal{background:var(--bg);border:1px solid var(--bd);border-radius:var(--rl);box-shadow:var(--sh3);display:flex;flex-direction:column;width:100%;overflow:hidden}
.modal-sm{max-width:420px}
.mhd{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.mtitle{font-size:13px;font-weight:600}
.mclose{background:none;border:none;color:var(--txm);cursor:pointer;padding:2px 6px;border-radius:4px;font-size:15px;line-height:1;transition:var(--tr)}
.mclose:hover{background:var(--bg3);color:var(--tx)}
.mbody{padding:14px;display:flex;flex-direction:column;gap:12px}
.fg{display:flex;flex-direction:column;gap:4px}
.fl{font-size:11px;font-weight:600;color:var(--txm)}
.fin{width:100%;padding:7px 10px;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);font-size:13px;color:var(--tx);outline:none;transition:border-color var(--tr)}
.fin:focus{border-color:var(--ace)}
.fin::placeholder{color:var(--txs)}
.mfoot{padding:10px 14px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:6px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:var(--r);font-size:12px;font-weight:500;cursor:pointer;border:1px solid;transition:var(--tr)}
.bsec{background:var(--bg2);border-color:var(--bd);color:var(--tx)}.bsec:hover{background:var(--bg3)}
.bpri{background:var(--ac);border-color:transparent;color:#fff}.bpri:hover{background:var(--ach)}
.bdan{background:var(--erb);border-color:var(--ere);color:var(--er)}.bdan:hover{background:var(--er);color:#fff}

.mob-overlay{display:none;position:fixed;inset:0;top:48px;background:rgba(0,0,0,.4);z-index:39;backdrop-filter:blur(1px)}
.mob-overlay.on{display:block}

@media (max-width:768px){
  :root{--sw:0px;--aiw:0px}
  .logo span{display:none}
  .game-badge{display:none!important}
  .left-panel{position:fixed;top:48px;left:0;height:calc(100dvh - 48px);z-index:40;box-shadow:var(--sh3);width:0;transition:width .18s ease;border-right:none}
  .left-panel.mob{width:260px;border-right:1px solid var(--bd)}
  .left-panel.off{width:0}
  .right-panel{position:fixed;top:48px;right:0;height:calc(100dvh - 48px);z-index:40;box-shadow:var(--sh3);width:0;transition:width .18s ease;border-left:none}
  .right-panel.mob{width:300px;border-left:1px solid var(--bd)}
  .right-panel.off{width:0}
  .preview-section{height:38%;min-height:140px}
  .hdr{padding:0 8px}
  .ibtn span{display:none}
  .tool-btn span{display:none}
  .toolbar{gap:3px;padding:5px 8px}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-l">
    <button class="ibtn" id="menu-toggle" title="Toggle Explorer" style="padding:4px 6px">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M1 2.75A.75.75 0 0 1 1.75 2h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 2.75Zm0 5A.75.75 0 0 1 1.75 7h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 7.75ZM1.75 12h12.5a.75.75 0 0 1 0 1.5H1.75a.75.75 0 0 1 0-1.5Z"/></svg>
    </button>
    <div class="logo">
      <div class="logo-mark" style="background:none;padding:0;overflow:hidden">
        <img src="favicon.png" width="26" height="26" style="display:block;border-radius:6px;object-fit:cover" alt="Code Mon">
      </div>
      <span>Game Panel</span>
    </div>
    <div class="game-badge" id="game-badge"></div>
  </div>
  <div class="hdr-r">
    <button class="ibtn prev-btn hidden" id="live-preview-btn" title="Open Live Preview">
      <svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor"><path d="M3.75 2h3.5a.75.75 0 0 1 0 1.5h-3.5a.25.25 0 0 0-.25.25v8.5c0 .138.112.25.25.25h8.5a.25.25 0 0 0 .25-.25v-3.5a.75.75 0 0 1 1.5 0v3.5A1.75 1.75 0 0 1 12.25 14h-8.5A1.75 1.75 0 0 1 2 12.25v-8.5C2 2.784 2.784 2 3.75 2Zm6.854-1h4.146a.25.25 0 0 1 .25.25v4.146a.25.25 0 0 1-.427.177L13.03 4.03 9.28 7.78a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042l3.75-3.75-1.543-1.543A.25.25 0 0 1 10.604 1Z"/></svg>
      <span>Live Preview</span>
    </button>
    <button class="thbtn" id="theme-toggle">
      <span id="th-ico"></span>
      <span id="th-lbl"></span>
    </button>
    <button class="ibtn" id="ai-toggle" title="Toggle AI Copilot">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8Zm8-6.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13ZM6.5 7.75A.75.75 0 0 1 7.25 7h1a.75.75 0 0 1 .75.75v2.75h.25a.75.75 0 0 1 0 1.5h-2a.75.75 0 0 1 0-1.5h.25v-2h-.25a.75.75 0 0 1-.75-.75ZM8 6a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"/></svg>
      <span>Copilot</span>
    </button>
    <button class="ibtn" id="files-toggle" title="Toggle File Panel">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M10.561 8.073a6.005 6.005 0 0 1 3.432 5.142.75.75 0 0 1-1.498.07 4.5 4.5 0 0 0-8.99 0 .75.75 0 0 1-1.498-.07 6.004 6.004 0 0 1 3.431-5.142 3.999 3.999 0 1 1 5.123 0ZM8 4.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z"/></svg>
      <span>Files</span>
    </button>
  </div>
</header>

<div class="app">

  <aside class="left-panel" id="leftPanel">
    <div class="panel-hd">
      <span class="panel-title">Explorer</span>
    </div>
    <div class="file-tree" id="file-tree"></div>
  </aside>

  <div class="center-panel">
    <div class="toolbar">
      <button class="tool-btn" id="new-file-btn">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        <span>New</span>
      </button>
      <button class="tool-btn" id="upload-btn">
        <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
        <span>Upload</span>
      </button>
      <div class="tool-sep"></div>
      <button class="tool-btn" id="save-btn">
        <svg viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
        <span>Save</span>
      </button>
      <button class="tool-btn" id="delete-btn">
        <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
        <span>Delete</span>
      </button>
      <button class="tool-btn" id="download-btn">
        <svg viewBox="0 0 24 24"><path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2z"/></svg>
        <span>Download</span>
      </button>
      <div class="tool-sep"></div>
      <button class="tool-btn" id="refresh-preview-btn">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        <span>Refresh</span>
      </button>
    </div>

    <div class="preview-section">
      <div class="preview-bar">
        <svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor" style="color:var(--txm);flex-shrink:0"><path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8ZM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8Z"/><circle cx="8" cy="8" r="2"/></svg>
        <span class="preview-bar-title" id="preview-url-label">No preview</span>
        <button class="preview-open-btn" id="open-preview-tab">
          <svg width="10" height="10" viewBox="0 0 16 16" fill="currentColor"><path d="M3.75 2h3.5a.75.75 0 0 1 0 1.5h-3.5a.25.25 0 0 0-.25.25v8.5c0 .138.112.25.25.25h8.5a.25.25 0 0 0 .25-.25v-3.5a.75.75 0 0 1 1.5 0v3.5A1.75 1.75 0 0 1 12.25 14h-8.5A1.75 1.75 0 0 1 2 12.25v-8.5C2 2.784 2.784 2 3.75 2Zm6.854-1h4.146a.25.25 0 0 1 .25.25v4.146a.25.25 0 0 1-.427.177L13.03 4.03 9.28 7.78a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042l3.75-3.75-1.543-1.543A.25.25 0 0 1 10.604 1Z"/></svg>
          Open
        </button>
      </div>
      <iframe id="preview-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" allowfullscreen></iframe>
    </div>

    <div class="editor-section">
      <pre id="highlighted-code"><code></code></pre>
      <textarea id="editor" placeholder="Select a file to edit…" spellcheck="false"></textarea>
    </div>
  </div>

  <aside class="right-panel off" id="rightPanel" data-mob-open="false">
    <div class="ai-hd">
      <span class="ai-hd-title">Copilot</span>
      <select class="model-select" id="model-select"></select>
      <button class="think-btn" id="think-btn">
        <svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5A6.5 6.5 0 1 0 14.5 8 6.508 6.508 0 0 0 8 1.5ZM0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8Zm9 3a1 1 0 1 1-2 0 1 1 0 0 1 2 0ZM6.92 6.085c.081-.16.19-.299.34-.398.145-.097.371-.187.74-.187.28 0 .553.087.738.225A.613.613 0 0 1 9 6.25c0 .177-.04.264-.077.318a.956.956 0 0 1-.277.245c-.076.051-.158.1-.258.161l-.007.004a7.728 7.728 0 0 0-.313.195 2.416 2.416 0 0 0-.692.742A2.65 2.65 0 0 0 7 9h1.5a1.15 1.15 0 0 1 .025-.242 1.01 1.01 0 0 1 .274-.39 5.21 5.21 0 0 1 .197-.133l.01-.006.35-.214c.17-.105.36-.225.52-.35.22-.17.42-.38.57-.65.15-.27.22-.56.22-.865 0-.47-.17-.92-.47-1.26C9.83 4.72 9.33 4.5 8 4.5c-.636 0-1.162.156-1.58.438-.413.278-.71.657-.88 1.047Z"/></svg>
        Think
        <span class="think-dot" id="think-dot"></span>
      </button>
    </div>
    <div class="ai-chat-list" id="chat-tabs">
      <button class="new-chat-btn" id="new-chat-btn">
        <svg width="10" height="10" viewBox="0 0 16 16" fill="currentColor"><path d="M7.75 2a.75.75 0 0 1 .75.75V7h4.25a.75.75 0 0 1 0 1.5H8.5v4.25a.75.75 0 0 1-1.5 0V8.5H2.75a.75.75 0 0 1 0-1.5H7V2.75A.75.75 0 0 1 7.75 2Z"/></svg>
        New
      </button>
    </div>
    <div class="msgs" id="msgs">
      <div class="msgs-inner" id="msgs-inner"></div>
    </div>
    <div class="ai-input-zone">
      <div class="irow">
        <div class="twrap">
          <textarea class="minput" id="ai-input" placeholder="Ask about your game… (Enter to send)" rows="1"></textarea>
        </div>
        <button class="sbtn" id="ai-send">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M.989 8 .064 2.68a1.342 1.342 0 0 1 1.85-1.462l13.402 5.744a1.13 1.13 0 0 1 0 2.076L1.913 14.782a1.343 1.343 0 0 1-1.85-1.463L.99 8Zm.603-5.288L2.38 7.25h4.87a.75.75 0 0 1 0 1.5H2.38l-.788 4.538L13.929 8Z"/></svg>
        </button>
      </div>
      <div class="ihint" id="ai-hint">Asks about your current file &amp; game context</div>
    </div>
  </aside>

</div>

<div class="status-bar">
  <span class="status-item" id="status-file">No file open</span>
  <span class="status-item" id="status-lines">Lines: 0</span>
  <span class="status-item" id="status-game"></span>
</div>

<div class="mob-overlay" id="mob-overlay" onclick="closeMobPanels()"></div>

<div class="tstack" id="tstack"></div>

<div class="ovl hidden" id="new-file-ovl">
  <div class="modal modal-sm">
    <div class="mhd">
      <span class="mtitle">Create New File</span>
      <button class="mclose" onclick="document.getElementById('new-file-ovl').classList.add('hidden')">&#x2715;</button>
    </div>
    <div class="mbody">
      <div class="fg">
        <label class="fl">Filename</label>
        <input class="fin" type="text" id="new-file-path" placeholder="e.g. components/button.js">
      </div>
    </div>
    <div class="mfoot">
      <button class="btn bsec" onclick="document.getElementById('new-file-ovl').classList.add('hidden')">Cancel</button>
      <button class="btn bpri" id="new-file-create">Create</button>
    </div>
  </div>
</div>

<div class="ovl hidden" id="upload-ovl">
  <div class="modal modal-sm">
    <div class="mhd">
      <span class="mtitle">Upload File</span>
      <button class="mclose" onclick="document.getElementById('upload-ovl').classList.add('hidden')">&#x2715;</button>
    </div>
    <div class="mbody">
      <div class="fg">
        <label class="fl">Destination path</label>
        <input class="fin" type="text" id="upload-path" placeholder="e.g. assets/image.png">
      </div>
      <div class="fg">
        <label class="fl">File</label>
        <input type="file" id="upload-file" style="background:var(--bg2);color:var(--tx);border:1px solid var(--bd);border-radius:var(--r);padding:6px 8px;width:100%;font-size:12px">
      </div>
    </div>
    <div class="mfoot">
      <button class="btn bsec" onclick="document.getElementById('upload-ovl').classList.add('hidden')">Cancel</button>
      <button class="btn bpri" id="upload-confirm">Upload</button>
    </div>
  </div>
</div>

<script>
(function() {
  const API_BASE = "https://code-mon.codemon.workers.dev";
  const AI_URL   = "https://code-mon.codemon.workers.dev/api/agent";

  const username = localStorage.getItem("code-mon-username");
  const password = localStorage.getItem("code-mon-pass");
  if (!username || !password) { alert("Not logged in"); location.href = "login.html"; return; }

  const urlParams = new URLSearchParams(window.location.search);
  const gameName  = urlParams.get("game");
  if (!gameName) { alert("Missing game parameter"); history.back(); return; }

  const LS_CH  = "cm-gp-chats-" + gameName;
  const LS_CUR = "cm-gp-cur-" + gameName;
  const LS_TH  = "cm-theme";
  const HISTORY_LIMIT = 6;

  let gameConfig  = null;
  let currentFile = null;
  let orgName     = null;
  let currentDir  = "/";
  let previewUrl  = null;
  let liveIndexUrl = null;

  let chats    = {};
  let curId    = null;
  let thinkMode = false;
  let busy      = false;

  const api = {
    listDir: (user, dir) => `${API_BASE}/api/list-dir?user=${encodeURIComponent(user)}&dir=${encodeURIComponent(dir)}`,
    load: null, save: null, delete: null, previewBase: null
  };

  const MODEL_CONFIG = {
    "gpt-oss":{"name":"GPT-OSS"},
    "gpt-oss-120b":{"name":"GPT-OSS 120B"},
    "gpt-4o":{"name":"GPT-4o"},
    "gpt-4.1":{"name":"GPT-4.1"},
    "sonnet":{"name":"Claude 3.5 Sonnet"},
    "sonnet-4.6":{"name":"Claude Sonnet 4.6"},
    "haiku":{"name":"Claude Haiku"},
    "deepseek-3.2":{"name":"DeepSeek 3.2"},
    "qwen-coder":{"name":"Qwen Coder"},
    "grok-4.0":{"name":"Grok 4.0"},
    "code-mon-special":{"name":"Code Mon"}
  };

  const P_THINK = `You are a deep reasoning engine for Code Mon Game Copilot — an AI assistant embedded inside the Code Mon JavaScript Game Engine IDE.

PLATFORM: Code Mon is a browser-based JavaScript game engine. Games run entirely in the browser. All code is HTML/CSS/JavaScript. The platform hosts files at code-mon-space.shop domains and serves them directly to users' browsers.

Before the planner and code generator run, think carefully about the user request. Analyze the request, identify edge cases, unclear requirements, technical challenges, and the best approach. Be concise but insightful — 80-120 words. Plain text only. Think like a senior JavaScript game developer. Do NOT write code. Do NOT write the plan — just think out loud about what matters. If a file is open in the editor, its full content is in context — use it.

DEPLOY INTELLIGENCE: Only suggest deploying code for real, substantial requests — actual game features, bug fixes, new files, complete game builds. NEVER deploy for greetings, simple questions, trivial chat, or non-code requests. If the user just says "hello" or asks a question, answer it — do not write or deploy code.`;

  const P_EXPAND = `You are a coding task planner for Code Mon Game Copilot — embedded in the Code Mon JavaScript Game Engine IDE.

PLATFORM: Code Mon is a browser-based JavaScript game engine. All games run in the browser as HTML/CSS/JS. Files are served from code-mon-space.shop. The engine supports Three.js (3D), Matter.js (2D physics), and Code Mon ECS modules (to be provided by the user).

Your ONLY job: take the user request and output a concise implementation plan under 150 words. List which files to create/modify, what each contains, key logic steps. Plain text only — no code, no markdown. Be technical and minimal.

DEPLOY RULE: Only plan to deploy (include [DEPLOY:filename] token) when the user explicitly asks to deploy, host, publish, or go live — OR when the task is clearly about building/shipping a complete game or feature. NEVER plan a deploy for greetings, questions, small edits, or when the user is just chatting. The deploy token triggers a real API call that writes to the live server — use it responsibly.

If the request is conversational or non-code (e.g. "hello", "how are you", "explain X"), output a plan that says: respond conversationally only — do not generate any code or files.`;

  const P_CODE = `You are Code Mon Game Copilot — a precise AI coding assistant embedded inside the Code Mon JavaScript Game Engine IDE. You write clean, complete, production-quality JavaScript games and web apps.

== PLATFORM KNOWLEDGE ==
- Code Mon is a browser-based JavaScript Game Engine
- All games run in the browser as HTML/CSS/JavaScript
- Files are hosted at code-mon-space.shop and served directly
- The engine supports: Three.js (3D rendering), Matter.js (2D physics), Howler.js (audio), GSAP (animation)
- Import libraries via CDN in HTML: <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script` + `>
- Matter.js CDN: <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script` + `>
- Code Mon ECS modules will be provided by the user in the codebase — use them as shown in existing files
- Always write self-contained HTML files with embedded CSS and JS unless the user specifies separate files
- Game canvas should fill the full viewport: width:100vw; height:100vh; margin:0; overflow:hidden
- Use requestAnimationFrame for game loops, not setInterval

== FORMATTING RULES ==
Use markdown in all responses:
- **bold** for emphasis  \`inline\` for variables/functions
- \`\`\`lang\\ncode\\n\`\`\` for generic code snippets

== FILE CREATION (CRITICAL) ==
When writing code to be saved as a file, wrap it EXACTLY like:
\`\`\`[filename.ext]
code here
\`\`\`

RULES:
- Filename in square brackets at start of fence — no exceptions
- Correct extension always (.html .css .js .json etc.)
- One fenced block per file
- Write COMPLETE working code — never truncate, never use placeholders like "// rest of code here"
- If editing an existing file shown in context, rewrite the ENTIRE file — include all original content plus your changes

== DEPLOY SYSTEM ==
You have FULL PERMISSION to deploy files directly to the live server via the Code Mon API. When you output a file block AND include the token [DEPLOY:filename.ext] in your response, the system will automatically save that file to the live server.

DEPLOY RULES — READ CAREFULLY:
1. ONLY deploy for real, meaningful code tasks — new games, features, bug fixes, complete builds
2. NEVER deploy for: greetings, questions, explanations, small chat, "hello world" trivial things
3. If the user says "hello" or asks how you are — just reply conversationally, no code, no deploy
4. If the user asks to "deploy", "publish", "host", or "go live" — include [DEPLOY:filename.ext] after the file block
5. The correct API is already determined by the game type (personal vs org) — just output the token and the system handles it
6. After deploying, tell the user the file is live

== HARD RESTRICTIONS ==
- Never generate images, audio, video, or binary file content
- Text and source code only
- If the request is conversational (greetings, questions, chitchat) — respond conversationally with NO code blocks
- Stay focused and efficient`;

  function x(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function toast(msg, type) {
    const stack = document.getElementById("tstack");
    const el = document.createElement("div");
    el.className = "toast " + type;
    el.textContent = msg;
    stack.appendChild(el);
    setTimeout(() => { el.style.cssText = "opacity:0;transition:opacity .3s"; setTimeout(() => el.remove(), 300); }, 3000);
  }

  function scrollBot() {
    const el = document.getElementById("msgs");
    el.scrollTop = el.scrollHeight;
  }

  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    localStorage.setItem(LS_TH, t);
    document.getElementById("hljs-light").disabled = t === "dark";

    if (!content) throw new Error("Empty AI response");

  function getEditorContext() {
    const content = document.getElementById("editor").value;
    if (!currentFile || !content.trim()) return "";

  function parseAIFiles(text) {
    const out = {};
    const re = /```\[([^\]]+)\]\n([\s\S]*?)```/g;
    let m;
    while ((m = re.exec(text)) !== null) out[m[1].trim()] = m[2];
    return out;
  }

  async function aiDeployFile(filename, content) {
    const saveUrl = gameConfig.type === "personal"
      ? API_BASE + "/api/save"
      : API_BASE + "/api/save-org";
    const body = gameConfig.type === "personal"
      ? { user: username, pass: password, filename: filename, content: content }
      : { user: username, pass: password, orgName: orgName, filename: filename, content: content };
    const res  = await fetch(saveUrl, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    return true;
  }

  async function handleAIDeployTokens(finalAnswer) {
    const files = parseAIFiles(finalAnswer);
    const deployRe = /\[DEPLOY:([^\]]+)\]/g;
    let match;
    const deployed = [];
    while ((match = deployRe.exec(finalAnswer)) !== null) {
      const fname = match[1].trim();
      const content = files[fname];
      if (content !== undefined) {
        try {
          await aiDeployFile(fname, content);
          deployed.push(fname);
          toast("AI deployed: " + fname, "ok");
          await loadDirectory(currentDir);
          if (fname === currentFile) {
            document.getElementById("editor").value = content;
            updateSyntaxHighlighting();
            updateStatusBar();
            if (/\.(html?)$/i.test(fname)) refreshPreview(fname);
          }
        } catch(e) {
          toast("Deploy failed for " + fname + ": " + e.message, "er");
        }
      }
    }
    return deployed;
  }

  async function sendChat() {
    if (busy) return;
    const inp = document.getElementById("ai-input");
    const txt = inp.value.trim();
    if (!txt) return;

    const chat = chats[curId];
    if (!chat) return;

    if (!chat.msgs.length) {
      chat.title = txt.slice(0, 36) + (txt.length > 36 ? "…" : "");
      renderChatTabs();
    }

    chat.msgs.push({ role:"user", content:txt });
    addMsgDOM("user", txt, false);
    saveChats();

    inp.value = "";
    inp.style.height = "auto";

    busy = true;
    document.getElementById("ai-send").disabled = true;

    const thinkingEl = showThinking("Thinking…");

    try {
      const edCtx = getEditorContext();
      let thinkText = null;

      if (thinkMode) {
        updateThinking(thinkingEl, "Deep thinking…");
        const thinkPrompt = `${P_THINK}\n\nUser request: "${txt}"${edCtx}\nHistory: ${getHist(chat)}`;
        thinkText = await callAI("gpt-oss", thinkPrompt);
      }

      updateThinking(thinkingEl, "Planning…");
      const planPrompt = P_EXPAND + "\n\nRequest: \"" + txt + "\"" + edCtx + "\nGame: " + gameName + " | Type: " + (gameConfig ? gameConfig.type : "personal") + " | Starting dir: " + currentDir + "\nHistory: " + getHist(chat) + (thinkText ? "\n\nPre-analysis:\n" + thinkText : "");
      const plan = await callAI("gpt-oss", planPrompt);

      removeThinking(thinkingEl);
      const planEl = showPlanMessage(plan, thinkText);

      const finalPrompt = P_CODE + "\n\n== CONVERSATION HISTORY ==\n" + getHist(chat) + "\n\n" + (thinkText ? "== THINKING ==\n" + thinkText + "\n\n" : "") + "== PLAN ==\n" + plan + "\n\n" + edCtx + "\n\n== GAME INFO ==\nGame: " + gameName + " | Type: " + (gameConfig ? gameConfig.type : "personal") + " | Starting dir: " + currentDir + " | Current file: " + (currentFile || "none") + " | Deploy API: " + (gameConfig && gameConfig.type === "org" ? "save-org (use orgName=" + (orgName || "") + ")" : "save (personal)") + "\n\n== USER REQUEST ==\n" + txt + "\n\nRespond now:";
      const mainModel = document.getElementById("model-select").value;

      await new Promise(resolve => {
        const check = setInterval(() => {
          const ts = planEl.querySelector(".plan-typing");
          if (ts && ts.textContent.length >= plan.length) { clearInterval(check); resolve(); }
        }, 50);
      });

      const finalAnswer = await callAI(mainModel, finalPrompt);

      chat.msgs.push({ role:"assistant", content:finalAnswer });
      addMsgDOM("assistant", finalAnswer, true);
      saveChats();

      await handleAIDeployTokens(finalAnswer);

    } catch(err) {
      removeThinking(thinkingEl);
      const em = "**Error:** " + x(err.message || "Please try again.");
      if (chats[curId]) { chats[curId].msgs.push({ role:"assistant", content:em }); addMsgDOM("assistant", em, false); saveChats(); }
    }

    busy = false;
    document.getElementById("ai-send").disabled = false;
  }

  async function initGame() {
    try {
      const res = await fetch(`${API_BASE}/api/game?user=${encodeURIComponent(username)}&game=${encodeURIComponent(gameName)}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      gameConfig = data;
      currentDir = gameConfig.starting || "/";

      document.getElementById("game-badge").textContent = gameName;
      document.getElementById("game-badge").style.display = "flex";
      document.getElementById("status-game").textContent = gameName + " · " + gameConfig.type;

      if (gameConfig.type === "personal") {
        api.load    = f => `${API_BASE}/api/load?user=${encodeURIComponent(username)}&filename=${encodeURIComponent(f)}`;
        api.save    = `${API_BASE}/api/save`;
        api.delete  = `${API_BASE}/api/delete-file`;
        api.previewBase = `https://${username}.code-mon-space.shop/`;

        const sd = currentDir === "/" ? "" : currentDir.replace(/^\/+/, "") + "/";
        liveIndexUrl = `https://${username}.code-mon-space.shop/${sd}index.html`;
      } else {
        orgName = gameConfig.project;
        api.load    = f => `${API_BASE}/api/load-org?user=${encodeURIComponent(username)}&orgName=${encodeURIComponent(orgName)}&filename=${encodeURIComponent(f)}`;
        api.save    = `${API_BASE}/api/save-org`;
        api.delete  = `${API_BASE}/api/delete-org-file`;
        api.previewBase = `https://${orgName}.code-mon-space.shop/${username}/`;

        const sd = currentDir === "/" ? "" : currentDir.replace(/^\/+/, "") + "/";
        liveIndexUrl = `https://${orgName}.code-mon-space.shop/${username}/${sd}index.html`;
      }

      const liveBtn = document.getElementById("live-preview-btn");
      liveBtn.classList.remove("hidden");
      liveBtn.onclick = () => window.open(liveIndexUrl, "_blank");

      await loadDirectory(currentDir);
    } catch(e) {
      alert("Failed to load game: " + e.message);
      history.back();
    }
  }

  async function loadDirectory(dirPath) {
    let userParam = gameConfig.type === "personal" ? username : `org/${orgName}/${username}`;
    try {
      const res  = await fetch(api.listDir(userParam, dirPath));
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      renderFileTree(data.files, dirPath);
    } catch(e) { console.error("listDir failed:", e); }
  }

  function renderFileTree(files, dir) {
    const container = document.getElementById("file-tree");
    container.innerHTML = "";

    const tree = { folders:{}, files:[] };
    files.forEach(f => {
      const parts = f.split("/");
      if (parts.length === 1) {
        tree.files.push(f);
      } else {
        let level = tree;
        for (let i = 0; i < parts.length - 1; i++) {
          const folder = parts[i];
          if (!level.folders[folder]) level.folders[folder] = { folders:{}, files:[] };
          level = level.folders[folder];
        }
        level.files.push(parts[parts.length - 1]);
      }
    });

    function createFileItem(displayName, fullPath) {
      const div = document.createElement("div");
      div.className = "file-item" + (currentFile === fullPath ? " active" : "");
      div.dataset.path = fullPath;

      const ext = displayName.split(".").pop().toLowerCase();
      let cls = "default";
      if (["html","htm"].includes(ext)) cls = "html";
      else if (ext === "css") cls = "css";
      else if (["js","jsx","ts","tsx"].includes(ext)) cls = "js";
      else if (ext === "json") cls = "json";
      else if (ext === "py") cls = "py";
      else if (ext === "md") cls = "md";
      else if (ext === "txt") cls = "txt";

      div.innerHTML = `<svg class="file-icon ${cls}" viewBox="0 0 24 24"><path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z"/></svg><span>${x(displayName)}</span>`;
      div.addEventListener("click", () => openFile(fullPath));
      return div;
    }

    function renderNode(node, prefix) {
      const frag = document.createDocumentFragment();
      Object.keys(node.folders).sort().forEach(folderName => {
        const folderPath = prefix ? `${prefix}/${folderName}` : folderName;
        const folderDiv = document.createElement("div");
        folderDiv.className = "folder-item";
        folderDiv.innerHTML = `<svg class="folder-toggle" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5v10z"/></svg><svg class="folder-icon" viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg><span>${x(folderName)}</span>`;
        const contents = document.createElement("div");
        contents.className = "folder-contents";
        const toggle = folderDiv.querySelector(".folder-toggle");

        folderDiv.addEventListener("click", async e => {
          e.stopPropagation();
          const expanded = contents.classList.toggle("open");
          toggle.classList.toggle("open", expanded);
          if (expanded && contents.children.length === 0) {
            let up = gameConfig.type === "personal" ? username : `org/${orgName}/${username}`;
            try {
              const r = await fetch(api.listDir(up, folderPath));
              const d = await r.json();
              if (!d.error) {
                const subTree = { folders:{}, files:[] };
                d.files.forEach(f => {
                  const rel = f.startsWith(folderPath + "/") ? f.slice(folderPath.length + 1) : f;
                  const parts = rel.split("/");
                  if (parts.length === 1) {
                    subTree.files.push(rel);
                  } else {
                    let level = subTree;
                    for (let i = 0; i < parts.length - 1; i++) {
                      if (!level.folders[parts[i]]) level.folders[parts[i]] = { folders:{}, files:[] };
                      level = level.folders[parts[i]];
                    }
                    level.files.push(parts[parts.length - 1]);
                  }
                });

                function appendSubNode(node, pathPrefix, parentEl) {
                  Object.keys(node.folders).sort().forEach(subFolderName => {
                    const subFolderPath = pathPrefix + "/" + subFolderName;
                    const subFolderDiv = document.createElement("div");
                    subFolderDiv.className = "folder-item";
                    subFolderDiv.style.paddingLeft = "10px";
                    subFolderDiv.innerHTML = `<svg class="folder-toggle" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5v10z"/></svg><svg class="folder-icon" viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg><span>${x(subFolderName)}</span>`;
                    const subContents = document.createElement("div");
                    subContents.className = "folder-contents";
                    subContents.style.paddingLeft = "16px";
                    const subToggle = subFolderDiv.querySelector(".folder-toggle");
                    subFolderDiv.addEventListener("click", async ev => {
                      ev.stopPropagation();
                      const subExpanded = subContents.classList.toggle("open");
                      subToggle.classList.toggle("open", subExpanded);
                      if (subExpanded && subContents.children.length === 0) {
                        let up2 = gameConfig.type === "personal" ? username : `org/${orgName}/${username}`;
                        try {
                          const r2 = await fetch(api.listDir(up2, subFolderPath));
                          const d2 = await r2.json();
                          if (!d2.error) {
                            const subTree2 = { folders:{}, files:[] };
                            d2.files.forEach(f2 => {
                              const rel2 = f2.startsWith(subFolderPath + "/") ? f2.slice(subFolderPath.length + 1) : f2;
                              const parts2 = rel2.split("/");
                              if (parts2.length === 1) subTree2.files.push(rel2);
                              else {
                                let lvl = subTree2;
                                for (let i = 0; i < parts2.length - 1; i++) {
                                  if (!lvl.folders[parts2[i]]) lvl.folders[parts2[i]] = { folders:{}, files:[] };
                                  lvl = lvl.folders[parts2[i]];
                                }
                                lvl.files.push(parts2[parts2.length - 1]);
                              }
                            });
                            appendSubNode(subTree2, subFolderPath, subContents);
                          }
                        } catch(_) {}
                      }
                    });
                    parentEl.appendChild(subFolderDiv);
                    parentEl.appendChild(subContents);
                  });
                  node.files.sort().forEach(fileName => {
                    const fullFilePath = pathPrefix + "/" + fileName;
                    parentEl.appendChild(createFileItem(fileName, fullFilePath));
                  });
                }

                appendSubNode(subTree, folderPath, contents);
              }
            } catch(_) {}
          }
        });

        frag.appendChild(folderDiv);
        frag.appendChild(contents);
      });

      node.files.sort().forEach(file => {
        const fullPath = prefix ? `${prefix}/${file}` : file;
        frag.appendChild(createFileItem(file, fullPath));
      });

      return frag;
    }

    container.appendChild(renderNode(tree, ""));
  }

  async function openFile(path) {
    currentFile = path;
    document.querySelectorAll(".file-item").forEach(el => el.classList.remove("active"));
    const activeEl = document.querySelector(`.file-item[data-path="${CSS.escape(path)}"]`);
    if (activeEl) activeEl.classList.add("active");

    try {
      const url = api.load(path);
      const res = await fetch(url);
      const content = await res.text();
      document.getElementById("editor").value = content;
      updateSyntaxHighlighting();
      updateStatusBar();

      if (/\.(html?)$/i.test(path)) {
        refreshPreview(path);
      } else {
        document.getElementById("preview-frame").src = "about:blank";
        document.getElementById("preview-url-label").textContent = "No preview for this file type";
      }
    } catch(e) { toast("Failed to load: " + e.message, "er"); }
  }

  async function refreshPreview(path) {
    const iframe = document.getElementById("preview-frame");
    const pathClean = path.replace(/^\/+/, "");
    let liveUrl;
    if (gameConfig.type === "personal") {
      liveUrl = "https://" + username + ".code-mon-space.shop/" + pathClean;
    } else {
      liveUrl = "https://" + orgName + ".code-mon-space.shop/" + username + "/" + pathClean;
    }
    previewUrl = liveUrl;
    document.getElementById("preview-url-label").textContent = liveUrl;
    document.getElementById("open-preview-tab").onclick = () => window.open(liveUrl, "_blank");

    if (/\.(html?)$/i.test(path)) {
      try {
        const content = document.getElementById("editor").value;
        if (content.trim()) {
          const blob = new Blob([content], { type: "text/html" });
          const blobUrl = URL.createObjectURL(blob);
          if (iframe._prevBlobUrl) URL.revokeObjectURL(iframe._prevBlobUrl);
          iframe._prevBlobUrl = blobUrl;
          iframe.src = blobUrl;
        } else {
          iframe.src = "about:blank";
        }
      } catch(_) {
        iframe.src = "about:blank";
      }
    } else {
      iframe.src = "about:blank";
      document.getElementById("preview-url-label").textContent = "Preview only available for HTML files · " + liveUrl;
    }
  }

  function updateSyntaxHighlighting() {
    const editor = document.getElementById("editor");
    const highlighted = document.getElementById("highlighted-code");
    const codeEl = highlighted.querySelector("code");
    const content = editor.value;

    codeEl.textContent = content;
    codeEl.className = "";
    if (currentFile) {
      const ext = currentFile.split(".").pop().toLowerCase();
      const lang = ext2lang(ext);
      codeEl.className = "language-" + lang;
    }
    delete codeEl.dataset.highlighted;
    hljs.highlightElement(codeEl);
    highlighted.scrollTop = editor.scrollTop;
    highlighted.scrollLeft = editor.scrollLeft;
  }

  function updateStatusBar() {
    const lines = document.getElementById("editor").value.split("\n").length;
    document.getElementById("status-file").textContent = currentFile || "No file open";
    document.getElementById("status-lines").textContent = "Lines: " + lines;
  }

  async function saveCurrentFile() {
    if (!currentFile) return toast("No file open", "er");
    const content = document.getElementById("editor").value;
    const body = gameConfig.type === "personal"
      ? { user:username, pass:password, filename:currentFile, content }
      : { user:username, pass:password, orgName, filename:currentFile, content };
    try {
      const res  = await fetch(api.save, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      toast("Saved!", "ok");
      if (/\.(html?)$/i.test(currentFile)) await refreshPreview(currentFile);
    } catch(e) { toast("Save failed: " + e.message, "er"); }
  }

  async function deleteCurrentFile() {
    if (!currentFile) return toast("No file selected", "er");
    if (!confirm("Delete " + currentFile + "?")) return;
    const body = gameConfig.type === "personal"
      ? { username, pass:password, filename:currentFile }
      : { username, pass:password, orgName, filename:currentFile };
    try {
      const res  = await fetch(api.delete, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      toast("Deleted", "ok");
      currentFile = null;
      document.getElementById("editor").value = "";
      updateSyntaxHighlighting();
      updateStatusBar();
      document.getElementById("preview-frame").src = "about:blank";
      await loadDirectory(currentDir);
    } catch(e) { toast("Delete failed: " + e.message, "er"); }
  }

  async function createFile(path) {
    const fullPath = currentDir === "/" ? path : currentDir + "/" + path;
    const body = gameConfig.type === "personal"
      ? { user:username, pass:password, filename:fullPath, content:"" }
      : { user:username, pass:password, orgName, filename:fullPath, content:"" };
    try {
      const res  = await fetch(api.save, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      toast("File created", "ok");
      await loadDirectory(currentDir);
      openFile(fullPath);
    } catch(e) { toast("Create failed: " + e.message, "er"); }
  }

  async function uploadFile(destPath, file) {
    const fullPath = currentDir === "/" ? destPath : currentDir + "/" + destPath;
    const isMedia = /\.(png|jpg|jpeg|gif|webp|svg|mp4|mp3|wav|avi|mov|ico)$/i.test(file.name);

    if (!isMedia) {
      const reader = new FileReader();
      reader.onload = async e => {
        const body = gameConfig.type === "personal"
          ? { user:username, pass:password, filename:fullPath, content:e.target.result }
          : { user:username, pass:password, orgName, filename:fullPath, content:e.target.result };
        try {
          const res  = await fetch(api.save, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
          const data = await res.json();
          if (data.error) throw new Error(data.error);
          toast("Uploaded!", "ok");
          await loadDirectory(currentDir);
          openFile(fullPath);
        } catch(e) { toast("Upload failed: " + e.message, "er"); }
      };
      reader.readAsText(file);
    } else {
      const reader = new FileReader();
      reader.onload = async e => {
        const endpoint = gameConfig.type === "personal" ? "/api/img-save" : "/api/img-save-org";
        const headers = gameConfig.type === "personal"
          ? { "x-user":username, "x-pass":password, "x-filename":fullPath }
          : { "x-user":username, "x-pass":password, "x-org":orgName, "x-filename":fullPath };
        try {
          const res  = await fetch(API_BASE + endpoint, { method:"POST", headers, body:e.target.result });
          const data = await res.json();
          if (data.error) throw new Error(data.error);
          toast("Media uploaded!", "ok");
          await loadDirectory(currentDir);
        } catch(e) { toast("Upload failed: " + e.message, "er"); }
      };
      reader.readAsArrayBuffer(file);
    }
  }

  function downloadCurrentFile() {
    if (!currentFile) return toast("No file open", "er");
    const content = document.getElementById("editor").value;
    const blob = new Blob([content], { type:"text/plain" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href = url; a.download = currentFile.split("/").pop(); a.click();
    URL.revokeObjectURL(url);
  }

  function toggleLeftPanel() {
    const lp = document.getElementById("leftPanel");
    const ov = document.getElementById("mob-overlay");
    if (window.innerWidth <= 768) {
      const opening = !lp.classList.contains("mob");
      document.getElementById("rightPanel").classList.remove("mob");
      lp.classList.toggle("mob");
      ov.classList.toggle("on", opening);
    } else {
      lp.classList.toggle("off");
    }
  }

  function toggleRightPanel() {
    const rp = document.getElementById("rightPanel");
    const ov = document.getElementById("mob-overlay");
    if (window.innerWidth <= 768) {
      const opening = !rp.classList.contains("mob");
      document.getElementById("leftPanel").classList.remove("mob");
      if (opening) {
        rp.classList.remove("off");
        rp.classList.add("mob");
        ov.classList.add("on");
      } else {
        rp.classList.remove("mob");
        ov.classList.remove("on");
      }
    } else {
      rp.classList.toggle("off");
    }
  }

  window.closeMobPanels = function() {
    document.getElementById("leftPanel").classList.remove("mob");
    const rp = document.getElementById("rightPanel");
    rp.classList.remove("mob");
    document.getElementById("mob-overlay").classList.remove("on");
  };

  document.getElementById("menu-toggle").addEventListener("click", toggleLeftPanel);
  document.getElementById("ai-toggle").addEventListener("click", () => {
    toggleRightPanel();
    document.getElementById("ai-toggle").classList.toggle("on", !document.getElementById("rightPanel").classList.contains("off"));
  });
  document.getElementById("files-toggle").addEventListener("click", () => {
    const lp = document.getElementById("leftPanel");
    if (window.innerWidth <= 768) {
      const opening = !lp.classList.contains("mob");
      document.getElementById("rightPanel").classList.remove("mob");
      lp.classList.toggle("mob");
      document.getElementById("mob-overlay").classList.toggle("on", opening);
    } else {
      lp.classList.toggle("off");
    }
  });

  document.getElementById("theme-toggle").addEventListener("click", () => {
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });

  document.getElementById("think-btn").addEventListener("click", () => {
    thinkMode = !thinkMode;
    document.getElementById("think-btn").classList.toggle("on", thinkMode);
    document.getElementById("think-dot").style.display = thinkMode ? "inline-block" : "none";
    toast(thinkMode ? "Thinking mode ON" : "Thinking mode OFF", thinkMode ? "nfo" : "ok");
  });

  document.getElementById("new-chat-btn").addEventListener("click", newChat);

  document.getElementById("ai-send").addEventListener("click", sendChat);
  document.getElementById("ai-input").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); }
  });
  document.getElementById("ai-input").addEventListener("input", function() {
    this.style.height = "auto";
    this.style.height = Math.min(this.scrollHeight, 120) + "px";
  });

  document.getElementById("editor").addEventListener("input", () => { updateSyntaxHighlighting(); updateStatusBar(); });
  document.getElementById("editor").addEventListener("scroll", function() {
    document.getElementById("highlighted-code").scrollTop = this.scrollTop;
    document.getElementById("highlighted-code").scrollLeft = this.scrollLeft;
  });

  document.getElementById("editor").addEventListener("keydown", e => {
    if (e.key === "Tab") {
      e.preventDefault();
      const start = e.target.selectionStart;
      const end   = e.target.selectionEnd;
      e.target.value = e.target.value.substring(0, start) + "  " + e.target.value.substring(end);
      e.target.selectionStart = e.target.selectionEnd = start + 2;
      updateSyntaxHighlighting();
    }
  });

  document.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); saveCurrentFile(); }
  });

  document.getElementById("new-file-btn").addEventListener("click", () => {
    document.getElementById("new-file-ovl").classList.remove("hidden");
    document.getElementById("new-file-path").value = "";
    document.getElementById("new-file-path").focus();
  });
  document.getElementById("new-file-create").addEventListener("click", () => {
    const path = document.getElementById("new-file-path").value.trim();
    if (!path) return;
    document.getElementById("new-file-ovl").classList.add("hidden");
    createFile(path);
  });
  document.getElementById("new-file-path").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("new-file-create").click();
  });

  document.getElementById("upload-btn").addEventListener("click", () => {
    document.getElementById("upload-ovl").classList.remove("hidden");
  });
  document.getElementById("upload-confirm").addEventListener("click", () => {
    const path = document.getElementById("upload-path").value.trim();
    const fi   = document.getElementById("upload-file");
    if (!path || !fi.files.length) { toast("Path and file required", "er"); return; }
    document.getElementById("upload-ovl").classList.add("hidden");
    uploadFile(path, fi.files[0]);
  });

  document.getElementById("save-btn").addEventListener("click", saveCurrentFile);
  document.getElementById("delete-btn").addEventListener("click", deleteCurrentFile);
  document.getElementById("download-btn").addEventListener("click", downloadCurrentFile);
  document.getElementById("refresh-preview-btn").addEventListener("click", async () => {
    if (currentFile) await refreshPreview(currentFile);
  });

  loadTheme();
  populateModelSelect();
  loadChats();
  if (!curId || !chats[curId]) newChat();
  else { renderChatTabs(); renderMsgs(); }
  initGame();

})();
</script>
