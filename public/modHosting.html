<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mods Hosting</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        h1 {
            font-size: 4rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 4rem;
            background: linear-gradient(135deg, #ffffff, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
        }

        .card {
            background: #111118;
            border: 1px solid #1f1f2a;
            border-radius: 40px;
            padding: 2.5rem;
            width: 380px;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 20px 35px -10px #00000080;
            text-decoration: none;
            display: block;
            color: inherit;
        }

        .card:hover {
            border-color: #4f46e5;
            transform: translateY(-5px);
            box-shadow: 0 30px 45px -15px #000, 0 0 0 1px #4f46e540 inset;
        }

        .image-wrapper {
            width: 100%;
            height: 220px;
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 1.8rem;
            background: #1a1a24;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card h2 {
            font-size: 2rem;
            font-weight: 600;
            color: #f0f0ff;
            margin-bottom: 0.75rem;
        }

        .card p {
            color: #9ca3af;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .badge {
            display: inline-block;
            background: #1e1e2a;
            color: #a78bfa;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid #2e2e40;
        }
    </style>
</head>
<body>
    <h1>Mods Hosting</h1>
    
    <a href="minecraft-addon-builder.html" class="card">
        <div class="image-wrapper">
            <img src="minecraft.png" alt="Minecraft">
        </div>
        <h2>Minecraft</h2>
        <p>host your minecraft mods, addons, and modpacks with high performance and instant setup</p>
        <span class="badge">addon hosting</span>
    </a>
</body>
</html>
