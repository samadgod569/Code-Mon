<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Code-Mon Installer Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="img/icon.png">
<style>
:root{
  --bg:#020617;
  --panel:#020617cc;
  --border:#1e293b;
  --text:#e5e7eb;
  --muted:#94a3b8;
  --primary:#2563eb;
  --primary2:#7c3aed;
}
*{box-sizing:border-box}
body{
  margin:0;
  height:100vh;
  background:
    radial-gradient(1200px 600px at top,#1e1b4b 0%,transparent 60%),
    radial-gradient(800px 400px at bottom,#0f172a 0%,transparent 60%),
    var(--bg);
  font-family:system-ui,-apple-system,BlinkMacSystemFont;
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
}
.app{
  width:900px;
  max-width:96%;
  background:var(--panel);
  backdrop-filter:blur(14px);
  border-radius:18px;
  box-shadow:0 40px 120px rgba(0,0,0,.75), inset 0 0 0 1px var(--border);
  overflow:hidden;
}
header{
  padding:22px 26px;
  font-size:22px;
  font-weight:700;
  background:linear-gradient(90deg,var(--primary),var(--primary2));
}
.content{
  padding:24px;
  display:grid;
  gap:16px;
}
label{
  font-size:13px;
  color:var(--muted);
}
input{
  width:100%;
  background:#020617;
  border:1px solid var(--border);
  border-radius:12px;
  color:var(--text);
  padding:14px 16px;
  font-size:15px;
  outline:none;
}
button{
  padding:14px 26px;
  border-radius:14px;
  border:none;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:white;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}
button:hover{
  box-shadow:0 14px 40px rgba(124,58,237,.45);
}
pre{
  background:#020617;
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
  max-height:300px;
  overflow:auto;
  font-size:13px;
  white-space:pre-wrap;
}
.loading{
  color:var(--muted);
  animation:pulse 1.2s infinite;
}
@keyframes pulse{
  0%{opacity:.4}
  50%{opacity:1}
  100%{opacity:.4}
}
</style>
</head>

<body>

<div class="app">
  <header>Create Install Page</header>

  <div class="content">
    <label>User</label>
    <input id="user" placeholder="C69P2W">

    <label>Password</label>
    <input id="pass" type="password" placeholder="••••••••">

    <button onclick="build()">Generate install page</button>

    <div id="status" class="loading" style="display:none">Processing…</div>
    <pre id="log"></pre>
  </div>
</div>

<script>
      (async function() {
    const API = "https://code-mon.codemon.workers.dev";

    const username = localStorage.getItem("code-mon-username");
    const password = localStorage.getItem("code-mon-pass");

    //  No credentials → go to login
    if (!username || !password) {
        localStorage.clear();
        location.href = "login.html";
        return;
    }

    try {
        const res = await fetch(`${API}/api/pass?username=${username}&pass=${password}`);
        const data = await res.json();

        //  Wrong password / user not found
        if (!data.success) {
            localStorage.removeItem("code-mon-username");
            localStorage.removeItem("code-mon-pass");
            localStorage.removeItem("user");

            location.href = "login.html";
            return;
        }

        //  Auth success → continue loading file.html normally
        console.log("User authenticated:", username);

    } catch (err) {
        // Network failure = prevent access
        localStorage.clear();
        location.href = "login.html";
    }
})();
async function build(){
  const userInput = document.getElementById("user");
  const passInput = document.getElementById("pass");
  const status = document.getElementById("status");
  const log = document.getElementById("log");

  const user = userInput.value.trim();
  const pass = passInput.value.trim();

  if(!user || !pass){
    alert("Missing credentials");
    return;
  }

  status.style.display = "block";
  log.textContent = "Loading original file…";

  try{
    const res = await fetch(
      "https://code-mon.codemon.workers.dev/api/load?user=C69P2W&filename=test.html"
    );

    let code = await res.text();

    code = code.replace(
      /<link[^>]*rel=["']manifest["'][^>]*href=["'][^"']*_manifest\.json["'][^>]*>/i,
      `<link rel="manifest" href="${user}_manifest.json">`
    );

    log.textContent = "Manifest link replaced.\nSaving install.html…";

    await fetch("https://code-mon.codemon.workers.dev/api/save",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        user: user,
        pass: pass,
        filename: "install.html",
        content: code
      })
    });

    log.textContent = "✔ install.html created successfully";
window.location.href = `https://code-mon-space.pages.dev/@me?user=${user}&filename=install.html`;
  }catch(e){
    log.textContent = "ERROR: " + e.message;
  }finally{
    status.style.display = "none";
  }
}
</script>

</body>
</html>
