<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Panel · Code Mon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #1e1e1e;
            --bg-secondary: #252526;
            --bg-tertiary: #2d2d30;
            --bg-card: #3e3e42;
            --bg-hover: #3e3e42;
            --bg-active: #094771;
            --border: #454545;
            --border-light: #4f4f4f;
            --text-primary: #cccccc;
            --text-secondary: #858585;
            --text-dim: #6b7280;
            --accent-blue: #569cd6;
            --accent-purple: #c586c0;
            --accent-green: #4ec9b0;
            --accent-orange: #ce9178;
            --accent-yellow: #dcdcaa;
            --accent-red: #f44747;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            font-size: 13px;
            line-height: 1.5;
        }

        /* Layout */
        .app {
            display: flex;
            height: 100vh;
        }

        /* Left Panel - File Explorer */
        .left-panel {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        .panel-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-header svg {
            width: 14px;
            height: 14px;
            fill: var(--accent-blue);
        }

        .file-tree {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .folder-item, .file-item {
            display: flex;
            align-items: center;
            padding: 4px 12px;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
            transition: background 0.2s;
            user-select: none;
        }

        .folder-item:hover, .file-item:hover {
            background: var(--bg-hover);
        }

        .file-item.active {
            background: var(--bg-active);
        }

        .folder-item .icon, .file-item .icon {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            flex-shrink: 0;
        }

        .folder-item .icon { fill: var(--accent-yellow); }
        .file-item .icon.html { fill: #e34c26; }
        .file-item .icon.css { fill: #264de4; }
        .file-item .icon.js { fill: #f0db4f; }
        .file-item .icon.json { fill: #5dc9e2; }
        .file-item .icon.py { fill: #3776ab; }
        .file-item .icon.java { fill: #5382a1; }
        .file-item .icon.cpp { fill: #00599c; }
        .file-item .icon.md { fill: #ffffff; }
        .file-item .icon.txt { fill: #c0c0c0; }
        .file-item .icon.default { fill: #cccccc; }

        .folder-item .toggle {
            width: 16px;
            height: 16px;
            margin-right: 4px;
            fill: var(--text-secondary);
            transition: transform 0.2s;
        }

        .folder-item .toggle.expanded {
            transform: rotate(90deg);
        }

        .folder-contents {
            display: none;
            padding-left: 20px;
        }

        .folder-contents.expanded {
            display: block;
        }

        /* Center Panel */
        .center-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .toolbar {
            padding: 8px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tool-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 12px;
            padding: 4px 8px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: var(--bg-hover);
            border-color: var(--accent-blue);
        }

        .tool-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .iframe-container {
            width: 100%;
            height: 40%;
            min-height: 200px;
            background: white;
            border-bottom: 1px solid var(--border);
        }

        #preview-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        .editor-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: var(--bg-primary);
        }

        #editor {
            width: 100%;
            height: 100%;
            padding: 16px;
            background: transparent;
            border: none;
            color: #c9d1d9;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            line-height: 1.6;
            resize: none;
            outline: none;
            tab-size: 4;
            overflow: auto;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            caret-color: #c9d1d9;
        }

        #highlighted-code {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 16px;
            margin: 0;
            overflow: auto;
            pointer-events: none;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            background: var(--bg-primary);
            z-index: 0;
        }

        #highlighted-code code {
            background: transparent !important;
            padding: 0 !important;
        }

        /* Right Panel - AI Copilot */
        .right-panel {
            width: 300px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            gap: 8px;
        }

        .message.ai {
            flex-direction: row;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            background: var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .message.ai .avatar {
            background: var(--accent-blue);
            color: white;
        }

        .bubble {
            max-width: calc(100% - 32px);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.5;
            word-break: break-word;
        }

        .message.ai .bubble {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
        }

        .message.user .bubble {
            background: var(--accent-blue);
            color: white;
        }

        .chat-input-area {
            padding: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
        }

        #chat-input {
            flex: 1;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-primary);
            padding: 8px;
            font-size: 12px;
            resize: none;
            outline: none;
        }

        #chat-send {
            background: var(--accent-blue);
            border: none;
            border-radius: 4px;
            color: white;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        #chat-send svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .file-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 2px 6px;
            margin: 2px;
            font-size: 11px;
        }

        .file-chip svg {
            width: 12px;
            height: 12px;
        }

        /* Status bar */
        .status-bar {
            height: 22px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 16px;
            font-size: 11px;
            color: var(--text-secondary);
            gap: 20px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            padding: 20px;
        }

        .modal h3 {
            margin-bottom: 16px;
        }

        .modal-input {
            width: 100%;
            padding: 8px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
<div class="app">
    <!-- Left Panel: File Tree -->
    <div class="left-panel">
        <div class="panel-header">
            <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
            <span>EXPLORER</span>
        </div>
        <div class="file-tree" id="file-tree"></div>
    </div>

    <!-- Center Panel: Editor + Preview -->
    <div class="center-panel">
        <div class="toolbar" id="toolbar">
            <button class="tool-btn" id="new-file-btn">
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                New File
            </button>
            <button class="tool-btn" id="upload-btn">
                <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
                Upload
            </button>
            <button class="tool-btn" id="save-btn">
                <svg viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
                Save
            </button>
            <button class="tool-btn" id="delete-btn">
                <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                Delete
            </button>
            <button class="tool-btn" id="download-btn">
                <svg viewBox="0 0 24 24"><path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2z"/></svg>
                Download
            </button>
        </div>
        <div class="iframe-container">
            <iframe id="preview-frame" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
        </div>
        <div class="editor-wrapper">
            <pre id="highlighted-code"><code></code></pre>
            <textarea id="editor" spellcheck="false" placeholder="Select a file to edit..."></textarea>
        </div>
    </div>

    <!-- Right Panel: AI Copilot -->
    <div class="right-panel">
        <div class="panel-header">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
            <span>CO-PILOT</span>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="message ai">
                <div class="avatar">AI</div>
                <div class="bubble">I'm your game dev copilot. I know Code Mon ECS modules. Ask me to generate code, fix bugs, or deploy files.</div>
            </div>
        </div>
        <div class="chat-input-area">
            <textarea id="chat-input" rows="2" placeholder="Ask anything..."></textarea>
            <button id="chat-send">
                <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
            </button>
        </div>
    </div>
</div>

<!-- Status Bar -->
<div class="status-bar">
    <div class="status-item" id="status-file">No file</div>
    <div class="status-item" id="status-type">Type: -</div>
    <div class="status-item" id="status-lines">Lines: 0</div>
</div>

<!-- Modals -->
<div class="modal-overlay" id="new-file-modal">
    <div class="modal">
        <h3>Create New File</h3>
        <input type="text" class="modal-input" id="new-file-path" placeholder="path/file.js">
        <div class="modal-actions">
            <button class="tool-btn" id="new-file-cancel">Cancel</button>
            <button class="tool-btn" id="new-file-create">Create</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="upload-modal">
    <div class="modal">
        <h3>Upload File</h3>
        <input type="text" class="modal-input" id="upload-path" placeholder="destination/file.txt">
        <input type="file" id="upload-file" style="margin-bottom:16px; background:var(--bg-primary); color:var(--text-primary);">
        <div class="modal-actions">
            <button class="tool-btn" id="upload-cancel">Cancel</button>
            <button class="tool-btn" id="upload-confirm">Upload</button>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---------- CONFIG ----------
        const API_BASE = "https://code-mon.codemon.workers.dev";
        const username = localStorage.getItem("code-mon-username");
        const password = localStorage.getItem("code-mon-pass");
        if (!username || !password) {
            alert("Not logged in. Redirecting to login.");
            location.href = "login.html";
            return;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const gameName = urlParams.get("game");
        if (!gameName) {
            alert("Missing game parameter.");
            history.back();
            return;
        }

        // Game config
        let gameConfig = null; // { type, project, starting }
        let currentFile = null;
        let fileContent = "";
        let fileStructure = {}; // will be built on demand
        let orgName = null; // for org type

        // API endpoints based on type
        let api = {
            listDir: (user, dir) => `${API_BASE}/api/list-dir?user=${encodeURIComponent(user)}&dir=${encodeURIComponent(dir)}`,
            load: null,
            save: null,
            delete: null,
            upload: null,
            previewBase: null,
        };

        // ---------- INIT: fetch game config ----------
        (async function init() {
            try {
                const res = await fetch(`${API_BASE}/api/game?user=${encodeURIComponent(username)}&game=${encodeURIComponent(gameName)}`);
                const data = await res.json();
                if (data.error) {
                    alert("Game not found: " + data.error);
                    history.back();
                    return;
                }
                gameConfig = data; // { type, project, starting }
                document.getElementById('status-file').textContent = `Game: ${gameName}`;

                // Configure APIs based on type
                if (gameConfig.type === 'personal') {
                    // personal: project = username (from config, but we'll use stored username)
                    api.load = (filename) => `${API_BASE}/api/load?user=${encodeURIComponent(username)}&filename=${encodeURIComponent(filename)}`;
                    api.save = `${API_BASE}/api/save`;
                    api.delete = `${API_BASE}/api/delete-file`;
                    api.upload = `${API_BASE}/api/save`; // same as save for text, but we'll handle binary separately
                    api.previewBase = `https://${username}.code-mon-space.shop/`;
                } else {
                    // organization
                    orgName = gameConfig.project;
                    api.load = (filename) => `${API_BASE}/api/load-org?user=${encodeURIComponent(username)}&orgName=${encodeURIComponent(orgName)}&filename=${encodeURIComponent(filename)}`;
                    api.save = `${API_BASE}/api/save-org`;
                    api.delete = `${API_BASE}/api/delete-org-file`;
                    api.upload = `${API_BASE}/api/save-org`;
                    api.previewBase = `https://${orgName}.code-mon-space.shop/${username}/`;
                }

                // Initial load of file tree at starting directory
                await loadDirectory(gameConfig.starting || '/');
            } catch (e) {
                alert("Failed to load game: " + e.message);
            }
        })();

        // ---------- File Tree ----------
        async function loadDirectory(dirPath) {
            let userParam;
            if (gameConfig.type === 'personal') {
                userParam = username;
            } else {
                // For org, we need to use the special prefix: org/orgName/username
                userParam = `org/${orgName}/${username}`;
            }
            const url = api.listDir(userParam, dirPath);
            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                // data.files is list of filenames relative to user prefix (e.g., ["src/main.js", "index.html"])
                // We need to build tree from these paths relative to current dir.
                // For simplicity, we'll just display them as flat list with folder icons based on '/' presence.
                // Better: build hierarchical tree. We'll implement recursive folder building.
                renderFileTree(data.files, dirPath);
            } catch (e) {
                console.error("Failed to list dir", e);
            }
        }

        function renderFileTree(files, currentDir) {
            const container = document.getElementById('file-tree');
            container.innerHTML = '';

            // Build structure from full paths
            const tree = { folders: {}, files: [] };
            files.forEach(f => {
                const parts = f.split('/');
                if (parts.length === 1) {
                    tree.files.push(f);
                } else {
                    let level = tree;
                    for (let i = 0; i < parts.length - 1; i++) {
                        const folder = parts[i];
                        if (!level.folders[folder]) level.folders[folder] = { folders: {}, files: [] };
                        level = level.folders[folder];
                    }
                    level.files.push(parts[parts.length - 1]);
                }
            });

            function renderNode(node, pathPrefix = '') {
                const fragment = document.createDocumentFragment();

                // Folders
                Object.keys(node.folders).sort().forEach(folderName => {
                    const folderPath = pathPrefix ? `${pathPrefix}/${folderName}` : folderName;
                    const folderDiv = document.createElement('div');
                    folderDiv.className = 'folder-item';
                    folderDiv.innerHTML = `
                        <svg class="toggle" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5v10z"/></svg>
                        <svg class="icon" viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
                        <span>${folderName}</span>
                    `;
                    const contentsDiv = document.createElement('div');
                    contentsDiv.className = 'folder-contents';

                    const toggle = folderDiv.querySelector('.toggle');
                    folderDiv.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        const expanded = contentsDiv.classList.toggle('expanded');
                        toggle.classList.toggle('expanded', expanded);
                        if (expanded && contentsDiv.children.length === 0) {
                            // lazy load subfolder contents
                            const subPath = folderPath;
                            let userParam;
                            if (gameConfig.type === 'personal') {
                                userParam = username;
                            } else {
                                userParam = `org/${orgName}/${username}`;
                            }
                            const subUrl = api.listDir(userParam, subPath);
                            try {
                                const res = await fetch(subUrl);
                                const data = await res.json();
                                if (!data.error) {
                                    const subTree = { folders: {}, files: [] };
                                    data.files.forEach(f => {
                                        const rel = f.replace(subPath + '/', '');
                                        if (!rel.includes('/')) {
                                            subTree.files.push(rel);
                                        } else {
                                            // we ignore deeper nesting for simplicity; could recurse but keep one level
                                            // better: just show files directly, no deeper folders?
                                        }
                                    });
                                    subTree.files.sort().forEach(file => {
                                        const fileItem = createFileItem(file, folderPath + '/' + file);
                                        contentsDiv.appendChild(fileItem);
                                    });
                                }
                            } catch (err) {}
                        }
                    });

                    folderDiv.appendChild(contentsDiv);
                    fragment.appendChild(folderDiv);
                });

                // Files
                node.files.sort().forEach(file => {
                    const fullPath = pathPrefix ? `${pathPrefix}/${file}` : file;
                    const fileItem = createFileItem(file, fullPath);
                    fragment.appendChild(fileItem);
                });

                return fragment;
            }

            function createFileItem(displayName, fullPath) {
                const div = document.createElement('div');
                div.className = 'file-item';
                if (currentFile === fullPath) div.classList.add('active');
                div.dataset.path = fullPath;

                const ext = displayName.split('.').pop().toLowerCase();
                let iconClass = 'default';
                if (['html','htm'].includes(ext)) iconClass = 'html';
                else if (ext === 'css') iconClass = 'css';
                else if (['js','jsx'].includes(ext)) iconClass = 'js';
                else if (ext === 'json') iconClass = 'json';
                else if (ext === 'py') iconClass = 'py';
                else if (ext === 'java') iconClass = 'java';
                else if (ext === 'cpp' || ext === 'c') iconClass = 'cpp';
                else if (ext === 'md') iconClass = 'md';
                else if (ext === 'txt') iconClass = 'txt';

                div.innerHTML = `
                    <svg class="icon ${iconClass}" viewBox="0 0 24 24"><path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z"/></svg>
                    <span>${displayName}</span>
                `;
                div.addEventListener('click', () => openFile(fullPath));
                return div;
            }

            const rootNode = renderNode(tree);
            container.appendChild(rootNode);
        }

        // ---------- File Operations ----------
        async function openFile(path) {
            currentFile = path;
            document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
            const activeEl = Array.from(document.querySelectorAll('.file-item')).find(el => el.dataset.path === path);
            if (activeEl) activeEl.classList.add('active');

            try {
                const url = api.load(path);
                const res = await fetch(url);
                const content = await res.text();
                fileContent = content;
                document.getElementById('editor').value = content;
                updateSyntaxHighlighting();
                updateStatusBar();

                // If it's an HTML file, refresh preview
                if (path.endsWith('.html') || path.endsWith('.htm')) {
                    refreshPreview(path, content);
                }
            } catch (e) {
                alert("Failed to load file: " + e.message);
            }
        }

        function updateSyntaxHighlighting() {
            const editor = document.getElementById('editor');
            const highlighted = document.getElementById('highlighted-code');
            const codeEl = highlighted.querySelector('code');
            const content = editor.value;

            codeEl.textContent = content;
            codeEl.className = '';
            if (currentFile) {
                const ext = currentFile.split('.').pop().toLowerCase();
                const langMap = {
                    js: 'javascript', jsx: 'javascript', ts: 'typescript', html: 'html', css: 'css',
                    json: 'json', py: 'python', java: 'java', cpp: 'cpp', c: 'cpp', md: 'markdown',
                };
                const lang = langMap[ext] || 'plaintext';
                codeEl.className = `language-${lang}`;
            }
            delete codeEl.dataset.highlighted;
            hljs.highlightElement(codeEl);

            highlighted.scrollTop = editor.scrollTop;
            highlighted.scrollLeft = editor.scrollLeft;
        }

        document.getElementById('editor').addEventListener('input', updateSyntaxHighlighting);
        document.getElementById('editor').addEventListener('scroll', function() {
            document.getElementById('highlighted-code').scrollTop = this.scrollTop;
            document.getElementById('highlighted-code').scrollLeft = this.scrollLeft;
        });

        function updateStatusBar() {
            const lines = document.getElementById('editor').value.split('\n').length;
            document.getElementById('status-file').textContent = currentFile || 'No file';
            document.getElementById('status-type').textContent = currentFile ? (currentFile.split('.').pop() || 'txt') : '-';
            document.getElementById('status-lines').textContent = `Lines: ${lines}`;
        }

        async function saveCurrentFile() {
            if (!currentFile) return alert('No file open');
            const content = document.getElementById('editor').value;
            const body = gameConfig.type === 'personal' 
                ? { user: username, pass: password, filename: currentFile, content }
                : { user: username, pass: password, orgName: orgName, filename: currentFile, content };

            try {
                const res = await fetch(api.save, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                fileContent = content;
                showNotification('File saved');

                // Refresh preview if HTML
                if (currentFile.endsWith('.html') || currentFile.endsWith('.htm')) {
                    refreshPreview(currentFile, content);
                }
            } catch (e) {
                alert('Save failed: ' + e.message);
            }
        }

        function refreshPreview(path, content) {
            const iframe = document.getElementById('preview-frame');
            if (gameConfig.type === 'personal') {
                const url = api.previewBase + path;
                // Use srcdoc for instant preview? Could use blob.
                // For simplicity, set src to the live URL
                iframe.src = url;
            } else {
                // For org, the URL structure might be different; we'll use srcdoc with content
                const blob = new Blob([content], { type: 'text/html' });
                iframe.src = URL.createObjectURL(blob);
            }
        }

        // ---------- AI Copilot ----------
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const chatSend = document.getElementById('chat-send');

        async function sendChat() {
            const text = chatInput.value.trim();
            if (!text) return;
            appendMessage('user', text);
            chatInput.value = '';

            // Placeholder: in a real implementation, call AI agent with context.
            // For now, simulate a response.
            setTimeout(() => {
                appendMessage('ai', "I understand you're working on a game. I can help generate ECS components or deploy files. Try asking me to create a new file or fix a bug.");
            }, 500);
        }

        function appendMessage(role, content) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            msgDiv.innerHTML = `
                <div class="avatar">${role === 'ai' ? 'AI' : 'U'}</div>
                <div class="bubble">${content}</div>
            `;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        chatSend.addEventListener('click', sendChat);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendChat();
            }
        });

        // ---------- Toolbar Actions ----------
        document.getElementById('new-file-btn').addEventListener('click', () => {
            document.getElementById('new-file-modal').classList.add('active');
        });
        document.getElementById('new-file-cancel').addEventListener('click', () => {
            document.getElementById('new-file-modal').classList.remove('active');
        });
        document.getElementById('new-file-create').addEventListener('click', async () => {
            const path = document.getElementById('new-file-path').value.trim();
            if (!path) return;
            document.getElementById('new-file-modal').classList.remove('active');
            // Create empty file
            const body = gameConfig.type === 'personal'
                ? { user: username, pass: password, filename: path, content: '' }
                : { user: username, pass: password, orgName: orgName, filename: path, content: '' };
            try {
                const res = await fetch(api.save, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                showNotification('File created');
                await loadDirectory(gameConfig.starting || '/');
                openFile(path);
            } catch (e) {
                alert('Create failed: ' + e.message);
            }
        });

        document.getElementById('save-btn').addEventListener('click', saveCurrentFile);

        document.getElementById('delete-btn').addEventListener('click', async () => {
            if (!currentFile) return alert('No file selected');
            if (!confirm(`Delete ${currentFile}?`)) return;
            const body = gameConfig.type === 'personal'
                ? { username, pass: password, filename: currentFile }
                : { username, pass: password, orgName, filename: currentFile };
            try {
                const res = await fetch(api.delete, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                showNotification('File deleted');
                currentFile = null;
                document.getElementById('editor').value = '';
                updateSyntaxHighlighting();
                updateStatusBar();
                await loadDirectory(gameConfig.starting || '/');
            } catch (e) {
                alert('Delete failed: ' + e.message);
            }
        });

        document.getElementById('download-btn').addEventListener('click', () => {
            if (!currentFile) return alert('No file open');
            const content = document.getElementById('editor').value;
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = currentFile.split('/').pop();
            a.click();
            URL.revokeObjectURL(url);
        });

        // Upload
        document.getElementById('upload-btn').addEventListener('click', () => {
            document.getElementById('upload-modal').classList.add('active');
        });
        document.getElementById('upload-cancel').addEventListener('click', () => {
            document.getElementById('upload-modal').classList.remove('active');
        });
        document.getElementById('upload-confirm').addEventListener('click', async () => {
            const path = document.getElementById('upload-path').value.trim();
            const fileInput = document.getElementById('upload-file');
            if (!path || !fileInput.files.length) return;

            const file = fileInput.files[0];
            const isMedia = /\.(png|jpg|jpeg|gif|webp|mp4|mp3|wav|avi|mov)$/i.test(file.name);
            document.getElementById('upload-modal').classList.remove('active');

            if (!isMedia) {
                // text file
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const content = e.target.result;
                    const body = gameConfig.type === 'personal'
                        ? { user: username, pass: password, filename: path, content }
                        : { user: username, pass: password, orgName, filename: path, content };
                    try {
                        const res = await fetch(api.save, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(body)
                        });
                        const data = await res.json();
                        if (data.error) throw new Error(data.error);
                        showNotification('File uploaded');
                        await loadDirectory(gameConfig.starting || '/');
                        openFile(path);
                    } catch (e) {
                        alert('Upload failed: ' + e.message);
                    }
                };
                reader.readAsText(file);
            } else {
                // media file – need to use img-save endpoint
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const arrayBuffer = e.target.result;
                    const endpoint = gameConfig.type === 'personal' ? '/api/img-save' : '/api/img-save-org';
                    const headers = gameConfig.type === 'personal'
                        ? { 'x-user': username, 'x-pass': password, 'x-filename': path }
                        : { 'x-user': username, 'x-pass': password, 'x-org': orgName, 'x-filename': path };
                    try {
                        const res = await fetch(API_BASE + endpoint, {
                            method: 'POST',
                            headers,
                            body: arrayBuffer
                        });
                        const data = await res.json();
                        if (data.error) throw new Error(data.error);
                        showNotification('Media uploaded');
                        await loadDirectory(gameConfig.starting || '/');
                    } catch (e) {
                        alert('Upload failed: ' + e.message);
                    }
                };
                reader.readAsArrayBuffer(file);
            }
        });

        function showNotification(msg) {
            // simple alert for now
            console.log(msg);
        }

        // Sync editor scroll with highlight
        document.getElementById('editor').addEventListener('scroll', function() {
            document.getElementById('highlighted-code').scrollTop = this.scrollTop;
            document.getElementById('highlighted-code').scrollLeft = this.scrollLeft;
        });

        // Keyboard save
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                saveCurrentFile();
            }
        });
    })();
</script>
</body>
</html>
