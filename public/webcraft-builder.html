<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebCraft · Visual Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wght@0,200..900;1,200..900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f6f8fa;--bg3:#eaeef2;--bd:#d0d7de;--bdm:#e1e4e8;
  --tx:#1f2328;--txm:#636c76;--txs:#9198a1;--ac:#0969da;--ach:#0550ae;
  --acb:#ddf4ff;--ace:#54aeff;--ok:#1a7f37;--okb:#dafbe1;--oke:rgba(26,127,55,.3);
  --er:#cf222e;--erb:#ffebe9;--ere:rgba(207,34,46,.3);--wn:#9a6700;--wnb:#fff8c5;--wne:rgba(154,103,0,.3);
  --sh1:0 1px 0 rgba(27,31,36,.04);--sh2:0 3px 6px rgba(140,149,159,.15);--sh3:0 8px 24px rgba(140,149,159,.2);
  --r:6px;--rl:12px;--tr:80ms cubic-bezier(.33,1,.68,1);
  --sw:256px;--pw:272px;
}
[data-theme="dark"]{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--bd:#30363d;--bdm:#21262d;
  --tx:#e6edf3;--txm:#8b949e;--txs:#6e7681;--ac:#58a6ff;--ach:#79c0ff;
  --acb:rgba(56,139,253,.1);--ace:rgba(56,139,253,.4);
  --ok:#3fb950;--okb:rgba(46,160,67,.1);--oke:rgba(63,185,80,.3);
  --er:#f85149;--erb:rgba(248,81,73,.1);--ere:rgba(248,81,73,.3);
  --wn:#e3b341;--wnb:rgba(187,128,9,.15);--wne:rgba(227,179,65,.3);
  --sh1:0 1px 0 rgba(0,0,0,.25);--sh2:0 3px 6px rgba(0,0,0,.3);--sh3:0 8px 24px rgba(0,0,0,.45);
}
html{font-family:'Mona Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{background:var(--bg2);color:var(--tx);height:100dvh;overflow:hidden;font-size:13px;line-height:1.5;display:flex;flex-direction:column}
button,input,select,textarea{font-family:inherit;font-size:inherit}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--txs)}

/* ── HEADER ── */
.hdr{background:var(--bg2);border-bottom:1px solid var(--bd);height:48px;padding:0 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;box-shadow:var(--sh1);z-index:100}
.logo{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px;color:var(--tx);text-decoration:none;flex-shrink:0}
.logo-mark{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,var(--ac),#6e40c9);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:14px}
.hdr-sep{width:1px;height:20px;background:var(--bd);margin:0 2px;flex-shrink:0}
.ibtn{background:none;border:1px solid var(--bd);border-radius:var(--r);color:var(--txm);cursor:pointer;padding:4px 8px;font-size:11px;display:flex;align-items:center;gap:4px;transition:var(--tr);white-space:nowrap;flex-shrink:0;height:28px}
.ibtn:hover{background:var(--bg3);color:var(--tx)}
.ibtn.active{background:var(--acb);border-color:var(--ace);color:var(--ac)}
.ibtn.danger:hover{background:var(--erb);border-color:var(--ere);color:var(--er)}
.ibtn-primary{background:var(--ac);border:none;color:#fff}
.ibtn-primary:hover{background:var(--ach);color:#fff}
.ibtn svg{width:12px;height:12px;fill:currentColor;flex-shrink:0}
#compCount{font-size:11px;color:var(--txs);white-space:nowrap}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:6px}

/* ── LAYOUT ── */
.app{display:flex;flex:1;overflow:hidden;min-height:0}

/* ── LEFT SIDEBAR ── */
.sidebar{width:var(--sw);background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.panel-hd{padding:8px 10px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px;flex-shrink:0}
.panel-title{font-size:10px;font-weight:700;color:var(--txm);text-transform:uppercase;letter-spacing:.6px;flex:1}
.search-wrap{position:relative;padding:8px;border-bottom:1px solid var(--bd);flex-shrink:0}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);fill:var(--txs);pointer-events:none}
#searchBox{width:100%;height:28px;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:0 8px 0 28px;font-size:11px;color:var(--tx);outline:none;transition:border-color var(--tr)}
#searchBox:focus{border-color:var(--ace)}
#searchBox::placeholder{color:var(--txs)}
.sb-body{overflow-y:auto;flex:1;padding:4px 6px 8px}

/* Category */
.cat-wrap{margin-bottom:1px}
.cat-hdr{display:flex;align-items:center;gap:6px;padding:6px 6px;cursor:pointer;border-radius:var(--r);color:var(--txm);font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;user-select:none;transition:var(--tr)}
.cat-hdr:hover{color:var(--tx);background:var(--bg3)}
.cat-arrow{margin-left:auto;font-size:9px;transition:transform .2s;display:inline-block;color:var(--txs)}
.cat-arrow.open{transform:rotate(90deg)}
.comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:2px 0 6px;overflow:hidden;max-height:600px;transition:max-height .25s ease}
.comp-grid.shut{max-height:0;padding:0}

/* Component tile */
.ci{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:8px 5px 7px;cursor:grab;display:flex;flex-direction:column;align-items:center;gap:4px;transition:var(--tr);user-select:none}
.ci:hover{border-color:var(--ace);background:var(--acb);color:var(--ac)}
.ci:active{cursor:grabbing;opacity:.7;transform:scale(.96)}
.ci-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--bg2);border:1px solid var(--bd);border-radius:5px;font-size:13px;font-weight:800;color:var(--txm);font-family:'Fira Code',monospace}
.ci:hover .ci-icon{background:var(--acb);border-color:var(--ace);color:var(--ac)}
.ci-lbl{font-size:10px;color:var(--txm);text-align:center;font-weight:500}
.ci:hover .ci-lbl{color:var(--ac)}

/* ── CANVAS AREA ── */
.canvas-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg3)}
.canvas-bar{height:36px;background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0}
.canvas-bar-info{font-size:11px;color:var(--txs)}
.canvas-bar-sel{font-size:11px;color:var(--ac);font-weight:600}
.zoom-ctrl{display:flex;align-items:center;gap:3px;margin-left:auto}
.zbtn{width:22px;height:22px;background:var(--bg);border:1px solid var(--bd);border-radius:4px;color:var(--txm);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:var(--tr);line-height:1}
.zbtn:hover{background:var(--bg3);color:var(--tx)}
#zmVal{min-width:36px;text-align:center;font-size:10px;color:var(--txm)}
.canvas-scroll{flex:1;overflow:auto;padding:40px 24px;display:flex;justify-content:center;align-items:flex-start}

/* Canvas */
#canvas{
  width:980px;min-height:480px;background:#fff;position:relative;
  box-shadow:0 0 0 1px rgba(27,31,36,.1),var(--sh3);
  border-radius:4px;transform-origin:top center;
  --cb:#ffffff;--ct:#1f2328;--ca:#0969da;--cs:#f6f8fa;--cbr:#d0d7de;
}
[data-theme="dark"] #canvas{box-shadow:0 0 0 1px rgba(0,0,0,.4),0 8px 32px rgba(0,0,0,.5)}
#canvas.drag-over{outline:2px dashed var(--ac);outline-offset:2px}
#drop-ph{height:3px;background:var(--ac);border-radius:2px;margin:2px 12px;display:none}
#drop-ph.show{display:block}
.canvas-empty{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;padding:32px}
.canvas-empty-ico{font-size:40px;margin-bottom:12px;opacity:.25}
.canvas-empty-txt{font-size:13px;color:var(--txm);opacity:.5;line-height:1.7}

/* Canvas component wrapper */
.cc{position:relative;cursor:default}
.cc:hover .cc-bar{opacity:.7}
.cc.sel .cc-bar{opacity:1!important;display:flex!important}
.cc.sel{outline:2px solid var(--ac)!important;outline-offset:0}
.cc:hover:not(.sel){outline:1px dashed rgba(9,105,218,.35)}
.cc-bar{position:absolute;top:-34px;left:0;display:none;align-items:center;gap:2px;background:var(--ac);border-radius:5px 5px 0 0;padding:3px 5px;z-index:500;white-space:nowrap}
.cc-label{font-size:9px;color:rgba(255,255,255,.8);padding:0 4px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.cc-drag-handle{cursor:grab;color:rgba(255,255,255,.7);padding:0 3px;font-size:13px;line-height:1}
.cc-drag-handle:active{cursor:grabbing}
.cbtn{width:22px;height:22px;background:rgba(255,255,255,.18);border:none;color:rgba(255,255,255,.9);border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;transition:background .1s}
.cbtn:hover{background:rgba(255,255,255,.35)}
.cbtn.del:hover{background:var(--er)}
.cc-inner{position:relative}

/* ── PROPERTIES PANEL ── */
.props-panel{width:var(--pw);background:var(--bg2);border-left:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.props-body{overflow-y:auto;flex:1;padding:0}
.p-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--txm);font-size:11px;text-align:center;padding:24px;gap:8px;opacity:.5}
.p-empty svg{width:28px;height:28px;fill:currentColor;opacity:.4}

/* Property sections */
.psec{border-bottom:1px solid var(--bd);padding:10px 12px}
.psec-title{font-size:9px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--txm);margin-bottom:8px}
.prow{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.prow:last-child{margin-bottom:0}
.plbl{font-size:10px;color:var(--txs);width:68px;flex-shrink:0;line-height:1.3}
.pctl{flex:1;min-width:0}

/* Controls */
.pin{width:100%;height:26px;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:0 7px;color:var(--tx);font-size:11px;outline:none;transition:border-color var(--tr)}
.pin:focus{border-color:var(--ace)}
.pcolor{width:100%;height:26px;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:2px 3px;cursor:pointer;outline:none}
.psel{width:100%;height:26px;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:0 5px;color:var(--tx);font-size:11px;outline:none;cursor:pointer;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='10' viewBox='0 0 16 16' fill='%236e7681'%3E%3Cpath d='M4.427 7.427l3.396 3.396a.25.25 0 0 0 .354 0l3.396-3.396A.25.25 0 0 0 11.396 7H4.604a.25.25 0 0 0-.177.427z'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 5px center;padding-right:20px}
.psel:focus{border-color:var(--ace)}
.slider-row{display:flex;align-items:center;gap:5px}
.pslider{flex:1;accent-color:var(--ac);height:14px;cursor:pointer}
.sval{min-width:34px;text-align:right;font-size:10px;color:var(--txs);font-family:'Fira Code',monospace}
.btn-grp{display:flex;gap:3px}
.pgbtn{flex:1;height:26px;background:var(--bg);border:1px solid var(--bd);color:var(--txm);border-radius:var(--r);cursor:pointer;font-size:11px;transition:var(--tr)}
.pgbtn:hover{border-color:var(--ace);color:var(--tx);background:var(--bg3)}
.pgbtn.on{background:var(--acb);color:var(--ac);border-color:var(--ace)}

/* Animation grid */
.anim-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px}
.abtn{padding:5px 3px;background:var(--bg);border:1px solid var(--bd);color:var(--txm);border-radius:var(--r);cursor:pointer;font-size:9px;text-align:center;transition:var(--tr);line-height:1.4}
.abtn:hover{border-color:var(--ace);color:var(--tx)}
.abtn.on{background:var(--acb);color:var(--ac);border-color:var(--ace)}

/* Shadow swatches */
.shadow-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.shbtn{height:26px;background:var(--bg);border:1px solid var(--bd);color:var(--txm);border-radius:var(--r);cursor:pointer;font-size:10px;transition:var(--tr)}
.shbtn:hover{border-color:var(--ace);color:var(--tx);background:var(--bg3)}

/* Action buttons */
.act-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.actbtn{height:28px;background:var(--bg);border:1px solid var(--bd);color:var(--txm);border-radius:var(--r);cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;gap:4px;transition:var(--tr)}
.actbtn:hover{background:var(--bg3);color:var(--tx)}
.actbtn.full{grid-column:1/-1}
.actbtn.danger{color:var(--er);border-color:var(--ere)}
.actbtn.danger:hover{background:var(--erb)}

/* ── PREVIEW MODE ── */
body.preview .sidebar,body.preview .props-panel{display:none}
body.preview .cc-bar,body.preview .canvas-empty{display:none!important}
body.preview .cc,.preview .cc:hover,.preview .cc.sel{outline:none!important;cursor:default}
body.preview #canvas{box-shadow:none;border-radius:0;width:100%;min-height:100%}
body.preview .canvas-scroll{padding:0}
body.preview .canvas-bar{display:none}

/* ── CODE MODAL ── */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:400;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.ovl.hidden{display:none}
.modal{background:var(--bg);border:1px solid var(--bd);border-radius:var(--rl);box-shadow:var(--sh3);display:flex;flex-direction:column;width:100%;max-width:820px;max-height:86vh;overflow:hidden}
.mhd{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.mtitle{font-size:13px;font-weight:600}
.mhd-actions{display:flex;gap:6px;align-items:center}
.mclose{background:none;border:none;color:var(--txm);cursor:pointer;padding:2px 7px;border-radius:var(--r);font-size:15px;line-height:1;transition:var(--tr)}
.mclose:hover{background:var(--bg3);color:var(--tx)}
.mbody{flex:1;overflow:auto;position:relative}
.code-out{padding:14px 16px;font-family:'Fira Code',monospace;font-size:12px;line-height:1.7;color:var(--tx);white-space:pre;background:var(--bg);margin:0;min-height:200px;tab-size:2;word-break:break-all;white-space:pre-wrap}
.mfoot{padding:10px 14px;border-top:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;gap:8px}
.mfoot-info{font-size:10px;color:var(--txs)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:var(--r);font-size:12px;font-weight:500;cursor:pointer;border:1px solid;transition:var(--tr)}
.bsec{background:var(--bg2);border-color:var(--bd);color:var(--tx)}.bsec:hover{background:var(--bg3)}
.bpri{background:var(--ac);border-color:transparent;color:#fff}.bpri:hover{background:var(--ach)}
.bdan{background:var(--erb);border-color:var(--ere);color:var(--er)}.bdan:hover{background:var(--er);color:#fff}

/* ── TOAST ── */
.tstack{position:fixed;bottom:20px;right:14px;z-index:999;display:flex;flex-direction:column;gap:5px}
.toast{padding:7px 12px;border-radius:var(--r);font-size:11px;font-weight:500;border:1px solid;box-shadow:var(--sh2);animation:tin .2s ease;max-width:280px;pointer-events:none}
.toast.ok{background:var(--okb);border-color:var(--oke);color:var(--ok)}
.toast.er{background:var(--erb);border-color:var(--ere);color:var(--er)}
.toast.nfo{background:var(--acb);border-color:var(--ace);color:var(--ac)}
@keyframes tin{from{transform:translateX(12px);opacity:0}to{transform:translateX(0);opacity:1}}

/* ── CANVAS COMPONENT STYLES ── */
/* These use CSS variables injected into #canvas so themes work */
.comp-navbar{padding:14px 32px;background:var(--cs);border-bottom:1px solid var(--cbr);display:flex;align-items:center;gap:24px}
.comp-navbar .nb-brand{font-weight:800;font-size:18px;color:var(--ca)}
.comp-navbar .nb-links{display:flex;gap:20px;margin-left:24px}
.comp-navbar .nb-links span{color:var(--ct);font-size:13px;cursor:pointer}
.comp-navbar .nb-cta{margin-left:auto;padding:7px 16px;background:var(--ca);color:#fff;border-radius:6px;font-weight:600;cursor:pointer;border:none;font-size:12px}

.comp-hero{padding:72px 48px;background:var(--ca);text-align:center}
.comp-hero h1{font-size:48px;font-weight:900;color:#fff;margin-bottom:12px;line-height:1.1}
.comp-hero p{font-size:16px;color:rgba(255,255,255,.82);margin-bottom:28px;line-height:1.6}
.comp-hero .hero-btn{display:inline-block;padding:12px 28px;background:#fff;color:var(--ca);border-radius:7px;font-weight:700;cursor:pointer;border:none;font-size:14px}

.comp-heading{padding:16px 32px 4px}
.comp-heading h1,.comp-heading h2,.comp-heading h3,.comp-heading h4{color:var(--ct);font-weight:800;line-height:1.2}

.comp-para{padding:6px 32px 16px}
.comp-para p{color:var(--ct);line-height:1.75;font-size:15px}

.comp-button{padding:14px 32px}
.comp-button .btn-el{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;background:var(--ca);color:#fff;border-radius:7px;font-weight:600;font-size:13px;cursor:pointer;border:none}

.comp-divider{padding:8px 32px}
.comp-divider hr{border:none;border-top:1px solid var(--cbr)}

.comp-spacer{height:48px}

.comp-card{padding:16px}
.comp-card .card-inner{background:var(--cs);border:1px solid var(--cbr);border-radius:10px;padding:20px}
.comp-card .card-inner h3{color:var(--ct);margin-bottom:7px;font-size:17px;font-weight:700}
.comp-card .card-inner p{color:var(--ct);opacity:.7;line-height:1.65;font-size:13px}

.comp-cols2{padding:18px 32px}
.comp-cols2 .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.comp-cols2 .col{background:var(--cs);border:1px dashed var(--cbr);border-radius:7px;padding:18px;min-height:80px;color:var(--ct);font-size:13px;line-height:1.6}

.comp-cols3{padding:18px 32px}
.comp-cols3 .cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.comp-cols3 .col{background:var(--cs);border:1px dashed var(--cbr);border-radius:7px;padding:16px;min-height:80px;color:var(--ct);font-size:13px;line-height:1.6}

.comp-img{padding:16px 32px}
.comp-img .img-ph{width:100%;height:180px;background:var(--cs);border:2px dashed var(--cbr);border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--ct);font-size:13px;gap:7px;opacity:.45}

.comp-video{padding:16px 32px}
.comp-video .vid-ph{width:100%;height:220px;background:#0d1117;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:48px;cursor:pointer;position:relative;overflow:hidden}
.comp-video .vid-ph::before{content:'';position:absolute;inset:0;background:var(--ca);opacity:.12}
.comp-video .vid-ph::after{content:'▶';color:#fff;z-index:1;position:relative;opacity:.85}

.comp-testimonial{padding:32px;background:var(--cs)}
.comp-testimonial .tq{font-size:40px;color:var(--ca);line-height:.8;margin-bottom:4px}
.comp-testimonial .ttext{font-size:16px;color:var(--ct);line-height:1.65;margin-bottom:20px;font-style:italic}
.comp-testimonial .tauthor{display:flex;align-items:center;gap:10px}
.comp-testimonial .t-avatar{width:40px;height:40px;background:var(--ca);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;flex-shrink:0}
.comp-testimonial .t-name{font-weight:700;color:var(--ct);font-size:13px}
.comp-testimonial .t-role{color:var(--ct);opacity:.55;font-size:12px}

.comp-stats{padding:32px}
.comp-stats .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;text-align:center}
.comp-stats .stat-num{font-size:40px;font-weight:900;color:var(--ca);line-height:1}
.comp-stats .stat-lbl{color:var(--ct);opacity:.6;font-size:12px;margin-top:4px}

.comp-feature{padding:18px 32px}
.comp-feature .feat-wrap{display:flex;gap:16px;align-items:flex-start}
.comp-feature .feat-icon{width:46px;height:46px;background:rgba(9,105,218,.08);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;color:var(--ca);border:1px solid rgba(9,105,218,.16)}
.comp-feature .feat-body h3{color:var(--ct);margin-bottom:5px;font-size:17px;font-weight:700}
.comp-feature .feat-body p{color:var(--ct);opacity:.65;line-height:1.65;font-size:13px}

.comp-alert{padding:12px 32px}
.comp-alert .al{padding:10px 16px;border-radius:7px;border-left:4px solid;display:flex;align-items:center;gap:8px;font-size:13px}
.al.info{background:#ddf4ff;border-color:#0969da;color:#0550ae}
.al.success{background:#dafbe1;border-color:#1a7f37;color:#116329}
.al.warning{background:#fff8c5;border-color:#9a6700;color:#7d4e00}
.al.danger{background:#ffebe9;border-color:#cf222e;color:#a40e26}

.comp-progress{padding:16px 32px}
.comp-progress .prog-row{display:flex;justify-content:space-between;color:var(--ct);font-size:12px;margin-bottom:6px}
.comp-progress .prog-bar{width:100%;height:8px;background:var(--cbr);border-radius:8px;overflow:hidden}
.comp-progress .prog-fill{height:100%;background:var(--ca);border-radius:8px}

.comp-list{padding:12px 32px}
.comp-list ul{list-style:none}
.comp-list li{padding:8px 0;border-bottom:1px solid var(--cbr);color:var(--ct);display:flex;align-items:center;gap:9px;font-size:13px}
.comp-list li::before{content:'✓';color:var(--ca);font-weight:700;flex-shrink:0}

.comp-quote{padding:24px 20px 24px 36px;border-left:4px solid var(--ca);margin:0 32px}
.comp-quote blockquote{font-size:19px;color:var(--ct);font-style:italic;line-height:1.65}
.comp-quote cite{display:block;margin-top:10px;color:var(--ct);opacity:.5;font-size:12px;font-style:normal}

.comp-badge{padding:8px 32px}
.comp-badge .badges{display:flex;gap:6px;flex-wrap:wrap}
.comp-badge .badge{padding:3px 10px;border-radius:100px;font-size:11px;font-weight:700;background:rgba(9,105,218,.08);color:var(--ca);border:1px solid rgba(9,105,218,.22)}

.comp-form{padding:24px 32px}
.comp-form h3{color:var(--ct);margin-bottom:16px;font-weight:700;font-size:18px}
.comp-form .form-field{margin-bottom:12px}
.comp-form label{display:block;color:var(--ct);font-size:12px;margin-bottom:4px;font-weight:600}
.comp-form input,.comp-form textarea,.comp-form select{width:100%;padding:8px 11px;border:1px solid var(--cbr);border-radius:6px;background:var(--cb);color:var(--ct);font-family:inherit;font-size:12px;outline:none}
.comp-form textarea{height:80px;resize:vertical}
.comp-form .form-submit{padding:10px 22px;background:var(--ca);color:#fff;border:none;border-radius:6px;font-weight:700;cursor:pointer;font-size:13px}

.comp-newsletter{padding:52px 32px;background:var(--ca);text-align:center}
.comp-newsletter h2{color:#fff;font-size:28px;margin-bottom:7px;font-weight:800}
.comp-newsletter p{color:rgba(255,255,255,.8);margin-bottom:20px;font-size:14px}
.comp-newsletter .nl-form{display:flex;gap:7px;max-width:360px;margin:0 auto}
.comp-newsletter input{flex:1;padding:10px 13px;border:none;border-radius:6px;font-size:12px;outline:none}
.comp-newsletter button{padding:10px 20px;background:rgba(255,255,255,.2);color:#fff;border:2px solid rgba(255,255,255,.5);border-radius:6px;font-weight:700;cursor:pointer;white-space:nowrap;font-size:12px}
.comp-newsletter button:hover{background:rgba(255,255,255,.3)}

.comp-gallery{padding:16px 32px}
.comp-gallery .gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.comp-gallery .gallery-item{aspect-ratio:4/3;background:var(--cs);border:1px solid var(--cbr);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--ct);opacity:.35;font-size:20px}

.comp-pricing{padding:32px}
.comp-pricing .price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.comp-pricing .plan{background:var(--cs);border:1px solid var(--cbr);border-radius:10px;padding:22px;text-align:center}
.comp-pricing .plan.featured{border-color:var(--ca);background:rgba(9,105,218,.03)}
.comp-pricing .plan-name{font-size:10px;color:var(--ct);opacity:.55;margin-bottom:10px;text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.comp-pricing .plan-price{font-size:40px;font-weight:900;color:var(--ct)}
.comp-pricing .plan-price sup{font-size:16px;font-weight:400;vertical-align:top;margin-top:9px;display:inline-block}
.comp-pricing .plan-price sub{font-size:12px;font-weight:400;opacity:.45}
.comp-pricing .plan-features{margin:16px 0;text-align:left}
.comp-pricing .plan-feat{padding:4px 0;color:var(--ct);font-size:12px;display:flex;align-items:center;gap:6px}
.comp-pricing .plan-feat::before{content:'✓';color:var(--ca);font-weight:700}
.comp-pricing .plan-btn{width:100%;padding:8px;border:1px solid var(--ca);border-radius:6px;color:var(--ca);background:transparent;font-weight:700;cursor:pointer;font-size:12px}
.comp-pricing .plan.featured .plan-btn{background:var(--ca);color:#fff}

.comp-footer{padding:32px;background:var(--cs);border-top:1px solid var(--cbr)}
.comp-footer .footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:32px}
.comp-footer .footer-brand{color:var(--ca);font-weight:900;font-size:16px;margin-bottom:6px}
.comp-footer .footer-sub{color:var(--ct);opacity:.5;font-size:12px;line-height:1.5}
.comp-footer h4{color:var(--ct);margin-bottom:10px;font-size:12px;font-weight:700}
.comp-footer ul{list-style:none}
.comp-footer ul li{color:var(--ct);opacity:.5;font-size:12px;padding:3px 0;cursor:pointer}
.comp-footer ul li:hover{opacity:.9;color:var(--ca)}
.comp-footer .footer-copy{margin-top:24px;padding-top:16px;border-top:1px solid var(--cbr);color:var(--ct);opacity:.3;font-size:11px;text-align:center}

.comp-code{padding:12px 32px}
.comp-code pre{background:var(--bg3,#f6f8fa);color:var(--tx,#1f2328);border:1px solid var(--cbr);border-radius:7px;padding:16px;font-size:12px;overflow-x:auto;line-height:1.65;font-family:'Fira Code',monospace}

.comp-breadcrumb{padding:8px 32px}
.comp-breadcrumb .bc{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ct);opacity:.55}
.comp-breadcrumb .bc-active{opacity:1;color:var(--ca);font-weight:600}
.comp-breadcrumb .bc-sep{opacity:.35}

.comp-counter{padding:32px;text-align:center}
.comp-counter .count-num{font-size:60px;font-weight:900;color:var(--ca);line-height:1}
.comp-counter .count-lbl{color:var(--ct);opacity:.55;font-size:14px;margin-top:5px}

.comp-tags{padding:8px 32px}
.comp-tags .tags{display:flex;gap:6px;flex-wrap:wrap}
.comp-tags .tag{padding:5px 10px;background:var(--cs);border:1px solid var(--cbr);border-radius:5px;font-size:11px;color:var(--ct);cursor:default}

.comp-table{padding:12px 32px}
.comp-table table{width:100%;border-collapse:collapse;font-size:12px}
.comp-table th{background:var(--cs);border:1px solid var(--cbr);padding:8px 12px;text-align:left;font-weight:700;color:var(--ct)}
.comp-table td{border:1px solid var(--cbr);padding:8px 12px;color:var(--ct)}
.comp-table tr:nth-child(even) td{background:rgba(0,0,0,.02)}

/* ── ANIMATIONS ── */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideInLeft{from{transform:translateX(-60px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideInRight{from{transform:translateX(60px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideInUp{from{transform:translateY(50px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideInDown{from{transform:translateY(-50px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes zoomIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bounceIn{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.1)}80%{transform:scale(.95)}100%{transform:scale(1);opacity:1}}
@keyframes flipInX{from{transform:perspective(400px) rotateX(-90deg);opacity:0}to{transform:perspective(400px) rotateX(0);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes swing{0%,100%{transform:rotate(0deg)}20%{transform:rotate(12deg)}40%{transform:rotate(-8deg)}60%{transform:rotate(5deg)}80%{transform:rotate(-4deg)}}
@keyframes rubberBand{0%{transform:scale(1)}30%{transform:scaleX(1.2) scaleY(.75)}40%{transform:scaleX(.75) scaleY(1.2)}50%{transform:scaleX(1.12) scaleY(.88)}65%{transform:scaleX(.97) scaleY(1.03)}75%{transform:scaleX(1.03) scaleY(.97)}100%{transform:scale(1)}}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3) drop-shadow(0 0 12px currentColor)}}
@keyframes colorCycle{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}
@keyframes floatUpDown{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes rotateSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes tada{0%,100%{transform:scale(1) rotate(0deg)}10%,20%{transform:scale(.9) rotate(-3deg)}30%,50%,70%,90%{transform:scale(1.1) rotate(3deg)}40%,60%,80%{transform:scale(1.1) rotate(-3deg)}}
@keyframes heartBeat{0%{transform:scale(1)}14%{transform:scale(1.15)}28%{transform:scale(1)}42%{transform:scale(1.15)}70%{transform:scale(1)}}
@keyframes jello{0%,100%{transform:scale3d(1,1,1)}30%{transform:scale3d(1.2,.75,1)}40%{transform:scale3d(.75,1.2,1)}50%{transform:scale3d(1.15,.85,1)}65%{transform:scale3d(.95,1.05,1)}75%{transform:scale3d(1.05,.95,1)}}

.an-fadeIn .cc-inner{animation:fadeIn .7s ease both}
.an-slideLeft .cc-inner{animation:slideInLeft .6s ease both}
.an-slideRight .cc-inner{animation:slideInRight .6s ease both}
.an-slideUp .cc-inner{animation:slideInUp .6s ease both}
.an-slideDown .cc-inner{animation:slideInDown .6s ease both}
.an-zoomIn .cc-inner{animation:zoomIn .6s cubic-bezier(.175,.885,.32,1.275) both}
.an-bounceIn .cc-inner{animation:bounceIn .8s ease both}
.an-flipInX .cc-inner{animation:flipInX .7s ease both}
.an-shake .cc-inner{animation:shake .6s ease both}
.an-pulse .cc-inner{animation:pulse 1.5s ease infinite}
.an-swing .cc-inner{animation:swing .8s ease both}
.an-rubber .cc-inner{animation:rubberBand .8s ease both}
.an-glow .cc-inner{animation:glow 2s ease infinite}
.an-colorCycle .cc-inner{animation:colorCycle 3s linear infinite}
.an-float .cc-inner{animation:floatUpDown 3s ease infinite}
.an-spin .cc-inner{animation:rotateSpin 2s linear infinite}
.an-tada .cc-inner{animation:tada .9s ease both}
.an-heartBeat .cc-inner{animation:heartBeat 1.3s ease infinite}
.an-jello .cc-inner{animation:jello .9s ease both}
</style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <div class="logo">
    <div class="logo-mark">⚡</div>
    <span>WebCraft</span>
  </div>
  <div class="hdr-sep"></div>
  <button class="ibtn" onclick="undo()" title="Undo (Ctrl+Z)">
    <svg viewBox="0 0 16 16"><path d="M1.22 6.78a.75.75 0 0 1 0-1.06l3.25-3.25a.75.75 0 1 1 1.06 1.06L3.56 5.5h5.69a3.75 3.75 0 0 1 0 7.5H6.5a.75.75 0 0 1 0-1.5h2.75a2.25 2.25 0 0 0 0-4.5H3.56l1.97 1.97a.75.75 0 1 1-1.06 1.06L1.22 6.78Z"/></svg>
    Undo
  </button>
  <button class="ibtn" onclick="redo()" title="Redo (Ctrl+Y)">
    <svg viewBox="0 0 16 16"><path d="M14.78 6.78a.75.75 0 0 0 0-1.06l-3.25-3.25a.75.75 0 1 0-1.06 1.06l1.97 1.97H6.75a3.75 3.75 0 0 0 0 7.5H9.5a.75.75 0 0 0 0-1.5H6.75a2.25 2.25 0 0 1 0-4.5h5.69l-1.97 1.97a.75.75 0 1 0 1.06 1.06l3.25-3.25Z"/></svg>
    Redo
  </button>
  <div class="hdr-sep"></div>
  <select id="themeSelect" class="ibtn" style="padding:0 8px;cursor:pointer;height:28px;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);color:var(--txm);font-size:11px;outline:none;appearance:none;padding-right:22px;background-image:url(&quot;data:image/svg+xml,%3Csvg width='10' height='10' viewBox='0 0 16 16' fill='%236e7681'%3E%3Cpath d='M4.427 7.427l3.396 3.396a.25.25 0 0 0 .354 0l3.396-3.396A.25.25 0 0 0 11.396 7H4.604a.25.25 0 0 0-.177.427z'/%3E%3C/svg%3E&quot;);background-repeat:no-repeat;background-position:right 5px center" onchange="applyTheme(this.value)">
    <option value="light">☀️ Light</option>
    <option value="dark">🌙 Dark</option>
    <option value="ocean">🌊 Ocean</option>
    <option value="sunset">🌅 Sunset</option>
    <option value="forest">🌿 Forest</option>
    <option value="violet">💜 Violet</option>
    <option value="midnight">🌃 Midnight</option>
    <option value="rose">🌸 Rose</option>
  </select>
  <span id="compCount" style="font-size:10px;color:var(--txs)">0 components</span>
  <div class="hdr-r">
    <button class="ibtn danger" onclick="clearAll()">
      <svg viewBox="0 0 16 16"><path d="M11 1.75V3h2.25a.75.75 0 0 1 0 1.5H2.75a.75.75 0 0 1 0-1.5H5V1.75C5 .784 5.784 0 6.75 0h2.5C10.216 0 11 .784 11 1.75ZM4.496 6.675l.66 6.6a.25.25 0 0 0 .249.225h5.19a.25.25 0 0 0 .249-.225l.66-6.6a.75.75 0 0 1 1.492.149l-.66 6.6A1.748 1.748 0 0 1 10.595 15h-5.19a1.75 1.75 0 0 1-1.741-1.575l-.66-6.6a.75.75 0 1 1 1.492-.15Z"/></svg>
      Clear
    </button>
    <button class="ibtn" id="prevBtn" onclick="togglePreview()">
      <svg viewBox="0 0 16 16"><path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8ZM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8Z"/><circle cx="8" cy="8" r="2"/></svg>
      Preview
    </button>
    <button class="ibtn ibtn-primary" onclick="showCode()">
      <svg viewBox="0 0 16 16"><path d="M0 1.75C0 .784.784 0 1.75 0h12.5C15.216 0 16 .784 16 1.75v12.5A1.75 1.75 0 0 1 14.25 16H1.75A1.75 1.75 0 0 1 0 14.25ZM6.02 12.47a.75.75 0 0 0 1.06 1.06l4-4a.75.75 0 0 0 0-1.06l-4-4a.75.75 0 0 0-1.06 1.06L9.44 9l-3.42 3.47Zm-1.54-9a.75.75 0 0 0-.98.04l-4 4a.75.75 0 0 0 0 1.06l4 4a.75.75 0 0 0 1.04-1.08L1.56 8l3.96-3.51a.75.75 0 0 0-.04-1.02Z"/></svg>
      Export &amp; Copy
    </button>
    <button class="ibtn" onclick="toggleTheme()" title="Toggle light/dark">
      <svg id="thico" viewBox="0 0 16 16"><path d="M8 12a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-1.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Zm5.657-8.157a.75.75 0 1 1 1.06 1.061l-1.06 1.06a.75.75 0 0 1-1.062-1.06l1.061-1.061ZM1.355 5.26a.75.75 0 1 1 1.06-1.06l1.06 1.06a.75.75 0 0 1-1.06 1.06L1.354 5.26ZM8 0a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0V.75A.75.75 0 0 1 8 0Zm0 13a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5A.75.75 0 0 1 8 13Zm8-5a.75.75 0 0 1-.75.75h-1.5a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 16 8ZM2.25 8a.75.75 0 0 1-.75.75H.75a.75.75 0 0 1 0-1.5h.75A.75.75 0 0 1 2.25 8Zm9.094 4.939a.75.75 0 0 1 1.06-1.06l1.06 1.06a.75.75 0 0 1-1.06 1.06l-1.06-1.06ZM2.343 4.404a.75.75 0 0 1 1.06-1.06l1.06 1.06a.75.75 0 0 1-1.06 1.06l-1.06-1.06Z"/></svg>
    </button>
  </div>
</header>

<!-- APP BODY -->
<div class="app">

  <!-- LEFT SIDEBAR -->
  <aside class="sidebar">
    <div class="panel-hd">
      <span class="panel-title">Components</span>
    </div>
    <div class="search-wrap">
      <svg width="12" height="12" viewBox="0 0 16 16"><path fill="currentColor" d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"/></svg>
      <input type="text" id="searchBox" placeholder="Search components…" oninput="filterComps(this.value)">
    </div>
    <div class="sb-body" id="sbBody"></div>
  </aside>

  <!-- CANVAS AREA -->
  <div class="canvas-wrap">
    <div class="canvas-bar">
      <span class="canvas-bar-info">Canvas · 980px</span>
      <span class="canvas-bar-sel" id="selName"></span>
      <div class="zoom-ctrl">
        <button class="zbtn" onclick="zm(-0.1)" title="Zoom out">−</button>
        <span id="zmVal">100%</span>
        <button class="zbtn" onclick="zm(+0.1)" title="Zoom in">+</button>
        <button class="zbtn" style="width:auto;padding:0 6px;font-size:10px" onclick="zm(0,'reset')">↺</button>
      </div>
    </div>
    <div class="canvas-scroll" id="cScroll">
      <div id="canvas"
           ondragover="onDragOver(event)"
           ondrop="onDrop(event)"
           ondragleave="onDragLeave(event)"
           onclick="onCanvasClick(event)">
        <div id="drop-ph"></div>
        <div class="canvas-empty" id="cEmpty">
          <div class="canvas-empty-ico">◻</div>
          <div class="canvas-empty-txt">Drag components here to build your page<br><small style="font-size:11px">or click any item in the sidebar</small></div>
        </div>
      </div>
    </div>
  </div>

  <!-- PROPERTIES PANEL -->
  <aside class="props-panel">
    <div class="panel-hd">
      <span class="panel-title">Properties</span>
    </div>
    <div class="props-body" id="propsBody">
      <div class="p-empty">
        <svg viewBox="0 0 16 16"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg>
        <span>Select a component<br>to edit properties</span>
      </div>
    </div>
  </aside>

</div>

<!-- CODE MODAL -->
<div class="ovl hidden" id="codeOvl">
  <div class="modal">
    <div class="mhd">
      <span class="mtitle">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor" style="vertical-align:middle;margin-right:5px"><path d="M0 1.75C0 .784.784 0 1.75 0h12.5C15.216 0 16 .784 16 1.75v12.5A1.75 1.75 0 0 1 14.25 16H1.75A1.75 1.75 0 0 1 0 14.25ZM6.02 12.47a.75.75 0 0 0 1.06 1.06l4-4a.75.75 0 0 0 0-1.06l-4-4a.75.75 0 0 0-1.06 1.06L9.44 9l-3.42 3.47Zm-1.54-9a.75.75 0 0 0-.98.04l-4 4a.75.75 0 0 0 0 1.06l4 4a.75.75 0 0 0 1.04-1.08L1.56 8l3.96-3.51a.75.75 0 0 0-.04-1.02Z"/></svg>
        Generated HTML
      </span>
      <div class="mhd-actions">
        <button class="btn bsec" onclick="copyCode()" id="copyBtn">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"/><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"/></svg>
          Copy Code

/* ════════════════════════════════════════
   SIDEBAR RENDER
════════════════════════════════════════ */
function renderSidebar(filter = '') {
  const body = document.getElementById('sbBody');
  body.innerHTML = '';
  LIB.forEach((cat, ci) => {
    const items = filter
      ? cat.items.filter(i => i.lbl.toLowerCase().includes(filter.toLowerCase()))
      : cat.items;
    if (!items.length) return;
    const wrap = document.createElement('div');
    wrap.className = 'cat-wrap';
    wrap.innerHTML = `
      <div class="cat-hdr" onclick="toggleCat(${ci})">
        <span>${cat.em}</span><span>${cat.cat}</span>
        <span class="cat-arrow open" id="arr-${ci}">›</span>
      </div>
      <div class="comp-grid" id="cg-${ci}">
        ${items.map(it => `
          <div class="ci" draggable="true" data-type="${it.t}"
               ondragstart="onSideDragStart(event,'${it.t}')"
               onclick="addComp('${it.t}')">
            <div class="ci-icon">${it.ic}</div>
            <div class="ci-lbl">${it.lbl}</div>
          </div>`).join('')}
      </div>`;
    body.appendChild(wrap);
  });
}

function toggleCat(ci) {
  document.getElementById(`cg-${ci}`)?.classList.toggle('shut');
  document.getElementById(`arr-${ci}`)?.classList.toggle('open');
}

function filterComps(v) { renderSidebar(v); }

/* ════════════════════════════════════════
   CREATE COMPONENT ELEMENT
════════════════════════════════════════ */
function mkEl(type, id) {
  if (!GEN[type]) return null;
  const wrap = document.createElement('div');
  wrap.className = 'cc';
  wrap.id = id;
  wrap.setAttribute('data-type', type);
  wrap.draggable = true;

  // Control bar
  const bar = document.createElement('div');
  bar.className = 'cc-bar';
  bar.innerHTML = `
    <span class="cc-drag-handle" title="Drag to reorder">⠿</span>
    <span class="cc-label">${type}</span>
    <button class="cbtn" onclick="moveComp('${id}',-1)" title="Move Up">↑</button>
    <button class="cbtn" onclick="moveComp('${id}',1)" title="Move Down">↓</button>
    <button class="cbtn" onclick="dupComp('${id}')" title="Duplicate">⧉</button>
    <button class="cbtn del" onclick="delComp('${id}')" title="Delete">✕</button>`;

  const inner = document.createElement('div');
  inner.className = 'cc-inner';
  inner.innerHTML = GEN[type]();

  wrap.appendChild(bar);
  wrap.appendChild(inner);

  // Events
  wrap.addEventListener('click', e => { e.stopPropagation(); selectComp(id); });
  wrap.addEventListener('dragstart', e => {
    e.stopPropagation();
    S.dragSrc = 'canvas'; S.dragId = id;
    setTimeout(() => wrap.style.opacity = '.4', 0);
    e.dataTransfer.effectAllowed = 'move';
  });
  wrap.addEventListener('dragend', () => {
    wrap.style.opacity = '';
    S.dragSrc = null; S.dragId = null;
    clearPh();
  });
  return wrap;
}

/* ════════════════════════════════════════
   ADD COMPONENT
════════════════════════════════════════ */
function addComp(type, beforeEl = null) {
  if (!GEN[type]) return;
  const id = genId();
  const el = mkEl(type, id);
  if (!el) return;
  const canvas = document.getElementById('canvas');
  const ph = document.getElementById('drop-ph');
  if (beforeEl) {
    const b = document.getElementById(beforeEl);
    canvas.insertBefore(el, b);
  } else {
    canvas.insertBefore(el, ph);
  }
  canvas.appendChild(ph);
  checkEmpty();
  updCount();
  selectComp(id);
  saveHist();
  toast('Added · ' + type, 'ok');
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* ════════════════════════════════════════
   DRAG FROM SIDEBAR
════════════════════════════════════════ */
function onSideDragStart(e, type) {
  S.dragSrc = 'sidebar'; S.dragType = type;
  e.dataTransfer.effectAllowed = 'copy';
}

function afterElement(y) {
  const els = [...document.querySelectorAll('#canvas .cc:not([style*="opacity"])')]
  return els.reduce((cl, ch) => {
    const box = ch.getBoundingClientRect();
    const off = y - box.top - box.height / 2;
    return off < 0 && off > cl.off ? { off, el: ch } : cl;
  }, { off: Number.NEGATIVE_INFINITY }).el;
}

function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = S.dragSrc === 'sidebar' ? 'copy' : 'move';
  document.getElementById('canvas').classList.add('drag-over');
  const ph = document.getElementById('drop-ph');
  const after = afterElement(e.clientY);
  ph.className = 'show';
  if (after) after.before(ph);
  else document.getElementById('canvas').appendChild(ph);
}

function onDrop(e) {
  e.preventDefault();
  const canvas = document.getElementById('canvas');
  canvas.classList.remove('drag-over');
  const after = afterElement(e.clientY);
  const ph = document.getElementById('drop-ph');
  ph.className = '';

  if (S.dragSrc === 'sidebar') {
    const type = S.dragType; if (!type) return;
    const id = genId();
    const el = mkEl(type, id); if (!el) return;
    if (after) after.before(el); else canvas.appendChild(el);
    canvas.appendChild(ph);
    checkEmpty(); updCount(); selectComp(id); saveHist();
    toast('Added · ' + type, 'ok');
  } else if (S.dragSrc === 'canvas' && S.dragId) {
    const dragEl = document.getElementById(S.dragId); if (!dragEl) return;
    if (after && after !== dragEl) after.before(dragEl);
    else if (!after) canvas.appendChild(dragEl);
    canvas.appendChild(ph);
    saveHist();
    toast('Reordered', 'nfo');
  }
  S.dragSrc = null; S.dragType = null; S.dragId = null;
}

function onDragLeave(e) {
  if (!document.getElementById('canvas').contains(e.relatedTarget)) {
    document.getElementById('canvas').classList.remove('drag-over');
    clearPh();
  }
}

function clearPh() {
  const ph = document.getElementById('drop-ph');
  if (ph) { ph.className = ''; document.getElementById('canvas').appendChild(ph); }
}

/* ════════════════════════════════════════
   SELECTION
════════════════════════════════════════ */
function selectComp(id) {
  document.querySelectorAll('.cc.sel').forEach(el => el.classList.remove('sel'));
  S.selId = id;
  const el = document.getElementById(id); if (!el) return;
  el.classList.add('sel');
  document.getElementById('selName').textContent = '· ' + el.getAttribute('data-type');
  renderProps(id);
}

function deselect() {
  document.querySelectorAll('.cc.sel').forEach(el => el.classList.remove('sel'));
  S.selId = null;
  document.getElementById('selName').textContent = '';

   COMPONENT ACTIONS
════════════════════════════════════════ */
function delComp(id) {
  document.getElementById(id)?.remove();
  if (S.selId === id) deselect();
  checkEmpty(); updCount(); saveHist();
  toast('Deleted', 'er');
}

function moveComp(id, dir) {
  const el = document.getElementById(id); if (!el) return;
  const canvas = document.getElementById('canvas');
  const all = [...canvas.querySelectorAll('.cc')];
  const i = all.indexOf(el);
  if (dir === -1 && i > 0) all[i - 1].before(el);
  else if (dir === 1 && i < all.length - 1) all[i + 1].after(el);
  saveHist(); toast(dir === -1 ? 'Moved up' : 'Moved down', 'nfo');
}

function dupComp(id) {
  const el = document.getElementById(id); if (!el) return;
  const type = el.getAttribute('data-type');
  const nid = genId();
  const nel = mkEl(type, nid); if (!nel) return;
  nel.querySelector('.cc-inner').innerHTML = el.querySelector('.cc-inner').innerHTML;
  nel.querySelector('.cc-inner').style.cssText = el.querySelector('.cc-inner').style.cssText;
  const anCls = [...el.classList].filter(c => c.startsWith('an-'));
  anCls.forEach(c => nel.classList.add(c));
  el.after(nel);
  updCount(); selectComp(nid); saveHist();
  toast('Duplicated', 'ok');
}

function clearAll() {
  if (!document.querySelectorAll('#canvas .cc').length) return;
  if (!confirm('Clear all components? This cannot be undone.')) return;
  document.querySelectorAll('#canvas .cc').forEach(e => e.remove());
  deselect(); checkEmpty(); updCount(); saveHist();
  toast('Canvas cleared', 'er');
}

function checkEmpty() {
  const e = document.getElementById('cEmpty');
  if (!e) return;
  e.style.display = document.querySelectorAll('#canvas .cc').length ? 'none' : '';
}

function updCount() {
  const n = document.querySelectorAll('#canvas .cc').length;
  document.getElementById('compCount').textContent = n + ' component' + (n === 1 ? '' : 's');
}

/* ════════════════════════════════════════
   ANIMATION HELPERS
════════════════════════════════════════ */
function getAnim(el) {
  return [...el.classList].find(c => c.startsWith('an-'))?.replace('an-', '') || 'none';
}
function setAnim(id, anId) {
  const el = document.getElementById(id); if (!el) return;
  [...el.classList].filter(c => c.startsWith('an-')).forEach(c => el.classList.remove(c));
  if (anId !== 'none') el.classList.add('an-' + anId);
}
function replayAnim(id) {
  const el = document.getElementById(id); if (!el) return;
  const inner = el.querySelector('.cc-inner');
  const an = getAnim(el); if (an === 'none') return;
  el.classList.remove('an-' + an);
  void inner.offsetWidth;
  el.classList.add('an-' + an);
  toast('▶ Animation played', 'nfo');
}

}

  // Transform sliders

  pb.querySelectorAll('[data-transform]').forEach(inp => {
    const sv = inp.nextElementSibling;

      if (k === 'skewX' && sv) sv.textContent = sk + '°';
    });
  });

/* ════════════════════════════════════════
   UNDO / REDO
════════════════════════════════════════ */
function getState() {
  const canvas = document.getElementById('canvas');
  return [...canvas.querySelectorAll('.cc')].map(el => ({
    id: el.id,
    type: el.getAttribute('data-type'),
    html: el.querySelector('.cc-inner')?.innerHTML,
    style: el.querySelector('.cc-inner')?.style.cssText,
    animClass: [...el.classList].filter(c => c.startsWith('an-')).join(' '),
  }));
}

function saveHist() {
  const snapshot = JSON.stringify(getState());
  S.hist = S.hist.slice(0, S.hIdx + 1);
  S.hist.push(snapshot);
  if (S.hist.length > 60) S.hist.shift();
  S.hIdx = S.hist.length - 1;
}

function restoreState(snapshot) {
  const data = JSON.parse(snapshot);
  const canvas = document.getElementById('canvas');
  const ph = document.getElementById('drop-ph');
  document.querySelectorAll('#canvas .cc').forEach(e => e.remove());
  data.forEach(d => {
    const el = mkEl(d.type, d.id);
    if (!el) return;
    el.querySelector('.cc-inner').innerHTML = d.html;
    el.querySelector('.cc-inner').style.cssText = d.style;
    if (d.animClass) d.animClass.split(' ').forEach(c => c && el.classList.add(c));
    canvas.insertBefore(el, ph);
  });
  canvas.appendChild(ph);
  checkEmpty(); updCount();
}

function undo() {
  if (S.hIdx <= 0) { toast('Nothing to undo', 'er'); return; }
  S.hIdx--;
  restoreState(S.hist[S.hIdx]);
  deselect(); toast('↩ Undo', 'nfo');
}

function redo() {
  if (S.hIdx >= S.hist.length - 1) { toast('Nothing to redo', 'er'); return; }
  S.hIdx++;
  restoreState(S.hist[S.hIdx]);
  deselect(); toast('↪ Redo', 'nfo');
}

/* ════════════════════════════════════════
   ZOOM
════════════════════════════════════════ */
function zm(delta, mode) {
  if (mode === 'reset') S.zmLevel = 1;
  else S.zmLevel = Math.max(0.3, Math.min(2, S.zmLevel + delta));
  document.getElementById('canvas').style.transform = `scale(${S.zmLevel})`;
  document.getElementById('zmVal').textContent = Math.round(S.zmLevel * 100) + '%';
}

function buildHTML() {
  const canvas = document.getElementById('canvas');
  const cs = canvas.style;
  const bg = cs.getPropertyValue('--cb') || '#ffffff';
  const tx = cs.getPropertyValue('--ct') || '#1f2328';
  const ac = cs.getPropertyValue('--ca') || '#0969da';
  const sf = cs.getPropertyValue('--cs') || '#f6f8fa';
  const br = cs.getPropertyValue('--cbr') || '#d0d7de';

  const rows = [...canvas.querySelectorAll('.cc')].map(el => {
    const inner = el.querySelector('.cc-inner');
    const anCls = [...el.classList].filter(c => c.startsWith('an-')).join(' ');
    const style = inner.style.cssText;
    return `  <!-- ${el.getAttribute('data-type')} -->\n  <div class="${anCls ? 'section ' + anCls : 'section'}"${style ? ` style="${style}"` : ''}>\n    ${inner.innerHTML.replace(/contenteditable=""/g, '').replace(/spellcheck="false"/g, '').trim()}\n  </div>`;
  }).join('\n\n');

  return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Website — Built with WebCraft</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cb:${bg};
  --ct:${tx};

}

body{background:var(--cb);color:var(--ct);line-height:1.5}
.section{position:relative}

/* ── Reusable Styles ── */
${getExportStyles()}

/* ── Animations ── */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideInLeft{from{transform:translateX(-60px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideInRight{from{transform:translateX(60px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideInUp{from{transform:translateY(50px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideInDown{from{transform:translateY(-50px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes zoomIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bounceIn{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.1)}80%{transform:scale(.95)}100%{transform:scale(1);opacity:1}}
@keyframes flipInX{from{transform:perspective(400px) rotateX(-90deg);opacity:0}to{transform:perspective(400px) rotateX(0);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes swing{0%,100%{transform:rotate(0deg)}20%{transform:rotate(12deg)}40%{transform:rotate(-8deg)}60%{transform:rotate(5deg)}80%{transform:rotate(-4deg)}}
@keyframes rubberBand{0%{transform:scale(1)}30%{transform:scaleX(1.2) scaleY(.75)}40%{transform:scaleX(.75) scaleY(1.2)}50%{transform:scaleX(1.12) scaleY(.88)}65%{transform:scaleX(.97) scaleY(1.03)}75%{transform:scaleX(1.03) scaleY(.97)}100%{transform:scale(1)}}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3) drop-shadow(0 0 12px currentColor)}}
@keyframes colorCycle{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}
@keyframes floatUpDown{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

.an-fadeIn .section,.an-fadeIn{animation:fadeIn .8s ease both}

function getExportStyles() {
  // Extract relevant <style> from current document for component classes
  const styles = [];
  for (const sheet of document.styleSheets) {
    try {
      for (const rule of sheet.cssRules) {
        if (rule.selectorText && (rule.selectorText.includes('comp-') || rule.selectorText.includes('.al.') || rule.selectorText.includes('.nb-') || rule.selectorText.includes('.plan') || rule.selectorText.includes('.feat') || rule.selectorText.includes('.stat'))) {
          styles.push(rule.cssText);
        }
      }
    } catch(e) {}
  }
  return styles.join('\n');
}

function showCode() {
  const code = buildHTML();
  document.getElementById('codeOut').textContent = code;
  const lines = code.split('\n').length;
  document.getElementById('codeInfo').textContent = lines + ' lines · ' + Math.round(code.length / 1024) + ' KB';
  document.getElementById('codeOvl').classList.remove('hidden');
}

function copyCode() {
  const code = document.getElementById('codeOut').textContent;
  navigator.clipboard.writeText(code).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"/></svg> Copied!`;
    setTimeout(() => {
      btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"/><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"/></svg> Copy Code`;
    }, 2000);
    toast('Code copied to clipboard!', 'ok');
  });
}

function downloadCode() {
  const code = buildHTML();
  const blob = new Blob([code], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'my-website.html';
  a.click();
  toast('Downloaded my-website.html', 'ok');
}

/* ════════════════════════════════════════
   TOAST
════════════════════════════════════════ */
function toast(msg, type = 'nfo') {
  const stack = document.getElementById('tstack');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  stack.appendChild(t);
  setTimeout(() => t.style.opacity = '0', 2200);
  setTimeout(() => t.remove(), 2500);
}

/* ════════════════════════════════════════
   KEYBOARD SHORTCUTS
════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
  if (e.key === 'Escape') {
    deselect();
    document.getElementById('codeOvl').classList.add('hidden');
    if (S.preview) togglePreview();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'p') { e.preventDefault(); togglePreview(); }
  if (e.key === 'Delete' && S.selId && !e.target.isContentEditable && e.target.tagName !== 'INPUT') {
    delComp(S.selId);
  }
});

   INIT
════════════════════════════════════════ */
renderSidebar();
saveHist();
checkEmpty();

  addComp('feature');
  addComp('pricing');
  addComp('footer');

  deselect();
  toast('🎉 Welcome to WebCraft! Drag, drop & customize.', 'nfo');
}, 100);
